<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RightMagic Showcase Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f3ee;
      --paper: #fffdf8;
      --ink: #111827;
      --ink-soft: #4b5563;
      --line: #ddd6ca;
      --brand: #0d3b66;
      --brand-soft: #e7f0f8;
      --accent: #c84b31;
      --accent-soft: #f8e5df;
      --good: #127a52;
      --good-soft: #e4f5ee;
      --radius: 20px;
      --shadow: 0 16px 36px rgba(17, 24, 39, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, #ffffff 0%, transparent 38%),
        radial-gradient(circle at 88% 0%, #eef7f8 0%, transparent 34%),
        var(--bg);
      line-height: 1.65;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
      letter-spacing: -0.02em;
    }

    .hero {
      padding: 72px 20px 48px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      width: 380px;
      height: 380px;
      position: absolute;
      right: -120px;
      top: -120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d8e8f7, #f9ede5);
      filter: blur(1px);
      z-index: -1;
    }

    .hero .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink-soft);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: clamp(34px, 7vw, 70px);
      line-height: 1.08;
      font-weight: 900;
      max-width: 980px;
      margin: 0 auto;
      color: var(--brand);
    }

    .hero p {
      max-width: 900px;
      margin: 18px auto 0;
      color: var(--ink-soft);
      font-size: clamp(15px, 2.2vw, 20px);
    }

    .meta-strip {
      max-width: 1240px;
      margin: 20px auto 4px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .meta-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px;
      text-align: center;
    }

    .meta-card .k {
      font-size: 12px;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .meta-card .v {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.1;
      margin-top: 5px;
      color: var(--brand);
    }

    .grid {
      max-width: 1240px;
      margin: 26px auto 90px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: translateY(20px);
      opacity: 0;
      animation: rise 0.7s ease forwards;
    }

    .card:nth-child(2) { animation-delay: 0.05s; }
    .card:nth-child(3) { animation-delay: 0.1s; }
    .card:nth-child(4) { animation-delay: 0.15s; }
    .card:nth-child(5) { animation-delay: 0.2s; }
    .card:nth-child(6) { animation-delay: 0.25s; }

    .card .thumb {
      height: 236px;
      width: 100%;
      object-fit: cover;
      border-bottom: 1px solid var(--line);
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .tag-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      padding: 4px 10px;
      border: 1px solid;
      white-space: nowrap;
    }

    .tag.topic {
      background: var(--brand-soft);
      color: var(--brand);
      border-color: #bfd4ea;
    }

    .tag.metric {
      background: var(--good-soft);
      color: var(--good);
      border-color: #bde5d4;
    }

    .card h3 {
      font-size: 29px;
      line-height: 1.2;
      color: #0f2f52;
    }

    .summary {
      color: var(--ink-soft);
      font-size: 15px;
      min-height: 78px;
    }

    .card-actions {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: #b7b0a3;
    }

    .btn.primary {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .btn.primary:hover {
      background: #0f4d86;
      border-color: #0f4d86;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(3px);
      opacity: 0;
      visibility: hidden;
      transition: 0.3s ease;
      z-index: 1000;
      overflow-y: auto;
      padding: 30px 18px;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      max-width: 1160px;
      margin: 0 auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.24);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .overlay.active .modal {
      transform: translateY(0);
    }

    .modal-top {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 20px;
      padding: 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(160deg, #fff, #f8f5ef);
    }

    .modal-top img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid var(--line);
    }

    .modal-head h2 {
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.12;
      color: #0f2f52;
      margin-top: 12px;
    }

    .modal-head p {
      margin-top: 14px;
      color: var(--ink-soft);
      font-size: 16px;
    }

    .close {
      position: sticky;
      top: 16px;
      margin-left: auto;
      margin-right: 18px;
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 1010;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 24px;
      padding: 24px;
    }

    .sec {
      margin-bottom: 20px;
    }

    .sec h4 {
      color: var(--accent);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .sec p {
      color: #1f2937;
      font-size: 16px;
    }

    .sec ul {
      margin-left: 18px;
      margin-top: 6px;
      color: #1f2937;
    }

    .sec li {
      margin: 7px 0;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .panel .k {
      font-size: 12px;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .panel .v {
      font-size: 16px;
      font-weight: 700;
      color: #172034;
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .chip {
      font-size: 12px;
      background: #f2f4f8;
      border: 1px solid #d7deea;
      color: #2f3d56;
      border-radius: 999px;
      padding: 4px 10px;
    }

    footer {
      padding: 34px 20px 48px;
      text-align: center;
      color: #6b7280;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .meta-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .modal-top,
      .modal-body {
        grid-template-columns: 1fr;
      }

      .modal-top img {
        height: 240px;
      }
    }
  </style>
</head>

    const grid = document.getElementById("grid");

    function renderCards() {
      projects.forEach((p) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <img class="thumb" src="${p.cover}" alt="${p.title}" loading="lazy" />
          <div class="card-body">
            <div class="tag-row">
              <span class="tag topic">${p.topic}</span>
              <span class="tag metric">${p.metric}</span>
            </div>
            <h3>${p.title}</h3>
            <p class="summary">${p.summary}</p>
            <div class="card-actions">
              <button class="btn primary" onclick="openModal('${p.id}')">查看详情</button>

            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

            </div>
            <div class="sec">
              <h4>Solution Design</h4>
              <p>${p.solution}</p>
            </div>
            <div class="sec">
              <h4>Technical Highlights</h4>
              <ul>${p.highlights.map((x) => `<li>${x}</li>`).join("")}</ul>
            </div>
            <div class="sec">
              <h4>Business Impact</h4>
              <ul>${p.impact.map((x) => `<li>${x}</li>`).join("")}</ul>
            </div>
          </div>
          <aside>
            <div class="panel">
              <div class="k">Client / Team</div>
              <div class="v">${p.client}</div>
            </div>
            <div class="panel">
              <div class="k">Year</div>
              <div class="v">${p.year}</div>
            </div>
            <div class="panel">
              <div class="k">Tech Stack</div>
              <div class="chips">${p.stack.map((x) => `<span class="chip">${x}</span>`).join("")}</div>
            </div>
            <div class="panel">
              <div class="k">Reference</div>
              <div class="v"><a href="./md-viewer.html?file=${encodeURIComponent(p.md)}" target="_blank" rel="noopener">${p.md.split('/').pop()}</a></div>
            </div>
          </aside>
        </section>
      `;

      document.getElementById("overlay").classList.add("active");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      document.getElementById("overlay").classList.remove("active");
      document.body.style.overflow = "auto";
    }

    function onOverlayClick(e) {
      if (e.target.id === "overlay") {
        closeModal();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    renderCards();
  </script>
</body>

</html>

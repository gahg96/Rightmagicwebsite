密（per-token）</td>\n<td>教师软分布</td>\n</tr>\n</tbody>\n</table>\n<p>两个关键推论：</p>\n<ol>\n<li><strong>SFT 是蒸馏的一个特例</strong>：SFT 的交叉熵等价于以标注 token 的 one-hot 分布为「教师」的 KL 散度 $-\\log P_S(y^<em><em>t) = \\text{KL}(\\delta</em>{y^</em>} | P_S)$；真正的蒸馏不过是把这个退化的「教师」换成教师模型的软分布——教师不仅告诉学生哪个 token 对，还告诉它其他 token 各有多好/多差，监督信息量完全不同；</li>\n<li><strong>第一阶段项目的位置</strong>：我们做的序列级数据蒸馏 = 离线蒸馏（off-policy + 稠密）。它有一个先天毛病叫<strong>曝光偏差（exposure bias）</strong>：学生训练时只见过教师走过的状态，一旦自己推理时早期走错一步，就会进入训练中从未见过的状态，误差滚雪球。On-policy 蒸馏就是来治这个病的——学生自己采样、在自己的轨迹上接受教师逐 token 打分，训练分布与推理分布一致。</li>\n</ol>\n<h3 id=\"62\">6.2 教师信号怎么算：散度方向 × 计算粒度</h3>\n<p>（来源：存档《知识蒸馏》第二节，转述）</p>\n<p><strong>散度方向</strong>决定学生拟合教师的姿态：Forward KL（$\\text{KL}(P_T|P_S)$）是 mode-covering，学生要给教师看重的地方都留足概率；Reverse KL（$\\text{KL}(P_S|P_T)$）是 mode-seeking，学生主攻教师的众数区域，输出更「尖锐」；广义 JSD($\\beta$) 在两者之间插值。ms-swift 中 GKD 默认 $\\beta=0.5$（JSD），<code>--beta</code> 可调：0 = Forward KL，1 = Reverse KL。</p>\n<p><strong>计算粒度</strong>决定成本：全词表分布最精确但要物化完整 logits、显存开销大；Top-K 是在教师概率最高的 K 个 token 上重新归一化的近似，适合走外部 API（受 <code>max_logprobs</code> 限制）；采样 token 只取教师在已采样 token 上的单个 logp，通信最省，但梯度估计方差大（存档文档引 DeepSeek-V4 技术报告的讨论）。</p>\n<h3 id=\"63-gkdopd-rlopsd\">6.3 三种方法：GKD、OPD-RL、OPSD</h3>\n<p>（来源：存档《知识蒸馏》第三节）</p>\n<table>\n<thead>\n<tr>\n<th>方法</th>\n<th>启用方式</th>\n<th>信号怎么传</th>\n<th>一句话</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>GKD</td>\n<td><code>--rlhf_type gkd</code></td>\n<td>散度作为直接 loss 反向传播，梯度流经学生全词表 logits（或 top-k）</td>\n<td>经典分布蒸馏的 on-policy 化</td>\n</tr>\n<tr>\n<td>OPD-RL</td>\n<td><code>--rlhf_type grpo</code> + 配置教师</td>\n<td>教师 log-ratio 注入 GRPO 的 per-token advantage，走 policy gradient</td>\n<td>蒸馏与任务奖励可叠加</td>\n</tr>\n<tr>\n<td>OPSD</td>\n<td>在 GKD 或 OPD-RL 基础上给 <code>teacher_prompt</code></td>\n<td>同一模型，教师侧多看「特权信息」（如参考解答）</td>\n<td>单模型自蒸馏，不需要外部教师</td>\n</tr>\n</tbody>\n</table>\n<p><strong>GKD 的两个核心参数</strong>：<code>--beta</code>（散度插值，默认 0.5）与 <code>--lmbda</code>（在线采样概率，默认 0.5）——<code>lmbda=0</code> 是纯离线（即第一阶段做法的分布版），<code>lmbda=1</code> 是纯在线，中间是混合；另有 <code>--sft_alpha</code> 控制混入 SFT loss 的比例（仅对非学生生成的数据生效，最终 loss = gkd_loss + sft_alpha × sft_loss），<code>--gkd_logits_topk</code> 控制 Top-K 蒸馏省显存，走外部教师 API 时必填。注意存档文档的提醒：若想走「教师离线生成数据」路径，需先把教师响应写进数据集再设 <code>lmbda=0</code>——这正是第一阶段管线与 GKD 的接合点。</p>\n<p><strong>OPD-RL 的机制</strong>一句话：标准 GRPO 的 advantage 是组内归一化的任务奖励（序列级），OPD-RL 在归一化<strong>之后</strong>逐 token 注入教师信号 $A_t = A_t^{base} + \\alpha \\cdot (\\log\\pi_{teacher}(y_t) - \\log\\pi_{student}(y_t))$，系数 <code>--teacher_kl_coef</code> 默认 1.0；不设 <code>--reward_funcs</code> 时 base advantage 为 0，即纯蒸馏模式。日志中的 <code>teacher_kl</code>（k3 估计量 $e^d - d - 1$）就是学生离教师还有多远的实时仪表。</p>\n<p><strong>教师的三种来源</strong>（GKD 与 OPD-RL 通用，来源同上）：</p>\n<ol>\n<li><code>--teacher_model</code>：训练进程内加载一个独立的冻结教师（吃训练机显存，可用 <code>--offload_teacher_model</code> 在非前向阶段卸载到 CPU，或 <code>--teacher_deepspeed</code> 给教师单独配并行策略）；</li>\n<li><code>--teacher_model_server</code>：连外部教师服务（<code>swift deploy</code> 起的 vLLM 服务），教师不占训练卡；还支持多教师路由——按数据集或样本 tag 把不同领域样本分给不同专家教师；</li>\n<li><strong>自蒸馏</strong>：LoRA 训练且教师与学生同模型时，可自动以基座（disable adapter）为固定教师，零额外加载。</li>\n</ol>\n<p><strong>与公司实境的对应（Muse 整理）</strong>：路径 2 正对我们的双机格局——一台 Spark 用 <code>swift deploy</code> 部署本地 Qwen3.8-Flash 当教师服务，另一台跑学生训练，教师数据不出内网；云端教师 API 路径同样可用（教师 API 需支持返回 logprobs，GKD 还需 <code>max_logprobs &gt;= gkd_logits_topk</code>）。<strong>但须注意：DeepSeek API 密钥已于 2026-10-20 失效</strong>，且其接口是否返回 logprobs 未经核实——实操一律以「本地 Qwen3.8-Flash 教师」为默认路径，云端 API 只作备选讨论，不写死。</p>\n<p>外部教师 API 的存档命令示例（来源：存档《知识蒸馏》，模型名按原文，实操时替换为公司模型）：</p>\n<pre><code class=\"language-bash\"># 步骤 1：部署教师服务（GKD 需 max_logprobs &gt;= gkd_logits_topk）\nCUDA_VISIBLE_DEVICES=0 swift deploy --model &lt;教师模型&gt; --infer_backend vllm --port 8000 --max_logprobs 64\n# 步骤 2：GKD 训练\nswift rlhf --rlhf_type gkd --model &lt;学生模型&gt; \\\n    --teacher_model_server http://localhost:8000 \\\n    --gkd_logits_topk 64 --lmbda 1.0 --beta 1.0 --dataset &lt;数据集&gt;\n</code></pre>\n<h3 id=\"64-muse-6163\">6.4 组合打法（Muse 整理，方法依据见 6.1–6.3 与第四节）</h3>\n<p>给蒸馏学生模型做后训练深化的推荐顺序：</p>\n<pre><code>第一阶段产物：数据蒸馏 SFT 学生模型（已验收）\n   │\n   ├─ 第一步 偏好对齐打底：DPO（数据现成、成本最低，先把风格/取向校准）\n   │\n   ├─ 第二步 能力深化（二选一或串联）：\n   │     · 有强教师在手边 → GKD（lmbda 从 0.5 起步）做 on-policy 分布蒸馏\n   │     · 任务可验证（有对错） → GRPO/OPD-RL，教师信号与任务奖励叠加\n   │\n   └─ 每一步都过冻结测试集，不过线就回滚——不叠「未验收的收益」\n</code></pre>\n<p>为什么是这个顺序：它同时呼应了 R1 的四阶段流水线（SFT 打底 → RL 深化 → 再 SFT/对齐收尾）与「RL 能进一步改进蒸馏模型」的社区共识（第四节），且每一步的算力成本递增、风险递增，符合小步验证的工程纪律。</p>\n<hr />\n<h2 id=\"_3\">七、评测闭环：偏好优化最容易在这里翻车</h2>\n<p>偏好优化与 SFT 评测的最大区别：<strong>训练指标（reward、偏好准确率）会说谎的概率大得多</strong>。模型完全可能在训练分布上一路涨分、在真实任务上一路掉分。本节把第一阶段的纪律搬过来，并加上偏好优化特有的仪表。</p>\n<h3 id=\"71\">7.1 沿用第一阶段的三件套</h3>\n<ol>\n<li><strong>冻结测试集</strong>：结课项目锁定的那 100–200 条测试集继续冻结，本讲所有实验共用同一套卷子；训练数据、偏好数据、调参过程都不许碰它；</li>\n<li><strong>三方评估口径</strong>：基线（本讲起点 = 蒸馏学生模型）、教师、本讲产物同卷同口径对比，报告里三方数字缺一不可；</li>\n<li><strong>人工抽检</strong>：自动指标之外抽样看原文输出，抽检通过率口径与第一阶段一致（≥90%）。</li>\n</ol>\n<p>评测工具层面，ms-swift 生态的评测组件为 EvalScope（第一阶段素材中已出现；其细节文档已于 P1 补抓存档 <code>modelscope/14-评测Evaluation.md</code>，开课时以当前版本文档为准，用它跑标准基准与自定义测试集的批量评测，冻结测试集仍以自有脚本/口径管理为准，不因工具更换而换卷）。</p>\n<h3 id=\"72-muse\">7.2 偏好优化特有的三个监视器（Muse 整理，指标来源见第五、六节）</h3>\n<table>\n<thead>\n<tr>\n<th>监视器</th>\n<th>看什么</th>\n<th>报警信号</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>奖励 vs 测试集背离</td>\n<td>训练 reward / 偏好准确率曲线 vs 冻结测试集分数</td>\n<td>reward 涨、测试集平或跌 = 典型 reward hacking 或过拟合，立即停训复盘</td>\n</tr>\n<tr>\n<td>KL 距离</td>\n<td>与参考模型的 KL（DPO 的 beta 约束对象）、OPD-RL 的 <code>teacher_kl</code></td>\n<td>KL 快速膨胀 = 模型在远离「会说人话」的区域，语言质量多半正在崩坏；输出变长、复读、格式怪异是伴随症状</td>\n</tr>\n<tr>\n<td>长度分布</td>\n<td>输出平均长度与分布变化</td>\n<td>无任务理由的长度暴涨 = 长度偏差或在钻奖励空子（第四节的社区教训）；对照测试集里「长而错」样本比例</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"73-reward-hacking\">7.3 过拟合与 reward hacking 的识别口诀</h3>\n<ul>\n<li><strong>只涨训练分、不涨冻结分</strong>：过拟合或 hack，先查数据再查奖励；</li>\n<li><strong>专挑格式分、内容分不动</strong>：奖励函数被钻空子（例如只奖励格式标签时模型学会堆标签）；</li>\n<li><strong>chosen/rejected 分得越来越开、生成越来越怪</strong>：DPO 的 beta 太小或训练过头，模型把「与 rejected 不同」误学成目标本身；</li>\n<li><strong>GRPO 组内全对或全错</strong>：该 prompt 的优势恒为 0、不产生学习信号，说明题目难度与模型水平不匹配——不是 bug，是数据配比问题，调整难度分布而不是加步数。</li>\n</ul>\n<hr />\n<h2 id=\"dpo-grpo\">八、实操：给第一阶段蒸馏学生模型做一轮 DPO / GRPO 对照实验</h2>\n<blockquote>\n<p>环境：单台 DGX Spark（GB10，128GB 统一内存）为主，双机更佳；学生模型为第一阶段蒸馏结课项目的 8B 级模型。<strong>前置警告：ms-swift 在 GB10/ARM 上的支持官方未明示（见大纲），本实操第一步就是冒烟；冒烟不过，整班降级 Colab（A100）同一套流程跑，不硬耗。</strong> Spark 上跑实验前先停 vllm-fn 容器腾内存，跑完恢复（公司既有运维口径）。</p>\n</blockquote>\n<h3 id=\"81\">8.1 实验设计（一句话版）</h3>\n<p>同一起点（蒸馏学生模型）、同一套冻结测试集、两条路线对照：<strong>A 组 DPO</strong>（离线偏好对，便宜稳妥）与 <strong>B 组 GRPO</strong>（在线采样 + 可验证奖励，进阶挑战）；单人学员二选一，与邻座结对凑成对照。验收只认冻结测试集与人工抽检，训练曲线只作诊断。</p>\n<h3 id=\"82\">8.2 步骤</h3>\n<p><strong>步骤 0 · 冒烟（30 分钟内出结论）</strong>\n- 在 Spark 上装好 ms-swift（开课当周版本），用任意小模型 + 官方 examples 的最小脚本跑通 <code>swift rlhf --rlhf_type dpo</code> 若干步不报错、能存 checkpoint；\n- 记录 GB10 上的实际表现（是否需关某些算子/降配置），形成全班统一的「Spark 适配说明」；\n- 冒烟失败 → 全班切 Colab，同一步骤在 Colab 复跑确认，后续步骤环境无关。</p>\n<p><strong>步骤 1 · 数据准备（关键，决定实验成败）</strong>\n- DPO 组：从第一阶段项目的<strong>训练集</strong>（不是测试集）题目出发，用起点学生模型对每题采样 2–4 个回答；chosen/rejected 的判定双通道——有客观答案的题用规则验算（对 = chosen、错 = rejected），开放题用教师（本地 Qwen3.8-Flash 服务）打分排序取首尾；人工抽检 30 条确认标注靠谱后放行。目标规模 500–2000 对；\n- GRPO 组：准备带 <code>solution</code> 列的 prompt 集（题目 + 参考答案），奖励函数 = 答案验算（对 1 错 0）+ 格式奖励（按第一阶段项目的输出格式约定）；难度配比刻意混合（易/中/难约 3:5:2，避免组内全对全错）；\n- 两组共同纪律：所有数据只来自训练集划分，冻结测试集零接触；数据文件留版本与来源记录。</p>\n<p><strong>步骤 2 · 训练</strong>\n- DPO 组：先按官方建议用 chosen 部分做一小轮 SFT 热身（可与第一阶段 SFT 配置对照），再跑 DPO：<code>--beta 0.1</code> 起步、<code>loss_type sigmoid</code>、开 <code>rpo_alpha</code> 掺 SFT loss 保稳定；LoRA 还是全参按显存实测决定（8B 级模型在 128GB 统一内存上有全参可能，但一切以冒烟结果为准）；\n- GRPO 组：以 §5.3 回填的官方实验口径为基线（组大小 8、温度 1.0、beta 0.001、lr 5e-7，开课当周按版本复核官方脚本），采样走 vLLM colocate 模式；只改动数据路径与模型路径，其余先用官方默认；\n- 两组都要求：固定随机种子、保存完整命令与版本信息、每 N 步存 checkpoint 以便回滚。</p>\n<p><strong>步骤 3 · A/B 验收</strong>\n- 起点模型与训练产物在同一冻结测试集上同口径评测（自动指标 + 人工抽检 ≥30 条）；\n- 同时记录通用能力抽查（从第一阶段通用数据里抽一小组）——偏好优化最常见的代价是「专项涨了、通用崩了」，不查不算验收；\n- 对照第七节三监视器复盘训练曲线：reward/KL/长度有没有报警信号。</p>\n<p><strong>步骤 4 · 成本账</strong>\n- 按第一阶段口径记账：训练时长、峰值内存、采样开销（GRPO 组单列生成耗时占比）、每 1 个百分点测试集收益对应的算力成本，两组横向对比。</p>\n<h3 id=\"83\">8.3 记录表（模板）</h3>\n<table>\n<thead>\n<tr>\n<th>项</th>\n<th>起点（蒸馏学生）</th>\n<th>A 组 DPO 产物</th>\n<th>B 组 GRPO 产物</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>冻结测试集得分</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>人工抽检通过率（≥30 条）</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>通用能力抽查得分</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>平均输出长度变化</td>\n<td>—</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>训练配置（beta / 关键参数 / 步数）</td>\n<td>—</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>训练时长 / 峰值内存</td>\n<td>—</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>异常信号（KL/长度/reward 背离）</td>\n<td>—</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>结论：是否过验收线</td>\n<td>—</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"84-muse\">8.4 验收标准（数值为 Muse 整理的建议口径，可按届调整）</h3>\n<ol>\n<li>冻结测试集相对起点<strong>不下降</strong>，目标提升 ≥2 个百分点；只涨训练指标不算达标；</li>\n<li>人工抽检通过率 ≥90%，且无语言质量崩坏样本（复读、混杂语言、格式失控）；</li>\n<li>通用能力抽查下降 ≤1 个百分点；</li>\n<li>记录表完整、命令与版本可复现、成本账齐全——<strong>报告诚实优先于结果好看</strong>：负结果（某路线没涨甚至跌了）如实写清诊断，同样算通过。</li>\n</ol>\n<hr />\n<h2 id=\"_4\">九、常见坑清单</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>坑</th>\n<th>症状</th>\n<th>对策（来源）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Reward hacking</td>\n<td>reward 涨、冻结测试集不涨，输出钻格式/措辞空子</td>\n<td>奖励尽量用规则验证（RLVR 思路）；神经奖励模型在大规模 RL 中更易被 hack（R1 团队经验，转述自机器之心存档 03/04）</td>\n</tr>\n<tr>\n<td>2</td>\n<td>KL 失控</td>\n<td>输出变长变怪、语言质量崩，KL 曲线陡升</td>\n<td>DPO 调大 <code>beta</code>、PPO 查 <code>kl_coef</code>（默认 0.05）；减步数、早停（参数来源：ms-swift《人类对齐 RLHF》）</td>\n</tr>\n<tr>\n<td>3</td>\n<td>偏好数据噪声</td>\n<td>训练 loss 降但抽检变差</td>\n<td>chosen/rejected 标注先人工抽检再放行；DPO 前先用 chosen 做 SFT 热身（官方文档建议）</td>\n</tr>\n<tr>\n<td>4</td>\n<td>DPO 参考 logp 预计算坑</td>\n<td>开 <code>precompute_ref_log_probs=True</code> 直接报错</td>\n<td>保持默认 <code>False</code>，Swift 的 DPOTrainer 暂不支持预计算（存档文档明示）</td>\n</tr>\n<tr>\n<td>5</td>\n<td>ORPO 参数误读</td>\n<td>把 ORPO 的 <code>--beta</code> 当 DPO 的 beta 调</td>\n<td>ORPO 借 <code>--beta</code> 传的是其 <code>lambda</code> 系数（存档文档明示）</td>\n</tr>\n<tr>\n<td>6</td>\n<td>长度偏差</td>\n<td>回答越训越长、错的更长</td>\n<td>关注长度分布监视器；可参考 Dr. GRPO 思路与对冗长错误答案的惩罚设计（转述自 Raschka 长文教训汇总）</td>\n</tr>\n<tr>\n<td>7</td>\n<td>GRPO 白采样</td>\n<td>某些 prompt 长期零优势、纯烧算力</td>\n<td>组内全对/全错导致优势为 0；调整题目难度配比（见 7.3）</td>\n</tr>\n<tr>\n<td>8</td>\n<td>曝光偏差误诊</td>\n<td>离线蒸馏的学生一遇自己走错的状态就崩</td>\n<td>这是 off-policy 的结构性问题；用 GKD 提高 <code>lmbda</code> 转 on-policy 纠错（存档《知识蒸馏》）</td>\n</tr>\n<tr>\n<td>9</td>\n<td>全词表蒸馏 OOM</td>\n<td>GKD 默认全词表算 KL 时爆显存</td>\n<td>开 <code>--gkd_logits_topk</code> 做 Top-K 蒸馏；教师可 offload 或走外部服务（存档《知识蒸馏》）</td>\n</tr>\n<tr>\n<td>10</td>\n<td>假涨点结论</td>\n<td>小样本上「提升明显」，一放大就消失</td>\n<td>冻结测试集足量评测 + 人工抽检；记住社区对蒸馏模型 RL 涨点的统计显著性提醒（转述自 Raschka 长文）</td>\n</tr>\n<tr>\n<td>11</td>\n<td>KTO 配比失衡</td>\n<td>好/坏样本权重失衡训偏</td>\n<td>按原论文建议保持 $\\lambda_D n_D / \\lambda_U n_U \\in [1, 4/3]$（存档《人类对齐 RLHF》）</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"_5\">十、课后练习与延伸阅读</h2>\n<p><strong>课后练习</strong></p>\n<ol>\n<li>（选型题）公司内部有三批资产：①客服对话的点赞/点踩日志 2 万条；②带标准答案的工单分类题 5000 道；③专家标注的「好回答/坏回答」成对数据 800 条。分别选哪条偏好优化路线？写明数据形态如何对齐 ms-swift 的要求。（依据：本讲第三节对照表）</li>\n<li>（读日志题）给出一段虚构的 OPD-RL 训练日志特征：<code>teacher_kl</code> 持续下降的同时冻结测试集分数先升后降。诊断最可能发生了什么，下一步动哪个参数？（依据：第六、七节）</li>\n<li>（复现题）在 Colab 上用 ms-swift 官方 examples 的 DPO 脚本，对任意 1–2B 小模型跑通 100 步并保存 checkpoint；提交命令、版本与 loss 曲线截图。（材料：ms-swift 仓库 <code>examples/train/rlhf/dpo</code>）</li>\n<li>（思考题）第一阶段项目里，如果把「教师离线生成数据 + SFT」换成 GKD 的 <code>lmbda=0</code> 模式，两者还剩什么区别？（提示：教师信号从 one-hot 变软分布；依据：存档《知识蒸馏》6.1 的坐标系）</li>\n</ol>\n<p><strong>延伸阅读（逐条标来源）</strong></p>\n<ul>\n<li>ms-swift《人类对齐 RLHF》（ModelScope 社区，存档 modelscope/07）：各算法超参与脚本索引，本讲第五节的源头；</li>\n<li>ms-swift《知识蒸馏》（ModelScope 社区，存档 modelscope/08）：GKD / OPD-RL / OPSD 全文，第六节的源头，含多教师路由与完整参数表；</li>\n<li>Cameron R. Wolfe《从 o1-mini 到 DeepSeek-R1，万字长文带你读懂推理模型的历史与技术》（机器之心编译，存档 jiqizhixin/03）：R1 四阶段与蒸馏模型的完整叙述；</li>\n<li>Sebastian Raschka《RL 推理训练正悄悄突破上限》（机器之心，存档 jiqizhixin/04）：PPO→GRPO、RLVR 的讲解与 15 篇论文导读；</li>\n<li>Datawhale《Happy-LLM》第六章 6.4 节（存档 datawhale/01）：偏好对齐与本章 SFT/PEFT 的衔接，及其指向的偏好对齐专题材料；</li>\n<li>论文原文（链接均出自存档文档）：GRPO 出处 DeepSeekMath（arXiv:2402.03300）、DPO（arXiv:2305.18290）、GKD（arXiv:2306.13649）、KTO（arXiv:2402.01306）、RM/PPO 出处（arXiv:2203.02155）；</li>\n<li>Thinking Machines Lab《On-Policy Distillation》博客（存档《知识蒸馏》参考文献列）：on-policy 蒸馏的一手论述；</li>\n<li>ms-swift 仓库 GRPO 完整实验流程与 Best Practices（大纲 P1 补抓项，补齐后替换本讲 5.3 的参数缺口）。</li>\n</ul>\n<hr />\n<blockquote>\n<p><strong>讲义版本</strong>：v1（2026-10-20）。已知待补：GRPO 完整参数与 EvalScope 细节（大纲 P1 补抓后回填）；ms-swift 在 GB10 上的适配结论待 A1/A2 冒烟实测后回填。</p>\n</blockquote>"}, {"num": "B1x", "ch": "进阶 B · 推理引擎", "label": "B1 双引擎机制走读", "title": "进阶 B1：引擎机制走读——vLLM × LMDeploy 双引擎对照", "html": "<h1 id=\"b1vllm-lmdeploy\">进阶 B1：引擎机制走读——vLLM × LMDeploy 双引擎对照</h1>\n<blockquote>\n<p><strong>讲次</strong>：第二阶段进阶专题 · 模块 B（推理引擎深挖）第 1 讲\n<strong>建议时长</strong>：2.5–3 小时（机制走读约 110 分钟 + 实操约 70 分钟）\n<strong>前置</strong>：第一阶段技术轨第 2 周（vLLM 部署与参数体系）、第 3 周（压测与运维）；进阶 A1（并行策略全景）\n<strong>素材来源</strong>：LMDeploy 官方文档《TurboMind 框架》《PyTorchEngine 性能分析》（上海人工智能实验室，Apache-2.0）；书生实战营《LMDeploy 部署进阶》（InternLM Tutorial）；ms-swift《推理和部署》（ModelScope，Apache-2.0）；Datawhale《Self-LLM：Qwen3 vLLM 部署调用》《Happy-LLM 扩展章：vLLM Thinking Budget》；DeepSeek 官方发布与技术报告（2026-10-20）；公司自有实测记录《MTP 实测总结-2026-10-13》。教学组织与对照框架为「Muse 整理」，逐项结论标注来源。</p>\n</blockquote>\n<hr />\n<h2 id=\"_1\">一、学习目标与本讲地图</h2>\n<p>第一阶段你已经会部署 vLLM、会调参数、会压测。本讲不再教操作，解决三个更深的问题：</p>\n<ol>\n<li><strong>引擎内部到底怎么运转</strong>：一个请求从进门生成结束，调度器、KV 管理、批处理各环节在忙什么——能对着公司现行服务的日志，把每个字段对应回机制。</li>\n<li><strong>换一个引擎，什么变了、什么没变</strong>：以 LMDeploy 为对照系，逐项比较架构、KV 管理、参数口径与可观测性，建立「引擎无关」的机制直觉。</li>\n<li><strong>迁移与选型的判断力</strong>：给一个新场景，能说清选 vLLM 还是 LMDeploy、迁移配置时哪些参数必须逐项核对而不是照抄数值。</li>\n</ol>\n<p>本讲地图：请求生命周期快进（第二节）→ vLLM 机制走读（第三节）→ LMDeploy 机制走读（第四节）→ 双引擎对照总表（第五节）→ 第三对照系 DeepInfer（第六节）→ 参数口径对照专题（第七节）→ 选型框架（第八节）→ 双引擎实操（第九节）。</p>\n<p><strong>先说结论</strong>：vLLM 与 LMDeploy 在「连续批处理 + KV 分块/池化管理」的大方向上是趋同的，真正的差异在三处——KV 复用的语义（按内容前缀 vs 按会话保活）、参数口径（同值不同义）、生态重心（通用前沿模型 vs 书生生态与量化工具链）。选型先看模型与量化路线，再看机制细节。</p>\n<h2 id=\"_2\">二、推理引擎到底在忙什么（快进）</h2>\n<p>一个请求在引擎里的生命周期（Muse 整理，承接第一阶段第 2 周）：</p>\n<p><strong>进门</strong>（API 层收请求、套对话模板、分词）→ <strong>排队</strong>（调度器决定何时进批）→ <strong>Prefill</strong>（整段 prompt 一次并行计算，建 KV Cache，产出第一个 token；算力受限）→ <strong>Decode</strong>（逐 token 生成，每步读全部权重 + 全部 KV；带宽受限）→ <strong>采样与出门</strong>（按 temperature/top_p 等采样参数选词，流式返回，命中停止条件结束）。</p>\n<p>三个必须钉死的直觉：</p>\n<ul>\n<li><strong>引擎的核心工作是「拼批」</strong>。单个请求的 Decode 每步只算 1 个 token，却要搬运一遍全部权重——公司实测 GB10 带宽 224–226 GB/s，Qwen3.8-Flash-Next 每步激活约 6B 参数、NVFP4 下约 3 GB 权重，纯搬运天花板约 13 ms/token。把多个请求拼进同一批，一次搬运喂饱多个请求，是吞吐的全部秘密。这就是<strong>连续批处理（continuous batching）</strong>：不等整批结束，token 级动态进出。把天花板和实测对照一下（Muse 整理，数字出自公司实测）：纯权重搬运的理论上限约 75 tok/s（3 GB ÷ 225 GB/s ≈ 13.3 ms/token），而现行服务单流实测生成吞吐在 25–31 tok/s 量级——中间的差额花在 KV 读取、注意力计算、MoE 路由与调度开销上。<strong>引擎机制优化的本质，就是把实测往天花板上推</strong>：批处理摊薄搬运、KV 管理减少无效读取、CUDA Graph 砍掉启动开销、投机解码让一次搬运产出多个 token。本讲后面的每个机制，都可以放回这笔账里定位。</li>\n<li><strong>KV Cache 是第二份「权重」</strong>。它随上下文长度和并发数线性膨胀，且 Decode 每步都要全量读取。引擎之间一半的机制差异，都在 KV 怎么存、怎么复用、怎么淘汰上。</li>\n<li><strong>调度器是交通警察</strong>。Prefill 和 Decode 抢同一条路：长 Prefill 独占会让所有在途请求的 TPOT 抖动，于是有了分块预填充（chunked prefill）把 Prefill 切块与 Decode 交错——公司现行配置已开启（来源：《MTP 实测总结》参数表）。</li>\n</ul>\n<h2 id=\"vllm\">三、vLLM 机制走读：对着公司现行配置逐项看</h2>\n<p>现行服务：Qwen3.8-Flash-Next-NVFP4（125B MoE）+ vLLM 官方 Day-0 镜像，TP2 + EP、MTP3、max-num-seqs 8、gpu-memory-utilization 0.80、prefix caching 已开启、CUDA Graph FULL_DECODE_ONLY（来源：公司《MTP 实测总结》与第一阶段第 2 周讲义现行值表）。下面每个机制都对照这份配置讲。</p>\n<h3 id=\"31-token\">3.1 调度器：token 预算制</h3>\n<p>vLLM 的调度以「每步 token 预算」为核心：调度器每步在 Running 队列里推进 Decode，同时从 Waiting 队列 admitting 新请求做 Prefill，总 token 数受预算约束；chunked prefill 开启后，超预算的长 Prefill 被切块，剩余部分下步继续，与 Decode 交错（Muse 整理；现行配置中 chunked prefill 为 True，来源：《MTP 实测总结》）。</p>\n<p>两个现行值要读懂：</p>\n<ul>\n<li><strong>max-num-seqs = 8</strong> 是并发序列硬上限。此前压测 12 并发时 TTFT 炸到 11.8 秒，根源就是超过 8 的请求只能排队（来源：《MTP 实测总结》参数表注）。并发上限不是越大越好：并发拉高摊薄了搬运成本，但每条序列的 TPOT 会变差，本质是拿单请求延迟换总吞吐。</li>\n<li><strong>max_num_scheduled_tokens 在 MTP 开启时被强制设为 2048</strong> 并伴随一条 WARNING（来源同上）。这提醒我们：投机解码会改写调度预算的推导方式，改 MTP 配置时要连带复核这一项——这是「参数之间会互相咬」的典型案例。</li>\n</ul>\n<h3 id=\"32-pagedattention-block-kv\">3.2 PagedAttention 与 Block 管理：KV 的虚拟内存</h3>\n<p>PagedAttention 把每条序列的 KV 切成固定大小的 block，物理上不要求连续，用 block 表做逻辑到物理的映射——和操作系统虚拟内存解决的是同一个问题：消除碎片，让 KV 池能被所有序列共享着用满（来源：第一阶段第 2 周讲义机制表）。</p>\n<p>公司这台机器有个细节值得注意：启动日志里 attention block size 被设为 <strong>800 tokens</strong>，并伴随 mamba page size 的 padding 日志（来源：《MTP 实测总结》日志表）。原因是 Qwen3.8-Flash-Next 是带线性注意力层的混合架构，其状态页与标准注意力 block 需要对齐——<strong>block 大小不是跨模型通用的常数，而是引擎按模型架构算出来的</strong>。这解释了为什么照抄别家模型的 block 配置没有意义。</p>\n<h3 id=\"33\">3.3 前缀缓存：按内容复用</h3>\n<p>prefix caching 的机制是给每个满 block 的内容算哈希并串成链，新请求的前缀只要与缓存中某条链逐块相同，就直接复用其 KV，跳过这部分 Prefill（Muse 整理）。现行服务已开启。</p>\n<p>读日志要会看：周期日志里的 <code>Prefix cache hit rate</code> 在压测中是 0.0%——不是没生效，而是 bench 用随机拼凑的 prompt，本来就没有公共前缀（来源：《MTP 实测总结》日志表注）。<strong>命中率是负载属性，不是引擎属性</strong>：系统提示词统一、多轮对话、模板化业务 prompt 的场景，命中率才会真正上去。B2 讲的量化与本讲的实操都会再用到这个判断。</p>\n<h3 id=\"34-cuda-graph-decode\">3.4 CUDA Graph：只捕获 Decode</h3>\n<p>现行配置 CUDA Graph 为 FULL_DECODE_ONLY，捕获尺寸 [1, 2, 4, 8, 16]（来源：《MTP 实测总结》）。只捕 Decode 的原因：Decode 每步的计算图形状只随 batch 大小变化、档位有限，值得预先捕获以消除小算子的启动开销；Prefill 长度千变万化，捕获不经济。代价记在启动账上：权重加载约 7 分钟、CUDA Graph 捕获与 warmup 约 3–5 分钟，整个启动 8 个阶段约 15 分钟（来源同上）——重启成本是运维纪律（攒批改参）的由来。</p>\n<h3 id=\"35\">3.5 可观测性：周期日志就是仪表盘</h3>\n<p>vLLM 每 10 秒一行 Engine 周期日志，第一阶段第 3 周已教读法，本讲只钉三个与机制对应的字段（来源：《MTP 实测总结》第三节）：<code>Running / Waiting reqs</code> 对应调度器两队列；<code>GPU KV cache usage</code> 对应 block 池占用率——它长期顶格说明并发或上下文已把 KV 池吃满，新请求只能等；<code>Avg generation throughput</code> 是 Decode 吞吐的窗口平均。另有一行 SpecDecoding metrics（接受长度、逐位置接受率）是投机解码的仪表盘，机制细节留到 B2，本讲只需知道：<strong>MTP 开时 generation throughput 约 31 tok/s、关时约 25 tok/s（单流）</strong>，接受率平均 61.8%（公司 A/B 实测）。读这行日志有个自检技巧：Accepted throughput ÷ Drafted throughput 应约等于平均接受率（实测例：40.30 ÷ 48.30 ≈ 83.4%，与日志自报一致）——对不上，先怀疑日志口径或采样窗口，而不是急着下性能结论（来源：《MTP 实测总结》第三节自检关系）。</p>\n<h2 id=\"lmdeploy-turbomind-pytorch\">四、LMDeploy 机制走读：TurboMind 与 PyTorch 双引擎</h2>\n<p>LMDeploy 一套框架内有两个引擎，定位不同（本节框架为 Muse 整理，机制事实均出自官方存档文档）：</p>\n<ul>\n<li><strong>TurboMind</strong>：基于 NVIDIA FasterTransformer 研发的高性能引擎（C++ 内核路线），为推理性能而生。取舍写在脸上：FasterTransformer 的 beam search、前缀提示词、稀疏 GEMM 等功能在 TurboMind 中被去掉，换取对话式推理的专注优化（来源：LMDeploy 官方《TurboMind 框架》）。</li>\n<li><strong>PyTorch 引擎</strong>：PyTorch 原生实现路线，胜在与 PyTorch 生态贴合——官方文档为其提供了 PyTorch Profiler 集成、Nsight Systems、Ray timeline 三套性能分析通道，多卡基于 Ray 实现（来源：LMDeploy 官方《PyTorchEngine 性能分析》）。</li>\n</ul>\n<p>新项目选哪个引擎，先看模型在哪个引擎的支持列表与量化路线更全，再看性能——这是读双引擎框架的第一原则。</p>\n<h3 id=\"41-persistent-batch\">4.1 Persistent Batch：换个名字的连续批处理</h3>\n<p>TurboMind 把连续批处理建模为一个跨越整个服务生命周期的 <strong>persistent batch</strong>：预先备好 N 个 batch slot，有空闲 slot 时请求加入，生成完毕 slot 立刻释放接新请求，batch 规模自动扩缩（来源：《TurboMind 框架》）。与 vLLM 的调度器队列是同一种思想的两种实现：vLLM 以 token 预算为调度粒度，TurboMind 以 slot 为占用粒度。对照着理解，比背任何一家的术语都管用。</p>\n<h3 id=\"42-kv-kv\">4.2 KV 缓存管理器：一个「KV 的缓存」</h3>\n<p>这是 TurboMind 与 vLLM 分野最大的一处，值得细读（来源：《TurboMind 框架》）：</p>\n<ul>\n<li>KV 由管理器从内存池分配，每个 slot 对应一条序列的 KV，块大小可预分配、按需分配或介于两者之间。</li>\n<li>池满时按 <strong>LRU</strong> 淘汰最久未用的序列——但被淘汰的 KV 不是直接扔掉，而是<strong>退化为最简形式（如 token IDs）保存</strong>；同一 sequence 再次到来且命中留存记录时，历史 KV 直接返回、跳过 context decoding（即 Prefill）；若已是 cache-miss，则用留存的 token IDs 重新解码回 KV。</li>\n<li>官方的说法是：从用户角度看，系统「就像可以访问无限的设备内存」。</li>\n</ul>\n<p>与 vLLM 前缀缓存对照（Muse 整理）：<strong>vLLM 复用的是「内容相同的前缀」，TurboMind 保活的是「同一会话的 KV」</strong>。前者对模板化 prompt、共享系统提示词友好（无状态、跨用户）；后者对长多轮对话友好（有状态、按会话）。两者解决的都是「别重复算 Prefill」，但命中条件、淘汰策略、适用负载完全不同——这是本讲最值得带走的一个对照。</p>\n<p>另外两个 TurboMind 实现要点：其一，注意力用基于 cutlass 的 FMHA 实现并加入间接缓冲指针，支持 batch 内<strong>不连续的 KV</strong>——与 PagedAttention 的目标相同（KV 不要求物理连续），实现路径不同；其二，它实现了 <strong>INT8 KV cache</strong>，直接压缩 KV 的内存与带宽开销（来源：《TurboMind 框架》）。KV 量化在 LMDeploy 的部署侧还有在线 int4/int8 选项，B2 展开。</p>\n<h3 id=\"43\">4.3 部署形态与显存账：实战营口径</h3>\n<p>部署入口是 <code>lmdeploy chat</code>（本地对话）、<code>lmdeploy serve api_server</code>（OpenAI 兼容 API 服务）、<code>lmdeploy serve gradio</code>（网页前端），量化走 <code>lmdeploy lite auto_awq</code>（来源：书生实战营《LMDeploy 部署进阶》）。两个参数先记住，第七节要细究：</p>\n<ul>\n<li><code>--cache-max-entry-count</code>（默认 0.8）：KV cache 占<strong>剩余显存</strong>的最大比例。</li>\n<li><code>--quant-policy</code>：KV cache 量化策略，0 为不量化、4 为 int4、8 为 int8（v0.4.0 起支持在线 KV 量化，per-head per-token 非对称量化；来源同上）。</li>\n</ul>\n<p>实战营给了一笔可复算的显存账（InternLM2.5-7B、BF16、24 GB 卡）：权重 14 GB，剩余 10 GB，KV 按默认 0.8 占 8 GB，总占用约 23 GB；把 cache-max-entry-count 改到 0.4，KV 降为 4 GB、总占用约 19 GB。这笔账的价值不在数字，在口径：<strong>LMDeploy 的 0.8 是「剩余显存的 80%」，vLLM 的 gpu-memory-utilization 0.80 是「总显存的 80%（含权重）」</strong>——数值一样，分母完全不同。参数口径专题见第七节。</p>\n<h2 id=\"_3\">五、双引擎对照总表</h2>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>vLLM</th>\n<th>LMDeploy</th>\n<th>来源</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>架构血统</td>\n<td>Python 调度 + 高性能内核，通用引擎路线</td>\n<td>TurboMind（FasterTransformer 血统，C++ 内核）+ PyTorch 双引擎</td>\n<td>LMDeploy 官方文档；Muse 整理</td>\n</tr>\n<tr>\n<td>批处理</td>\n<td>连续批处理，token 预算调度，chunked prefill 交错</td>\n<td>Persistent batch，slot 占用制，自动扩缩</td>\n<td>《MTP 实测总结》；《TurboMind 框架》</td>\n</tr>\n<tr>\n<td>KV 管理</td>\n<td>PagedAttention 分块 + block 表，池内共享</td>\n<td>内存池 + slot 分配，块大小可调</td>\n<td>第一阶段讲义；《TurboMind 框架》</td>\n</tr>\n<tr>\n<td>KV 复用语义</td>\n<td>前缀缓存：按内容哈希复用相同前缀的 KV</td>\n<td>LRU 保活：同会话 KV 淘汰后退化为 token IDs，回来可免 Prefill</td>\n<td>《MTP 实测总结》；《TurboMind 框架》</td>\n</tr>\n<tr>\n<td>KV 量化</td>\n<td>以引擎版本支持为准（开课复核）</td>\n<td>TurboMind INT8 KV；部署侧在线 int4/int8（quant-policy）</td>\n<td>《TurboMind 框架》；实战营</td>\n</tr>\n<tr>\n<td>权重量化</td>\n<td>NVFP4（modelopt_fp4）为公司现行路线</td>\n<td>AWQ W4A16 工具链（lite auto_awq）成熟</td>\n<td>公司实测记录；实战营、LMDeploy W4A16 存档</td>\n</tr>\n<tr>\n<td>并行（经 ms-swift 接入）</td>\n<td>TP / PP / DP，多 LoRA ✅</td>\n<td>TP / DP，多 LoRA ❌</td>\n<td>ms-swift《推理和部署》三后端对比表</td>\n</tr>\n<tr>\n<td>投机解码</td>\n<td>MTP（模型自带层）公司已实测，接受率 61.8%</td>\n<td>以当前版本文档为准（开课复核）</td>\n<td>公司 A/B 实测</td>\n</tr>\n<tr>\n<td>参数口径风格</td>\n<td>显存按总显存比例；长度按总长（max-model-len）</td>\n<td>KV 按剩余显存比例；生成长度按 max_new_tokens 口径</td>\n<td>见第七节</td>\n</tr>\n<tr>\n<td>日志与指标</td>\n<td>10 秒周期日志（吞吐/队列/KV 占用/前缀命中）+ SpecDecoding 行</td>\n<td>PyTorch 引擎：Profiler/nsys/Ray timeline（环境变量开启）</td>\n<td>《MTP 实测总结》；《PyTorchEngine 性能分析》</td>\n</tr>\n<tr>\n<td>生态重心</td>\n<td>前沿模型 Day-0 支持、社区规模</td>\n<td>书生生态（InternLM/InternVL）、量化部署工具链</td>\n<td>Muse 整理</td>\n</tr>\n</tbody>\n</table>\n<p>读表提醒：表中「以版本为准」的格子不要背答案——两个项目迭代都快，正确做法是开课当周查各自文档确认，这正是把它们标出来的原因。</p>\n<h2 id=\"deepinfer2026-10\">六、第三对照系：DeepInfer（2026-10 新开源）</h2>\n<p>2026-10-20，DeepSeek 开源了其内部生产推理框架 <strong>DeepInfer</strong>（Apache-2.0）。它跑不到公司硬件上（原因见下表），但作为「生产级推理系统长什么样」的最新样本，值得放进对照系——看不懂别家的设计取舍，就容易把自家引擎的每个默认值当成真理（本节事实来源：DeepSeek 官方发布与技术报告，2026-10-20）。</p>\n<p><strong>血统与范围先说清</strong>：DeepInfer 主要构建在 vLLM 之上，源自其内部对早期 vLLM 的深度定制分支，另借鉴 SGLang 与 TensorRT-LLM。首发版仅支持 DeepSeek-V4.1-Flash 一个模型、仅离线模式；其 KV Cache 系统、PD 分离、数据并行副本负载均衡<strong>均未开源</strong>——开源的是高性能内核，不是完整服务框架。硬件仅支持 NVIDIA SM100（CUDA 13）与华为昇腾 950（CANN 9.2）。<strong>GB10 是 sm_121，不在支持范围，公司 Spark 无法运行，本节只作机制对照与观察。</strong></p>\n<p>机制要点里有四个值得技术轨学员琢磨的设计决策：</p>\n<ul>\n<li><strong>Attention DP + 均衡 CP</strong>：注意力走数据并行、上下文并行做均衡——与 A1 讲的并行策略在推理侧的再组合。</li>\n<li><strong>EP 取值哲学按阶段分化</strong>：MoE 专家并行配 EPLB 专家负载均衡，且 Prefill 用小 EP（2–8）、Decode 用 Wide-EP（64–128）。背后的账是：Prefill 算力受限、拼大批摊薄通信；Decode 带宽受限、专家分散到更多卡上分摊搬运——正是第二节「两阶段两种瓶颈」推到极致的结论。</li>\n<li><strong>异步零开销调度 + 批次不变推理</strong>：调度开销从关键路径上拿掉；批次不变（batch-invariant）与确定性采样让同一请求在不同批次组成下产出一致结果（仅 NVIDIA）——生产系统对「可复现」的执念，压测口径（第三周）里我们只摸到了边。</li>\n<li><strong>算子层收编自家全家桶</strong>：FlashMLA、DeepGEMM、DeepEP、TileKernels、DeepSelect、TileLang kernel——引擎竞争到最后是算子库的竞争。结构化输出（regex/JSON schema/EBNF）则已是生产标配而非加分项。</li>\n</ul>\n<p>生产数据（<strong>官方自报、未经第三方验证</strong>，引用时必须带这句）：单集群日吞吐 155 万亿 token、输入缓存命中率 96%、平均 TTFT 约 400 ms、单流约 230 tok/s（编码场景 300）。96% 的缓存命中率反过来印证第三节的判断：真实生产负载（模板化、长系统提示词）的命中率与 bench 的 0% 是两个世界，<strong>评判缓存机制要拿自己的负载说话</strong>。同批开源的 deepseek-recipe 是生产级 token 编解码组件，与官方 API 处理逻辑对齐，做分词口径对齐时可参考。</p>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>vLLM（公司现行）</th>\n<th>LMDeploy</th>\n<th>DeepInfer</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>定位</td>\n<td>通用开源推理引擎</td>\n<td>双引擎框架（性能 + 生态）</td>\n<td>内部生产系统的高性能内核开源</td>\n</tr>\n<tr>\n<td>血统</td>\n<td>原生项目</td>\n<td>TurboMind 源自 FasterTransformer</td>\n<td>vLLM 深度定制分支 + 借鉴 SGLang/TensorRT-LLM</td>\n</tr>\n<tr>\n<td>开源完整度</td>\n<td>完整服务框架</td>\n<td>完整框架（含量化工具链）</td>\n<td>仅内核：单模型、离线模式，KV 系统/PD 分离/DP 均衡未开源</td>\n</tr>\n<tr>\n<td>硬件</td>\n<td>覆盖广，公司 GB10 在跑</td>\n<td>以当前版本支持列表为准</td>\n<td>仅 SM100 与昇腾 950，<strong>GB10 不支持</strong></td>\n</tr>\n<tr>\n<td>对公司适用性</td>\n<td>生产主力</td>\n<td>候选对照与特定场景备选</td>\n<td>不可运行，机制对照与观察名单</td>\n</tr>\n</tbody>\n</table>\n<p><strong>选型结论更新</strong>：DeepInfer 的出现不改变「vLLM 主力、LMDeploy 对照」的现有格局；它改变的是我们的观察清单——当它的模型覆盖、在线模式或 GB10 级硬件支持有进展时再重估，现阶段把它的 EP 分阶段取值与批次不变思想收进调优工具箱即可。</p>\n<h2 id=\"_4\">七、参数口径对照专题：迁移配置时最容易栽的地方</h2>\n<p>双引擎对照里，机制差异看得见，<strong>口径差异看不见</strong>——它们藏在同名同值的参数背后，迁移时照抄数值必栽。以下四组逐项拆（Muse 整理，参数事实出自前引各来源）：</p>\n<table>\n<thead>\n<tr>\n<th>参数对</th>\n<th>vLLM 口径</th>\n<th>LMDeploy 口径</th>\n<th>栽点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>显存比例</td>\n<td><code>gpu-memory-utilization 0.80</code>：引擎占<strong>总显存</strong>的比例，权重在内</td>\n<td><code>cache-max-entry-count 0.8</code>：KV 占<strong>剩余显存</strong>（扣权重后）的比例</td>\n<td>同填 0.8，实际 KV 差出一个权重大小；在小显存卡上照抄会直接 OOM 或 KV 严重不足</td>\n</tr>\n<tr>\n<td>最大长度</td>\n<td><code>max-model-len</code>：输入 + 输出的<strong>总长</strong>上限</td>\n<td>部署侧常见 <code>max_new_tokens</code> 口径：只算<strong>生成</strong>部分</td>\n<td>把总长值填进生成长度，等于把上下文预算放大一截，KV 账全错</td>\n</tr>\n<tr>\n<td>并行度</td>\n<td><code>--tensor-parallel-size 2</code></td>\n<td><code>--tp 1</code>（api_server 参数）</td>\n<td>名字不同、含义相同，属于「同义不同名」；反而好办，对照表一贴即可</td>\n</tr>\n<tr>\n<td>并发上限</td>\n<td><code>max-num-seqs</code>：调度器准入的序列数上限</td>\n<td>persistent batch 的 slot 数（预备的批次槽位）</td>\n<td>概念对应但粒度不同：vLLM 还受 token 预算二次约束，LMDeploy 以 slot 占用为准，压测曲线形状会不同</td>\n</tr>\n</tbody>\n</table>\n<p>请求级参数同样有坑：vLLM 的 <code>SamplingParams.max_tokens</code> 只算生成 token（Happy-LLM 的 Thinking Budget 实验代码里专门算了这笔账：思考预算要另行扣减已生成计数，来源：Datawhale《Happy-LLM vLLM 推理Thinking Budget》）——把「总长思维」带进请求级参数，截断位置就会莫名其妙。</p>\n<p><strong>迁移核对清单</strong>（换引擎部署同一模型时逐项打勾）：</p>\n<ol>\n<li>显存：这个比例的分母是总显存还是剩余显存？按新口径重算 KV 账（用实战营那笔 7B 账的方法）。</li>\n<li>长度：每个长度参数管的是总长、输入还是生成？三者分别对齐后再填。</li>\n<li>并行：TP/DP 的参数名与生效范围（单机/跨机）逐项对照，启动后看日志确认实际切分。</li>\n<li>量化：权重格式（NVFP4 / AWQ 等）与 KV 量化是两个开关，别把一家的「quant-policy」理解成权重量化。</li>\n<li>并发：准入上限的参数叫什么、还有没有第二重约束（token 预算/slot）？</li>\n<li>日志：新引擎的周期指标在哪看、字段叫什么——先建好观测，再开始调参（第一阶段运维纪律）。</li>\n</ol>\n<h2 id=\"_5\">八、选型框架：什么场景选谁</h2>\n<p>按顺序问四个问题（Muse 整理，公司结论结合现行实境）：</p>\n<ol>\n<li><strong>模型在谁家支持最好？</strong> 前沿新模型、需要 Day-0 适配与 NVFP4 路线——vLLM 是公司已验证的答案，现行 Qwen3.8-Flash-Next 服务即是此路。InternLM/InternVL 生态模型、要用其量化部署全链路——LMDeploy 的原生支持更顺。</li>\n<li><strong>量化路线走哪条？</strong> 权重 W4A16（AWQ）+ 在线 KV int4/int8 的组合，LMDeploy 工具链（lite auto_awq + quant-policy）是现成流水线；NVFP4 与 MTP 投机解码的组合，公司只在 vLLM 上有实测背书。细节 B2 展开。</li>\n<li><strong>负载形态是什么？</strong> 模板化 prompt、共享长前缀：vLLM 前缀缓存直接受益，且公司有命中率观测口径；长多轮会话粘性强的对话服务：TurboMind 的会话级 KV 保活（LRU 退化为 token IDs）在机制上更贴——但注意这条结论来自官方文档，<strong>未经公司自家实测</strong>，立项试点前先做第九节的对照实验再下结论。</li>\n<li><strong>团队的运维资产在哪？</strong> 公司在 vLLM 上有启动脚本、周期日志读法、压测脚本与变更纪律的完整积累；换引擎等于重建这套资产。没有前三条的硬理由，不迁移生产，试点先行。</li>\n</ol>\n<p>一句话收束：<strong>vLLM 是默认项，LMDeploy 是「模型生态或量化路线对口」时值得认真试点的对照项，DeepInfer 是观察项</strong>。</p>\n<h2 id=\"_6\">九、实操：同一模型双引擎上线对照</h2>\n<p><strong>实验设计</strong>：同一台 DGX Spark（单机即可，避开生产双机服务）、同一模型 <strong>Qwen3-8B（BF16）</strong>（vLLM 部署步骤可参照 Datawhale《Self-LLM：Qwen3 vLLM 部署调用》的 <code>vllm serve</code> 口径）、同一把压测尺子（公司 <code>~/workspace/your_files/qwen38-flash-bench/</code> 的 bench 客户端，口径与 vllm bench serve 一致；LMDeploy 的 api_server 提供 OpenAI 兼容接口，同一客户端可直连——接入方式以开课当周版本文档复核）。变量只有引擎一个，其余全固定，这是第一阶段压测纪律的原样复用。</p>\n<p><strong>步骤 0：LMDeploy 冒烟（硬时间盒 30 分钟，先于一切）</strong></p>\n<p>GB10（ARM + sm_121）不在 LMDeploy 官方验证的主流组合里，<strong>装不上是完全可能的结果，不丢人、要记录</strong>。冒烟清单：①隔离环境（独立 venv/conda，不碰生产容器）→ ②按官方当前文档安装 → ③<code>lmdeploy chat</code> 最小对话跑通 → ④<code>lmdeploy serve api_server</code> 起服务、curl 模型列表与一次对话成功 → ⑤记录版本与依赖清单。四步全过才进入对照；任一步卡满 30 分钟，停，转入降级路径，并把失败点（缺轮子/算子不支持/版本冲突）写进实验记录——失败点本身就是选型证据。</p>\n<p><strong>步骤 1：vLLM 基线</strong>。单机启动 Qwen3-8B：固定 <code>--max-model-len 8192</code>、显存比例按本机统一内存口径取值并记录；bench 跑输入 1024 / 输出 256、并发 1 / 4 / 8 三档（与公司 MTP 实测同口径档位），每档留周期日志片段。</p>\n<p><strong>步骤 2：LMDeploy 同口径</strong>。用第七节核对清单逐项对齐参数后再启动（显存按「剩余显存」口径重算 KV、长度分总长/生成两项对齐、tp=1）；同三档并发、同 bench 配置跑完。</p>\n<p><strong>步骤 3：填记录表并写差异分析</strong>。</p>\n<table>\n<thead>\n<tr>\n<th>记录项</th>\n<th>vLLM</th>\n<th>LMDeploy</th>\n<th>备注</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>版本与启动命令全文</td>\n<td></td>\n<td></td>\n<td>参数对齐过程逐项留痕</td>\n</tr>\n<tr>\n<td>启动耗时（到 API 就绪）</td>\n<td></td>\n<td></td>\n<td>vLLM 侧分阶段记录（对照启动 8 阶段）</td>\n</tr>\n<tr>\n<td>TTFT p50 / p99（并发 1 / 4 / 8）</td>\n<td></td>\n<td></td>\n<td>同 bench 口径</td>\n</tr>\n<tr>\n<td>TPOT p50（并发 1 / 4 / 8）</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>生成吞吐（并发 8）</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>运行时内存占用（权重 / KV / 总）</td>\n<td></td>\n<td></td>\n<td>LMDeploy 侧用实战营显存账方法复算</td>\n</tr>\n<tr>\n<td>前缀/会话复用观测</td>\n<td>前缀命中率（周期日志）</td>\n<td>会话复用现象（多轮同 prompt 观察）</td>\n<td>口径不同，如实分开记录，不硬比</td>\n</tr>\n<tr>\n<td>异常与坑</td>\n<td></td>\n<td></td>\n<td>含冒烟记录</td>\n</tr>\n</tbody>\n</table>\n<p><strong>验收标准</strong>：①记录表完整、两组数据同口径可比对；②差异分析能把每个显著差异<strong>归因到机制或口径</strong>（引用本讲第五、七节），不许只写「A 比 B 快」；③给出一条明确的选型建议并写明证据边界（单机、单模型、BF16 的结论不外推到 125B MoE 生产场景）。</p>\n<p><strong>降级路径（冒烟不过时，诚实执行）</strong>：改为 vLLM 单引擎深挖——同模型做 max-num-seqs 与 chunked prefill 的单变量对照（复用第一阶段实验方法），LMDeploy 部分基于官方存档文档完成差异分析表，并在报告中<strong>逐项标注哪些结论来自文档、未经自家实测</strong>。降级不降验收标准。</p>\n<h2 id=\"_7\">十、常见坑清单</h2>\n<ol>\n<li><strong>0.8 照抄症</strong>：把 vLLM 的 gpu-memory-utilization 数值原样填给 cache-max-entry-count（或反之），分母不同、KV 账全错。防法：第七节清单第 1 项。</li>\n<li><strong>拿 bench 的 0% 命中率否定前缀缓存</strong>：随机 prompt 本来就没有前缀可命中。先看负载，再评机制。</li>\n<li><strong>双机脚本不一致</strong>：公司有过只改一台 launch 脚本、两边 MTP 配置对不上导致启动卡死的实测教训（来源：《MTP 实测总结》运维教训）。任何引擎、任何双机部署，配置必须字节级一致并 diff 确认。</li>\n<li><strong>把实战营命令当现行版本</strong>：存档教程基于 lmdeploy 0.5.3，命令与参数以开课当周官方文档复核为准——这也是所有存档素材的通用纪律。</li>\n<li><strong>TurboMind 权重格式想当然</strong>：TurboMind 的权重设计源自 LLaMA 官方实现，与 HF 格式在 W_q/W_k 上差一个转置，官方在转换代码中做了适配（来源：《TurboMind 框架》FAQ）。迁移模型时先确认转换路径，不要手动挪文件碰运气。</li>\n<li><strong>跨口径比吞吐</strong>：不同输入/输出长度、不同并发、不同量化格式的数字不能直接比大小（第一阶段纪律）。看到「某引擎快 X 倍」的宣传，先问口径。</li>\n<li><strong>日志时区误读</strong>：vLLM 容器日志为 UTC，北京时间需 +8（来源：《MTP 实测总结》）。跨引擎对时间线时先统一时区。</li>\n<li><strong>以为 DeepInfer 能上 Spark</strong>：仅 SM100 与昇腾 950，GB10 不在支持范围。看到新开源先查硬件与模型支持表，再谈试用。</li>\n</ol>\n<h2 id=\"_8\">十一、课后练习与延伸阅读</h2>\n<p><strong>课后练习</strong></p>\n<ol>\n<li>用实战营的显存账方法，算一笔账：Qwen3-8B（BF16）在单台 Spark（可见约 121.6 GB）上分别按 vLLM 与 LMDeploy 口径给 KV 留预算，两种口径下 KV 各是多少 GB？差值来自哪个参数的分母？</li>\n<li>在公司现行服务周期日志里找一行 Engine 日志，逐字段标注它对应的机制（调度/KV/吞吐），并判断当时服务的瓶颈更可能在哪一侧。</li>\n<li>任选一个你设想的业务场景（如「带统一系统提示词的标书问答」或「长多轮客服对话」），用第八节四问写一页选型说明，结论必须注明证据来自实测还是文档。</li>\n</ol>\n<p><strong>延伸阅读（逐条标来源）</strong></p>\n<ul>\n<li>LMDeploy 官方《TurboMind 框架》（存档：materials-advanced/internlm/02）——persistent batch 与 KV 缓存管理器原文。</li>\n<li>LMDeploy 官方《PyTorchEngine 性能分析》（存档：internlm/03）——Profiler/nsys/Ray timeline 的开启方法，模块 C 的预习。</li>\n<li>书生实战营《LMDeploy 部署进阶》（存档：internlm/07）——部署命令、显存账与 W4A16/KV 量化实操原文（版本 0.5.3，命令需复核）。</li>\n<li>LMDeploy 官方《INT4 模型量化和部署》（存档：internlm/01）——B2 预习，AWQ 路线细节。</li>\n<li>ms-swift《推理和部署》（存档：materials-advanced/modelscope/06）——三后端（vLLM/SGLang/LMDeploy）能力对比表与 swift deploy 的参数映射，第七节的对照来源。</li>\n<li>Datawhale《Self-LLM：Qwen3 vLLM 部署调用》（存档：datawhale/04）——实操中 vLLM 侧的部署口径参照。</li>\n<li>公司自有《MTP 实测总结-2026-10-13》（goals/dgx-spark/files/）——周期日志字段、启动 8 阶段与 A/B 数据，本讲 vLLM 侧的证据底座。</li>\n<li>DeepSeek 官方 DeepInfer 发布与技术报告（2026-10-20，官方仓库 README）——第六节事实来源；生产数据为官方自报，阅读时保持口径警惕。</li>\n</ul>"}, {"num": "B2x", "ch": "进阶 B · 推理引擎", "label": "B2 量化与投机解码", "title": "进阶 B2：量化全家桶与投机解码家族", "html": "<h1 id=\"b2\">进阶 B2：量化全家桶与投机解码家族</h1>\n<blockquote>\n<p>讲次：第二阶段进阶专题 · 模块 B（推理引擎深挖）第 2 讲\n建议时长：2.5–3 小时（授课约 2 小时 + 实操约 1 小时）\n前置：技术轨第 1 周（推理七步、KV Cache 与量化概念）、第 2–3 周（vLLM 部署与压测）；模块 B 第 1 讲（双引擎对照）；公司现行部署口径（NVFP4 + MTP3）\n素材来源：ms-swift《导出与量化推送》（魔搭 ModelScope 社区，存档 05）；LMDeploy《INT4 模型量化和部署》（上海人工智能实验室，存档 01）；Datawhale self-llm《DeepSeek-7B-Chat 4bits 量化 QLoRA 微调》（存档 05）；机器之心 Pro 论文解读《SpecTr-GBV》（Yijun Lin 等，EMNLP 2026）、机器之心《DoSA 稀疏注意力》（小红书 Dots 团队，深水、星炼）；公司自有实测《MTP 实测总结-2026-10-13》；DeepSeek 官方发布（DeepInfer 开源，2026-10-20）。教学组织与算例为「Muse 整理」，凡引用数值均在文中标注出处。\n版权口径：社区与机构素材版权归原作者/机构，仅公司内部学习使用；机器之心两篇为前沿素材，本讲以自有文字转述观点并标注来源。</p>\n</blockquote>\n<hr />\n<h2 id=\"_1\">一、学习目标与本讲地图</h2>\n<p>学完这一讲，你应该能做到五件事：</p>\n<ol>\n<li><strong>算得清账</strong>：给一个模型和一种量化格式（W4A16 / W8A8 / W4A4），当场算出权重显存、decode 每步的权重搬运量，以及它在 GB10 上的理论速度上限。</li>\n<li><strong>选得对方法</strong>：面对 AWQ、GPTQ、FP8、BNB、NVFP4 五种 PTQ 路线，能说清每种要不要校准、校准在校准什么、精度风险落在哪、工具链在哪。</li>\n<li><strong>做得对验收</strong>：量化完成后不靠「聊两句感觉还行」，而是走冻结测试集 + 双轨指标的精度回归，给出可签字的验收结论。</li>\n<li><strong>读得懂投机</strong>：看到引擎日志里的接受率、平均接受长度，能判断这组投机配置在赚钱还是在亏钱，并知道旋钮往哪边拧。</li>\n<li><strong>排得出组合</strong>：量化和投机解码同时上时，先定精度下限、再排性能收益，不把两个变量搅在一起调。</li>\n</ol>\n<p>本讲地图：先给量化算账（第二节），再逐个过 PTQ 家族（第三节），然后讲校准与验收的方法论（第四节）和一个常被混谈的邻居——KV Cache 量化（第五节）；下半场进入投机解码：原理一页（第六节前半）、家族逐个定位（MTP / EAGLE / Medusa / 多草稿块验证 / DSpark）、公司 MTP 实测精读；最后是前沿选读（第七节）、组合决策流程（第八节）与实操（第九节）。</p>\n<p><strong>一句话结论先行</strong>：量化省的是「搬运」，投机省的是「步数」——decode 慢在每步都要把权重从内存搬一遍。所有选型的第一性原理，就是回到这笔带宽账上算。</p>\n<hr />\n<h2 id=\"w4a16-w8a8-w4a4\">二、量化路线图：三笔账算清 W4A16 / W8A8 / W4A4</h2>\n<h3 id=\"21\">2.1 量化到底在量什么</h3>\n<p>训练后量化（PTQ，Post-Training Quantization）指模型训练完成之后，再把数值从高精度格式换成低比特格式，不重新训练。本讲只谈 PTQ；训练中就用低精度的 QAT（量化感知训练）不在本讲范围。</p>\n<p>一个权衡必须先立住（Muse 整理）：<strong>权重量化</strong>压的是权重本身，省显存、省搬运；<strong>激活量化</strong>连每步计算中的中间激活也压，省的更多，但激活里有离群值（outlier），压坏了精度掉得更凶。业界把格式写成 <strong>WxAy</strong>：x 是权重比特数，y 是激活比特数。于是：</p>\n<ul>\n<li><strong>W4A16</strong>：权重 4 bit、激活保持 16 bit——只动权重，最稳妥，是当前开源生态最成熟的部署格式；</li>\n<li><strong>W8A8</strong>：权重和激活都 8 bit——计算走 INT8/FP8 通路，prefill 这类计算密集场景受益明显；</li>\n<li><strong>W4A4</strong>：权重与激活都 4 bit——最激进，公司现行 NVFP4 部署就是这一档（后端 <code>modelopt_fp4</code>，见《MTP 实测总结》配置表）。</li>\n</ul>\n<h3 id=\"22\">2.2 第一笔账：权重显存</h3>\n<p>权重字节数 ≈ 参数量 × 每参数字节数。以 8B 模型和公司在跑的 125B MoE 为例（Muse 整理，按标称参数量粗算，未含缩放因子与元数据开销，实际略大）：</p>\n<table>\n<thead>\n<tr>\n<th>格式</th>\n<th>每参数</th>\n<th>8B 权重</th>\n<th>125B 权重（总量）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>BF16（不量化）</td>\n<td>2 B</td>\n<td>≈16 GB</td>\n<td>≈250 GB</td>\n</tr>\n<tr>\n<td>W8（A8）</td>\n<td>1 B</td>\n<td>≈8 GB</td>\n<td>≈125 GB</td>\n</tr>\n<tr>\n<td>W4（A16 或 A4）</td>\n<td>0.5 B</td>\n<td>≈4 GB</td>\n<td>≈62.5 GB</td>\n</tr>\n</tbody>\n</table>\n<p>对照公司实测：现行服务日志显示 <code>Model loading took 61.73 GiB</code>（《MTP 实测总结》3.3 节）——125B 模型 NVFP4 落盘占用约 61.7 GiB，与上表 62.5 GB 的粗算基本对得上，这就是 W4 的分量：一台 Spark 的 128 GB 内存装得下整个 125B 模型的权重，还有余量留给 KV Cache；换 BF16 则双机都装不下总量的一半。</p>\n<h3 id=\"23-decode\">2.3 第二笔账：decode 搬运量与带宽天花板</h3>\n<p>decode 阶段每生成一个 token，都要把「本步激活的那部分权重」从内存读一遍。MoE 模型每步只激活一部分参数——公司模型每步激活约 6B（《MTP 实测总结》1.1 节）。按 W4A4 的 0.5 B/参数算（Muse 整理）：</p>\n<blockquote>\n<p>每步搬运 ≈ 6B × 0.5 B ≈ 3 GB；GB10 实测带宽 224–226 GB/s（公司 cuda-hello.py v2 实测，见项目记录）→ 纯搬运时间 ≈ 3 GB ÷ 225 GB/s ≈ 13 ms/token。</p>\n</blockquote>\n<p>这就是「decode 带宽天花板约 13 ms/token」的来历——它同时解释了两件事：</p>\n<ul>\n<li><strong>为什么量化对 decode 收益大</strong>：同样的 6B 激活参数，BF16 每步搬 12 GB（≈53 ms），W8 搬 6 GB（≈27 ms），W4 搬 3 GB（≈13 ms）。权重比特数减半，理论 decode 速度翻倍——量化在 decode 阶段约等于直接买带宽。</li>\n<li><strong>为什么实测到不了天花板</strong>：现行服务 MTP 开启时 TPOT p50 约 21.3 ms（《MTP 实测总结》4.2 节），高于 13 ms——差距来自 kernel 启动开销、通信与调度（第一阶段已确立的口径：单流 decode 瓶颈在启动开销而非带宽）。所以量化的理论收益要打折看，实测为准。</li>\n</ul>\n<p>反过来，<strong>prefill 是计算密集</strong>（一次处理成百上千个 token，矩阵乘的算术强度高），权重搬运被摊薄，量化的收益主要来自激活也低比特带来的计算通路加速（W8A8、W4A4 的意义在此），TTFT 的改善幅度通常小于 decode。这条判断在第八节组合决策时还要用。</p>\n<h3 id=\"24\">2.4 第三笔账：精度风险</h3>\n<p>比特越低，数值能表示的取值越稀疏，量化误差越大——但误差大小不只取决于比特数，更取决于<strong>误差落在哪</strong>。权重里少数大幅值通道（离群通道）主导了激活的尺度，粗暴地一刀切量化会把这些通道压坏，这是 AWQ、GPTQ 这类方法存在的理由（第三节展开）。经验排序（Muse 整理，定性判断，具体以第四节的回归结果为准）：W8A8 风险最低、通常近似无损；W4A16 风险可控、是部署主力；W4A4 风险最高，必须逐模型验证——公司敢用 NVFP4，是因为有官方 Day-0 镜像与实测背书，不等于任何模型套上 W4A4 都没事。</p>\n<p>还有一个常被忽略的事实：<strong>量化误差与投机解码的接受率会互相影响</strong>。草稿与目标的分布差距越大，接受率越低；如果草稿模型和目标模型的量化口径不一致，等于人为拉大分布差距。这条在第六节精读公司数据时还会回来。</p>\n<hr />\n<h2 id=\"ptq\">三、PTQ 家族逐个讲</h2>\n<p>先给全景表（工具与校准口径以 ms-swift《导出与量化推送》存档为准，该文档明确：AWQ、GPTQ 需要校准数据集、量化质量较好但耗时较长；FP8、BNB 无需校准数据集、耗时较短；四者均支持多模态（BNB 除外）、推理加速与量化后继续训练）：</p>\n<table>\n<thead>\n<tr>\n<th>方法</th>\n<th>格式</th>\n<th>要校准</th>\n<th>原理一句话</th>\n<th>主要适用边界</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>AWQ</td>\n<td>W4A16 为主</td>\n<td>要</td>\n<td>按激活重要性保护关键权重通道，再量化</td>\n<td>部署推理，生态最成熟</td>\n</tr>\n<tr>\n<td>GPTQ</td>\n<td>W4A16 为主</td>\n<td>要</td>\n<td>逐层最小化量化误差，用二阶信息补偿已量化权重</td>\n<td>部署推理，老牌方案</td>\n</tr>\n<tr>\n<td>FP8</td>\n<td>W8A8</td>\n<td>不要</td>\n<td>权重与激活转 FP8 浮点，用缩放因子对齐动态范围</td>\n<td>有 FP8 计算通路的硬件</td>\n</tr>\n<tr>\n<td>BNB</td>\n<td>W4（NF4）</td>\n<td>不要</td>\n<td>分块量化 + 双重量化，主打把大模型塞进小显存</td>\n<td>训练侧 QLoRA，而非部署主力</td>\n</tr>\n<tr>\n<td>NVFP4</td>\n<td>W4A4</td>\n<td>厂商侧</td>\n<td>4 bit 浮点 + 分组缩放，计算与存储都走 4 bit</td>\n<td>需引擎与硬件原生支持，公司现行</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"31-awq\">3.1 AWQ：先保护，再量化</h3>\n<p>AWQ（Activation-aware Weight Quantization）的核心观察是：权重的重要性不均匀——少数权重通道对应的激活幅值特别大，这些通道量化错了，误差会被激活放大。AWQ 的做法是根据校准数据统计出的激活分布，给重要通道做等效缩放保护，再做分组量化（原理转述自 LMDeploy《INT4 模型量化和部署》所引 AWQ 论文口径，arXiv:2306.00978）。</p>\n<p>工具与参数以 LMDeploy 存档为准，它给了本讲最完整的一条可执行命令链：</p>\n<pre><code class=\"language-shell\">lmdeploy lite auto_awq \\\n   $HF_MODEL \\\n  --calib-dataset 'wikitext2' \\\n  --calib-samples 128 \\\n  --calib-seqlen 2048 \\\n  --w-bits 4 \\\n  --w-group-size 128 \\\n  --batch-size 1 \\\n  --work-dir $WORK_DIR\n</code></pre>\n<p>逐个参数读懂它（Muse 整理）：校准集默认 <code>wikitext2</code>、128 条样本、每条 2048 token；权重 4 bit、每 128 个权重一组共享缩放因子。文档还给了两个排障口径：精度有损时开启 <code>--search-scale</code> 重新量化（更慢，但会搜索更优的缩放）；量化 OOM 时减小 <code>--calib-seqlen</code>、调大 <code>--calib-samples</code>、<code>--batch-size</code> 保持 1。量化产物随后可直接部署（TurboMind 引擎 <code>model_format='awq'</code>），也可起 OpenAI 兼容的 API 服务——注意 LMDeploy 量化模块目前只支持 AWQ，GPTQ 只支持推理其量化产物，不负责生产。</p>\n<blockquote>\n<p>GB10 提示：LMDeploy 该文档列出的可推理 GPU 清单止于 Ada Lovelace（sm89，40 系列），<strong>未列 GB10（sm121）</strong>。这不等于跑不了，但意味着实操必须冒烟先行（第九节）。</p>\n</blockquote>\n<h3 id=\"32-gptq\">3.2 GPTQ：逐层补偿误差</h3>\n<p>GPTQ 的思路是逐层量化：量化完一列权重后，用海森矩阵（二阶信息）估计这次量化给本层输出带来的误差，并调整尚未量化的权重去补偿它（原理一句话，Muse 整理）。它与 AWQ 同为 W4A16 主力、同样需要校准数据；在 ms-swift 中通过 <code>gptqmodel + optimum</code> 依赖导出（另有 GPTQ v2 脚本）。选型上两者精度通常同档，更多取决于目标引擎对哪种产物支持更好、以及手头校准数据的形态。LMDeploy 的分工正好是例证：生产用 AWQ，推理两者都吃。</p>\n<h3 id=\"33-fp8-8-bit\">3.3 FP8：不校准的 8 bit 浮点路线</h3>\n<p>FP8 路线在 ms-swift 的定位是「无需校准、导出快」（《导出与量化推送》）。它的底气来自格式本身：FP8 是浮点（带指数位），动态范围比同比特定点宽得多，对权重与激活的分布更宽容，因此可以省掉校准搜索这一步，代价是只到 8 bit——显存与搬运收益是 W4 的一半。要点有两条（Muse 整理）：一是缩放策略（逐张量还是逐通道、何时更新缩放因子）是各框架实现差异的主要来源，选型时要看引擎实现而不是只看格式名；二是收益兑现依赖硬件 FP8 计算通路，在 GB10 上的实际支持情况以冒烟为准，不预设结论。</p>\n<h3 id=\"34-bnb-qlora-4-bit\">3.4 BNB 与 QLoRA：训练侧的 4 bit，别和部署量化混谈</h3>\n<p>BNB 指 bitsandbytes 的 4 bit 量化（NF4 数据类型 + 双重量化）。它在 ms-swift 支持矩阵中的位置很说明问题：唯独它不支持多模态，且它真正的舞台是<strong>训练侧</strong>——Datawhale 的 QLoRA 教程是最直观的证据：DeepSeek-7B-Chat 以 <code>load_in_4bit=True</code>、<code>bnb_4bit_quant_type=\"nf4\"</code>、<code>bnb_4bit_use_double_quant=True</code> 加载，基座权重只占约 5.7 GB，再挂 LoRA 适配器训练，6 GB 显存即可微调 7B 模型（Datawhale self-llm 存档）。</p>\n<p>所以 BNB 的定位要讲清（Muse 整理）：它解决的是「训得起」——把冻结的基座压到 4 bit、只训小适配器；部署推理的主力格式仍是 AWQ/GPTQ/FP8/NVFP4。用 BNB 产物直接上线服务不是主流路径，面试或汇报里把 QLoRA 和部署量化混为一谈是常见错误。</p>\n<h3 id=\"35-nvfp4\">3.5 NVFP4：公司现行路线的坐标</h3>\n<p>公司现行部署即 NVFP4（W4A4）：vLLM 配置 <code>quantization: modelopt_fp4</code>、后端 FLASHINFER_CUTLASS（《MTP 实测总结》1.2 节）。把它放进家族表里，位置就清楚了：</p>\n<ul>\n<li>它是五种方法里唯一把<strong>激活也压到 4 bit</strong> 的现行路线，搬运账最漂亮（第二节 13 ms/token 的天花板就是它算出来的）；</li>\n<li>它的精度保障不来自校准手艺，而来自 NVIDIA 的 ModelOpt 工具链与官方 Day-0 镜像的整套验证——这是「厂商侧背书」型路线，换模型、换版本时必须重新回归，不能默认平移；</li>\n<li>它与 ms-swift 的关系是错位的：ms-swift 的量化导出矩阵里是 AWQ/GPTQ/FP8/BNB，没有 NVFP4 导出（存档文档如实如此）。教学上要明说：<strong>训练/导出侧用 ms-swift 家族，部署侧的 NVFP4 走 NVIDIA 工具链</strong>，两条链在选型会上不要混淆。</li>\n</ul>\n<p><strong>本节素材缺口如实标注</strong>：ms-swift《导出与量化推送》偏命令与支持矩阵，未展开各方法的校准原理细节；本节 AWQ/GPTQ/BNB 的原理讲解结合了 LMDeploy 文档所引论文口径与 Datawhale 教程实例，属于教学整理（已逐处标注），精确的算法细节以原论文为准。ms-swift 仓库的量化 examples 脚本（awq.sh / gptq.sh / bnb.sh 等）已列入大纲 P1 补抓，脚本到位后本节的命令层细节再做一轮回填。</p>\n<hr />\n<h2 id=\"_2\">四、校准与精度评估方法论</h2>\n<h3 id=\"41\">4.1 校准数据怎么选</h3>\n<p>校准是 AWQ/GPTQ 这类方法的「体检采样」：拿一小批有代表性的输入跑一遍前向，统计激活分布，据此定缩放与保护策略。三条纪律（Muse 整理）：</p>\n<ol>\n<li><strong>像生产，不像考试</strong>：校准数据应来自与生产负载同分布的文本。LMDeploy 默认用 wikitext2（英文维基）是通用起点；若生产负载是中文业务文本，拿英文维基校准出的缩放因子未必贴合——这不是说默认不能用，而是精度回归若不达标，第一嫌疑就是校准分布。</li>\n<li><strong>量要够、长要够</strong>：存档给的参照是 128 条 × 2048 token。样本太少，激活统计不稳；序列太短，长上下文才出现的激活模式采不到。</li>\n<li><strong>校准集与测试集必须隔离</strong>：校准数据若混进冻结测试集的内容，回归分数就被污染了——这是第十节坑单的第一条，性质等同考试泄题。</li>\n</ol>\n<h3 id=\"42\">4.2 精度回归：双轨指标</h3>\n<p>量化后「精度还行不行」不能用一个指标回答，本讲立双轨（Muse 整理，纪律承接第一阶段冻结测试集口径）：</p>\n<ul>\n<li><strong>轨道一 · 困惑度（PPL）</strong>：在固定文本上量语言建模损失的变化。便宜、灵敏、适合做版本间横向比较；缺点是它测的是「像不像原文」，不直接等于业务任务做得对不对。</li>\n<li><strong>轨道二 · 冻结测试集任务指标</strong>：第一阶段冻结的那套测试集原样跑一遍，看任务正确率/得分相对 BF16 基线掉了多少。这是验收的裁判轨，PPL 只能当侦察轨。</li>\n</ul>\n<p>评测工具链上，LMDeploy 文档的做法是量化后用 OpenCompass 做多维能力评测（《INT4 模型量化和部署》「模型评测」节）——可作公开基准轨的参照；公司内部验收仍以自有冻结集为准，两者不互相替代。</p>\n<h3 id=\"43\">4.3 量化后验收清单</h3>\n<p>每次量化产物上线前逐项过（Muse 整理）：</p>\n<ul>\n<li>[ ] 精度轨：冻结测试集得分与 BF16 基线差值在项目约定的下限内（下限先于实验定好，见第八节）；</li>\n<li>[ ] 侦察轨：PPL 变化有记录，无异常跳升；</li>\n<li>[ ] 抽检轨：人工抽检若干条真实风格 prompt 的输出，无语言崩坏、复读、格式塌方；</li>\n<li>[ ] 性能轨：同口径压测（同 prompt 集、同并发、同输出长度）下 TTFT/TPOT/吞吐有数，且与量化前的基线可比；</li>\n<li>[ ] 配置轨：量化方法、校准集来源与规模、工具版本、关键参数全部留痕——没有记录的量化产物不许上线，因为出问题时无法复现。</li>\n</ul>\n<hr />\n<h2 id=\"kv-cache\">五、KV Cache 量化：省的是另一本账</h2>\n<p>权重之外，推理时还有一本大账：KV Cache。每个 token、每一层都要存一份 K 和 V，长上下文、高并发时它膨胀得比权重还快——公司现行配置最大上下文 256K（《MTP 实测总结》1.2 节），KV 占用直接决定能开多大并发、缓存多少前缀。</p>\n<p>KV Cache 量化（如把 KV 存成 INT8/FP8 甚至更低）省的是<strong>容量与 KV 搬运</strong>：decode 每步要读全部历史 KV，上下文越长，这笔搬运越可观。它的风险点与权重量化不同（Muse 整理）：K 的分布有著名的离群通道问题，压坏了会直接伤注意力质量；而且误差随上下文变长累积，短文本回归测不出来——验收时必须专门留长上下文样本。</p>\n<p>把它与权重量化分开讲的原因，就是防止一种误判：<strong>「模型已经 W4 了，KV 再量化收益不大」是错的</strong>——两者省的是不同的搬运；反过来，KV 量化也不是免费的，它的精度账要单独算、单独验。LMDeploy 的 kv_quant 文档已于 P1 补抓存档（<code>internlm/09-LMDeploy-KVCache量化.md</code>），参数层回填如下：在线 int4/int8 量化（per-head per-token 非对称量化，v0.4.0 起支持，离线量化方式已移除），同容量下 KV block 数约为 BF16 的 int8 2 倍、int4 4 倍；本节概念与验收口径不变，参数以该存档为准、开课按版本复核。</p>\n<p><strong>前沿补充 · SWA Bounded Replay（DeepSeek 官方发布，2026-10-20）</strong>：DeepSeek 刚开源的内部推理框架 DeepInfer 里有一个与本节相邻但维度完全不同的机制——解码阶段需要重演上下文时，它只重放请求末尾一小段（V4.1 默认约 140 个 token），避免重做整个 Prefill。它优化的是<strong>重算成本</strong>，不碰存储格式：KV 量化是「把存的东西压小」，Bounded Replay 是「要重算时只算尾巴一截」。两者可以叠加、互不替代。另外必须写清：DeepInfer 仅支持 SM100 与昇腾 950、仅 DeepSeek-V4.1-Flash、离线模式，<strong>GB10 不支持、Spark 上跑不了</strong>，本讲只作机制学习，不进实操。</p>\n<hr />\n<h2 id=\"_3\">六、投机解码家族</h2>\n<h3 id=\"61\">6.1 原理一页：草稿—验证与接受率</h3>\n<p>投机解码（Speculative Decoding）针对的正是第二节那笔账：decode 每步只产出 1 个 token，却要搬一遍权重，太亏。它的解法是（Muse 整理）：</p>\n<ol>\n<li><strong>草稿</strong>：用便宜得多的办法一次猜出接下来 k 个 token（草稿模型、模型自带的小头、或规则）；</li>\n<li><strong>验证</strong>：目标模型一次前向并行算出这 k 个位置的真实分布，逐位比对——猜对的留下，第一个猜错的位置用目标模型的分布纠正采样，后面的草稿全部作废；</li>\n<li><strong>无损保证</strong>：验证规则在数学上保证最终输出分布与目标模型逐 token 生成<strong>完全一致</strong>——投机解码省的是步数，不动精度（这条与量化形成鲜明对照：量化是有损压缩，投机是无损加速）。</li>\n</ol>\n<p>收益由<strong>接受率</strong>决定。每步产出 = 1 个保底 token + 被接受的草稿数。设平均接受长度为 L̄，则同样搬运量下速度约放大到 L̄ 倍（粗算，未扣草稿与验证的额外开销）。所以读投机配置只看一个核心问题：<strong>草稿够不够便宜、猜得够不够准</strong>。草稿贵或猜得差时，验证开销白花，投机反而亏——公司实测里就有 11% 的窗口处于「MTP 在亏」的区间（下文精读）。</p>\n<h3 id=\"62\">6.2 家族逐个定位</h3>\n<table>\n<thead>\n<tr>\n<th>方法</th>\n<th>草稿从哪来</th>\n<th>特点与代价</th>\n<th>定位</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>经典独立草稿模型</td>\n<td>另训一个小模型</td>\n<td>与目标模型分布越贴合接受率越高；要单独部署维护</td>\n<td>投机解码的原型路线</td>\n</tr>\n<tr>\n<td><strong>MTP</strong></td>\n<td>模型架构自带的多 token 预测层</td>\n<td>不用额外模型，草稿几乎同源；需模型原生支持</td>\n<td><strong>公司现行路线</strong></td>\n</tr>\n<tr>\n<td>EAGLE</td>\n<td>在目标模型隐状态上训一个轻量草稿头</td>\n<td>在特征层而非 token 层做草稿，接受率通常更高；要额外训练草稿头</td>\n<td>精度（接受率）优先的进阶路线</td>\n</tr>\n<tr>\n<td>Medusa</td>\n<td>目标模型顶上并联多个预测头</td>\n<td>结构最简单、改造成本低；单步多头并行猜测，接受质量一般弱于 EAGLE</td>\n<td>低成本改造路线</td>\n</tr>\n<tr>\n<td>多草稿 + 块验证（SpecTr-GBV）</td>\n<td>同一草稿模型生成 K 条候选</td>\n<td>验证环节从「逐位接受」升级为「在多条草稿里找最长可接受块」</td>\n<td>验证算法侧的前沿优化</td>\n</tr>\n<tr>\n<td><strong>DSpark</strong></td>\n<td>DeepSeek 框架内置草稿</td>\n<td>草稿默认最多 5 个 token，验证按<strong>置信度调度</strong></td>\n<td>框架级整合路线（2026-10-20 新发布）</td>\n</tr>\n</tbody>\n</table>\n<p><strong>SpecTr-GBV（转述）</strong>：机器之心 Pro 对 EMNLP 2026 论文 SpecTr-GBV（Yijun Lin 等，中国人民大学等机构）的解读指出，既有方法沿两条线分别优化——多草稿（multi-draft）扩大候选空间，提高「至少一条能被接受」的概率；块验证（block verification）提高单次验证能接受的长度上限——两者长期分开设计。该工作把多条草稿与目标序列的验证写成最优传输问题，在保持输出分布一致的前提下直接最大化期望接受长度，并证明在条件独立耦合类中可达理论上界；实验同时提醒一个工程现实：Block Efficiency（每次目标模型调用平均带走的 token 数）不等于端到端加速比，草稿生成与批量验证都有额外开销，草稿太长时加速比先升后降（来源：机器之心 Pro 论文解读，2026-10-15）。</p>\n<p><strong>DSpark 与置信度调度（DeepSeek 官方发布，2026-10-20）</strong>：DeepInfer 内置的投机解码名为 DSpark，草稿默认最多 5 个 token；其验证环节的特色是<strong>按模型对草稿 token 的置信度来安排调度</strong>——置信度高的草稿优先/多验，低的少验或早弃。对照公司 MTP 实测（接受率 61.8%、且有 11% 窗口在亏）正好点出它试图解决的问题：<strong>接受率不是常数，而是随内容逐 token 波动的</strong>；固定长度、一刀切地验证全部草稿，等于在注定被拒的草稿上照样付验证成本。置信度调度就是想把验证预算动态投给「大概率能过」的草稿。要注意它与 MTP 不是同一物种：MTP 是草稿的<strong>来源</strong>（架构自带预测层），DSpark 的置信度调度是验证的<strong>调度策略</strong>，理论上可叠加在任何草稿来源之上。另外重申其落地边界：DeepInfer 仅支持 SM100 与昇腾 950、仅 DeepSeek-V4.1-Flash、离线模式，<strong>GB10 不支持</strong>，本讲只学机制。</p>\n<h3 id=\"63-mtp\">6.3 公司 MTP 实测精读</h3>\n<p>素材：《MTP 实测总结-2026-10-13》，环境为现行服务同款（Qwen3.8-Flash-Next-NVFP4，TP2+EP，<code>method=mtp, num_speculative_tokens=3</code>，单流、输入 1024 / 输出 256、200 prompts，压测 prompt 为随机词序——对投机不友好，测得的是保守值）。</p>\n<p><strong>先读懂三个数</strong>（日志字段口径见实测总结 3.1 节）：</p>\n<ul>\n<li><strong>逐位置接受率</strong>：示例窗口为 0.957 / 0.832 / 0.714——越靠后的草稿位越难猜中，这是普适规律。决定「猜 3 个还是猜 2 个」的正是第三位的接受率还值不值它的验证成本；实测总结的后续优化方向里已留了 <code>num_speculative_tokens</code> 降到 2 或 1 的对照实验；</li>\n<li><strong>平均接受长度</strong>：全程在 2.4–3.5 之间（理论上限 4 = 1 保底 + 3 草稿）。它才是收益的直接度量：平均每步多赚约 1.4–2.5 个 token；</li>\n<li><strong>平均接受率 61.8%</strong>：56 个统计窗口的分布是——&gt;70% 的窗口占 34%（大赚），50–70% 占 36%（灰色地带），&lt;50% 合计 31%，其中 &lt;40% 的窗口占 11%、明确在亏。<strong>读法</strong>：61.8% 不是某个稳定状态，而是内容可预测性波动的平均；模板化程度高的真实业务 prompt 接受率预计高于这批随机词压测。</li>\n</ul>\n<p><strong>再看 A/B 结论</strong>（同口径 200 prompts，MTP 开 vs 关）：</p>\n<table>\n<thead>\n<tr>\n<th>指标</th>\n<th>MTP 开</th>\n<th>MTP 关</th>\n<th>读法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>TPOT p50</td>\n<td>21.3 ms</td>\n<td>39.2 ms</td>\n<td>开快 1.84×</td>\n</tr>\n<tr>\n<td>TPOT mean</td>\n<td>30.7 ms</td>\n<td>47.2 ms</td>\n<td>开快 1.54×</td>\n</tr>\n<tr>\n<td>输出吞吐</td>\n<td>31.09 tok/s</td>\n<td>20.49 tok/s</td>\n<td>开快 1.52×</td>\n</tr>\n<tr>\n<td>TTFT mean</td>\n<td>374.0 ms</td>\n<td>325.6 ms</td>\n<td>开慢约 48 ms</td>\n</tr>\n<tr>\n<td>单请求总耗时 p50</td>\n<td>约 5.8 s</td>\n<td>约 10.3 s</td>\n<td>开省约 4.5 s</td>\n</tr>\n</tbody>\n</table>\n<p>结论（实测总结原文口径）：<strong>MTP3 保留开启</strong>——62% 平均接受率换来 1.5–1.8× 真实加速，猜错的成本远小于猜对的收益；TTFT 多出的约 48 ms（因 prefill 阶段也要跑 MTP 头）可忽略。</p>\n<p><strong>何时关、何时调</strong>（Muse 整理，承接实测口径）：当负载以短输出为主、TTFT 敏感时，48 ms 的固定税占比上升，值得单独 A/B；当监控显示接受率长期低于 50% 一线，先查草稿与目标的分布差距（模型版本、量化口径是否一致），再考虑减小 <code>num_speculative_tokens</code>；并发场景（多序列批处理）下 decode 已能靠 batching 摊薄搬运，投机的相对收益会收窄——实测总结亦注明并发 sweep 下的 MTP 表现尚未测，不要把单流结论平移到高并发。</p>\n<hr />\n<h2 id=\"_4\">七、前沿选读：稀疏注意力与量化的组合空间</h2>\n<p>量化压的是权重与 KV 的<strong>存储和搬运</strong>；还有一类优化压的是注意力的<strong>计算范围</strong>——稀疏注意力：长上下文时并非每个历史 token 都值得算注意力，先筛掉大部分、只对入选者精算。</p>\n<p><strong>DoSA（转述）</strong>：小红书 Dots 团队的工作（经机器之心 Pro 发表）针对 DeepSeek-V3.2 这类已用稀疏注意力（DSA）的模型发现：主注意力省了之后，为每个查询筛选 Top-K 候选的<strong>索引器</strong>反而成了瓶颈——在约 1M token 上下文下，索引器占预填充时间的 73%–90.8%（Dots3-Note-preview、GLM-5.2、DeepSeek-V3.2 三个模型口径）。DoSA 的解法是「先判断、后精算」：用分数上下界证明某候选不可能入选就直接跳过其全头打分，只对过界候选精算，从而<strong>保持原始 Top-K 选择结果不变</strong>（无损筛选，而非换一套近似规则）。测试中平均约 97% 的候选被提前过滤，三个模型在约 1M 上下文下首 token 延迟较各自 SGLang 基线分别降低约 37%、46%、48%（来源：机器之心 Pro / 小红书 Dots 团队，2026-10）。</p>\n<p>把它放进本讲的地图（Muse 整理）：推理加速的「省」有三个正交维度——<strong>权重侧</strong>（量化：搬得少）、<strong>步数侧</strong>（投机解码：步数少）、<strong>注意力侧</strong>（稀疏化：每步算得少）。DoSA 这类工作与量化的组合空间在于：权重/KV 压到 4 bit 之后，注意力筛选与精算环节的相对占比会上升，长上下文场景的下一个瓶颈大概率出现在注意力侧。现阶段对公司的意义是建立坐标感：我们 256K 上下文配置下若 TTFT 成为痛点，排查顺序应包括注意力与索引环节，而不是只盯着量化比特数往下压。</p>\n<hr />\n<h2 id=\"_5\">八、量化 × 投机的组合决策</h2>\n<p>两类优化同时存在时，顺序错了会互相污染结论。流程如下（Muse 整理，文字版流程图）：</p>\n<ol>\n<li><strong>先定精度下限</strong>：在动手量化前，用 BF16（或现行已验证格式）在冻结测试集上测出基线分，并约定可接受的最大跌幅。没有这条线，后面所有「还行」都是感觉。</li>\n<li><strong>定量化路线</strong>：按第二节三笔账选格式——显存/搬运收益、硬件通路、精度风险依次过；产出后走第四节验收清单，不过线就换路线或加校准，不许带伤上线。</li>\n<li><strong>再排投机收益</strong>：在已定版的量化产物上测接受率与 A/B（方法照 6.3 节口径：同 prompt 集、同长度、看 TPOT 与吞吐，不只看接受率）。投机无损，不动精度线，但接受率会被量化口径影响——草稿与目标必须同源同口径。</li>\n<li><strong>组合复测</strong>：最终配置（量化格式 × 投机开关与草稿长度）整体跑一遍同口径压测 + 精度回归，留痕归档。任何单项变更（换量化方法、换草稿长度、换模型版本）都触发复测，不沿用旧结论。</li>\n</ol>\n<p>一句话记忆：<strong>精度线管量化，接受率管投机，复测管组合</strong>。</p>\n<hr />\n<h2 id=\"awq-vs-fp8\">九、实操：AWQ vs FP8 两条路线对照</h2>\n<p>目标：对同一个模型走完两条量化路线，给出有数据的选型结论。模型建议用 7–8B 级稠密模型（单台 Spark 可完成；具体型号开课时定版）。</p>\n<p><strong>步骤 0 · 冒烟先行（约 30 分钟，硬时间盒）</strong>：量化工具链（ms-swift 导出环境 / 相应量化工具）在 GB10 上均未验证。先逐项过：依赖安装（ms-swift 文档口径：AWQ 需 <code>autoawq</code>、GPTQ 需 <code>gptqmodel optimum</code>、BNB 需 <code>bitsandbytes</code>；FP8 走 swift 导出自带路径）→ 小模型试量化一个层级/小样本跑通 → 量化产物能被推理引擎加载并正常输出。三项任一卡住超过时间盒，全班降级 Colab 按同一流程执行（Colab GPU 的量化与推理生态是已验证路径），Spark 侧只做数据对照——口径与 A1、A2 两讲一致，先声明再动手。</p>\n<p><strong>步骤 1 · 基线</strong>：BF16 原模型跑冻结测试集（任务分 + PPL 双轨记录），并做同口径压测（固定 prompt 集、输出长度、并发），留作两条路线的共同裁判。</p>\n<p><strong>步骤 2 · AWQ 路线</strong>：用 ms-swift 的 AWQ 导出脚本（examples/export/quantize/awq.sh，脚本细节以仓库当前版本为准）或 LMDeploy <code>auto_awq</code> 命令链完成量化；校准集二选一要有记录：默认 wikitext2，或换成业务分布文本（注明来源与规模）。参数参照第三节存档口径（128 条 × 2048、group 128）。</p>\n<p><strong>步骤 3 · FP8 路线</strong>：用 ms-swift FP8 导出（无需校准）完成量化，记录导出耗时与两条路线的校准成本差异。</p>\n<p><strong>步骤 4 · 精度回归</strong>：两份产物分别跑冻结测试集 + PPL，与基线对照填记录表；各抽检 10 条真实风格 prompt 输出。</p>\n<p><strong>步骤 5 · 同口径压测</strong>：两份产物在同一引擎、同一压测口径下测 TTFT / TPOT / 吞吐；有条件时顺带记录开启投机（若引擎与模型支持）前后的接受率变化，观察量化口径对接受率的影响。</p>\n<p><strong>步骤 6 · 选型结论</strong>：按第八节流程出结论——精度先过线，过线者比性能，同档者比工具链成本（校准耗时、维护复杂度）。</p>\n<p>记录表模板：</p>\n<table>\n<thead>\n<tr>\n<th>路线</th>\n<th>工具/版本</th>\n<th>校准集</th>\n<th>权重体积</th>\n<th>冻结集得分（Δ基线）</th>\n<th>PPL（Δ基线）</th>\n<th>TTFT</th>\n<th>TPOT</th>\n<th>吞吐</th>\n<th>导出耗时</th>\n<th>结论</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>BF16 基线</td>\n<td>—</td>\n<td>—</td>\n<td></td>\n<td>基线</td>\n<td>基线</td>\n<td></td>\n<td></td>\n<td></td>\n<td>—</td>\n<td>裁判</td>\n</tr>\n<tr>\n<td>AWQ</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>FP8</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>验收标准：① 两条路线都完成「量化—回归—压测」全链且记录表无空项；② 选型结论能指着表中数字说清取舍，不许出现「感觉差不多」；③ 任一路线精度不过线时，结论中必须写明不过线的数据与处置（换校准/换路线/放弃该路线），负结果如实写同样算达标。</p>\n<hr />\n<h2 id=\"_6\">十、常见坑清单</h2>\n<ol>\n<li><strong>校准数据泄漏</strong>：校准集混入测试集内容，回归分数虚高——校准与评测数据必须物理隔离、来源留痕（第四节）。</li>\n<li><strong>只看困惑度不看任务</strong>：PPL 只涨一点点，业务任务可能已经塌方；反之亦然。双轨缺一不可（第四节）。</li>\n<li><strong>拿随机词压测的接受率当业务结论</strong>：随机词序可预测性最低，接受率是保守值；业务 prompt 更模板化，接受率通常更高（公司实测总结口径）。用错负载得出错结论。</li>\n<li><strong>接受率虚高误判</strong>：只看平均接受率不看 A/B 的 TPOT——接受率分布方差极大，11% 的窗口在亏钱只有 A/B 能定案（6.3 节）。</li>\n<li><strong>量化后不回归就上线</strong>：尤其 W4A4 这类激进格式，换模型、换版本默认「应该没事」是最常见的事故源（3.5 节）。</li>\n<li><strong>把 QLoRA 当部署量化</strong>：BNB/NF4 是训练侧省显存方案，与部署格式是两条链（3.4 节）。</li>\n<li><strong>草稿与目标口径不一致</strong>：量化版本、模型版本有一处对不上，分布差距直接吃掉接受率（2.4 节）。</li>\n<li><strong>只压权重忘了 KV</strong>：长上下文、高并发下 KV 才是大头；只做权重量化会误判显存与并发上限（第五节）。</li>\n<li><strong>校准分布与生产分布脱节</strong>：英文维基校准、中文业务上线，缩放因子不贴合——精度不达标时先查这条（4.1 节）。</li>\n<li><strong>投机与量化同时改</strong>：两个变量一起动，出了问题分不清是谁的——组合必须按第八节顺序分步验证。</li>\n</ol>\n<hr />\n<h2 id=\"_7\">十一、课后练习与延伸阅读</h2>\n<p>练习：</p>\n<ol>\n<li><strong>算账题</strong>：为一个 32B 稠密模型分别算 BF16 / W8A8 / W4A16 / W4A4 的权重体积，以及在 225 GB/s 带宽下 decode 每步的理论搬运时间（注意稠密模型每步搬全部权重，与 MoE 的口径区别写清）。</li>\n<li><strong>读日志题</strong>：给出一段 SpecDecoding 周期日志（参照《MTP 实测总结》3.1 节格式），算出该窗口的平均接受率与平均接受长度，并判断这组窗口的投机在赚钱还是亏钱，写明依据。</li>\n<li><strong>选型题</strong>：某内部服务要把一个 14B 模型从 BF16 迁到单台 Spark 上线，要求上下文 128K、并发优先。给出你的量化路线选择、校准方案与验收方案，并说明为什么不选另外两条路线。</li>\n<li><strong>思考题</strong>：DSpark 的置信度调度（6.2 节）若移植到公司 MTP 场景，你预期它改善的是哪个区间的窗口？结合 6.3 节的接受率分布表回答。</li>\n</ol>\n<p>延伸阅读（逐条标来源）：</p>\n<ul>\n<li>ms-swift《导出与量化推送》：量化导出命令与支持矩阵的权威口径（ModelScope 社区，存档 modelscope/05）。</li>\n<li>LMDeploy《INT4 模型量化和部署》：AWQ 完整命令链、评测与部署衔接（上海人工智能实验室，存档 internlm/01）。</li>\n<li>AWQ 原论文（arXiv:2306.00978，LMDeploy 文档引用）：激活感知量化的原理细节。</li>\n<li>Datawhale self-llm《DeepSeek-7B-Chat 4bits 量化 QLoRA 微调》：BNB/NF4 训练侧实操（存档 datawhale/05）。</li>\n<li>《SpecTr-GBV》论文解读：多草稿与块验证的统一框架（机器之心 Pro 解读，Yijun Lin 等，EMNLP 2026；存档 jiqizhixin/02）。</li>\n<li>《DoSA 稀疏注意力》：注意力侧加速与索引器瓶颈（机器之心 Pro / 小红书 Dots 团队；存档 jiqizhixin/01）。</li>\n<li>公司自有《MTP 实测总结-2026-10-13》：接受率与 A/B 的原始数据及日志字段口径（内部文档，goals/dgx-spark/files/）。</li>\n<li>DeepSeek 官方发布（2026-10-20）：DeepInfer 开源与 DSpark、SWA Bounded Replay 机制说明——注意其硬件与模型支持边界，仅作机制学习。</li>\n</ul>\n<blockquote>\n<p>下一讲预告：模块 C 转向性能调优——当量化与投机的常规手段用尽之后，如何用 profiling 证据定位下一个瓶颈。</p>\n</blockquote>"}, {"num": "C1", "ch": "进阶 C · 性能调优", "label": "C1 Profiling 方法论与工具链", "title": "进阶 C1：Profiling 方法论与工具链", "html": "<h1 id=\"c1profiling\">进阶 C1：Profiling 方法论与工具链</h1>\n<blockquote>\n<p><strong>讲次</strong>：第二阶段进阶专题 · 模块 C（性能调优）第 1 讲\n<strong>建议时长</strong>：2.5–3 小时（方法论与工具链约 110 分钟 + 案例精读约 30 分钟 + 实操约 60 分钟）\n<strong>前置</strong>：第一阶段技术轨第 3 周（压测与运维：分位数纪律、周期日志、诊断树）；进阶 B1（引擎机制与周期日志字段）、B2（量化与投机解码的账）；进阶 A1 的带宽账\n<strong>素材来源</strong>：LMDeploy 官方文档《PyTorchEngine 性能分析》（上海人工智能实验室，Apache-2.0，存档于 materials-advanced/internlm/03）；公司自有实测记录《MTP 实测总结-2026-10-13》与压测方案 BENCH-PLAN（<code>~/workspace/your_files/qwen38-flash-bench/</code>）；GB10 带宽与算力数字均为公司实测（讲义中逐处标注）。方法论框架、自上而下四层定位法与决策树为「Muse 整理」；nsys / ncu / torch profiler 的通用定位为工具常识性介绍，其在 GB10 上的可用性一律以开课前冒烟为准（见第四节）。</p>\n</blockquote>\n<hr />\n<h2 id=\"_1\">一、学习目标与本讲地图</h2>\n<p>第一阶段第 3 周你学会了压测与看日志，能回答「慢不慢、慢在哪个阶段」；B1、B2 你把引擎机制和两笔账（搬运账、接受率账）打通了。本讲再往下走一层，解决的是<strong>定位</strong>问题：</p>\n<ol>\n<li><strong>证据观</strong>：任何一句「瓶颈在 X」都要能说出证据等级——是猜测、日志级、时间线级还是 kernel 级；证据等级不够，不许动大手术。</li>\n<li><strong>四层定位法</strong>：从业务指标一路下钻到单个 kernel，每层看什么工具、能下什么结论、代价多大，形成固定动作而不是临场发挥。</li>\n<li><strong>会用 Roofline 判读</strong>：给定一个负载，能先算它应该站在带宽墙还是算力墙，再去和实测对账——先有预期，再抓证据。</li>\n<li><strong>走完一次真实定位</strong>：以公司单流 decode 的瓶颈定位为案例（含一次著名的误诊插曲），再亲手用只读观测 + 离线复现产出一份定位报告。</li>\n</ol>\n<p>本讲地图：证据观（第二节）→ 四层定位法（第三节）→ 工具链逐个讲（第四节）→ Roofline 判读演练（第五节）→ 决策树（第六节）→ 公司案例精读（第七节）→ 实操（第八节）→ 避坑（第九节）→ 练习与阅读（第十节）。</p>\n<p><strong>先说结论</strong>：调优的瓶颈很少在工具不够强，而在证据链断裂——多数团队止步于「日志显示慢」，然后直接开始改参数。profiling 的全部意义，是在动手之前把「慢」字拆成可以指认的开销项。本讲的方法只有一条主线：<strong>自上而下、先算账后抓图、每下一层都要上一层先给出值得下钻的理由</strong>。</p>\n<h2 id=\"_2\">二、证据观：无证据，不调优</h2>\n<h3 id=\"21\">2.1 从「感觉慢」到「定位单」</h3>\n<p>线上反馈的原始形态通常是三句话：「最近好像变慢了」「某个客户说卡」「GPU 利用率看着不高」。这三句话一句也不能直接变成调优动作，中间隔着一份<strong>定位单</strong>——把症状翻译成可验证命题的工单（Muse 整理）：</p>\n<table>\n<thead>\n<tr>\n<th>定位单字段</th>\n<th>写法示例（公司口径）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>症状</td>\n<td>哪个指标、什么分位数、什么负载档位下异常。如「单流 in1024/out256，TPOT p50 由 21 ms 升至 39 ms」</td>\n</tr>\n<tr>\n<td>基线</td>\n<td>和什么比。历史同口径数据或第一阶段的基线表；没有基线，先补基线再谈异常</td>\n</tr>\n<tr>\n<td>假设</td>\n<td>可证伪的一句话。如「接受率随流量内容变化而下跌，导致每步产出 token 数下降」</td>\n</tr>\n<tr>\n<td>证据</td>\n<td>支撑或推翻假设的数据，注明等级（见 2.2）</td>\n</tr>\n<tr>\n<td>排除项</td>\n<td>已排除的方向及排除依据——写下来，防止下个人重复劳动</td>\n</tr>\n<tr>\n<td>结论与动作</td>\n<td>结论一句、动作一个（单变量），动作的风险等级要与证据等级匹配</td>\n</tr>\n</tbody>\n</table>\n<p>这张单子和第一阶段压测报告模板、A2 的对照实验记录表是同一套纪律的延续：<strong>调优不是灵感，是工单流转</strong>。C2 的调优闭环会直接以定位单为输入。</p>\n<h3 id=\"22\">2.2 证据四等级</h3>\n<table>\n<thead>\n<tr>\n<th>等级</th>\n<th>证据形态</th>\n<th>能支撑的结论</th>\n<th>能支撑的动作</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>L0 猜测</td>\n<td>体感、单次观察、无复现</td>\n<td>什么都不能</td>\n<td>只许补测，不许改</td>\n</tr>\n<tr>\n<td>L1 日志级</td>\n<td>周期日志、指标端点、压测分位数</td>\n<td>慢在哪个阶段、哪类资源紧张（队列/KV/接受率）</td>\n<td>改配置级参数（单变量、留痕，承接第一阶段变更纪律）</td>\n</tr>\n<tr>\n<td>L2 时间线级</td>\n<td>nsys 时间线：计算/通信/空泡的排布</td>\n<td>时间花在哪一类开销（kernel 执行、launch 等待、同步、NCCL 通信）</td>\n<td>改调度与并行形态、动 CUDA Graph 与批策略</td>\n</tr>\n<tr>\n<td>L3 kernel 级</td>\n<td>ncu 单 kernel 报告：SM 利用、内存吞吐、stall 原因</td>\n<td>某个算子为什么慢、离 Roofline 还差多少</td>\n<td>换 kernel/后端、提改造需求、验收厂商优化</td>\n</tr>\n</tbody>\n</table>\n<p>两条使用规则（Muse 整理）：</p>\n<ul>\n<li><strong>动作的风险等级不得高于证据等级</strong>。拿 L1 证据去换注意力后端（L3 动作），是进阶阶段最常见的翻车方式；反过来，为改一个并发参数去抓 ncu，是浪费——证据要够用，不要过剩。</li>\n<li><strong>结论句必须自带等级</strong>。报告里写「瓶颈在 kernel 启动开销（L1+L2 排除法，见第七节）」和写「瓶颈在 kernel 启动开销」，可信度完全不同。第七节的公司案例恰好是一个「以 L1 证据 + 受控 A/B 达成强结论」的范例，也标明了它还差哪一级证据、今天会怎么补。</li>\n</ul>\n<h2 id=\"_3\">三、自上而下四层定位法</h2>\n<p>定位永远从上往下（Muse 整理）。每一层回答一个问题，上一层给不出「值得下钻」的信号，就不要跳层——跳层抓到的图再漂亮，也回答不了业务问题。</p>\n<h3 id=\"31-l1\">3.1 L1 业务指标层：慢在哪一段、是不是系统性</h3>\n<ul>\n<li><strong>看什么</strong>：TTFT / TPOT / E2E 延迟与输出吞吐，全部带分位数与负载档位（输入/输出长度、并发）。口径与纪律沿用第一阶段第 3 周：报告一律用分位数、延迟与吞吐成对报告、本讲不重复展开。</li>\n<li><strong>能下的结论</strong>：慢在 Prefill（TTFT）还是 Decode（TPOT）；是全量变慢还是长尾变慢（p50 与 p99 的背离本身就是线索）；随并发的形态（线性区/拐点/饱和区）是否改变。</li>\n<li><strong>工具与代价</strong>：公司压测脚本（<code>qwen38-flash-bench/</code>，与 vllm bench serve 同口径）；代价最低，这一层永远先做。</li>\n</ul>\n<h3 id=\"32-l2\">3.2 L2 引擎层：哪类资源在紧张</h3>\n<ul>\n<li><strong>看什么</strong>：引擎周期日志与指标端点。vLLM 侧就是第一阶段读熟的那张仪表盘：Engine 周期行的 Running / Waiting、GPU KV cache usage、Prefix cache hit rate、prompt/generation throughput 两条吞吐线；MTP 开启时另有 SpecDecoding 行的三个数（平均接受率、平均接受长度、Accepted throughput）。字段口径与自检关系见《MTP 实测总结》第三节，本讲只强调一个动作：<strong>先用自检关系验数据再下结论</strong>——如 Accepted ÷ Drafted 应约等于平均接受率，对不上先查日志口径（容器时间戳为 UTC、窗口为 10 秒瞬时值等），别急着查引擎。</li>\n<li><strong>能下的结论</strong>：排队（Waiting 持续 &gt;0）、KV 吃满、接受率下跌、前缀命中结构变化——这四类是引擎层能直接定性的「资源紧张」，第一阶段的诊断树正是在这一层工作。</li>\n<li><strong>工具与代价</strong>：日志归档 + <code>/metrics</code> 端点（如已接入 Prometheus 更佳）；代价低，可常态化。</li>\n</ul>\n<h3 id=\"33-l3\">3.3 L3 系统层：时间到底花在哪一类开销</h3>\n<ul>\n<li><strong>看什么</strong>：nsys 时间线。一条时间轴上并排摆着 CPU 线程、GPU kernel、显存拷贝与 NCCL 通信，看四件事：GPU 时间轴上的<strong>空泡</strong>（kernel 与 kernel 之间的空白）、CPU 侧 <strong>launch 排布</strong>（kernel 是提前排队还是现算现发）、<strong>同步点</strong>（哪次同步让 GPU 等 CPU 或等对端机器）、<strong>通信占比</strong>（双机 EP 的 all-to-all / allgather 在一步里占多少）。</li>\n<li><strong>能下的结论</strong>：把一 step 的时间拆成「真计算 / 通信 / 等待」三笔账——这是 L1、L2 永远给不出的。单流 decode 的固定开销问题（第七节）只有在这一层才能从「排除法推论」升级为「直接量出空泡」。</li>\n<li><strong>工具与代价</strong>：nsys 抓取开销小，可以对准一段稳态负载抓 10–30 秒窗口；代价主要是分析人力与文件体积，以及多进程/多机场景下时间线对齐的功夫（双机要两边都抓、注意时钟口径）。</li>\n</ul>\n<h3 id=\"34-l4-kernel\">3.4 L4 kernel 层：单个算子为什么慢</h3>\n<ul>\n<li><strong>看什么</strong>：ncu 对指定 kernel 的报告：duration、SM 利用率、DRAM 吞吐（拿去和实测带宽 224–226 GB/s 对账，公司实测）、warp 的 stall 原因分布、occupancy。</li>\n<li><strong>能下的结论</strong>：这个 kernel 是带宽型还是计算型、实测效率离 Roofline 预测差多少、慢在访存还是在发射/占用不足。换后端、换量化格式这类 L3 动作的验收，也在这一层做。</li>\n<li><strong>工具与代价</strong>：代价最高——ncu 靠重放 kernel 计时，会显著扰动时序，只能抓极短的片段，<strong>永远不许对生产全量开启</strong>；且它只回答「这个 kernel 本身」，回答不了「系统为什么慢」，所以它是最后一层，不是第一层。</li>\n</ul>\n<p>四层一句话总览：<strong>L1 定段，L2 定类，L3 定开销构成，L4 定算子</strong>。多数日常问题在 L2 就能闭环；进入 L3 的门槛是「L2 指向某类开销但量不出来」；进入 L4 的门槛是「已锁定具体 kernel 且要做换/改的决策」。</p>\n<h2 id=\"_4\">四、工具链逐个讲</h2>\n<h3 id=\"41-nsysnsight-systems\">4.1 nsys（Nsight Systems）：系统时间线</h3>\n<ul>\n<li><strong>定位</strong>：L3 的主力。系统级、轻量，回答「时间去哪了」。</li>\n<li><strong>入门路径</strong>（Muse 整理）：先抓单进程短窗口，学会看 GPU 行的空泡与 kernel 密度 → 再看 CPU 行的 launch 与同步标记 → 最后才碰多进程/多机与 NCCL 段。推理服务的典型用法是包住一段稳态压测窗口，而不是从进程启动开始录——启动期有 7 分钟权重加载与 CUDA Graph 捕获（公司实测，《MTP 实测总结》启动 8 阶段），混在里面只会淹没稳态信号。</li>\n<li><strong>读图纪律</strong>：先量总账（一个 step 的墙钟时间里 GPU busy 占多少），再逐段归因；空泡要区分「等 CPU 发射」「等通信」「等同步」三类，形态不同、药方不同。</li>\n</ul>\n<h3 id=\"42-ncunsight-computekernel\">4.2 ncu（Nsight Compute）：kernel 体检仪</h3>\n<ul>\n<li><strong>定位</strong>：L4 的主力。对指定 kernel 做规则化体检，输出离理论上限的差距与 stall 归因。</li>\n<li><strong>入门路径</strong>：只抓一个 step 内的少数目标 kernel（先由 L3 时间线点名）→ 先看 duration 与内存吞吐两个数 → 再看 stall 分布。切忌一上来全量抓取：一是慢，二是报告淹没重点。</li>\n<li><strong>红线</strong>：重放机制会改变被测对象的时序，ncu 的数字用来判断「这个 kernel 的效率」，不能直接当线上延迟引用；报告引用时标注「ncu 重放口径」。</li>\n</ul>\n<h3 id=\"43-torch-profiler\">4.3 torch profiler：框架层的算子账</h3>\n<ul>\n<li><strong>定位</strong>：介于 L2 与 L3 之间。按 PyTorch 算子聚合 CPU/GPU 时间与显存，能把时间线对应回模型结构（哪一层、哪个算子族），适合回答「时间花在 attention 还是 MoE 路由还是采样」这类结构问题。</li>\n<li><strong>与 nsys 的分工</strong>：torch profiler 给「算子账本」，nsys 给「时间排布」；前者看构成，后者看空泡与同步。两者都有 Python 栈信息，排查「某段 Python 编排开销异常」时比 nsys 更直接。</li>\n<li><strong>代价</strong>：中等开销，会扰动时序，同样只抓稳态短窗。</li>\n</ul>\n<h3 id=\"44-lmdeploy\">4.4 对照：LMDeploy 的三条分析通道（引存档）</h3>\n<p>LMDeploy 的 PyTorch 引擎把三条通道做成了引擎内置开关，值得对照学习（来源：LMDeploy 官方《PyTorchEngine 性能分析》，存档 internlm/03）：</p>\n<ul>\n<li><strong>PyTorch Profiler 通道</strong>：环境变量开启（<code>LMDEPLOY_PROFILE_CPU</code> / <code>LMDEPLOY_PROFILE_CUDA</code>），可设延迟启动（<code>LMDEPLOY_PROFILE_DELAY</code>，默认口径为启动后 3 秒）与采样时长（<code>LMDEPLOY_PROFILE_DURATION</code>，如 10 秒），trace 默认 gzip 压缩落盘。「延迟 + 定时窗」的设计值得借鉴：自动跳过启动噪声、只抓稳态段，和 4.1 的读图纪律是同一思想。</li>\n<li><strong>Nsight Systems 通道</strong>：单卡直接 <code>nsys profile</code> 包脚本；<strong>多卡因其多卡支持基于 Ray，改为设 <code>LMDEPLOY_RAY_NSYS_ENABLE=1</code> 由 Ray 侧拉起 nsys（不要再外套 <code>nsys profile</code>）</strong>，结果默认落在 <code>/tmp/ray/session_xxx/nsight</code>。这一条是对本讲最重要的提醒：<strong>profiler 的接法必须顺着引擎的进程模型走</strong>——vLLM 是 APIServer + EngineCore 多进程、LMDeploy 多卡是 Ray 多 worker，包错进程，抓到的就是一片空白。</li>\n<li><strong>Ray timeline 通道</strong>：<code>LMDEPLOY_RAY_TIMELINE_ENABLE=1</code> 输出 timeline.json，看的是多 worker 的任务排布——对应到 vLLM 双机场景，就是「两台机器的 step 是否对齐、通信段是否互相等待」。</li>\n</ul>\n<p>该存档篇幅偏操作指引（大纲已注明），方法论部分即本讲第三节的四层框架：通道只是入口，先想清要回答哪一层的问题，再选开关。</p>\n<h3 id=\"45-gb10\">4.5 GB10 上的可用性：统一口径</h3>\n<p>nsys / ncu / torch profiler 在公司 DGX Spark（GB10，sm_121）上的可用性与版本匹配，<strong>本讲一律标注「以开课前冒烟为准」，不在讲义里写死</strong>。理由第七节会给出：这台机器上已经实证过「同名工具、不同构建，性能差近一个数量级」的环境敏感性。冒烟清单（讲义附，实操前执行）：驱动与 nsys/ncu 版本对齐检查 → 对一个小模型短窗抓取 → 确认能打开、时间线完整、目标 kernel 可见 → 记录版本组合进定位报告。冒烟不过时的降级路径见第八节。</p>\n<h2 id=\"roofline\">五、Roofline 进阶：从概念到会用</h2>\n<p>第一阶段你已经用 Roofline 算过带宽账（结论框架在 A1 与第 3 周讲义里）。本讲把它从「算一道题」升级为「判读工具」：给定负载，先判它该撞哪面墙，再拿实测对账，差值就是定位线索（Muse 整理）。</p>\n<h3 id=\"51\">5.1 判读三件套</h3>\n<ul>\n<li><strong>算术强度</strong>（FLOPs/Byte）：每从内存搬 1 字节，能摊到多少次浮点运算。由负载决定，不由硬件决定。</li>\n<li><strong>两面墙</strong>：算力墙 = 峰值算力（GB10 的 BF16 算力量级约 125 TFLOPS，公司压测方案 BENCH-PLAN 口径）；带宽墙 = 实测带宽 224–226 GB/s（公司实测，取 225 GB/s 计算）。</li>\n<li><strong>脊点（ridge point）</strong>：强度 = 算力 ÷ 带宽。按 BENCH-PLAN 的理论带宽口径约 458 FLOPs/B；换成实测带宽约 556 FLOPs/B——口径不同、量级相同，判读结论不变（引用时写明口径）。强度低于脊点 → 带宽受限，再多算力也闲置；高于脊点 → 算力受限，带宽有富余。</li>\n</ul>\n<p>判读动作固定三步：<strong>算强度 → 对脊点 → 拿实测效率对账</strong>（实测达到该墙的百分之几）。第三步最重要：形态对了但效率只有三成，说明瓶颈不在这面墙上，在开销构成里——该下钻 L3 了。</p>\n<h3 id=\"52-decode\">5.2 演练一：单流 Decode 为什么是带宽墙形态</h3>\n<p>用公司现行模型算（数字均为公司实测口径）：</p>\n<ul>\n<li>每步搬运：MoE 每步激活约 6B 参数，NVFP4 每参数 0.5 字节 → 约 3 GB 权重（整机口径；TP2 后每卡约 1.5 GB，BENCH-PLAN 同账）。</li>\n<li>每步计算：约 2 × 6B = 12 GFLOP（每参数一次乘加）。</li>\n<li>算术强度 ≈ 12 GFLOP ÷ 3 GB = <strong>4 FLOPs/B</strong>，只有脊点的约百分之一——<strong>深度带宽受限</strong>，形态判定无悬念。</li>\n<li>对账：纯搬运下限 = 3 GB ÷ 225 GB/s ≈ <strong>13 ms/token</strong>（即约 75 tok/s 上限）；而实测单流 TPOT p50 在关 MTP 时约 39 ms、开 MTP 时约 21 ms（《MTP 实测总结》A/B 表）。形态对、效率只有三到六成——<strong>结论：单流 decode 的主要矛盾不是带宽本身，而是每步的固定开销把带宽利用率压低了</strong>。这条判读链就是第七节案例的前半段，先记住它。</li>\n</ul>\n<p>注意一个常见误读：带宽受限 ≠ 实测贴着带宽下限跑。带宽受限是「上限由带宽定」，实测离上限的差距恰恰是定位对象。把这两句话分清，本节就过关了。</p>\n<h3 id=\"53-prefill\">5.3 演练二：Prefill 为什么是另一副面孔</h3>\n<p>同一模型、同一批权重，Prefill 的强度完全不同：</p>\n<ul>\n<li>Prefill 一次并行处理 N 个输入 token，权重只读一遍服务全部 N 个 token：计算约 2 × 6B × N，搬运仍约 3 GB → 强度 ≈ <strong>4N FLOPs/B</strong>。</li>\n<li>N 取 1024（公司压测的常用输入档）：强度约 4096 FLOPs/B，远超脊点——<strong>算力受限</strong>。N 小到一百出头时才回到脊点附近。</li>\n<li>对账方式随之不同：Prefill 该看的是实测 TFLOPS 离峰值多远、TTFT 随输入长度是否近线性增长（《MTP 实测总结》：开 MTP 后 TTFT 多约 48 ms，因为 Prefill 还要多跑 MTP 头——算力账上的一笔小支出，与形态判定一致）。</li>\n<li>推论（C2 会用到）：<strong>优化 Prefill 靠算力与环境，优化 Decode 靠带宽利用与步数</strong>——两类问题用两套工具、两本账。把「慢」不分段地统称「性能差」，是定位的大忌。而「算力到底能跑出多少」恰恰对运行环境极度敏感——这就引出第七节的插曲。</li>\n</ul>\n<h2 id=\"_5\">六、瓶颈定位决策树</h2>\n<p>把第三节的四层与第一阶段诊断树合并成一张可执行决策表（Muse 整理；第一阶段诊断树负责 L1–L2 的症状分流，本表在其基础上补 L3–L4 的下钻路径）：</p>\n<table>\n<thead>\n<tr>\n<th>症状（L1）</th>\n<th>第一个分叉（L2）</th>\n<th>下钻动作</th>\n<th>常见落点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>TTFT 高</td>\n<td>Waiting 持续 &gt;0？</td>\n<td>是 → 不下钻，先解排队（并发与 max-num-seqs 的账，进 C2）；否 → 看 prompt throughput 与输入长度分布</td>\n<td>排队过载；或长输入扎堆、Chunked Prefill 配置；或 Prefill 算力环境异常（先查第七节插曲的环境基线）</td>\n</tr>\n<tr>\n<td>TPOT 高</td>\n<td>单流还是并发下高？</td>\n<td>单流 → 先算 5.2 的带宽账对账，差距大 → L3 抓单步时间线量空泡；并发 → 看 KV usage 与 SpecDecoding 接受率</td>\n<td>单流：每步固定开销（第七节案例）；并发：KV 搬运膨胀、接受率随流量下跌、EP 通信</td>\n</tr>\n<tr>\n<td>吞吐上不去</td>\n<td>吞吐随并发涨不涨、Waiting 是否为 0</td>\n<td>不涨且 Waiting=0 → 先排除客户端与 max-num-seqs 硬上限（阶梯压测口径，第 3 周）；涨但早平台化 → L3 看 GPU 空泡与通信占比</td>\n<td>客户端瓶颈（不是服务端问题）；调度上限；通信/同步吃掉增益</td>\n</tr>\n<tr>\n<td>GPU 利用率低但延迟高</td>\n<td>—（直接进 L3）</td>\n<td>nsys 看时间线：空泡在等 CPU 发射、等同步还是等对端</td>\n<td>launch-bound / 同步等待的典型形态；注意 nvidia-smi 的利用率是采样窗口内「有活就算」，单值最不可信</td>\n</tr>\n<tr>\n<td>p99 抖、p50 稳</td>\n<td>长尾窗口的日志有什么</td>\n<td>对齐时间戳看长尾窗口的 KV usage、Waiting、接受率（注意容器日志为 UTC）</td>\n<td>长请求混入、KV 抢占重算、个别窗口接受率塌陷（MTP 实测中 mean 被长尾拖垮即此形态）</td>\n</tr>\n</tbody>\n</table>\n<p>决策树的用法纪律：<strong>每次只沿一支往下走，走完一支再换</strong>；每个分叉点的判断依据要写进定位单的「证据」栏。树是有限的，树外症状先回 L1 把症状描述精确化（哪个分位数、哪档负载），多半是症状没定义好，而不是树缺分支。</p>\n<h2 id=\"decode\">七、案例精读：公司单流 Decode 瓶颈定位全过程</h2>\n<p>这是公司环境里真实发生过的一次完整定位（证据与数据出自《MTP 实测总结-2026-10-13》及公司实测数据库，本节为复盘整理，标注「Muse 整理」处为复盘叙述）。它值得精读的原因有二：一是结论反直觉，二是它示范了「没有高级工具时，靠算账 + A/B 也能把结论做实」——以及它的证据缺口在哪。</p>\n<h3 id=\"71-l1\">7.1 症状与基线（L1）</h3>\n<p>起因是 MTP 投机解码的开关评估，需要先回答「现行服务单流 decode 到底慢在哪」。基线口径固定为单流、输入 1024 / 输出 256、200 个 prompts（公司压测脚本 latency 模式）：关 MTP 时 TPOT p50 约 39.2 ms、吞吐约 20.5 tok/s。症状一句话：<strong>单流 TPOT 约 39 ms，且 GPU 并非满负荷忙碌的样子</strong>。</p>\n<h3 id=\"72-l1\">7.2 第一刀：带宽账排除带宽（L1 算账）</h3>\n<p>按 5.2 的账：纯权重搬运下限约 13 ms/token。实测 39 ms 是下限的约 3 倍。若真是带宽吃满，TPOT 应当贴着 13 ms 一线、且对并发不敏感地保持——实际差了三倍，<strong>带宽不是主要矛盾</strong>（排除项一，写进定位单）。同理，算力侧：单流 decode 强度约 4 FLOPs/B，算力闲置是形态决定的，也不可能是算力墙（排除项二）。</p>\n<p>那么每步多出的约 26 ms 花在哪？候选只剩一类：<strong>每步的固定开销</strong>——一 step 里几十层网络的 kernel 序列发射、采样、调度编排、双机 EP 通信的同步等待。这些开销与 token 数无关、与每步的工作量无关，单流 batch=1 时无处摊薄，占的比例自然最大。</p>\n<h3 id=\"73-mtp-ab-l1l2\">7.3 第二刀：MTP A/B 做的受控实验（L1–L2 证据）</h3>\n<p>排除法只是推论，A/B 把它做实（数据：《MTP 实测总结》4.2 表）：</p>\n<table>\n<thead>\n<tr>\n<th>指标</th>\n<th>MTP 开</th>\n<th>MTP 关</th>\n<th>读法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>TPOT p50</td>\n<td>21.3 ms</td>\n<td>39.2 ms</td>\n<td>开后每 token 时间降约 46%</td>\n</tr>\n<tr>\n<td>输出吞吐</td>\n<td>31.09 tok/s</td>\n<td>20.49 tok/s</td>\n<td>每步产出变多，总产出随之涨</td>\n</tr>\n<tr>\n<td>平均接受率</td>\n<td>61.8%（全程平均）</td>\n<td>—</td>\n<td>每步平均产出约 2.4–3.5 个 token</td>\n</tr>\n<tr>\n<td>TTFT mean</td>\n<td>374.0 ms</td>\n<td>325.6 ms</td>\n<td>开后多约 48 ms：Prefill 多跑 MTP 头，算力账上的小支出</td>\n</tr>\n</tbody>\n</table>\n<p>推理链：如果每步时间主要由「搬运 + 固定开销」构成、且与产出 token 数近似无关，那么让每步多产出 token（MTP 平均每步约 2.4–3.5 个），每 token 摊到的时间应显著下降——实测 TPOT 从 39.2 降到 21.3 ms，降幅与「固定成本被多 token 摊薄」的模型吻合；反之，若瓶颈是某种随 token 线性增长的开销，MTP 不该有这个效果。<strong>A/B 结果与固定开销模型互相印证</strong>，结论成立。</p>\n<p>再补一条行为旁证：并发加上去以后，总吞吐显著高于单流的线性叠加预期——batch 变大、每步工作量变大，固定开销被更多 token 摊薄、带宽利用率随之上升。这就是公司已验证结论的由来：<strong>单流 decode 的瓶颈在 kernel 启动等每步固定开销而非带宽；max-num-seqs 的本质，是用并发把带宽利用率打上去</strong>（公司实测结论）。</p>\n<h3 id=\"74\">7.4 结论与它的证据边界（诚实标注）</h3>\n<p>定位单结论：单流 TPOT 约 39 ms 中，纯搬运下限约 13 ms，其余约三分之二为每步固定开销（kernel 启动、调度编排、同步与通信等待的合计）。应对顺序：保留 MTP（已决策，接受率 61.8% 换 1.5–1.8 倍加速）；并发水位按拐点管理（进 C2）；CUDA Graph 现行 FULL_DECODE_ONLY 已是对固定开销的针对性手段，保留。</p>\n<p><strong>证据边界要如实说</strong>：这次定位的证据是 L1 算账 + L1/L2 的受控 A/B 与日志旁证，固定开销内部的构成比例（launch 占多少、同步占多少、通信占多少）<strong>没有被直接量出来</strong>——当年手里没有在 GB10 上冒烟通过的 nsys 流程。今天重做，补的一步很明确：按第八节实操，在离线环境抓一窗单流 decode 的 nsys 时间线，把一步的空泡逐段量出来，将结论从「排除法 + A/B 印证」升级为 L2 时间线级直测。这正是本讲存在的意义：<strong>知道自己的结论站在哪一级，并知道下一级怎么补</strong>。</p>\n<h3 id=\"75-tflops\">7.5 插曲：环境即性能——一次险些误诊的 TFLOPS</h3>\n<p>同一个 GB10 环境里还有一笔必须讲的账（公司实测）：fp16 矩阵乘，vLLM 官方 Day-0 镜像自带的 torch 跑出 <strong>90–96 TFLOPS</strong>，而 pip 安装的 torch 2.11（cu128）在 sm_121 上只有约 <strong>11 TFLOPS</strong>——同硬件、同运算，差近 9 倍。成因是构建与架构适配：pip 通用构建对 sm_121 的支持不到位，而 Day-0 镜像是针对该代系优化的 pin 版本（这也是公司「部署选 pin 版本、不追 latest」纪律的由来，见第一阶段运维部分）。</p>\n<p>把它放进本讲的原因：<strong>profiling 之前先验环境基线</strong>。若有人在 pip torch 环境里测 Prefill（算力受限形态，见 5.3），会得出「这模型 Prefill 慢得离谱」的结论，然后去查引擎、查模型——全查错了方向，慢的是地基。所以四层定位法在 L1 之前还有个不成文的第 0 层：<strong>环境基线</strong>——镜像与关键库版本、一个标准矩阵乘的 TFLOPS、实测带宽，三项与已知基线对齐了，才许往下定位。本讲实操的步骤 0 就是它。</p>\n<h2 id=\"_6\">八、实操：只读观测 + 离线复现，一份定位报告</h2>\n<p>总原则：现行服务<strong>只读、不停、不改</strong>；需要抓时间线的部分放到离线环境做，与大纲「C1 实操需维护窗口」的口径相比，本设计把扰动降到零，代价与降级路径都写明。</p>\n<h3 id=\"81-0-20\">8.1 步骤 0：环境基线与工具冒烟（约 20 分钟）</h3>\n<ol>\n<li>记录现行环境指纹：镜像版本、torch 版本、驱动版本；跑一次标准 fp16 矩阵乘，与基线（Day-0 镜像口径 90–96 TFLOPS，公司实测）对照，偏离先处理环境、不许带病往下走。</li>\n<li>工具冒烟（清单见 4.5）：nsys / torch profiler 对一个小模型短窗抓取，确认时间线可打开、目标 kernel 可见；结果与版本组合记入报告。冒烟不过的工具，在报告中如实标注「本环境未通过」，走 8.4 降级路径，不硬凑。</li>\n</ol>\n<h3 id=\"82-1-30\">8.2 步骤 1：现行服务只读观测（约 30 分钟，不停服）</h3>\n<ol>\n<li>在一段有真实流量的时段，截取至少 30 分钟的 Engine 周期日志与 SpecDecoding 日志（注意容器时间戳为 UTC，对齐北京时间）。</li>\n<li>逐项填观测表：generation throughput 的 p50 估计（按窗口行统计）、Running/Waiting 分布、KV usage 高位占比、Prefix cache hit rate 均值、平均接受率与平均接受长度。</li>\n<li>数据自检：任取 3 个 SpecDecoding 窗口验算 Accepted ÷ Drafted ≈ 平均接受率；对不上，先解决口径问题再继续。</li>\n<li>与基线对账：generation 吞吐对 MTP 开约 31 tok/s 的历史基线（公司实测，注意负载档位差异）、接受率对 61.8% 全程平均基线；偏离项各写一句假设（只写假设，本环节不动手验证）。</li>\n</ol>\n<h3 id=\"83-2-decode-40\">8.3 步骤 2：离线复现单流 Decode 的一步（约 40 分钟）</h3>\n<p>环境二选一：维护窗口内的 Spark 单机离线环境（需按变更纪律停服排期），或 Colab A100 同构复现（形态可比、数值不可平移，报告须标注）。</p>\n<ol>\n<li>用一个小模型（如 Qwen3-8B，B1 实操用过）以离线方式跑单流 decode，固定输入输出长度，预热后进入稳态。</li>\n<li>用冒烟通过的工具抓一窗稳态时间线（nsys 优先；或 torch profiler 的算子账），量三笔数：单步墙钟时间、GPU busy 时间、空泡总时长；把空泡按「等发射 / 等同步 / 等通信」粗分（单机无通信项时只有前两类）。</li>\n<li>算对账表：实测单步时间 vs 该模型的搬运下限（按其每步激活量与实测带宽自算，方法同 5.2），给出固定开销占比——把第七节的公司结论在小模型上亲手复现一遍。</li>\n</ol>\n<h3 id=\"84\">8.4 降级路径（工具冒烟不过时）</h3>\n<p>跳过 8.3 的抓图，改用《MTP 实测总结》的历史数据（本讲义第七节已备齐）做纸面复盘，完成同一份定位报告，但在「证据等级」栏如实写明本次止步于 L1 + 历史 A/B，并列出补测条件。<strong>报告完整度不降，证据等级如实降</strong>——这是全系列实操的共同口径（与 A1、A2、B1 一致）。</p>\n<h3 id=\"85\">8.5 产出：定位报告（模板）</h3>\n<table>\n<thead>\n<tr>\n<th>栏目</th>\n<th>内容要求</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>症状</td>\n<td>指标 + 分位数 + 负载档位 + 与基线偏离幅度</td>\n</tr>\n<tr>\n<td>环境指纹</td>\n<td>镜像/库/驱动版本 + 基线三项（带宽、矩阵乘 TFLOPS、工具冒烟结果）</td>\n</tr>\n<tr>\n<td>证据链</td>\n<td>逐层列出：每层看了什么、得到什么数、出处（日志行/图/表）</td>\n</tr>\n<tr>\n<td>排除项</td>\n<td>排除了什么、依据什么</td>\n</tr>\n<tr>\n<td>结论</td>\n<td>一句话 + 证据等级（如「L1 算账 + L2 时间线直测」）</td>\n</tr>\n<tr>\n<td>建议动作</td>\n<td>一个单变量动作 + 预期收益的估算方法（具体执行放 C2）</td>\n</tr>\n</tbody>\n</table>\n<p><strong>验收标准</strong>：证据链至少完整到所用工具允许的最高层级且每层有具体数字；每个结论可回溯到证据链中的某一行；排除项不少于两项；环境指纹缺失或基线未对齐的报告直接打回——先补第 0 层。</p>\n<h2 id=\"_7\">九、常见坑清单</h2>\n<ol>\n<li><strong>只看平均值</strong>：公司 MTP 正式测试中 TPOT mean 30.7 ms 而 p50 只有 21.3 ms——mean 被 27 分钟里少数慢窗口拖高（《MTP 实测总结》）。拿 mean 做定位单的症状栏，第一步就错。</li>\n<li><strong>profiling 开销污染结论</strong>：ncu 靠重放、profiler 本身吃 CPU 与显存；抓图前后的基线要各测一次，开销比写进报告。拿 profiling 状态下的延迟当线上延迟，是自欺欺人。</li>\n<li><strong>拿单流结论套并发场景</strong>：瓶颈会搬家——单流是固定开销主导（第七节），并发下可能变成 KV 搬运或通信主导。定位单必须写明负载档位，跨档位引用结论要重新验证。</li>\n<li><strong>信 nvidia-smi 的利用率单值</strong>：采样窗口内 GPU 有活就算忙，98% 利用率完全可能与大量空泡并存（空泡在窗口内被「忙」掩盖）。利用率只配当 L0 线索。</li>\n<li><strong>包错进程抓了个寂寞</strong>：多进程/多 worker 引擎必须顺着进程模型接 profiler（4.4 的 LMDeploy/Ray 例子）；vLLM 侧同理，抓 APIServer 进程看不到 EngineCore 的 kernel。</li>\n<li><strong>窗口无代表性</strong>：10 秒窗口抓不到长尾、启动期抓图全是加载噪声；先想清要稳态还是要长尾，窗口与问题对齐，预热样本按纪律剔除（压测脚本丢弃首个 warmup 请求即为此）。</li>\n<li><strong>时间戳对不齐</strong>：容器日志为 UTC、压测机为北京时间（《MTP 实测总结》专门提醒），跨日志对齐前先换算，错 8 小时能拼出任何「灵异相关」。</li>\n<li><strong>归因一步到位</strong>：看到 GPU 空泡就写「kernel 启动慢」——空泡还有等同步、等通信、等数据三类成因，形态判读（L3）之后才许写结论（呼应 2.2 的等级纪律）。</li>\n<li><strong>在错的环境里定位</strong>：pip torch 的 11 TFLOPS 环境里测什么都是「算力不行」（7.5 插曲）。环境指纹不在报告里的定位，一律先怀疑环境。</li>\n<li><strong>只定位不留档</strong>：定位单不归档，下次同类问题从零再来。定位报告与压测基线一并归档（与第一阶段日志归档纪律一致），这是 C2 闭环的输入资产。</li>\n</ol>\n<h2 id=\"_8\">十、课后练习与延伸阅读</h2>\n<p><strong>练习</strong></p>\n<ol>\n<li>（算账）某 32B 稠密模型 BF16 部署在单台 Spark 上单流 decode：按实测带宽 225 GB/s 算它的纯搬运下限与算术强度，并判它与公司现行 MoE 模型（约 13 ms/token）谁更「吃亏」在固定开销上，写出推理链。</li>\n<li>（判读）给一段虚构的现行服务日志：Waiting 长期为 0、KV usage 35%、接受率由 62% 跌至 41%、TPOT p50 上升 30%——按第六节决策树写出你的排查路径与第一步动作，并说明为什么不动 max-num-seqs。</li>\n<li>（Roofline）输入长度从 1024 升到 32768 时，Prefill 的算术强度如何变化？为什么长上下文服务的 TTFT 优化首先要查的是算力环境而不是带宽？（用 5.3 的账回答）</li>\n<li>（证据等级）为「把 num_speculative_tokens 从 3 改为 2」这个候选动作（出自《MTP 实测总结》后续方向）设计取证方案：需要哪一级证据、用什么口径的 A/B、看哪三个数。</li>\n</ol>\n<p><strong>延伸阅读（逐条标来源）</strong></p>\n<ol>\n<li>LMDeploy 官方《PyTorchEngine 性能分析》（上海人工智能实验室，Apache-2.0）——存档 materials-advanced/internlm/03，本讲第四节的对照原文。</li>\n<li>公司自有《MTP 实测总结-2026-10-13》（<code>~/workspace/goals/dgx-spark/files/</code>）——周期日志字段口径与 A/B 原始数据，第七节案例的一手出处。</li>\n<li>公司压测方案 BENCH-PLAN（<code>~/workspace/your_files/qwen38-flash-bench/</code>）——roofline 定上限 → 实测 → 对照找瓶颈的方法论原型与脊点口径。</li>\n<li>NVIDIA Nsight Systems / Nsight Compute 官方文档（NVIDIA 官方）——工具定版以官方文档为准，开课前按 GB10 冒烟结果复核版本与支持矩阵（本讲未写死）。</li>\n<li>PyTorch Profiler 官方教程（PyTorch 官方文档）——算子账本的读法与 trace 分析。</li>\n<li>Williams, Waterman, Patterson, <em>Roofline: An Insightful Visual Performance Model</em>（CACM 2009，经典文献）——第五节判读法的原始出处，读图 1–3 即可。</li>\n<li>回看进阶 B1 第三、五节（vLLM 机制与周期日志）与 B2 第六节（MTP 实测精读）——本讲的 L2 层与案例前置。</li>\n<li>第一阶段技术轨第 3 周讲义第五、六节（日常巡检与性能诊断树）——本讲决策树的上游版本，对照看「进阶后多了哪两层」。</li>\n</ol>\n<hr />\n<blockquote>\n<p><strong>下一讲预告</strong>：C2 调优闭环实战——拿着本讲的定位单，选一个真实负载画像，走完「基线 → 单变量干预 → 复测 → 成本账」的完整闭环，产出本模块的结课作品。</p>\n</blockquote>"}, {"num": "C2", "ch": "进阶 C · 性能调优", "label": "C2 调优闭环实战", "title": "进阶 C2：调优闭环实战——把方法论跑成闭环，把性能算成钱", "html": "<h1 id=\"c2\">进阶 C2：调优闭环实战——把方法论跑成闭环，把性能算成钱</h1>\n<blockquote>\n<p><strong>讲次</strong>：第二阶段进阶专题 · 模块 C（性能调优）第 2 讲 · 模块 C 结课讲\n<strong>建议时长</strong>：3 小时 + 结课实操（讲授约 100 分钟 + 闭环实操约 120 分钟，可拆两次课）\n<strong>前置</strong>：进阶 C1（Profiling 方法论与工具链）；进阶 B1（双引擎机制与参数口径）、B2（量化与投机解码的手段库）；第一阶段技术轨第 3 周（压测四要素、变更纪律与压测报告模板）；公司《MTP 实测总结-2026-10-13》（下称《MTP 实测总结》）\n<strong>素材来源</strong>：C1 的四层定位法、Roofline 进阶与瓶颈定位决策树（按《进阶专题大纲 v1》模块 C 口径衔接，C1 讲义定版后以其术语为准）；公司自有《MTP 实测总结》与压测方案 <code>~/workspace/your_files/qwen38-flash-bench/BENCH-PLAN.md</code>（下称「压测方案」，内含同环境实测基线）；Datawhale Happy-LLM 扩展章《用 vLLM 实现 s1 模型的 Thinking Budget 控制》（CC BY-NC-SA 4.0）；DeepSeek 官方发布与技术报告（2026-10-20，「每卡每小时收入」为官方自报口径）。教学组织、成本模型与量规为「Muse 整理」；凡引用数值均标注出处，测算类数字逐项标明假设。</p>\n</blockquote>\n<hr />\n<h2 id=\"_1\">一、学习目标与本讲地图</h2>\n<p><strong>与 C1 的分工先划清</strong>（Muse 整理）：C1 回答「瓶颈在哪」——四层定位法自上而下收敛范围、Roofline 给每个瓶颈算理论账、决策树把症状映射到证据。C2 回答另外三个问题：<strong>朝哪个方向调、调完怎么证明、这笔调优值多少钱</strong>。定位错了，C2 的闭环只会高效地把错误方向固化下来；没有 C2 的闭环，C1 的定位报告就停在「发现问题」没人负责修完。两讲是一件事的前后半程。</p>\n<p>学完这一讲，你应该能做到五件事：</p>\n<ol>\n<li><strong>会画画像</strong>：从生产日志里提炼出请求长度、并发、缓存命中、输出长度四组分布，并说清这个画像决定了哪几个调优目标。</li>\n<li><strong>会分场景</strong>：长上下文与混合负载各自的失效模式说得清，手里有对应的调优抓手，并知道抓手与 B1/B2 的接口在哪。</li>\n<li><strong>会算成本账</strong>：给一台自建推理服务的硬件投入与实测吞吐，能建出单 token 成本模型，并能指出与云 API 定价、厂商自报数据对比时口径差在哪。</li>\n<li><strong>会跑闭环</strong>：基线冻结 → 单变量干预 → 同口径复测 → 结论与回滚点，五步不缺项，变更纪律不打折。</li>\n<li><strong>交得出作品</strong>：以一份端到端调优报告作为模块 C 的结课作品（第七节量规评分）。</li>\n</ol>\n<p>本讲地图：负载画像（第二节）→ 长上下文调优（第三节）→ 混合负载调优（第四节）→ 单 token 成本建模（第五节）→ 调优闭环五步（第六节）→ 结课实操与量规（第七节）→ 坑单（第八节）→ 练习、阅读与模块收官（第九节）。</p>\n<p><strong>结论先行</strong>：调优的顺序永远是「画像 → 目标 → 证据 → 干预 → 算账」。跳过画像直接调参，调的是想象中的用户；只调性能不算账，省下的每个毫秒都不知道值多少钱、又花了多少钱换来。</p>\n<h2 id=\"_2\">二、负载画像方法论：先认识你的流量，再动任何参数</h2>\n<h3 id=\"21\">2.1 什么是负载画像</h3>\n<p>负载画像（workload profile）是对一段时间内真实请求的统计描述：不是「平均请求长什么样」，而是<strong>分布长什么样</strong>（Muse 整理）。平均值在推理负载里几乎总是骗人的：平均输入 2K token 的流量，可能由 90% 的 200 token 短问答和 10% 的 100K 长文档组成——这两种流量的瓶颈、调优方向完全不同，平均数把它们搅成一团。</p>\n<p>为什么先讲画像？因为 C1 的一切定位工具都需要一个参照系：Roofline 算出的天花板是给「某一种负载」算的，瓶颈定位决策树的第一层问题（这是 Prefill 受限还是 Decode 受限？）本质上就是在问画像。<strong>没有画像的调优，是在给想象中的用户调系统</strong>——压测脚本里那组长度，是你以为的负载，不是生产里的负载。</p>\n<h3 id=\"22\">2.2 画像的四组分布：从哪提、看什么</h3>\n<p>四组分布构成一幅够用的画像。公司现行服务的 vLLM 周期日志（每 10 秒一行）加 API 层访问日志，足以提炼前三组半（出处：《MTP 实测总结》第三节日志说明；第一阶段技术轨第 3 周讲义第五节巡检口径）：</p>\n<table>\n<thead>\n<tr>\n<th>分布</th>\n<th>数据来源</th>\n<th>看什么（分位数与形态，不看平均）</th>\n<th>直接决定的调优目标</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>请求长度分布</td>\n<td>API 访问日志的 prompt token 数</td>\n<td>输入长度的 P50/P90/P99；长尾有多长、多重</td>\n<td>Prefill 侧投入：chunked prefill 块大小、长上下文 KV 预算</td>\n</tr>\n<tr>\n<td>并发分布</td>\n<td>周期日志 <code>Running / Waiting reqs</code> 时序</td>\n<td>高峰并发、Waiting&gt;0 的时长占比、到达的突发性</td>\n<td>max-num-seqs 与网关控流线画在哪</td>\n</tr>\n<tr>\n<td>前缀缓存命中</td>\n<td>周期日志 <code>Prefix cache hit rate</code> 时序</td>\n<td>稳态命中率、命中率的时段结构</td>\n<td>系统提示词与会话复用值不值得专门优化</td>\n</tr>\n<tr>\n<td>输出长度分布</td>\n<td>API 访问日志的 completion token 数</td>\n<td>输出 P50/P90；长输出请求占比；思考型请求的占比</td>\n<td>Decode 侧投入：MTP 深度、max_tokens 策略、成本模型里的输出权重</td>\n</tr>\n</tbody>\n</table>\n<p>提炼方法三条纪律（Muse 整理）：<strong>其一，按时段切</strong>——至少分工作时段与夜间批处理时段，两幅画像分开画，混在一起等于没有画像；<strong>其二，看分位数与双峰</strong>——直方图优先于统计量，双峰分布的第一反应是「这是两类业务」，先拆业务再谈参数；<strong>其三，标注来源窗口</strong>——画像必须写明取自哪几天、哪台服务，业务一变画像就过期，报告里不写窗口期的画像不许引用。</p>\n<p>一个公司现成的反例：压测方案与《MTP 实测总结》用的都是随机词拼凑 prompt，前缀缓存命中率为 <strong>0%</strong>——这不是现行服务在生产里的命中率，而是那组人为负载的属性（B1 已钉过这条：命中率是负载属性）。真实生产负载若含统一系统提示词、多轮会话、模板化业务问答，命中率会是完全不同的数字。<strong>拿 bench 画像代替生产画像，是本讲最想根除的错误。</strong></p>\n<h3 id=\"23\">2.3 画像决定目标：三组对照</h3>\n<p>画像画完，调优目标应当能从图上直接读出来（Muse 整理）：</p>\n<ul>\n<li><strong>输入长、输出短</strong>（如文档摘要、长文问答）：成本压在 Prefill 与 KV 上 → 目标定在 TTFT 与 KV 效率，抓手在第三节；</li>\n<li><strong>输入短、输出长</strong>（如代码生成、长文写作、思考型推理）：成本压在 Decode 步数上 → 目标定在 TPOT 与单请求总成本，抓手是 MTP 这类「省步数」手段（B2）与输出长度治理（第四节 4.3）；</li>\n<li><strong>高并发、请求短</strong>（如批量分类、嵌入前处理）：瓶颈在调度与排队 → 目标定在拐点水位与尾延迟，抓手在第四节。</li>\n</ul>\n<p>反过来，若有人提不出画像就报调优目标——比如「把吞吐再提 20%」——先问一句：提哪一类请求的吞吐、以哪一类请求的延迟为代价？答不上来，目标驳回，先补画像。</p>\n<h2 id=\"_3\">三、长上下文调优要点</h2>\n<p>长上下文（现行配置 max_seq_len 262144，即 256K 上限，来源：《MTP 实测总结》参数表）的失效模式与普通负载不同：请求数不多，单请求就能把 KV 池吃穿、把新请求的 TTFT 拖进泥潭。调优抓手按「容量—命中—计算」三层排（Muse 整理，机制衔接 B1/B2）：</p>\n<p><strong>第一层：KV 容量账先算对。</strong> 一条 256K 上下文的请求占多少 KV、池子里能同时躺几条，是长上下文并发的真实上限——它通常远小于 max-num-seqs 的名义值。压测方案给的纪律可直接搬用：长上下文从小往大加（32K→128K→512K 逐档），不要一次顶到上限（来源：压测方案第五节）。调优动作的本质是给长请求划预算：最大上下文、长请求并发数、KV 占用率告警线，三者配套着定，单改任何一个都会在另两个上漏出来。</p>\n<p><strong>第二层：前缀命中是长上下文的第一杠杆。</strong> 长 prompt 的 Prefill 成本与长度成正比，一次命中省下的也与长度成正比——短 prompt 命中省几十毫秒，长文档场景命中省的是几秒。现行服务 prefix caching 已开启（来源：《MTP 实测总结》），调优不在开关而在<strong>让负载变得可命中</strong>：系统提示词与 few-shot 前缀全租户统一、不要在 prompt 头部拼时间戳/随机 ID 这类每请求必变的字段、多轮会话尽量粘住同一实例。B1 讲过 TurboMind 的会话级 KV 保活是另一种复用语义——选型层面的差异，调优层面的动作一致：先从画像量出当前命中率，再动手。</p>\n<p><strong>第三层：Prefill 计算别堵住 Decode。</strong> 现行配置已开 chunked prefill（来源同上）：长 prompt 被切块与 Decode 交错，保住在途请求的 TPOT 不被单个长请求击穿。调优旋钮是块大小与每步 token 预算：块大则长请求 TTFT 好、在途请求抖动大；块小则反之。用画像定档：长请求占比高且交互请求对 TPOT 敏感时往小调，反之往大调，并用第六节的闭环验证，不听经验口诀。</p>\n<p><strong>与 B2 的接口（两处，点到为止）</strong>：其一，<strong>KV 量化</strong>——KV 存成更低比特直接扩大容量层天花板，是长上下文档位不够时最对症的手段，代价与验收口径在 B2 第五节，本讲只要求在闭环报告里把它列为候选干预并引用 B2 的验收清单；其二，<strong>稀疏注意力</strong>——DoSA 一类工作（B2 第七节）压的是注意力侧的计算量，指向的是「命中之外 Prefill 还能怎么省」，属前沿观察项，本讲不作为可执行干预。反过来要警惕：长上下文场景下权重量化的收益会被 KV 账稀释，先算清三笔账的占比再排干预顺序（B2 第二节的账法）。</p>\n<h2 id=\"_4\">四、混合负载调优：长短混跑时，谁先谁后</h2>\n<p>生产流量从来不是压测里那种整齐的长度分档：短问答、长文档、思考型长输出混在同一个队列里。混合负载的调优对象不是某个参数，而是<strong>请求之间的相互伤害</strong>（Muse 整理）。</p>\n<h3 id=\"41\">4.1 三种典型伤害</h3>\n<ul>\n<li><strong>队头阻塞</strong>：一条 200K 输入的请求在 Prefill 上占住调度，后面几十条短请求的 TTFT 集体变差。chunked prefill 是第一道防线（第三节），网关侧把超长请求分流到独立队列/独立时间窗是第二道。</li>\n<li><strong>尾延迟污染</strong>：长输出请求长时间占用序列槽位，短请求的 P99 被拖长。第一阶段压测讲义的诊断树已给过方向：P99 抖动大先查长请求混入与抢占（来源：第一阶段技术轨第 3 周讲义第六节）。指标汇报必须按画像分层：混在一起报的 P99 对谁都没有指导意义。</li>\n<li><strong>KV 挤兑与抢占</strong>：KV 池被长上下文请求占满时，新请求等待、甚至触发在途请求的抢占重算，吞吐与延迟同时劣化（来源同上）。画像里 KV 占用率的时序形态——是长期高位还是尖峰——决定对策是扩预算还是削峰。</li>\n</ul>\n<h3 id=\"42\">4.2 优先级与抢占：先立规则，再调参数</h3>\n<p>混合负载调优的正确顺序是<strong>先定服务规则，再定引擎参数</strong>（Muse 整理）：</p>\n<ol>\n<li><strong>分级</strong>：按画像把流量分成至少两级——交互级（人在等，延迟目标严）与批量级（任务在等，吞吐目标优先）。分级标准写进报告，不靠口头默契。</li>\n<li><strong>隔离手段按成本排</strong>：最轻的是网关控流与配额（压测方案的生产建议即是此路：在线交互由 API 网关控流在拐点水位内，批量离线另开时段打满，来源：压测方案第四节）；其次是引擎侧的请求优先级能力（<strong>以当前 vLLM 版本文档为准，开课当周复核其优先级调度的支持范围与语义</strong>，不预设）；最重的是分实例部署——批量流量独立一组服务，物理隔离，代价是硬件利用率与运维份数。</li>\n<li><strong>抢占是最后手段</strong>：抢占重算本质是拿已花的算力换调度公平，只应发生在 KV 真实不足时；若抢占频发，问题在容量账（第三节第一层）没算对，不在抢占策略不够聪明。</li>\n</ol>\n<h3 id=\"43\">4.3 批与并发的权衡面，以及一个应用层杠杆</h3>\n<p>并发这条线，公司已有一组同环境实测可作锚点（来源：压测方案第三节实测基线，同为现行服务与压测口径）：总吞吐随并发 4→8 档由约 37.9 升至约 50.4 tok/s（+32.8%），中位 TTFT 只涨约 10ms——8 并发是这条曲线的拐点区；到 12 并发，总吞吐几乎不再涨（约 51.3），中位 TTFT 却从约 0.86 秒炸到约 11.8 秒。根源是 max-num-seqs 8 的硬上限：超出的请求不是「慢一点」，是进队列干等（来源：《MTP 实测总结》参数表注）。<strong>这条曲线的形状就是混合负载调优的全部直觉</strong>：拐点之前，并发是免费的吞吐；拐点之后，并发买到的只有排队。调优动作因此只有两类：要么把拐点往右推（扩 KV 预算、提 max-num-seqs、KV 量化），要么把水位管在拐点左边（网关控流）——推拐点的每个动作都要过第六节闭环，因为拐点位置还随画像漂移。</p>\n<p>还有一个常被漏掉的应用层杠杆：<strong>输出长度本身是可以治理的</strong>。请求级 <code>max_tokens</code> 只算生成 token（B1 参数口径专题），思考型负载里输出长度的大头是思考过程——Datawhale 的 Thinking Budget 案例演示了给推理设思考预算上限的做法：在 s1 这类 test-time scaling 场景里，以预算约束思考长度、必要时用续写引导词控制思考深度（来源：Datawhale《Happy-LLM vLLM 推理 Thinking Budget》，案例素材）。对成本与延迟而言，这等于直接改写画像的输出长度分布，杠杆比引擎参数大。但案例同时给了警告：强行截断或续写可能让模型重复打转、质量不升反降——输出治理必须与质量抽检绑在一起做，不许只看 token 账（同上，其结果分析节）。这一条在实操报告的量规里有对应扣分项。</p>\n<h2 id=\"token\">五、单 token 成本建模：把性能算成钱</h2>\n<h3 id=\"51\">5.1 模型结构：成本只有三块，利用率说了算

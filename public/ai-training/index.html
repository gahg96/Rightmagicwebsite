<strong>评估指标</strong>：上线前评估集构成（条数、类型分布）与试点期验收指标（含量化门槛与「停下来的条件」）；</li>\n<li><strong>试点计划</strong>：试点用户、周期、影子运行方式、owner 人选、复盘时间点。</li>\n</ol>\n<p><strong>可选加分项</strong>：在 Dify 上把业务轨已有的某个原型（如投标公告整理助手、资料问答助手）升级为「带人工确认点 + 审计记录」的版本——确认节点真实可停、运行日志真实可查，现场演示一次完整运行与一次驳回回放。</p>\n<p><strong>验收量规要点</strong>（100 分，70 分通过；量规为 Muse 整理）：</p>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>分值</th>\n<th>得分要点 / 否决项</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>价值账</td>\n<td>20</td>\n<td>四判据齐全、测算口径写明；<strong>场景过不了判据还硬立项，该项 0 分</strong></td>\n</tr>\n<tr>\n<td>流程与确认点</td>\n<td>25</td>\n<td>流程闭环、确认点覆盖全部高风险动作；<strong>漏标一个对外/金额类动作的确认点，整卡退回重做</strong></td>\n</tr>\n<tr>\n<td>架构与分流</td>\n<td>20</td>\n<td>四层职责有着落、数据分流逐环节明确；敏感数据出现云端路径且无合规论证，该项 0 分</td>\n</tr>\n<tr>\n<td>评估与试点计划</td>\n<td>20</td>\n<td>评估集构成具体、验收指标量化、停止条件敢写且可执行</td>\n</tr>\n<tr>\n<td>治理</td>\n<td>15</td>\n<td>双 owner 落到角色、知识库维护责任明确、停用开关有安排</td>\n</tr>\n</tbody>\n</table>\n<p>互评规则：每组的设计卡由另一组按「如果我是业务 owner，我敢不敢签字」为标准挑毛病，挑出的问题比夸奖计分更高。</p>\n<hr />\n<h2 id=\"_7\">九、常见坑</h2>\n<ol>\n<li><strong>先平台后场景</strong>：先买/先建一个「企业级 Agent 平台」，再到处找场景往里塞。平台是规模化的产物，不是起点；顺序应是场景跑通 → 复用沉淀 → 才有平台（第六节）；</li>\n<li><strong>一步到位全自动</strong>：第一个版本就想去掉所有人工确认。上线阻力、事故风险、信任崩塌都来自这一步迈得太大。正确顺序是人审全开、按数据逐步放行；</li>\n<li><strong>没有评估集就上线</strong>：靠几位同事「试了试感觉不错」发布。没有基线，后续任何变更都无从判断好坏，事故也无从复盘（5.3）；</li>\n<li><strong>权限给满图省事</strong>：一个超级账号跑遍所有系统。省的是接入的半天事，埋的是越权取数与责任不清两颗雷（5.1）；</li>\n<li><strong>把试点成功当规模化成功</strong>：试点期是小圈子、高配合、影子运行，成功只证明「场景成立」；推广期的权限、成本、长尾问题一个都还没遇到（6.2）；</li>\n<li><strong>用 Agent 盖数据缺口</strong>：数据没进系统、口径不统一，先上 Agent「智能处理」。它只会把数据问题放大成业务问题（2.1、第七节）；</li>\n<li><strong>知识库只建不管</strong>：上线时灌一批文档，之后制度换版无人同步。Agent 引用过期文件答错，比答「不知道」伤害大得多（5.6）；</li>\n<li><strong>只看演示不看报表</strong>：汇报时放最好的一次运行录像。路线图的评审纪律就是为此存在：只看指标与事故记录（第六节）。</li>\n</ol>\n<hr />\n<h2 id=\"_8\">十、课后练习与延伸阅读</h2>\n<p><strong>练习</strong></p>\n<ol>\n<li><strong>补一本账</strong>：从第三节地图里选一个 ★★ 场景，补齐它升 ★★★ 所缺的条件清单（数据、权限、评估各缺什么），写成一页纸的「立项前置条件」；</li>\n<li><strong>审一张卡</strong>：拿第八节的量规，审一遍业务轨第 4 周你自己（或本组）的 Dify 原型作业，列出它离本讲上线标准还差哪几项；</li>\n<li><strong>算分流账</strong>：假设公司三个已上线场景月 token 量分别为 200 万 / 1500 万 / 6000 万，按 2.2 口径分别估算走云 API 与走本地（按 30% 利用率口径）的月度成本，并说明为什么不能只按这笔账决定通道。</li>\n</ol>\n<p><strong>延伸阅读（逐条标来源）</strong></p>\n<ul>\n<li>进阶 E1 讲义《Agent 演进史》：本讲判据与编排模式的出处，尤其是「工作流 vs Agent」的适用边界（内部讲义）；</li>\n<li>进阶 C2 讲义第五节《单 token 成本建模》：成本账的完整模型与敏感性分析方法（内部讲义）；</li>\n<li>业务轨第 3 周讲义《Agent 入门与扣子实操》、第 4 周讲义《Dify 与 MCP 业务助手》：设计卡与人工确认纪律的第一版，本讲是其升级版（内部讲义）；</li>\n<li>WaytoAGI 社区《MCP 协议：案例精选》：工具接入的案例谱系，挑与设计卡场景相近的两个细读（社区文章，存档 materials/00、10）；</li>\n<li>Anthropic《Building Effective Agents》：工作流与 Agent 的模式分类，本讲编排层分工的概念出处之一（厂商官方文章，公开）；</li>\n<li>《进阶专题大纲 v1》与第二阶段规划：本讲在整个进阶专题中的定位与后续衔接（内部文档）。</li>\n</ul>\n<blockquote>\n<p><strong>模块 E 收官一句话</strong>：E1 让我们知道 Agent 从哪来、能干什么；E2 的结论是——企业里决定 Agent 生死的，从来不是它多聪明，而是我们有没有把场景选对、把数据备好、把权限管住、把验收做实。这四件事，就是这门课留给各位的全部行李。</p>\n</blockquote>\n<hr />\n<p><em>讲师备注：本讲案例均为公司内部场景，授课时 biz-management 的数据口径以开课当周系统现状为准；成本与云 API 价格数字沿用 C2 口径，须按「开课前复核」纪律更新。加分项演示前先在 Dify 当前版本复核人工确认与日志功能的位置。</em></p>"}];
var GROUPS = ["总目录", "业务轨 · 概念到落地（5 周）", "技术轨 · 原理到蒸馏（6 周）", "进阶 A · 训练工程", "进阶 B · 推理引擎", "进阶 C · 性能调优", "进阶 D · 底层架构", "进阶 E · Agent 专题"];
var nav = document.getElementById('nav');
var content = document.getElementById('content');
GROUPS.forEach(function(g){
  var c = document.createElement('div');
  c.className = 'chap'; c.textContent = g;
  c.onclick = function(){ c.classList.toggle('closed');
    SECTIONS.filter(function(s){return s.ch===g;}).forEach(function(s){ document.getElementById('nav-'+s.num).style.display = c.classList.contains('closed') ? 'none' : ''; });
  };
  nav.appendChild(c);
  SECTIONS.filter(function(s){return s.ch===g;}).forEach(function(s){
    var a = document.createElement('a');
    a.className = 'sec'; a.id = 'nav-'+s.num; a.textContent = s.label;
    a.onclick = function(){ show(s.num); };
    nav.appendChild(a);
  });
});
function show(num){
  var s = SECTIONS.find(function(x){ return x.num === num; });
  if(!s) return;
  document.querySelectorAll('.sec').forEach(function(e){ e.classList.remove('active'); });
  var el = document.getElementById('nav-'+num); if(el) el.classList.add('active');
  content.innerHTML = s.html;
  content.scrollTop = 0;
  window.scrollTo(0, 0);
  if(typeof closeDrawer === 'function') closeDrawer();
  document.title = s.title + ' · AI 培训 Wiki';
}
var searchBox = document.getElementById('search');
var resultsBox = document.getElementById('results');
searchBox.addEventListener('input', function(){
  var q = searchBox.value.trim().toLowerCase();
  resultsBox.innerHTML = '';
  if(q.length < 2){ content.innerHTML = HOME_HTML; return; }
  var hits = SECTIONS.filter(function(s){
    var txt = (s.title + ' ' + s.html.replace(/<[^>]+>/g, ' ')).toLowerCase();
    return txt.indexOf(q) !== -1;
  }).slice(0, 30);
  if(!hits.length){ resultsBox.innerHTML = '<div style="color:var(--muted);font-size:12px;">无匹配</div>'; return; }
  hits.forEach(function(s){
    var d = document.createElement('div');
    d.className = 'r';
    var plain = s.html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
    var idx = plain.toLowerCase().indexOf(q);
    var snip = idx >= 0 ? '…' + plain.slice(Math.max(0, idx-40), idx+80) + '…' : '';
    d.innerHTML = '<b>' + esc(s.label) + '</b><small>' + esc(snip) + '</small>';
    d.onclick = function(){ show(s.num); };
    resultsBox.appendChild(d);
  });
});
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var HOME_HTML = "<div class=\"home\"><h1>🎓 公司内部 AI 培训 · 讲义 Wiki</h1><p style=\"color:var(--muted)\">全套讲义共 22 篇（总目录 1 + 业务轨 5 + 技术轨 6 + 进阶专题 10），约 11.6 万中文字。左侧目录浏览，或用上方搜索框全文检索。每讲的配套 PPT 在 Google Drive，入口见「全项目总目录」篇。</p><h2>结构与阅读路径</h2><ul><li><b>业务轨（5 周）</b>：无技术门槛。概念扫盲 → 提示词实战 → Agent 与扣子 → Dify 与 MCP → 岗位项目路演。</li><li><b>技术轨（6 周）</b>：面向开发与运维。原理与三笔账 → 本地部署与 vLLM → 压测运维 → SFT → 后训练与蒸馏 → 结课项目。</li><li><b>进阶专题（10 讲）</b>：A 训练工程 → B 推理引擎 → C 性能调优 → D 底层架构 → E Agent 演进与企业落地。主线：训得动 → 跑得稳 → 调得准 → 算得清。</li></ul><h2>使用说明</h2><ul><li>讲义中的实操基于公司 2×DGX Spark（GB10）本地部署与 Google Colab；涉及平台版本与价格处均标注「开课前复核」。</li><li>讲义引用素材均标注来源（社区文章 / 官方文档 / Muse 整理），版权归原作者与来源机构所有。</li></ul><p style=\"color:var(--muted)\">本 Wiki 由 Muse 协助整理与制作 · 仅供学习交流。</p></div>";
content.innerHTML = HOME_HTML;

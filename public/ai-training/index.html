</h3>\n<p>单 token 成本的模型一句话（Muse 整理）：</p>\n<blockquote>\n<p><strong>单位成本 = （硬件摊销 + 电费 + 运维人力）÷ 统计期内的有效产出 token 数</strong></p>\n</blockquote>\n<p>三块成本的性情完全不同，先分清再算：</p>\n<ul>\n<li><strong>硬件摊销</strong>：一次性投入按服役年限直线摊，是大头，且<strong>与产出无关</strong>——机器闲着也在烧这笔钱；</li>\n<li><strong>电费</strong>：与运行时长相关、与负载弱相关。GB10 的能效让这一项小得反常（见 5.2 的精算），但在数据中心卡上它会完全不同，不要把这台机器的结论平移；</li>\n<li><strong>运维人力</strong>：最容易漏、最难估准的一项——重启、升级、排障、值守的时间都是钱。漏算人力是自建成本最常见的造假方式（第八节坑单）。</li>\n</ul>\n<p>分母里的「有效产出」是关键限定：要扣除失败请求、被抢占重算的部分与测试流量。<strong>这个模型最重要的推论是：自建服务的单位成本几乎完全由利用率决定</strong>。同一套硬件，利用率从 10% 提到 30%，单位成本直接降到三分之一——比任何单个引擎参数的调优收益都大。这就是调优在本讲的终极定义：<strong>在延迟与质量达标的前提下，把有效利用率往上推</strong>。画像（第二节）告诉你利用率的时间结构，闭环（第六节）负责把每一步改进证明出来。</p>\n<h3 id=\"52\">5.2 公司案例精算一遍（教学测算，假设逐项标注）</h3>\n<p>对象：现行服务，2×DGX Spark（GB10）+ Qwen3.8-Flash-Next-NVFP4 + vLLM。</p>\n<p><strong>分子（月成本）</strong>：</p>\n<table>\n<thead>\n<tr>\n<th>项</th>\n<th>取值</th>\n<th>出处/假设</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>硬件投入</td>\n<td>约 21 万元（区间 20–22 万）</td>\n<td>公司口径：2 台 128GB 版 Spark（$6,950/台）+ 交换机/DAC 线（公司测算记录）</td>\n</tr>\n<tr>\n<td>摊销</td>\n<td>21 万 ÷ 4 年 ÷ 12 ≈ <strong>4,375 元/月</strong></td>\n<td>教学假设：直线摊销、服役 4 年、无残值</td>\n</tr>\n<tr>\n<td>电费</td>\n<td>≈ <strong>50 元/月</strong></td>\n<td>测算：满载单机功耗约 29W（公司压测实测，来源：压测方案第三节），双机加交换机按约 0.07 kW、月 720 小时、电价 1 元/度粗算——能效是 GB10 的特例，此数不可外推到数据中心卡</td>\n</tr>\n<tr>\n<td>运维人力</td>\n<td>≈ <strong>1,200 元/月</strong></td>\n<td>教学假设：每月约 4 小时维护（升级、排障、巡检）× 300 元/小时内部人力成本。实际填报时用本部门口径替换</td>\n</tr>\n<tr>\n<td><strong>合计</strong></td>\n<td><strong>≈ 5,600 元/月</strong></td>\n<td>摊销占约八成——再次印证 5.1 的推论</td>\n</tr>\n</tbody>\n</table>\n<p><strong>分母（月产出）</strong>：以拐点水位 8 并发的总吞吐约 50 tok/s 为产能口径（公司压测实测，来源：压测方案第三节；此处按产出 token 计、输入 token 的处理成本并入综合口径，属教学简化，正式测算应把 Prefill 单列）：满负荷（24 小时连续以拐点水位运行）月产出 ≈ 50 × 86,400 × 30 ≈ <strong>1.30 亿 token</strong>。</p>\n<p><strong>单位成本随利用率的变化</strong>（利用率 = 实际以拐点水位运行的时长占比）：</p>\n<table>\n<thead>\n<tr>\n<th>利用率</th>\n<th>月产出</th>\n<th>单 token 成本</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>100%（理论上限）</td>\n<td>≈1.30 亿</td>\n<td>≈ 43 元 / 百万 token</td>\n</tr>\n<tr>\n<td>30%</td>\n<td>≈0.39 亿</td>\n<td>≈ 145 元 / 百万 token</td>\n</tr>\n<tr>\n<td>10%</td>\n<td>≈0.13 亿</td>\n<td>≈ 430 元 / 百万 token</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"53\">5.3 三方对照：口径不齐，数字不许直接比</h3>\n<p>把上表与另外两个数字摆在一起（Muse 整理对照框架）：</p>\n<ul>\n<li><strong>云 API 定价</strong>：以 DeepSeek 官方 Flash 档为例，输入约 $0.30 / 百万 token、输出约 $1.20 / 百万 token（项目调研记录的官方价，开课前复核）。按输入输出 3:1 的常见比例折成混合价，约合人民币 <strong>4 元 / 百万 token</strong> 量级。</li>\n<li><strong>厂商自报锚点</strong>：DeepSeek 公布其生产集群「每卡每小时收入 38 美元（按谷价）」（来源：DeepSeek 官方发布，2026-10-20，智东西等转述其技术报告口径）。</li>\n</ul>\n<p>三个数字差出一到两个数量级，但<strong>没有一个是算错的</strong>——差的是口径，逐项拆开：</p>\n<table>\n<thead>\n<tr>\n<th>口径维度</th>\n<th>公司自建（5.2）</th>\n<th>云 API 定价</th>\n<th>DeepInfer 锚点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>数字性质</td>\n<td>成本</td>\n<td>价格（含厂商利润与规模摊薄）</td>\n<td><strong>收入</strong>（不是成本，更不是利润）</td>\n</tr>\n<tr>\n<td>利用率假设</td>\n<td>按实际利用率敏感变化</td>\n<td>与用户无关，厂商承担闲置</td>\n<td>接近满负荷：官方同口径披露单集群日吞吐 155 万亿 token、缓存命中 96%（官方自报）</td>\n</tr>\n<tr>\n<td>价格时段</td>\n<td>—</td>\n<td>分峰谷，缓存命中另有低价档</td>\n<td><strong>谷价</strong>口径，非全天均价</td>\n</tr>\n<tr>\n<td>硬件</td>\n<td>GB10（能效特例、电费可忽略）</td>\n<td>不可见</td>\n<td>SM100 数据中心卡，单卡产能与功耗结构完全不同</td>\n</tr>\n<tr>\n<td>规模</td>\n<td>2 台</td>\n<td>平台级</td>\n<td>集群级（Decode 侧 Wide-EP 64–128 卡的系统）</td>\n</tr>\n</tbody>\n</table>\n<p>公司已有的测算结论与这套口径分析自洽：按官方 Flash API 的低价、纯 token 替代口径，自建约 <strong>13 年回本</strong>（公司测算结论）——把 5.2 的单位成本与云混合价并排看，结论的数量级并不意外。回本年限对三个变量极端敏感：利用率、对照的价格档位（峰价/谷价、命中/未命中）、人力是否计入，任一变量换口径，结果摆动数倍到一个数量级。<strong>所以成本建模交付的不是一个数字，而是一张敏感性表 + 一句口径声明</strong>；谁拿单一数字汇报回本，谁的账就没有算完。自建的真实价值不在 token 替代——在私有化合规、数据不出内网、固定成本摊销与可控性（公司测算结论）——调优的任务因此是把利用率与达标率做实，让这笔固定投入摊得更值，而不是幻想在单价上打赢云厂商。</p>\n<h2 id=\"_5\">六、调优闭环五步：基线、假设、干预、复测、回滚</h2>\n<p>C1 的定位结论只是闭环的输入。闭环五步如下（Muse 整理，纪律承接第一阶段技术轨第 3 周与《MTP 实测总结》的实测范式）：</p>\n<p><strong>第一步 · 基线（冻结口径）</strong>。干预之前，先产出一份可复现的基线：压测四要素（要回答的问题、负载定义、环境快照、判定标准）齐全，用固定数据集与阶梯口径跑完，把启动脚本、镜像版本、基线数据三件套归档（来源：第一阶段技术轨第 3 周讲义第一、八节）。基线不冻结，后面所有「变好了」都无从谈起。负载必须来自第二节的画像，而不是随手构造——这是 C2 对第一阶段口径的唯一升级。</p>\n<p><strong>第二步 · 假设（指明机制与预期量级）</strong>。写下：我认为瓶颈在 X 机制（引 C1 的定位证据），干预 Y 后，指标 Z 预计改善约 N%（量级即可，但必须有数）。量级从哪来？从账里来——Roofline 的天花板与实测的差额就是改善的上限空间；《MTP 实测总结》是最好的范式：动手前先有「接受率约六成、预期换来 1.5 倍量级加速」的判断框架，实测 TPOT p50 快 1.84×、吞吐快 1.52× 与之对位（来源：《MTP 实测总结》第四节）。没有量级的假设不算假设，只是愿望。</p>\n<p><strong>第三步 · 单变量干预</strong>。一次只动一个变量，其余配置、负载、时段尽量不变——多变量齐动的后果在第八节坑单里。公司 MTP A/B 的动作序列就是标准件：双机各备份原脚本 → 只改目标行 → 停集群 → 按编排重拉 → 等 API 就绪 → 用日志判据验证变更已生效（如 MTP 关闭后启动日志应为 <code>speculative_config=None</code> 且不再出现 SpecDecoding 行，来源：《MTP 实测总结》2.3 节）。<strong>验证「变更真的生效了」是干预的一部分，不是可选项</strong>——没生效的实验比没做实验更危险。</p>\n<p><strong>第四步 · 复测（同口径）</strong>。同一份数据集、同一组长度档与并发阶梯、同样的预热与样本量，复测干预后的指标，与基线同表对照；分位数口径不变（报告一律用分位数，来源：第一阶段纪律）。结果无论涨跌都入档：负结果同样是有价值的结论，《MTP 实测总结》里「TTFT 开 MTP 反而慢约 48 ms」就是如实记录的负项，并与正项一起支撑了最终判断。</p>\n<p><strong>第五步 · 结论与回滚点</strong>。结论只写三件事：假设是否成立（数据对位）、保留还是回滚、下一轮的候选假设。回滚点必须在<strong>第三步之前</strong>就定义好：回滚的触发条件（哪个指标恶化到什么线）、回滚动作（恢复哪份备份脚本）、回滚后的验证（健康检查三件套 + 一档小压测对照基线）。注意现行服务的重启成本约 15 分钟、一半耗在权重加载（来源：《MTP 实测总结》运维教训）——所以调参要攒批进行，且回滚窗口要把这 15 分钟算进去。</p>\n<p><strong>涉及现行生产服务的附加纪律</strong>（Muse 整理，承接大纲实操总表对 C2 的标注）：一切触及现行服务的干预只在<strong>维护窗口</strong>内进行——低峰时段、提前通知使用方、变更单获批准后执行，窗口内完成「干预 → 复测 → 保留或回滚 → 健康检查」的完整动作，不把半成品状态留过窗口；双机配置一致性是红线，脚本同步后必须 diff 核对（公司有双机 MTP 配置不一致导致启动卡死的实测教训在案，来源：《MTP 实测总结》第五节）。<strong>降级方案</strong>：无法获得维护窗口、或干预风险不可控时，闭环改在<strong>单机离线复现</strong>——用单台 Spark 起同模型（或缩小版）的离线服务，把五步原样跑完，结论注明「单机离线口径，与生产双机部署的差异点是 TP2/EP 与互联」，作为申请维护窗口的前置证据。降级降的是环境，不是步骤。</p>\n<h2 id=\"c\">七、结课实操：端到端调优闭环（模块 C 结课作品）</h2>\n<p><strong>任务定义</strong>：以小组（或个人）为单位，从现行服务（维护窗口口径）或单机离线复现环境（二选一，报告中声明）出发，选定一个源自真实画像的调优问题，走完第六节五步，产出一份调优报告。问题必须出自画像，不许凭空选题——参考方向（任选其一或自拟经讲师确认）：拐点水位复核与 max-num-seqs 调整评估；长上下文请求的 KV 预算与 TTFT 治理；系统提示词结构对前缀命中的影响量化；输出长度治理（max_tokens/思考预算）对成本与延迟的影响。</p>\n<p><strong>执行步骤</strong>（与五步一一对应，每步留档）：</p>\n<ol>\n<li><strong>画像与选题</strong>：从指定窗口期的生产日志（脱敏）提炼四组分布，写明选题理由——画像的哪个形态指向了这个问题；</li>\n<li><strong>基线</strong>：按压测四要素写计划，固定数据集与阶梯，产出基线数据并归档环境快照；</li>\n<li><strong>假设</strong>：写明机制判断（引 C1 定位方法或日志证据）与预期改善量级（引 Roofline 或带宽账）；</li>\n<li><strong>干预</strong>：变更单先行；单变量修改；用日志判据验证变更生效；生产环境只在批准的维护窗口内执行，否则走单机离线降级路径并注明口径差异；</li>\n<li><strong>复测与结论</strong>：同口径复测、与基线同表对照；给出保留/回滚结论与回滚方案；补一节成本账——本次干预对单位成本的影响，用第五节模型折算（改善的是吞吐、利用率还是人力，一项一项对）。</li>\n</ol>\n<p><strong>调优报告模板</strong>（在第一阶段压测报告模板上扩展，Muse 整理）：</p>\n<table>\n<thead>\n<tr>\n<th>章节</th>\n<th>必备内容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1. 选题与画像</td>\n<td>画像四组分布（注明窗口期与脱敏方式）、选题理由、要回答的问题</td>\n</tr>\n<tr>\n<td>2. 基线</td>\n<td>环境快照（镜像/参数全文/双机一致）、负载定义、基线结果表（分位数口径）、判定标准</td>\n</tr>\n<tr>\n<td>3. 假设</td>\n<td>机制判断 + 定位证据、预期改善量级及其账面来源</td>\n</tr>\n<tr>\n<td>4. 干预记录</td>\n<td>变更单要点、实际改动（逐行）、变更生效的验证证据、时间线</td>\n</tr>\n<tr>\n<td>5. 复测对照</td>\n<td>与基线同口径的对照表、曲线（如适用）、负结果如实入表</td>\n</tr>\n<tr>\n<td>6. 结论</td>\n<td>假设成立与否、保留/回滚决定、回滚方案（触发条件 + 动作 + 验证）</td>\n</tr>\n<tr>\n<td>7. 成本账</td>\n<td>干预前后的单位成本折算（第五节模型）、敏感性说明、口径声明</td>\n</tr>\n</tbody>\n</table>\n<p><strong>评分量规（五项各 20 分，总分 100；结课通过线 60，单项否决线见注）</strong>：</p>\n<table>\n<thead>\n<tr>\n<th>评分项</th>\n<th>满分标准</th>\n<th>典型扣分</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>基线完整性（20）</td>\n<td>四要素齐全、负载源自真实画像、环境快照可复现、基线数据归档</td>\n<td>用 bench 随机负载冒充画像；缺判定标准；样本量不足以稳定分位数</td>\n</tr>\n<tr>\n<td>单变量纪律（20）</td>\n<td>全程单变量；变更生效有日志级验证；双机一致有 diff 证据（或降级口径声明完整）</td>\n<td>多变量齐动且无法归因（<strong>本项低于 8 分，作品直接不通过</strong>）；改了参数却没验证生效</td>\n</tr>\n<tr>\n<td>证据等级（20）</td>\n<td>结论每个数字可溯源到基线/复测原表；定位结论有 C1 层级证据或日志字段支撑；负结果如实记录</td>\n<td>只报平均值不报分位数；拿厂商自报数据当自家证据；结论与表中数据对不上</td>\n</tr>\n<tr>\n<td>成本账（20）</td>\n<td>用第五节模型完整折算、假设逐项标注、与外部价格对比时附口径声明</td>\n<td>漏算人力或摊销；直接与云价/厂商锚点比大小不做口径拆解</td>\n</tr>\n<tr>\n<td>回滚方案（20）</td>\n<td>触发条件量化、动作可执行（含 15 分钟重启成本的时间预算）、回滚后验证步骤明确</td>\n<td>只写「不行就回滚」无触发线；回滚动作依赖窗口外资源</td>\n</tr>\n</tbody>\n</table>\n<p>报告评审方式建议：小组互评一轮（按量规打分并写依据）+ 讲师复核否决项。<strong>这份报告同时是本模块的归档资产</strong>：通过评审的报告按第一阶段的基线归档纪律存档，作为现行服务的调优基线 v1，后续任何调参先查它。</p>\n<h2 id=\"_6\">八、常见坑清单</h2>\n<ol>\n<li><strong>为压测调参</strong>：对着 bench 负载把参数调到最优，上线面对真实画像全不适用——bench 的随机 prompt 连前缀命中都是 0%（第二节）。防法：基线负载必须来自画像，bench 只做工具验证。</li>\n<li><strong>画像缺失或过期</strong>：拿三个月前的流量结构定今天的目标；或拿全天混合数据掩盖双峰。防法：画像标窗口期、分时段、分业务，分位数与直方图优先于平均数。</li>\n<li><strong>多变量齐动</strong>：一次改三个参数，指标变好了不知道是谁的功劳、变差了不知道回滚哪个。防法：第六节第三步的单变量纪律 + 变更生效验证；攒批改参不等于同时改参，是一批排队逐个过闭环。</li>\n<li><strong>拿平均值汇报</strong>：平均 TTFT 达标、P99 已经炸穿，平均值把长尾藏了起来。防法：分位数口径是第一阶段就立的纪律，本讲量规直接扣分。</li>\n<li><strong>成本账漏项</strong>：只算电费得出「自建真便宜」，或只算硬件不算人，得出任何想要的结论。防法：三项成本逐项列示，缺项必须写明「未计入」及原因。</li>\n<li><strong>口径不齐硬比价</strong>：拿自家满负荷理论成本比云厂商谷价、拿厂商的收入数字当成本锚点。防法：5.3 的口径表先过一遍再开口。</li>\n<li><strong>只调参数不治负载</strong>：输出长度失控、prompt 头部拼随机字段打掉前缀命中——负载侧的问题用引擎参数硬扛，事倍功半。防法：第四节 4.3 与第三节第二层，调优先问负载能不能治。</li>\n<li><strong>变更不留痕、无回滚点</strong>：参数改完没记录、脚本没备份，出事只能凭记忆复原；《MTP 实测总结》的双机不一致教训就是留痕缺失的变体。防法：变更单 + 双份备份 + diff，写进量规否决项。</li>\n<li><strong>窗口纪律松弛</strong>：在业务高峰动生产参数、在维护窗口里留半成品状态。防法：第六节附加纪律，窗口内闭环、不过夜。</li>\n<li><strong>负结果不入档</strong>：只汇报调好了的，失败的干预从记录里消失，下一任重复踩坑。防法：第四步纪律，负结果与正结果同表入档。</li>\n</ol>\n<h2 id=\"c_1\">九、课后练习、延伸阅读与模块 C 收官</h2>\n<p><strong>课后练习</strong></p>\n<ol>\n<li><strong>画像练习</strong>：给定一份脱敏的周期日志节选（讲师提供），提炼四组分布并写出两个候选调优目标，各注明它们分别由画像的哪个形态支持。</li>\n<li><strong>成本敏感性练习</strong>：在 5.2 的模型上，分别把利用率换成 20%、摊销年限换成 3 年、人力换成每月 8 小时，重算单位成本并指出哪个变量的杠杆最大、为什么。</li>\n<li><strong>反面案例练习</strong>：给一份「多变量齐动 + 平均值汇报 + 漏算人力」的伪调优报告（讲师提供），按第七节量规逐项打分并写明扣分依据。</li>\n</ol>\n<p><strong>延伸阅读（逐条标来源）</strong></p>\n<ul>\n<li>公司自有《MTP 实测总结-2026-10-13》（<code>~/workspace/goals/dgx-spark/files/</code>）——闭环五步的完整实测范式：假设、A/B、日志自检、回滚与恢复全程留痕，写作前必读。</li>\n<li>公司压测方案 <code>~/workspace/your_files/qwen38-flash-bench/BENCH-PLAN.md</code>——拐点实测基线、恒压方法（10 分钟恒压看排队与稳定性）与压测纪律，第四、五节的数字锚点出处。</li>\n<li>第一阶段技术轨第 3 周讲义《压测与运维》——压测四要素、指标体系、变更纪律与压测报告模板，本讲基线与报告格式的底座。</li>\n<li>Datawhale Happy-LLM 扩展章《用 vLLM 实现 s1 模型的 Thinking Budget 控制》（materials-advanced/datawhale/03，CC BY-NC-SA 4.0）——输出长度治理的完整代码案例，注意其结果分析节对强行续写翻车的如实记录。</li>\n<li>LMDeploy 官方《PyTorch 引擎 Profiling》（materials-advanced/internlm/03，上海人工智能实验室，Apache-2.0）——C1 工具链的对照系，闭环里需要引擎级证据时回看。</li>\n<li>DeepSeek 官方技术报告（V4.1 Flash 推理系统，2026-10）——5.3 厂商锚点的出处；阅读时对照口径表，重点看其分阶段并行与负载均衡的系统级取舍（与 B1 第六节呼应），数据为官方自报。</li>\n<li>vLLM 官方文档（调度与性能相关章节）——请求优先级、抢占策略等引擎能力的定版口径，开课当周复核，本讲不预设结论的部分以其为准。</li>\n</ul>\n<p><strong>模块 C 收官小结</strong>（Muse 整理）：C1 教你把瓶颈找到，C2 教你把改进做完并算清账。两讲合起来是一条完整的工作链：画像立参照、定位给证据、闭环做干预、成本定价值。走完这个模块，你手里应该有三样东西：一幅现行服务的真实负载画像、一份达到量规线的调优报告、一套能复算的单 token 成本模型——它们既是结课作品，也是现行服务后续所有调优工作的起点基线。下一模块 D 将下潜到这条链的底层：GPU 与互联、CUDA 与 NCCL、GB10 统一内存——回答「天花板本身是怎么来的」。</p>"}, {"num": "D1", "ch": "进阶 D · 底层架构", "label": "D1 从零搭建与架构演进", "title": "进阶 D1：从零搭建大模型与架构演进", "html": "<h1 id=\"d1\">进阶 D1：从零搭建大模型与架构演进</h1>\n<blockquote>\n<p>讲次：第二阶段进阶专题 · 模块 D（底层架构）第 1 讲\n建议时长：2.5–3 小时（含实操）\n前置：第一阶段技术轨第 1 周（最小 Transformer 与三笔账）、进阶 B1/B2（引擎与量化）、C1（Roofline 判读）\n素材来源：Datawhale Happy-LLM 第五章《动手搭建大模型》（存档 <code>datawhale/02</code>，CC BY-NC-SA 4.0）、Datawhale So Large LM 第 4 章《新的模型架构》与第 6 章《模型训练》相关部分（存档 <code>datawhale/08</code>、<code>datawhale/06</code>）、第一阶段技术轨第 1 周讲义（自有）、进阶 B2 讲义（自有）；DeepSeek V4.1 架构细节为公开报道口径，逐处标注。教学组织与算账演练为 Muse 整理。</p>\n</blockquote>\n<hr />\n<h2 id=\"_1\">一、学习目标与本讲地图</h2>\n<p>结论先行：<strong>现代大模型的架构史，就是一部「为成本让路」的历史——每一次零件升级，省的都是 KV、搬运或激活参数中的一笔。</strong> 本讲把第一周那个最小 Transformer 逐件换成现代零件，换一件、算一笔账。</p>\n<p>学完本讲，你应当能：</p>\n<ol>\n<li><strong>复述全套零件</strong>：对着一个现代 decoder-only 模型的配置表，逐件说清每个零件解决什么问题、代价是什么；</li>\n<li><strong>手算三本账</strong>：给定架构配置，手算总参数量、每 token 的 KV 大小、单步 decode 的权重搬运量，并与代码/日志实测互证；</li>\n<li><strong>讲清四条演进线</strong>：Dense→MoE、MHA→GQA/MLA、位置编码演进、滑动窗口混合注意力——每条都落到对 KV、激活参数、带宽的实际影响；</li>\n<li><strong>读懂新架构报道</strong>：面对「某新模型换了个架构」类新闻，能分清哪些是已证实的机制、哪些是报道口径、哪些是营销话术。</li>\n</ol>\n<p>本讲地图：回炉（第二节）→ 从零搭建全走读（第三节）→ 架构演进线（第四节）→ 成本账演练（第五节）→ 前沿一瞥（第六节）→ 实操对照（第七节）。</p>\n<h2 id=\"transformer\">二、回炉：第一周的最小 Transformer，还差什么</h2>\n<p>第一周我们在 Colab 里写过一个字符级 GPT（配置：<code>n_layer=4, n_head=4, n_embd=128, block_size=128</code>，词表是 65 个字符）。它的组件清单是（第一周讲义，自有）：</p>\n<table>\n<thead>\n<tr>\n<th>组件</th>\n<th>一句话职责</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Token Embedding</td>\n<td>把 token ID 变成向量，是模型查的「字典」</td>\n</tr>\n<tr>\n<td>位置编码（可学习绝对位置）</td>\n<td>告诉模型每个 token 排第几</td>\n</tr>\n<tr>\n<td>多头自注意力（MHA）</td>\n<td>token 之间交换信息：Q 打分、按分数吸收 V</td>\n</tr>\n<tr>\n<td>FFN（两层 MLP，4 倍升维）</td>\n<td>每个 token 独立「消化」信息，知识主要存这里</td>\n</tr>\n<tr>\n<td>LayerNorm + 残差</td>\n<td>让深层网络训得动</td>\n</tr>\n<tr>\n<td>LM Head</td>\n<td>把向量变回词表上的概率分布，采样出下一个 token</td>\n</tr>\n</tbody>\n</table>\n<p>这套骨架和今天生产的模型<strong>同构</strong>——Transformer 的基本盘十年没变。差距全在零件的代际上：</p>\n<ul>\n<li>位置编码：可学习绝对位置 → <strong>RoPE</strong>（决定上下文外推能力）；</li>\n<li>归一化：LayerNorm 后置 → <strong>RMSNorm 前置（Pre-Norm）</strong>（决定深层训练稳定性）；</li>\n<li>注意力：MHA 每头一份 KV → <strong>GQA 分组共享 KV</strong>（决定 KV Cache 大小）；</li>\n<li>FFN：单个大 MLP → <strong>门控 SwiGLU</strong>，再到 <strong>MoE 多专家</strong>（决定参数量与激活量的解耦）；</li>\n<li>词表：65 个字符 → <strong>十万级 BPE 词表</strong>（决定 embedding 占比与分词效率）。</li>\n</ul>\n<p>本讲就是把这五处升级逐件拆开。提醒一句学习纪律（Muse 整理）：<strong>只抄结构不算账，等于没学</strong>——每个零件后面都跟着它省了或花了哪笔账，这正是模块 D 和前面模块 B、C 的分界线：前面学「怎么用、怎么调」，这里学「为什么长这样」。</p>\n<h2 id=\"happy-llm-llama\">三、从零搭建全走读：Happy-LLM 第五章的类 LLaMA 实现</h2>\n<p>本节以 Happy-LLM 第五章为准走读（存档 <code>datawhale/02</code>）。该章从零实现了一个 LLaMA2 风格模型，示例配置为：<code>dim=768, n_layers=12, n_heads=16, n_kv_heads=8, vocab_size=6144, max_seq_len=512</code>，代码实测总参数 <strong>82,594,560（约 82.6M）</strong>——这个数字先记住，第五节我们用手算把它验出来。</p>\n<h3 id=\"31-modelconfig\">3.1 配置即架构：先读 ModelConfig</h3>\n<p>现代模型的「架构」落到工程上就是一张配置表。第五章的 <code>ModelConfig</code> 里几个字段值得先点名（原文口径）：<code>dim</code>（模型维度）、<code>n_layers</code>（层数）、<code>n_heads</code>（注意力头数）、<code>n_kv_heads</code>（键值头数，<strong>与 n_heads 分开设</strong>——这是 GQA 的开关）、<code>multiple_of</code>（FFN 隐藏维度对齐的倍数）、<code>flash_attn</code>（是否用 Flash Attention）。读任何开源模型的 config.json，先找这几项，架构的大样就有了。</p>\n<h3 id=\"32-rmsnorm-pre-norm\">3.2 归一化：RMSNorm 与 Pre-Norm 的摆法</h3>\n<p>第五章实现的 RMSNorm 公式为：只用均方根做缩放，不减均值、不带偏置，再乘可学习增益 γ（原文公式与代码）。它相对 LayerNorm 省掉的是均值计算与偏置参数，收益不在参数量（每层就 dim 个增益参数，可忽略），而在<strong>计算更简、数值行为更可控</strong>。</p>\n<p>更重要的是摆法：第五章的 DecoderLayer 是</p>\n<pre><code>h   = x + Attention(RMSNorm(x))\nout = h + FFN(RMSNorm(h))\n</code></pre>\n<p>即归一化放在每个子层<strong>之前</strong>（Pre-Norm），残差通路本身不经过任何归一化。解决的问题：几十上百层堆叠时梯度能沿残差通路直达浅层，训练稳定性显著好于把归一化放在子层之后的 Post-Norm 老摆法——这是模型敢堆到上百层的前提之一。代价：几乎没有，所以现代模型几乎全员 Pre-Norm + RMSNorm。</p>\n<h3 id=\"33-rope-gqa\">3.3 注意力：RoPE + GQA，一次装齐两个现代零件</h3>\n<p>第五章的 Attention 里有两处与第一周最小实现的本质差异：</p>\n<p><strong>RoPE（旋转位置编码）</strong>。代码用 <code>precompute_freqs_cis</code> 预计算每个位置、每个头维度上的旋转角（以复数形式），把 Q、K 向量按位置两两配对旋转。注入方式从「加一个位置向量」变成「按位置旋转向量」：好处是注意力分数天然只依赖相对距离，且不占额外参数；它决定外推行为——训练长度之外的位置是旋转角没见过的区域，这就是第一周讲过的「标称上下文 ≠ 好用上下文」的机制根源。</p>\n<p><strong>GQA（分组查询注意力）</strong>。配置里 <code>n_kv_heads=8 &lt; n_heads=16</code>：16 个 Q 头分成 8 组，每组 2 个 Q 头共享同一份 K、V；代码用 <code>repeat_kv</code> 在计算时把 KV 复制展开对齐 Q 头。它解决的问题只有一个——<strong>KV Cache 太大</strong>：KV 的量正比于 KV 头数，减半 KV 头，KV 就减半，计算量几乎不变。代价是 K/V 的表达多样性下降，所以它是可调旋钮：<code>n_kv_heads = n_heads</code> 退化为 MHA，<code>=1</code> 是 MQA（最省、质量损失最明显），中间是 GQA。原文亦注明：LLaMA2 家族里只有 70B 款用了 GQA，教程实现是主动选了 GQA 来教——正好说明 GQA 在当时已是「值得默认打开」的选项。</p>\n<p>走读完注意力，顺手把配置里那个 <code>flash_attn</code> 开关说清（Muse 整理）：Flash Attention 不是新架构，而是注意力的<strong>实现方式</strong>——把 QK^T 的大矩阵分块在片上 SRAM 里算完、配合在线 softmax 技巧，避免把完整的注意力分数矩阵写回显存。它不改变任何数学结果，省的是中间结果的显存占用与搬运（长序列时这笔账非常大）。记住这条分界线：<strong>本讲讲的零件分两类，改数学的（RoPE、GQA、SwiGLU）和只改实现的（Flash Attention）</strong>——后者在 B1 已从引擎侧见过，这里从模型侧再认一次；面试与评审时把两者混为一谈，是常见的露怯点。</p>\n<h3 id=\"34-ffnswiglu-4\">3.4 FFN：SwiGLU 门控与「4 倍再打三分之二折」</h3>\n<p>第五章的 MLP 不是第一周的两层 ReLU MLP，而是三矩阵的门控结构（原文代码）：</p>\n<pre><code>FFN(x) = W2( SiLU(W1·x) ⊙ (W3·x) )\n</code></pre>\n<p>W3 给出一路「门」，与 SiLU 激活的 W1 路逐元素相乘，再经 W2 降维。解决的问题是表达力与梯度流（门控让网络能学会「这部分信息放行多少」）。注意隐藏维度的定法（原文口径）：先取 4×dim，再乘 2/3，最后向上对齐到 <code>multiple_of</code> 的倍数——为什么打折？因为三矩阵结构比两矩阵多了一整块参数，4 倍 ×2/3 是在<strong>保持参数量与传统 4 倍两层 MLP 大致相当</strong>的前提下换结构：一层 FFN 参数 ≈ 3 × dim × hidden ≈ 3 × d × (8d/3) = 8d²，与第一周讲的「FFN 约 8d²/层」正好接上。代价：实现与显存访问模式比两层 MLP 稍复杂，仅此而已。</p>\n<h3 id=\"35-lm-head\">3.5 组装与采样：LM Head 不神秘</h3>\n<p>DecoderLayer 堆 12 层，前面接 Embedding、最后接一层 RMSNorm 与 LM Head（输出到词表维度的线性层），采样在 logits 上做 top-k/softmax（原文 5.1.6 的生成代码）。两个工程点值得点名：</p>\n<ul>\n<li><strong>Embedding 的账开始显形</strong>：示例词表只有 6144，embedding 是 6144×768 ≈ 4.7M，占总参约 5.7%；换成十万级词表、dim 不变，embedding 立刻变成第一大件——词表大小是架构成本账里最容易被漏算的一项（第五节细算）。另一个常见省参做法是 <strong>权重绑定</strong>：LM Head 与 Embedding 共用同一张表（第五节验算能对上总数，靠的正是只算一份），小模型上几乎默认，大模型上则两种流派都有，读配置时看 <code>tie_word_embeddings</code> 字段即可（Muse 整理）。</li>\n</ul>\n<p><strong>分词器是架构的一部分，不是预处理杂活</strong>（原文 5.2）。第五章把分词器分三档讲透：整词级（词表爆炸、未登录词无解）、字符级（词表最小、但序列被拉长数倍）、子词级 BPE（在字符上不断合并最高频相邻对，词表大小可控、高频词整进、生僻词拆得开，当代标准答案）。词表大小是一笔双向账：<strong>词表越大，同一句话的 token 越少（序列短、KV 与计算省），但 Embedding 与 LM Head 越大（参数贵）</strong>；词表越小则相反。今天主流模型十万级词表，就是在这笔账上取的平衡点——这也解释了为什么「换分词器」从来不是小事：它同时动序列长度、参数量与多语言成本（第一周的 token 估算习惯，其源头在这里）。\n- <strong>5.2/5.3 节是配套的完整闭环</strong>：第五章后半训练了一个 BPE 分词器（词→字符→子词三档对比，原文 5.2），并用这套实现跑了小模型的预训练 + SFT + 生成全流程（原文 5.3）。实操环节我们就走这条线（第七节）。</p>\n<h2 id=\"_2\">四、架构演进线：四次「为成本让路」</h2>\n<h3 id=\"41-dense-moe\">4.1 Dense → MoE：总参数与激活参数解耦</h3>\n<p><strong>机制</strong>（So Large LM 第 4 章，存档 <code>datawhale/08</code>）：把每层的单个 FFN 换成 E 个专家 FFN，加一个门控（router）为每个 token 选 top-k 个专家（原文以 top-2 为经典口径），其余专家不算、也不搬。原文追溯得很清楚：稠密门控不省计算，<strong>稀疏化（只取 top-k、其余置零）才是省计算的关键一步</strong>；随之而来的工程命门是负载均衡——专家被选次数严重不均时，没被选中的专家拿不到梯度、永远练不出来，所以要有容量系数与负载均衡辅助损失（原文给出 load-balancing loss 的构成），这正是进阶 A1 讲 EPLB 时的理论源头。</p>\n<p>门控还要处理一个脏活：<strong>容量与溢出</strong>（原文口径）。每个专家每批能处理的 token 有上限（容量 = 平均量 × 容量系数，原文示例取 2），超出的 token 走残差旁路跳过该层专家——宁可这个 token 少加工一次，也不能让热门专家把整批训练拖垮或直接丢 token。这是 MoE 与 Dense 的一个气质差异：Dense 的计算图是确定的，MoE 的计算图带一点「调度系统」的味道，容量、均衡、溢出策略都是架构参数的一部分。</p>\n<p><strong>账</strong>（Muse 整理，接 B2 账法）：</p>\n<ul>\n<li>总参数：FFN 部分 ≈ ×E 倍增长——容量（知识总量）上去了；</li>\n<li>激活参数：每 token 只走 k 个专家，FFN 激活量 ≈ Dense 的 k/E；</li>\n<li>decode 搬运：按激活参数算，所以 MoE 能用 Dense 的搬运量扛起数倍的总参数；</li>\n<li>KV：<strong>完全不变</strong>——MoE 只动 FFN，不动注意力。这是初学者最常算错的一笔（第八节坑清单）；</li>\n<li>新代价：路由与负载均衡、专家并行的 all-to-all 通信（A1 已讲）、推理时全部权重仍要在内存里（体积按总参数算，第一周口径）。</li>\n</ul>\n<p><strong>锚点数字</strong>（So Large LM 第 4 章原文口径）：GLaM 总参数 1.2T、每 token 激活 95B（约 8%），训练成本约为 GPT-3 的 1/3；Switch Transformer 用 top-1 做到 1.6T。公司在跑的 Qwen3.8-Flash-Next 是同一逻辑的当代版本：总 125B、每步激活约 6B（B2 讲义口径）。</p>\n<h3 id=\"42-mha-gqa-mlakv\">4.2 MHA → GQA → MLA：KV 压缩的三级台阶</h3>\n<p>KV 大小公式（第一周已学）：每 token KV = 2（K 和 V）× 层数 × KV 头数 × 每头维度 × 每元素字节数。演进就是逐项压这个乘积：</p>\n<ul>\n<li><strong>第一级 MQA/GQA</strong>：压「KV 头数」。GQA 已在 3.3 讲透；MQA 把 KV 头压到 1，KV 降到 MHA 的 1/n_heads，质量代价最大，一般只在极端吞吐场景用。</li>\n<li><strong>第二级 MLA（多头潜在注意力）</strong>：压的思路换了一维——不再存每头完整的 K、V，而是把 KV 压成一个低维潜向量存下来，用时再投影还原（机制为 Muse 整理，源自 DeepSeek 公开的 MLA 设计）。账面上每 token 只存潜向量维度（远小于 头数×头维度），KV 可以再降一个量级；代价是解码时多一步还原计算，且与 RoPE 的结合需要额外设计（位置部分单独处理）。它和 GQA 的区别要分清：GQA 是「少存几份」，MLA 是「存压缩包」。</li>\n<li><strong>共同的账</strong>：KV 降下来，长上下文才装得下、并发才上得去（B1 讲的 KV 容量与 C2 的长上下文调优都是在花这笔省下的钱）；精度风险则从「权重」转移到了「缓存」——这也是 B2 把 KV 量化单列一节的原因。</li>\n</ul>\n<p>拿第五章的示例配置把第一级台阶算实（Muse 整理）：每 token KV = 2 × 12 层 × KV 头数 × 48 × 2B（BF16）。GQA（8 头）= 18,432 B ≈ <strong>18 KB/token</strong>；若退回 MHA（16 头）则翻倍到约 36 KB/token。示例模型 max_seq_len 只有 512，差别不过几 MB，不痛不痒；把同样的比例放回生产模型——层数、头数、上下文一起放大两个数量级——GQA 省下的就是几十 GB 级的显存与实打实的并发数。<strong>架构零件的价值永远要放到目标规模上算</strong>，这是本讲反复出现的一句话。</p>\n<h3 id=\"43\">4.3 位置编码演进：从「背位置」到「转角度」</h3>\n<ul>\n<li><strong>可学习绝对位置</strong>（第一周最小实现与早期 GPT）：每个位置一个向量，简单直接；硬伤是训练长度之外的位置向量根本没训过，外推即崩。</li>\n<li><strong>RoPE</strong>（3.3 已走读）：相对距离由旋转角差天然给出，无额外参数，成为当代默认。</li>\n<li><strong>长上下文外推</strong>：RoPE 之后的故事主线是「怎么让训短的模型用长」——调整旋转频率基数、在推理时做角度缩放等一族办法（概念层，Muse 整理）。直觉是：旋转角的「刻度盘」是按训练长度标定的，盘外的位置角速度对不上；缩放类办法相当于把刻度盘整体拉长重标，代价是近距离分辨率被摊薄，所以外推后的长上下文往往「能读完、读不细」。这也解释了当代模型的另一种选择：干脆用长序列数据原生训练（把外推问题变成数据与算力问题），两种路线在新模型发布时都会见到，读报道时先分清是哪一种。工程结论不变：<strong>外推是补救不是原生</strong>，评估长上下文能力要看有效长度而非标称长度（C2 已立此口径）。</li>\n<li><strong>对成本的影响</strong>：位置编码本身几乎不花参数与带宽，它的账记在「可用上下文长度」上——通过决定 KV 要为多长序列付账，间接决定显存总账。</li>\n</ul>\n<h3 id=\"44-swa\">4.4 SWA 混合注意力：给全注意力分段限流</h3>\n<p>滑动窗口注意力（SWA）：每个 token 只看前面固定窗口 w 个 token，KV 每层只需保留窗口大小——长序列下 KV 不再随长度线性增长。纯 SWA 的问题是远距离信息传不回来，所以当代做法是<strong>混合</strong>：多数层 SWA + 少数层全注意力，兼顾局部效率与全局通路（机制为 Muse 整理）。账：SWA 层的 KV/token 被窗口 w 封顶，全注意力层照旧；混合比就是成本与能力的旋钮。这一零件在 B1/B2 已以 DeepInfer 的 SWA Bounded Replay 形式出现过（解码端只重放末尾一小段重建窗口状态）——同一思想在架构侧与引擎侧的两次现身，第六节还会再遇到它。</p>\n<h3 id=\"45-muse\">4.5 演进总表（Muse 整理）</h3>\n<table>\n<thead>\n<tr>\n<th>演进</th>\n<th>动了哪个零件</th>\n<th>省/换的是哪笔账</th>\n<th>代价</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dense → MoE</td>\n<td>FFN</td>\n<td>总参数 ↑、激活与搬运 ≈ 不变（按 k/E）</td>\n<td>路由均衡、通信、内存按总量付</td>\n</tr>\n<tr>\n<td>MHA → GQA</td>\n<td>注意力 KV 头</td>\n<td>KV 按分组比下降</td>\n<td>K/V 表达多样性下降</td>\n</tr>\n<tr>\n<td>GQA → MLA</td>\n<td>注意力 KV 存法</td>\n<td>KV 再降一个量级（存潜向量）</td>\n<td>解码多一步还原、设计复杂</td>\n</tr>\n<tr>\n<td>绝对位置 → RoPE</td>\n<td>位置注入</td>\n<td>零参数、相对距离天然化</td>\n<td>原生外推仍有限，需缩放补救</td>\n</tr>\n<tr>\n<td>全注意力 → SWA 混合</td>\n<td>注意力范围</td>\n<td>SWA 层 KV 被窗口封顶</td>\n<td>远距离通路靠少数全注意力层兜底</td>\n</tr>\n<tr>\n<td>LayerNorm 后置 → RMSNorm 前置</td>\n<td>归一化</td>\n<td>训练稳定性（深层可堆）</td>\n<td>近乎无（当代默认）</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"_3\">五、架构选择的成本账：手算三本账</h2>\n<p>方法承接第一周与 B2/C1（Muse 整理）：<strong>参数量决定体积、KV 决定上下文容量、激活参数决定 decode 搬运</strong>。三本账的公式：</p>\n<ul>\n<li>总参数 ≈ Σ每层（注意力 + FFN） + Embedding（+ LM Head，未绑定时另计一份）；</li>\n<li>每 token KV = 2 × 层数 × KV 头数 × 每头维度 × 字节数（MLA/SWA 架构按 4.2/4.4 修正）；</li>\n<li>decode 每步搬运 ≈ 激活参数 × 权重字节数（MoE 按激活量，Dense 按总量），步时下限 = 搬运量 ÷ 实测带宽（GB10 取 225 GB/s，公司实测口径）。</li>\n</ul>\n<h3 id=\"51-826m\">5.1 验算：把第五章的 82.6M 手算出来</h3>\n<p>用 3.1 的示例配置（dim=768，12 层，16 头/8 KV 头，head_dim=48）：</p>\n<ul>\n<li>注意力/层：Wq 768×768 + Wk 768×384 + Wv 768×384 + Wo 768×768 = 1,769,472；</li>\n<li>FFN/层：hidden = 4×768×(2/3) = 2048（已对齐 64），3 × 768 × 2048 = 4,718,592；</li>\n<li>每层合计 ≈ 6.49M，×12 层 ≈ 77.9M；Embedding 6144×768 ≈ 4.72M；</li>\n<li><strong>总计 ≈ 82.6M —— 与代码实测的 82,594,560 对得上</strong>（差异在归一化增益等零头）。</li>\n</ul>\n<p>这一验算的价值不在数字本身：以后拿到任何模型的 config，你能在五分钟内判断官方标称参数量有没有水分、embedding 占比是否异常。</p>\n<h3 id=\"52\">5.2 演练题（课堂完成，答案要点附后）</h3>\n<p><strong>题目</strong>：某 Dense 模型配置：dim=2048，层数 24，注意力头 16、KV 头 4（head_dim=128），FFN 隐藏维度 5504（SwiGLU 三矩阵），词表 64,000，权重与 KV 均按 BF16。</p>\n<ol>\n<li>手算总参数量（LM Head 与 Embedding 绑定）；</li>\n<li>手算每 token 的 KV 大小；若上下文 128K，单条序列 KV 占多少？</li>\n<li>估算单流 decode 的步时下限（带宽取 225 GB/s），并指出这笔账里没算什么；</li>\n<li>若把 FFN 换成 8 专家 top-2 的 MoE（其余不变），重算第 1、3 问，并说明第 2 问为什么不变。</li>\n</ol>\n<p><strong>答案要点</strong>：</p>\n<ol>\n<li>注意力/层 = 2048×2048（Wq）+ 2×2048×512（Wk、Wv）+ 2048×2048（Wo）= 10,485,760；FFN/层 = 3×2048×5504 = 33,816,576；每层 ≈ 44.3M ×24 ≈ 1.063B；Embedding = 64,000×2048 ≈ 0.131B；<strong>总计约 1.19B</strong>（1.2B 级）。</li>\n<li>KV/token = 2 × 24 × 4 × 128 × 2B = 49,152 B ≈ <strong>48 KB/token</strong>；128K 序列 ≈ 48KB × 131,072 ≈ <strong>6.4 GB/条</strong>——这就是长上下文先爆 KV 而不是先爆权重的道理。</li>\n<li>搬运 ≈ 1.19B × 2B ≈ 2.4 GB，步时下限 ≈ 2.4GB ÷ 225GB/s ≈ <strong>10.6 ms（约 94 tok/s 上限）</strong>；没算的：KV 搬运（长上下文时不可忽略）、kernel 启动等固定开销（C1 的结论：实测步时只会比下限大）。</li>\n<li>MoE 化：FFN 总参数 ×8 → 总参数 ≈ 0.38B（注意力+Embedding）+ 24×33.8M×8 ≈ <strong>6.9B</strong>；每步激活 FFN ≈ top-2 的量，搬运 ≈ (0.38B + 24×33.8M×2) × 2B ≈ 4.0 GB → 步时下限 ≈ 18 ms——注意总参数涨了近 6 倍，步时只涨了不到 1 倍，这正是 MoE 的全部意义；KV 不变，因为注意力没动。</li>\n</ol>\n<h3 id=\"53-125b-moe-nvfp4\">5.3 反着用：从账反推公司的 125B 为什么必须是 MoE + NVFP4</h3>\n<p>三本账不只能验算，还能反推架构选择。用公司现行模型做一遍（数字均为 B2 已标注口径，Muse 整理）：</p>\n<ul>\n<li>若 125B 做成 Dense + BF16：权重 250 GB，双机总内存 243 GB 都装不下——<strong>Dense 路线在门口就被体积账否决</strong>；</li>\n<li>做成 MoE（总 125B、激活约 6B）+ BF16：体积仍是 250 GB，还是装不下——<strong>只 MoE 不量化也不行</strong>；</li>\n<li>MoE + NVFP4（约 0.5 字节/参数）：权重约 62.5 GB（与服务日志实测 61.73 GiB 互证），单台 128 GB 装得下且留出 KV 余量；decode 搬运按激活 6B 算约 3 GB/步，落在 GB10 的带宽账内——<strong>两个零件叠加，账才平</strong>。</li>\n</ul>\n<p>这就是读架构的正确姿势：任何「为什么用 MoE、为什么上 FP4」的问题，先摆三本账，答案多半自己浮出来；浮不出来的，才是真正的技术争议点。</p>\n<h2 id=\"-\">六、前沿一瞥：编码器-解码器混合与「记忆外置」（公开报道口径，只观察不定论）</h2>\n<p>本节全部事实来自公开报道（2026-09 至 10 月的模型发布报道与 DeepInfer 开源材料），<strong>不是论文定论</strong>，请按「公开报道口径」引用，不要写进对外材料当事实。</p>\n<p>DeepSeek V4.1-Flash 的公开架构信息（报道口径）：552B 总参数的多模态 MoE，Prefill 激活约 8B、Decode 激活约 16B；架构上把 40 层拆成 20 层因果编码器 + 20 层解码器的 <strong>CED（因果编码器-解码器）</strong> 结构，解码器不自算全局 KV、而是派生自编码器末层状态，报道称 Prefill 计算近减半；注意力用 CSA2（压缩稀疏注意力 2 代），KV 压到约 <strong>890 字节/token</strong>；解码器每层带 128 token 窗口的 SWA，其状态靠重放末尾一小段重建——就是 B1/B2 讲过的 SWA Bounded Replay；另有 Engram 条件记忆组件（有报道给出 196B 参数量，口径不一）。</p>\n<p>把这条新闻放回本讲的坐标系看（Muse 整理）：</p>\n<ul>\n<li>CED 是「编码器-解码器」这个老范式（So Large LM 第 6 章的第三类模型，存档 <code>datawhale/06</code>）在 decoder-only 主导十年后的回潮，动的账是 Prefill；</li>\n<li>CSA2 与 890 B/token 是 4.2 节 KV 压缩线的延续——比 GQA/MLA 再往前一步的「压缩 + 稀疏」组合；</li>\n<li>Engram 这类「把记忆做成可寻址的外部参数」与 So Large LM 第 4 章后半的<strong>基于检索的模型</strong>（RAG/RETRO，存档 <code>datawhale/08</code>）是同一思想脉络的当代变体：参数不必全靠「背」，可以「查」；</li>\n<li>观察结论只到这里为止：<strong>方向可信（每笔账都对得上本讲的成本逻辑）、细节待论文与开源代码证实</strong>。这也是读一切新架构新闻的方法——先对账，再决定信几分。</li>\n</ul>\n<h2 id=\"_4\">七、实操：跑通第五章，与第一周实现做结构对照</h2>\n<p><strong>环境</strong>：Colab（AI Pro，优先）或单台 Spark（注意：Spark 上跑 GPU 实验前需按既有纪律停 <code>vllm-fn</code> 容器腾内存，跑完恢复；本实操模型小，CPU/GPU 均可，Colab 免费档亦可）。</p>\n<p><strong>步骤</strong>：</p>\n<ol>\n<li>取 Happy-LLM 第五章代码（仓库 datawhalechina/happy-llm 第五章），按 5.1 节顺序组装：ModelConfig → RMSNorm → Attention → MLP → DecoderLayer → 完整模型；</li>\n<li>用示例配置实例化，打印总参数量，与 5.1 节的手算 82.6M 互证（对不上先查哪层算错，不许跳过）；</li>\n<li>跑通 5.3 的最小闭环：用自带小数据走一遍预训练若干步 + 生成一段文本（能出连贯字符即可，不追效果）；</li>\n<li><strong>对照笔记（本实操的核心产出）</strong>：把第一周的字符级 GPT 与本次实现逐件对照成表，每行写清「零件差异 → 对应的演进动机（第四节哪一条）」；</li>\n<li>选做：把 <code>n_kv_heads</code> 从 8 改到 16 与 1，各跑一次前向并记录 KV 张量形状变化，验证 4.2 的账。</li>\n</ol>\n<p><strong>零件差异对照表（模板，至少覆盖这六行）</strong>：</p>\n<table>\n<thead>\n<tr>\n<th>零件</th>\n<th>第一周最小实现</th>\n<th>第五章实现</th>\n<th>演进动机（对应第四节）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>位置编码</td>\n<td>可学习绝对位置</td>\n<td>RoPE</td>\n<td>4.3</td>\n</tr>\n<tr>\n<td>归一化</td>\n<td>LayerNorm（后置式简化实现）</td>\n<td>RMSNorm 前置</td>\n<td>3.2</td>\n</tr>\n<tr>\n<td>KV 头</td>\n<td>与 Q 头同数（MHA）</td>\n<td>n_kv_heads=8（GQA）</td>\n<td>4.2</td>\n</tr>\n<tr>\n<td>FFN</td>\n<td>两层 MLP + ReLU/GELU</td>\n<td>SwiGLU 三矩阵门控</td>\n<td>3.4</td>\n</tr>\n<tr>\n<td>词表</td>\n<td>65 字符</td>\n<td>BPE 子词（示例 6144）</td>\n<td>3.5</td>\n</tr>\n<tr>\n<td>注意力实现</td>\n<td>手写缩放点积</td>\n<td>Flash Attention 开关</td>\n<td>效率（B1 已讲）</td>\n</tr>\n</tbody>\n</table>\n<p><strong>验收标准</strong>：模型能实例化且参数量与手算互证；生成闭环跑通；对照表六行齐全且每行能<strong>口头讲出</strong>差异对应的账（验收时随机抽两行问）。</p>\n<h2 id=\"_5\">八、常见坑清单</h2>\n<ol>\n<li><strong>只抄结构不算账</strong>：能默写 LLaMA 结构图但说不出 KV 多大、搬运多少——本讲的验收方式就是防这个的；</li>\n<li><strong>把 MoE 总参数当激活参数</strong>（或反过来）：体积按总量、速度按激活量，混淆是部署翻车头号原因（第一周已立规矩，本讲再犯按没学过处理）；</li>\n<li><strong>以为 MoE 能省 KV</strong>：MoE 只动 FFN，KV 一分不少；长上下文爆内存先去查注意力侧；</li>\n<li><strong>演进名词与版本对不上</strong>：GQA 不是 LLaMA2 全系标配（原文注明只有 70B 款用了）、MLA 是 DeepSeek 的设计不是通用标准——引用架构特性时必须带模型与版本；</li>\n<li><strong>漏算 Embedding</strong>：十万级词表 × 大 dim 的 embedding 可以占到总参的一到两成，手算时第一个写它；</li>\n<li><strong>拿报道口径当定论</strong>：第六节的数字（890 B/token、激活 8B/16B 等）是公开报道口径，写进方案前要等论文/官方文档复核；</li>\n<li><strong>RoPE 外推迷信</strong>：标称支持的长度 ≠ 有效长度，位置编码换代也没改变这条（4.3）。</li>\n</ol>\n<h2 id=\"_6\">九、课后练习与延伸阅读</h2>\n<p><strong>练习</strong>：</p>\n<ol>\n<li>（算账）任选一个你熟悉的开源小模型（如 Qwen 系列 7B/8B 的 config），手算其总参数与 KV/token，与官方标称互证，写出差异来源；</li>\n<li>（读表）把第五节演练题的 MoE 变体再推进一步：若同时把 KV 头从 4 改到 2，重算第 2 问，并说明这笔账与 MoE 那笔为什么互不影响；</li>\n<li>（对照）用第七节的对照表模板，分析公司在跑的 Qwen3.8-Flash-Next：逐件指出它用了哪代零件（以 B1/B2 已标注口径为准，查不到的写「未公开」，不许猜）。</li>\n</ol>\n<p><strong>延伸阅读（逐条标来源）</strong>：</p>\n<ul>\n<li>Happy-LLM 第五章《动手搭建大模型》全文与代码（Datawhale，存档 <code>datawhale/02</code>）——本讲主干，实操代码出处；</li>\n<li>So Large LM 第 4 章《新的模型架构》（Datawhale，存档 <code>datawhale/08</code>）——MoE 的门控/均衡/容量全套推导与检索式模型的原始出处；</li>\n<li>So Large LM 第 6 章《模型训练》（Datawhale，存档 <code>datawhale/06</code>）——三类模型范式（decoder-only / encoder-only / encoder-decoder）与训练目标，第六节 CED 回潮的背景知识；</li>\n<li>第一阶段技术轨第 1 周讲义 第三至七节（自有）——三笔账的原始出处，本讲所有算账的公式来源；</li>\n<li>进阶 B2 讲义 第二、六节（自有）——搬运账与投机解码的口径，第五节步时下限的衔接；</li>\n<li>DeepInfer 仓库 README 与 DeepSeek V4.1 技术报告（DeepSeek 官方，2026-10-20 发布）——第六节报道口径的一手出处，阅读时注意区分「已开源可验证」与「报告自报」两类表述。</li>\n</ul>"}, {"num": "D2", "ch": "进阶 D · 底层架构", "label": "D2 GPU 互联与统一内存", "title": "进阶 D2：GPU 与互联——CUDA、NCCL 与 GB10 统一内存深挖", "html": "<h1 id=\"d2gpu-cudanccl-gb10\">进阶 D2：GPU 与互联——CUDA、NCCL 与 GB10 统一内存深挖</h1>\n<blockquote>\n<p><strong>讲次</strong>：第二阶段进阶专题 · 模块 D（底层架构）第 2 讲 · 全专题收官讲\n<strong>建议时长</strong>：2.5–3 小时（概念讲解约 120 分钟 + 实操约 60 分钟）\n<strong>前置</strong>：进阶 A1（并行策略全景与选型）、B1（引擎机制与现行服务配置）、C1（四层定位法、Roofline 判读、单流 decode 固定开销结论）；第一阶段技术轨第 1 周的带宽账\n<strong>素材来源</strong>：概念口径以 NVIDIA 官方文档（《CUDA Programming Guide》《NCCL Developer Guide》）与 PyTorch 官方文档（分布式通信文档）为准，讲义中逐处标注「官方文档」；ms-swift《Megatron-SWIFT 快速开始》作并行策略的应用侧印证（存档于 materials-advanced/modelscope/04）；DeepInfer 支持清单引其官方仓库 README（2026-10-20 发布，B1 已走读）；一切具体数字均为公司实测（逐处标注）。框架组织与账目推导为「Muse 整理」。</p>\n</blockquote>\n<hr />\n<h2 id=\"_1\">一、学习目标与本讲地图</h2>\n<p>前面七讲里反复出现一批底层词汇：kernel 启动开销、带宽墙、all-to-all、sm_121、统一内存。它们一直被当作「已知」使用，本讲把这批词汇的账本一次性翻开——这是全专题的收官讲，定位先说死：</p>\n<p><strong>这是一堂底层词汇与账目课，不是 kernel 编程课。</strong> 学完之后你不需要能写一个 CUDA kernel，但要能做到三件事：</p>\n<ol>\n<li><strong>读得懂</strong>：A1 的并行选型、B1 的引擎参数、C1 的定位结论里出现的每个底层词，都知道它在说什么、账怎么算。</li>\n<li><strong>对得上</strong>：能把 C1 那句「单流 decode 的瓶颈在每步固定开销」拆回 CUDA 的执行模型里，逐项指出这笔开销由什么构成、为什么 CUDA Graph 能治它。</li>\n<li><strong>判得准</strong>：给定一台新机器、一个新框架，先查三件事——内存带宽实测多少、互联带宽多少、compute capability 支持不在清单里——再谈性能。</li>\n</ol>\n<p>本讲地图：GPU 微架构（第二节）→ CUDA 编程模型（第三节）→ GB10 统一内存（第四节）→ 集合通信原语（第五节）→ NCCL 与双机 RoCE（第六节）→ 指令集与选型纪律（第七节）→ 编译与图优化一页（第八节）→ 实操（第九节）→ 避坑（第十节）→ 练习、阅读与八讲收官（第十一节）。</p>\n<p><strong>先说结论</strong>：前七讲的所有「账」，最后都落到三种物理资源上——<strong>算力（每秒能做多少次运算）、内存带宽（每秒能搬多少字节进出计算单元）、互联带宽（每秒能在机器之间搬多少字节）</strong>。GPU 架构、CUDA 模型、集合通信、指令集，本质都是在回答这三种资源如何被组织、被消耗、被浪费。本讲就是把这张总账补完。</p>\n<h2 id=\"gpu\">二、GPU 微架构：概念层讲透</h2>\n<h3 id=\"21-sm-warpgpu\">2.1 SM 与 warp：GPU 的「车间」与「班组」</h3>\n<p>按 NVIDIA 官方文档的口径，一块 GPU 由几十到上百个 <strong>SM（Streaming Multiprocessor，流式多处理器）</strong> 组成，每个 SM 是一个能独立调度执行的计算单元——类比成车间：GPU 是一座工厂，SM 是车间，工厂的产能约等于车间数 × 每车间的班组吞吐。</p>\n<p>SM 内部的执行以 <strong>warp</strong> 为最小调度单位：一个 warp 是 32 个线程的班组，同一 warp 的 32 个线程在同一时刻执行同一条指令（SIMT 模型，官方文档）。这解释了两个常见现象：</p>\n<ul>\n<li>为什么 GPU 适合大批量同构计算：成千上万个 warp 并行推进，单个 warp 慢不要紧，总吞吐靠数量。</li>\n<li>为什么分支发散（warp 内线程走不同分支）会掉速：班组必须齐步走，分叉时只能轮流执行两条路。</li>\n</ul>\n<p>对 LLM 的意义只需要记住一句：<strong>矩阵乘这类规整计算能把 warp 喂满，是 GPU 的主场；decode 阶段每步只算很少的量，班组大量空转——这是后面所有带宽讨论的根源。</strong></p>\n<h3 id=\"22-tensor-core\">2.2 Tensor Core：为矩阵乘专设的工位</h3>\n<p>普通 CUDA Core 做的是标量/向量运算；<strong>Tensor Core</strong> 是 SM 内专为矩阵乘加（MMA）设置的硬件单元，一条指令完成一小块矩阵的乘加（官方文档）。大模型的绝大部分浮点运算是矩阵乘，所以「峰值算力」这个数字说的基本就是 Tensor Core 的吞吐，且随数据类型变化：位宽越低（BF16 → FP8 → FP4），单位时间的运算次数越高——这正是 B2 讲量化时「低精度不只是省显存、还提算力」的硬件根源。</p>\n<p>GB10 的 BF16 峰值算力约 125 TFLOPS（公司口径）。注意这个数字的读法：它是 Tensor Core 全速、数据供给完美时的上限，实际负载能达到几成，取决于数据搬运跟不跟得上——这就引出本节最重要的一组区分。</p>\n<h3 id=\"23\">2.3 存储层级：离计算越近越快、越小</h3>\n<p>GPU 的数据要经过一条层级链才能到达计算单元（官方文档口径，量级如下）：</p>\n<table>\n<thead>\n<tr>\n<th>层级</th>\n<th>位置</th>\n<th>容量量级</th>\n<th>速度量级</th>\n<th>谁在用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>寄存器</td>\n<td>SM 内部</td>\n<td>每 SM 数百 KB</td>\n<td>最快，周期级</td>\n<td>当前 warp 的变量</td>\n</tr>\n<tr>\n<td>共享内存 / L1</td>\n<td>SM 片上</td>\n<td>每 SM 数百 KB</td>\n<td>片上速度，远快于显存</td>\n<td>block 内协作、数据复用</td>\n</tr>\n<tr>\n<td>L2 缓存</td>\n<td>芯片级</td>\n<td>数十 MB</td>\n<td>介于片上与显存之间</td>\n<td>全部 SM 共享</td>\n</tr>\n<tr>\n<td>显存（GB10 上即统一内存）</td>\n<td>片外</td>\n<td>本机约 121.6 GB 可见（公司实测）</td>\n<td>实测 224–226 GB/s（公司实测）</td>\n<td>权重、KV Cache、激活</td>\n</tr>\n</tbody>\n</table>\n<p>这张表要读出三件事：</p>\n<ol>\n<li><strong>速度差是量级差，不是百分比差</strong>。片上存储的访问速度比片外显存高一到两个数量级。权重每从显存搬一次进 SM，路上花的时间就是 decode 的主要成本。</li>\n<li><strong>容量越大的层级越慢</strong>。121.6 GB 的权重与 KV 只能住在最慢的一层，这是 LLM 推理的先天格局：模型越大，每步要搬的字节越多。</li>\n<li><strong>优化的本质是复用</strong>。让一份数据在片上多算几遍（提高算术强度）、或让一批请求共用一次搬运（批处理、投机解码），都是在绕开最慢的那一层。这与 C1 的 Roofline 判读是同一件事的两种说法。</li>\n</ol>\n<h3 id=\"24\">2.4 算力和带宽是两种完全不同的资源</h3>\n<p>这是全讲最重要的一句区分，前面几讲一直在用、本讲正式立住：</p>\n<ul>\n<li><strong>算力（TFLOPS）</strong>：每秒能做多少次浮点运算，资源在 SM/Tensor Core 里，消耗它的是「计算」。</li>\n<li><strong>带宽（GB/s）</strong>：每秒能把多少字节从显存搬进 SM，资源在内存总线上，消耗它的是「搬运」。</li>\n</ul>\n<p>两者不能互相替代：一台机器可以算力过剩而带宽饥饿（decode 的常态），也可以反过来（大 batch prefill 更接近算力受限）。判断负载卡在哪一种，用 C1 的 Roofline：GB10 的脊点约 458 FLOPs/B（BF16 峰值约 125 TFLOPS ÷ 理论带宽 273 GB/s，公司口径）——算术强度低于脊点，缺的是带宽；高于脊点，缺的是算力。公司现行模型的单流 decode 算术强度约 4 FLOPs/B，离脊点差两个数量级，所以它的故事永远先是带宽的故事，其次才是开销的故事（第三节）。</p>\n<h2 id=\"cuda-kernel\">三、CUDA 编程模型：kernel 是一次「集体开工」</h2>\n<h3 id=\"31-grid-block-thread\">3.1 grid / block / thread 三层</h3>\n<p>CUDA 程序的基本动作是<strong>发射（launch）一个 kernel</strong>：CPU 把一段要在 GPU 上执行的函数连同执行配置提交给 GPU，GPU 按三层结构把活铺开（官方文档）：</p>\n<ul>\n<li><strong>thread（线程）</strong>：最小执行单位，成千上万个；</li>\n<li><strong>block（线程块）</strong>：一组线程（通常数百个），被分配到一个 SM 上执行，块内线程可通过共享内存协作；</li>\n<li><strong>grid（网格）</strong>：本次 kernel 的全部 block，铺满整块 GPU。</li>\n</ul>\n<p>一次矩阵乘就是一次 kernel 发射：grid 里的每个 block 负责结果矩阵的一小块，各自从显存把数据搬进片上、算完写回。<strong>关键直觉：kernel 不是「调用一个函数」那么轻，它是一次全厂范围的集体开工——有组织成本。</strong></p>\n<h3 id=\"32-c1\">3.2 启动开销从哪来：把 C1 的账对上</h3>\n<p>C1 的公司案例结论：现行服务单流 decode 每步约 39 ms（关 MTP，TPOT p50），纯搬运下限只有约 13 ms，差出的约三分之二被判为「每步固定开销」，其构成在 C1 里如实标注为未直测的推论。本讲把这笔账的构成项在概念层拆开（构成项与量级直觉为 Muse 整理，比例以 C1 实操的 nsys 直测为准，不在此编造）：</p>\n<p>一 step 的 decode 要顺序执行几十层网络，每层包含多个 kernel（注意力、矩阵乘、归一化、采样、MoE 分发与回收……），双机 EP 还要插入通信操作。固定开销就藏在每个环节的缝隙里：</p>\n<ol>\n<li><strong>launch 提交开销</strong>：每次 kernel 发射，CPU 侧要准备参数、写命令队列，量级为每次几微秒。一 step 数百次发射，累计到毫秒量级——单看不大，但 decode 每步的真实 GPU 工作（搬运 3 GB 约 13 ms）本身就短，缝隙占比被放大。</li>\n<li><strong>调度编排开销</strong>：引擎在 CPU 侧做每步的请求调度、KV 块管理、采样参数准备。这部分不占 GPU 时间，但若 CPU 准备慢于 GPU 执行，GPU 就会出现空泡。</li>\n<li><strong>同步等待</strong>：双机 EP 的通信、采样后的结果回读等环节带同步语义，快的设备等慢的设备，等待时间与工作量无关、只与步数有关。</li>\n</ol>\n<p>三者共同的特征：<strong>只随步数增长，不随每步的 token 数增长</strong>。这正是 C1 用 MTP A/B 印证的模型——MTP 让每步多产出 token，搬运账几乎不变、固定开销被更多 token 摊薄，于是 TPOT 从 39.2 降到 21.3 ms。账，到这里就对上了。</p>\n<p>还要补一句证据边界（与 C1 一致）：以上是构成项层面的拆解，<strong>各构成项的精确占比没有被直测量过</strong>；要把这笔账从「构成清楚」升级为「比例清楚」，靠的是 C1 实操里那一窗 nsys 时间线。本讲的定位是概念层，点到为止。</p>\n<h3 id=\"33-batch\">3.3 一个推论：为什么小 batch 是固定开销的重灾区</h3>\n<p>把 3.2 的账推一步：batch=1 时，每步 GPU 真实工作量最小（搬运量由激活参数决定，与 batch 关系不大，但每步产出的 token 只有 1 个），固定开销全额摊在这一个 token 上；batch 变大后，每步产出成倍增加，固定开销被摊薄，带宽利用率随之上升——这就是公司已验证结论「max-num-seqs 的本质是用并发打带宽利用率」在 CUDA 模型里的解释。反过来，任何「每步多干点活」的优化（批处理、投机解码、连续批处理）都是在同一条账上做文章。</p>\n<h2 id=\"gb10\">四、内存层级与 GB10 统一内存深挖</h2>\n<h3 id=\"41-cpu-gpu\">4.1 统一内存的物理含义：CPU 和 GPU 共用同一片内存</h3>\n<p>先把概念说准。独显机型里，GPU 有自己独立的显存（HBM），CPU 有自己的内存，两者之间隔着 PCIe 总线，数据来回要显式拷贝。而 GB10 这类 SoC 采用<strong>统一内存架构</strong>：CPU 与 GPU 共享同一片物理内存（LPDDR5X），系统可见约 121.6 GB/台（公司实测）。GPU 访问权重数据时走的是片上互连直达这片内存，不存在「先拷到显存」这一步。</p>\n<p>注意区分两个同名概念：CUDA 编程接口里也有个「Unified Memory」（托管内存，<code>cudaMallocManaged</code>），那是软件层的自动迁移机制；本节讲的是<strong>硬件层面的物理统一内存</strong>，两者别混（官方文档对前者有专门章节，本讲只取硬件含义）。</p>\n<h3 id=\"42-llm\">4.2 对 LLM 部署的三个实际影响</h3>\n<ol>\n<li><strong>无 PCIe 拷贝，加载即映射</strong>。模型权重从磁盘读入内存后，GPU 可直接访问，省去了独显机型「主机内存 → 显存」的整段搬运。冷启动与换模型的账因此不同——但这也意味着没有一道拷贝环节帮你把数据「整理」进高速显存，GPU 每步都直接面对这片内存的速度。</li>\n<li><strong>容量即上限，且是全机共享的上限</strong>。121.6 GB 要同时装下操作系统、引擎进程、125B 模型的权重（NVFP4 约 62.5 GB）与 KV Cache。公司现行服务统一内存占用约 112 GB（公司实测），余量就是 KV 与并发的硬顶——第一阶段讲义里「GB10 内存账」的每一行，根都在这里。独显机型显存不够还能靠主机内存周转（慢但能跑），统一内存没有这个缓冲带，满了就是满了。</li>\n<li><strong>带宽是全机共享的一条</strong>。这片内存的理论带宽 273 GB/s 要同时服务 CPU 与 GPU。GPU 实测可达 224–226 GB/s（理论的 82–83%，公司实测）——sizing 时必须用实测值：按 273 算出来的 decode 上限会系统性高估两成，这正是第十节坑清单的第一条。</li>\n</ol>\n<h3 id=\"43-sizing\">4.3 实测带宽的测法与 sizing 口径</h3>\n<p>公司的 224–226 GB/s 来自 cuda-hello.py 类的自研带宽测试（STREAM 式读写模式，公司实测）：用大块连续内存做读、写、拷贝，测出可持续带宽而非峰值突发。这个测法值得在任何新机器上复刻，口径立为三条纪律（Muse 整理）：</p>\n<ul>\n<li><strong>sizing 用实测带宽，不用理论带宽</strong>。一切 decode 上限、并发规划、成本账，先过这道折扣（GB10 上约 0.82–0.83）。</li>\n<li><strong>测的是「服务同款访问模式」</strong>。权重搬运是流式大块读，带宽测试也要用大块连续访问对齐；拿小块随机访问的数字去套 decode 的账，是另一种错。</li>\n<li><strong>基线要留档</strong>。带宽与算力基线是 C1 说的「第 0 层环境基线」的组成部分，换镜像、换驱动、换机器后先复测再谈性能变化。</li>\n</ul>\n<p>还须点明 GB10 的定位账：273 GB/s 的理论带宽与数据中心 HBM 机型（数 TB/s 量级）差一个数量级，这不是缺陷而是定位——桌面级 SoC 用 LPDDR 换来了 128 GB 的大容量与低功耗，代价就是 decode 的带宽天花板。选型时把这笔账认下来，比事后调优重要得多。</p>\n<h2 id=\"_2\">五、集合通信原语：谁给谁什么</h2>\n<p>并行策略在 A1 已经讲透，本讲只补最后一块拼图：每个策略落到线上，实际是哪种<strong>集合通信原语</strong>在搬数据。原语按 PyTorch/NCCL 官方文档口径定义，先逐个讲清「谁给谁什么」（设参与设备数为 N，每份数据总量为 S）：</p>\n<table>\n<thead>\n<tr>\n<th>原语</th>\n<th>谁给谁什么</th>\n<th>结果</th>\n<th>典型通信量（每设备）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>all-reduce</strong></td>\n<td>每台都有一份完整的待汇总数据（如梯度），全员相加</td>\n<td>每台都拿到汇总后的全量结果</td>\n<td>≈ 2×(N−1)/N × S，N 大时趋近 2S</td>\n</tr>\n<tr>\n<td><strong>all-gather</strong></td>\n<td>每台交出自己的一片（S/N）</td>\n<td>每台都拼出全量 S</td>\n<td>≈ (N−1)/N × S，趋近 S</td>\n</tr>\n<tr>\n<td><strong>reduce-scatter</strong></td>\n<td>每台有一份完整数据，分段汇总</td>\n<td>每台只拿到其中一段（S/N）的汇总结果</td>\n<td>≈ (N−1)/N × S，趋近 S</td>\n</tr>\n<tr>\n<td><strong>all-to-all</strong></td>\n<td>每台给其余每台发一份各不相同的数据</td>\n<td>每台收到其余每台发给自己的那份</td>\n<td>与数据分布有关，量级 ≈ S</td>\n</tr>\n</tbody>\n</table>\n<p>两个关键关系（官方文档与实现常识）：</p>\n<ul>\n<li><strong>all-reduce = reduce-scatter + all-gather</strong>。先分段汇总、再把结果拼全，所以它的通信量约等于两段之和（趋近 2S）。框架里的梯度同步、张量并行的结果合并，走的都是这条分解链。</li>\n<li><strong>点对点（send/recv）不是集合通信</strong>，但流水线并行（PP）用的正是它：相邻 stage 之间传激活值，A1 说 PP「通信量最小」的根源在此——它只在层边界传，不做全员汇总。</li>\n</ul>\n<h3 id=\"51\">5.1 与并行策略一一对应</h3>\n<table>\n<thead>\n<tr>\n<th>A1/B1 的策略</th>\n<th>背后的原语</th>\n<th>账怎么估</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>DP（梯度同步）</td>\n<td>all-reduce（或 ZeRO 式 reduce-scatter + all-gather 分片变体）</td>\n<td>每步一次，量 ≈ 梯度总量 ×2（N 大时）；ZeRO 把参数/优化器状态也分片，用 all-gather 在需要时拼回</td>\n</tr>\n<tr>\n<td>TP（张量并行）</td>\n<td>前向 all-gather / all-reduce，反向对应反向原语</td>\n<td>每层多次触发，频率最高、对延迟最敏感——这就是 A1「TP 尽量不跨节点」的通信学解释</td>\n</tr>\n<tr>\n<td>EP（专家并行）</td>\n<td>all-to-all（token 分发 dispatch + 结果回收 combine 两次）</td>\n<td>量随 token 数与激活专家数走；公司现行 vLLM 配置 TP2+EP、all-to-all 后端选 <code>allgather_reducescatter</code>——即用 all-gather + reduce-scatter 组合实现等价的 all-to-all 语义（B1 现行值），在双机小规模下这是实现层面的务实选择</td>\n</tr>\n<tr>\n<td>PP（流水线并行）</td>\n<td>相邻 stage 间 send/recv</td>\n<td>只传边界激活，量最小、频率低</td>\n</tr>\n<tr>\n<td>CP（上下文并行）</td>\n<td>注意力计算中的 all-gather / 环状传递</td>\n<td>随序列长度增长，长上下文场景才上桌（B1 的 DeepInfer 对照中出现过）</td>\n</tr>\n</tbody>\n</table>\n<p>读表的方法：<strong>看到任何并行配置，先翻译成原语，再按原语估通信量、按第六节的互联带宽估通信时间</strong>。策略名字千变万化，原语只有这几种，账只有这一本。</p>\n<h2 id=\"nccl-roce\">六、NCCL 与双机 RoCE：互联的带宽账</h2>\n<h3 id=\"61-nccl\">6.1 NCCL 的角色</h3>\n<p><strong>NCCL</strong> 是 NVIDIA 的集合通信库（官方文档）：PyTorch、vLLM、Megatron 等框架在 NVIDIA 硬件上执行第五节的原语，底层基本都落到 NCCL。它做三件事：感知拓扑（哪几张卡在同一台机器、走什么链路）、为每个原语选算法与通道（ring/tree 等组织方式）、把通信与计算的流水尽量排开。对使用者的意义是：你不需要自己写通信，但你调的每一个并行参数，最终都在指挥 NCCL 搬数据——所以 NCCL 的带宽基准（第九节实操）测的是整条链路的实账，不是理论值。</p>\n<p>备一句边界：跨厂商或昇腾等平台有各自的通信库（如 HCCL），原语语义相通、实现与性能另算，本讲不展开。</p>\n<h3 id=\"62-200g-roce\">6.2 200G RoCE 的带宽账：先算再判</h3>\n<p>公司双机之间是 <strong>200G RoCE 直连</strong>（公司现行部署）。换算成立即可比的口径：</p>\n<ul>\n<li>200 Gbit/s ÷ 8 = <strong>25 GB/s 理论带宽</strong>，实测有效带宽还要再打折扣（协议开销、小消息效率，量级以第九节实操为准）。</li>\n<li>与统一内存带宽实测 224–226 GB/s 对比：<strong>跨机搬 1 个字节的时间，约是在本机内存里搬 1 个字节的 9 倍</strong>。</li>\n<li>再与机内互联对比：同一台机器内部（片上互连/NVLink 类）是 TB/s 量级，与 RoCE 的 25 GB/s 差近两个数量级。</li>\n</ul>\n<p>判瓶颈的方法只有一步：<strong>通信时间 = 通信量 ÷ 有效互联带宽，与同一步的计算/搬运时间比大小</strong>。举两个现行服务的例子（量级估算，Muse 整理）：</p>\n<ul>\n<li>TP 若跨机：每层都要合并结果，一步 decode 触发几十次跨机 all-reduce，每次的数据量不大但<strong>延迟与同步次数</strong>叠起来，先死的不是带宽而是步频——这从通信侧再次解释了 A1 的纪律「TP 尽量不跨节点、限制在高速互联域内」。公司现行 TP2 跨双机是推理侧的既定权衡（权重装载与 MoE 结构使然，B1 已述），能成立的前提是 decode 的单步通信量被 EP 结构摊薄，而非 TP 本身便宜。</li>\n<li>EP 的 all-to-all 跨机：量随 token 走，单流时量小、并发上来后线性增长。C1 定位单流固定开销时把「通信等待」列为构成项之一，指的就是这类同步——并发档位变化时要重新对账（C1 坑清单「瓶颈会搬家」）。</li>\n</ul>\n<p>结论立成一句可迁移的直觉：<strong>跨机通信先算两笔账——总量除带宽看时间占比，次数乘延迟看步频损失；任何一笔超标，这个切法就不该跨机。</strong></p>\n<h2 id=\"compute-capability\">七、指令集一课：compute capability 与「能不能跑」</h2>\n<h3 id=\"71-sm_121-sm100\">7.1 sm_121 与 SM100：同代、不同分支</h3>\n<p>NVIDIA 给每代 GPU 定一个 <strong>compute capability（CC，计算能力）</strong> 版本号，编译产物（SASS/PTX）按它生成，算子库也按它做实现与调优。两个本讲必须分清的号：</p>\n<ul>\n<li><strong>SM100（CC 10.0）</strong>：数据中心 Blackwell（B200/GB200 一代）的计算能力；</li>\n<li><strong>sm_121（CC 12.1）</strong>：GB10 所属的 Blackwell 消费/工作站分支的计算能力。</li>\n</ul>\n<p>同属 Blackwell 大代，但<strong>是两个不同的分支</strong>：指令集细节、Tensor Core 的数据通路与专用指令（如 SM100 上的特定矩阵乘指令路径）并不互通。为某个 CC 编译的 kernel 二进制，只能在相同或兼容的 CC 上运行；算子库（如 FlashMLA、DeepGEMM 这类深度绑定硬件特性的实现）更是按目标 CC 逐个适配。这就是「数字更大不等于兼容」的原因：12.1 不是 10.0 的超集，而是另一条分支。</p>\n<h3 id=\"72-deepinfer-spark\">7.2 案例复盘：DeepInfer 为什么上不了 Spark</h3>\n<p>B1 已走读过 DeepInfer（DeepSeek 2026-10-20 开源其生产推理框架）的支持清单，这里只从指令集角度复盘这条红线：</p>\n<ul>\n<li>DeepInfer 首发仅支持 SM100 与昇腾 950，唯一模型 DeepSeek-V4.1-Flash，且其算子层收编的是 FlashMLA、DeepGEMM、DeepEP 等按 SM100 深度调优的自家 kernel；</li>\n<li>GB10 是 sm_121：不在支持清单内，<strong>不是「跑得慢」，是根本跑不起来</strong>——kernel 层就没有为这条分支编译的产物；</li>\n<li>叠加容量账：该模型 552B 权重约 300 GB+，同样超过双机总内存——架构与容量双重不可行（B1 结论）。</li>\n</ul>\n<p>这个案例的价值不在 DeepInfer 本身，而在于它把选型顺序钉死了（见 7.3）：任何新框架先过 CC 这一关，过不了，后面的性能数字全是别人的故事。</p>\n<h3 id=\"73-cc\">7.3 选型纪律：先查 CC，再谈性能</h3>\n<p>把本节立成三步纪律（Muse 整理，与 C1「第 0 层环境基线」衔接）：</p>\n<ol>\n<li><strong>查卡</strong>：目标机器的 compute capability 是多少（<code>nvidia-smi</code> 与官方规格可查，本机 GB10 = sm_121）。</li>\n<li><strong>查支持矩阵</strong>：框架与关键算子库的官方支持清单里有没有这个 CC——注意区分「官方支持」「社区能跑」「实测可用」三档（与 C1 的证据等级同构）。</li>\n<li><strong>查优化覆盖</strong>：在支持清单内，还要问一层——算子是否为这个 CC 做过调优。公司吃过现成的亏：pip torch 2.11 在 sm_121 上 fp16 矩阵乘只有约 11 TFLOPS，而 Day-0 镜像自带 torch 是 90–96 TFLOPS（公司实测）——前者是「能跑但没优化」，后者是「为这代硬件调过」。<strong>CC 决定能不能跑，优化覆盖决定跑多快，两层都要查。</strong></li>\n</ol>\n<h2 id=\"_3\">八、编译与图优化：它们在消灭什么开销（一页）</h2>\n<p>第三节留下的固定开销，业界有三件标准武器，本讲只讲它们各自在消灭哪笔开销，不讲用法细节：</p>\n<table>\n<thead>\n<tr>\n<th>武器</th>\n<th>做什么</th>\n<th>消灭的开销</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>CUDA Graph</strong></td>\n<td>把一串 kernel 的发射序列录制成一张「图」，之后一次提交、整图重放</td>\n<td>逐个 launch 的 CPU 提交开销与步间缝隙——第三节固定开销的第 1、2 项</td>\n</tr>\n<tr>\n<td><strong>TorchInductor</strong>（PyTorch 编译栈）</td>\n<td>把 PyTorch 的算子图编译、融合成更少的 kernel 再执行</td>\n<td>kernel 数量本身：融合后发射次数下降、中间结果少落显存，顺带省搬运</td>\n</tr>\n<tr>\n<td><strong>Triton</strong></td>\n<td>写 GPU kernel 的语言与编译器（Inductor 的主要后端之一），按 block 抽象生成高效 kernel</td>\n<td>让「融合与定制 kernel」变得可编程——是上面一行的生产工具</td>\n</tr>\n</tbody>\n</table>\n<p>回扣现行服务：vLLM 的 CUDA Graph 配置现行值为 <strong>FULL_DECODE_ONLY</strong>（B1 现行值）——只把 decode 步录成图，因为 decode 每步的 kernel 序列固定、形状稳定，正是 launch 开销占比最高的场景；prefill 的输入长度多变、图难以复用，故不捕。这个配置选择用第三节的账一算就通：<strong>图优化打的正是「形状稳定 × 步数极多」的那部分固定开销</strong>。</p>\n<p>与本讲定位的关系：以上三件武器知道「在消灭什么」即可，调参与排障在 B/C 模块的口径里已经够用；真要动手写 Triton kernel，属于深水区路线（见第十一节收官小结的去向说明），不在本专题的交付范围内。</p>\n<h2 id=\"_4\">九、实操：双机集合通信基准 + 内存带宽复测</h2>\n<p>目标：亲手测出第六节那笔账的实数，并与 A1、C1 的历史数据汇成一张三方对照表。分三个步骤，<strong>步骤 2 涉及双机满负荷通信与显存占用，须在维护窗口内停 <code>vllm-fn</code> 后执行</strong>（现行服务占约 112 GB 统一内存且持续占用带宽，不停服测出的是「与服务争抢后」的数，不是链路实账）；窗口纪律沿用 C2 的变更流程（批准、双机一致、留痕、测完恢复服务并做健康检查）。</p>\n<h3 id=\"1\">步骤 1：单机内存带宽复测（可不停服先行，但数值以窗口内为准）</h3>\n<ul>\n<li>用公司既有的带宽测试口径（cuda-hello.py 类 STREAM 式大块读写）在每台 Spark 上复测统一内存带宽，与历史基线 224–226 GB/s 对照。</li>\n<li>若偏差超过约 5%，先停下查第 0 层（镜像/驱动/温度墙），不要带着漂移的基线往下测。</li>\n<li>产出：两台机器的实测带宽各一份，记入对照表「内存带宽」行。</li>\n</ul>\n<h3 id=\"2all-reduce\">步骤 2：all-reduce 带宽曲线（维护窗口，双机）</h3>\n<ul>\n<li>工具口径：用 nccl-tests 的 <code>all_reduce_perf</code>（NCCL 官方基准工具）或等价的 PyTorch 分布式脚本（<code>torch.distributed.all_reduce</code> 计时），二选一并在报告中注明（命令以所选工具的官方仓库当前版本为准，本讲不锁版本）。</li>\n<li>扫描消息大小：从 1 KB 起按数量级递增到 1 GB（如 1KB / 64KB / 1MB / 16MB / 256MB / 1GB），每档记录总线带宽（busbw）与耗时。</li>\n<li>判读曲线形态（这是本实操的核心产出，不是数字本身）：</li>\n<li>小消息段：带宽远低于 25 GB/s 理论线——<strong>延迟主导</strong>，此时比的是每次通信的固定延迟，对应第六节「TP 跨机先死于步频」的判断；</li>\n<li>大消息段：带宽趋近一条平台线——读出这条平台与 25 GB/s 的比例，即 RoCE 链路的有效率；</li>\n<li>拐点位置：延迟与带宽的交接点，决定「多大的消息跨机才划算」。</li>\n<li>选做：同法测 all-gather 与 all-to-all 各一档大消息，与第五节的通信量公式对账（实测时间 ≈ 通信量 ÷ 平台带宽，偏差大时回查公式里漏了哪一项）。</li>\n</ul>\n<h3 id=\"3\">步骤 3：三方对照成表（验收产出）</h3>\n<p>把本讲实测与历史数据汇成一张表，逐行写明数据出处与日期：</p>\n<table>\n<thead>\n<tr>\n<th>行</th>\n<th>本讲实测</th>\n<th>历史对照</th>\n<th>要回答的问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>内存带宽</td>\n<td>步骤 1 复测值</td>\n<td>224–226 GB/s（既有基线）</td>\n<td>基线漂移没有？</td>\n</tr>\n<tr>\n<td>跨机 all-reduce 平台带宽</td>\n<td>步骤 2 大消息段</td>\n<td>25 GB/s（200G 理论线）</td>\n<td>RoCE 有效率几成？</td>\n</tr>\n<tr>\n<td>小消息延迟</td>\n<td>步骤 2 小消息段</td>\n<td>A1 并行实验的双机开销体感、C1 固定开销构成项</td>\n<td>跨机每步的同步成本量级对得上吗？</td>\n</tr>\n<tr>\n<td>decode 账复核</td>\n<td>用新基线重算搬运下限</td>\n<td>C1 的 13 ms/token 与 39 ms 实测</td>\n<td>基线更新后，C1 结论是否依然成立？</td>\n</tr>\n</tbody>\n</table>\n<p><strong>降级方案</strong>（窗口批不下来时）：跳过步骤 2 的实测，改为——① 不停服做只读观测（服务运行时的日志与 <code>nvidia-smi</code> 读数，只记录、不下链路结论）；② 用本讲给出的理论口径（25 GB/s、通信量公式）对 A1 实验数据做纸面复盘。报告中如实标注哪些行是实测、哪些是理论估算，证据等级不许混写（C1 纪律）。</p>\n<p><strong>验收标准</strong>：曲线形态判读完整（延迟段/平台段/拐点三者齐全且各有数字支撑）；对照表每行有出处与日期；能用自己的话回答「为什么 TP 尽量不跨机、EP 的 all-to-all 在什么并发档位会先撞墙」。</p>\n<h2 id=\"_5\">十、常见坑清单</h2>\n<ol>\n<li><strong>拿理论带宽做 sizing</strong>：按 273 GB/s 算 decode 上限，系统性高估两成。GB10 一律用实测 224–226 GB/s（第四节纪律）。</li>\n<li><strong>把通信带宽与内存带宽混成一本账</strong>：225 GB/s 是本机内存的账，25 GB/s 是跨机的账，差 9 倍。用错账本，并行选型必然翻车（A1 选型题的高发错误）。</li>\n<li><strong>compute capability 想当然</strong>：「都是 Blackwell 应该能跑」——sm_121 与 SM100 是不同分支，DeepInfer 的教训在案（第七节）。先查 CC 与支持矩阵，再谈一切。</li>\n<li><strong>把「能跑」当「跑得快」</strong>：pip torch 在 sm_121 上 11 TFLOPS 对 Day-0 镜像 90–96 TFLOPS（公司实测）——支持清单之外还要查优化覆盖（7.3 第三步）。</li>\n<li><strong>小消息测带宽、大消息测延迟</strong>：拿单个尺寸的消息给整条链路下结论。通信基准必须扫尺寸、看曲线形态（第九节判读法）。</li>\n<li><strong>只看 all-reduce 的总时间不看构成</strong>：总时间 = 数据量 ÷ 带宽 + 次数 × 延迟，两种成分对应完全不同的改法（减量 vs 减次），混在一起就无从下手。</li>\n<li><strong>统一内存当普通显存用</strong>：忘了容量是与 CPU 共享的整机上限、带宽也是共享的——给 GPU 规划满 121.6 GB，等于给操作系统留零（现行服务 112 GB 占用的读法见第四节）。</li>\n<li><strong>拿单机结论套双机</strong>：单机测出的 kernel/搬运账不含跨机同步，双机每步要多付通信的量与次——C1「瓶颈会搬家」在互联层的翻版。</li>\n</ol>\n<h2 id=\"_6\">十一、课后练习、延伸阅读与八讲收官</h2>\n<h3 id=\"111\">11.1 课后练习</h3>\n<ol>\n<li>（算账）现行服务某步 decode 需跨机 all-reduce 一份 8 MB 数据：按 RoCE 有效带宽取理论值的七成估算，这次通信耗时多少？与单步搬运下限 13 ms 相比占多少？由此说明「TP 跨机先死于步频还是带宽」。（口径：本讲第五、六节）</li>\n<li>（判读）某同事拿一台新机器的宣传页来选型：「内存带宽 273 GB/s、算力 1000 TFLOPS」。按本讲纪律，你依次要追问哪三个问题？每个问题分别在防哪一类坑？</li>\n<li>（对应表）把 A1 实验 E2（双机 TP）的通信逐步拆开：每步包含哪些原语、各触发几次、哪一笔最可能先撞 RoCE 的墙？写出推理链，数字可用量级估算并注明。</li>\n<li>（复盘）用第七节三步纪律，为「在公司 Spark 上试跑 SGLang」做一次纸面选型检查：CC、支持矩阵、优化覆盖各写一行结论与出处。</li>\n</ol>\n<h3 id=\"112\">11.2 延伸阅读（逐条标来源）</h3>\n<ul>\n<li>NVIDIA《CUDA Programming Guide》——GPU 架构、编程模型与存储层级的官方口径（官方文档；sm/CC 兼容性章节与第七节对应）。</li>\n<li>NVIDIA《NCCL Developer Guide》与 nccl-tests 仓库——集合通信原语的定义、算法与基准方法（官方文档；第五、六、九节的定版来源）。</li>\n<li>PyTorch 官方文档「Distributed communication package」——原语在框架层的语义与接口（官方文档）。</li>\n<li>ms-swift《Megatron-SWIFT 快速开始》（存档 <code>materials-advanced/modelscope/04</code>）——并行策略的应用侧选型规则，与第五节对应表互为印证。</li>\n<li>DeepInfer 官方仓库 README 与技术报告（DeepSeek，2026-10-20）——SM100 支持清单与生产并行打法，第七节案例的一手出处（其生产数据为官方自报，读时注意口径）。</li>\n</ul>\n<h3 id=\"113\">11.3 进阶专题八讲收官小结</h3>\n<p>到这里，第二阶段进阶专题八讲全部走完。按模块回顾这套能力清单（每项都对应至少一次实操产出）：</p>\n<table>\n<thead>\n<tr>\n<th>模块</th>\n<th>带走的能力</th>\n<th>代表产出</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A 训练工程</td>\n<td>并行策略选型与成本账；偏好优化（DPO/GRPO）与蒸馏深化的全链路判断</td>\n<td>并行对照实验、偏好优化对照实验</td>\n</tr>\n<tr>\n<td>B 推理引擎</td>\n<td>双引擎机制对照与参数口径迁移；量化选型与投机解码的收益评估</td>\n<td>双引擎差异分析、量化选型结论</td>\n</tr>\n<tr>\n<td>C 性能调优</td>\n<td>四层定位法与证据等级；负载画像、调优闭环与单 token 成本建模</td>\n<td>定位报告、调优基线 v1</td>\n</tr>\n<tr>\n<td>D 底层架构</td>\n<td>从零搭建的架构直觉；GPU/CUDA/NCCL/统一内存的词汇与总账</td>\n<td>集合通信基准与三方对照表</td>\n</tr>\n</tbody>\n</table>\n<p>四模块合起来是一条完整的推理与训练工程链：<strong>训得动（A）→ 跑得稳（B）→ 调得准（C）→ 算得清（D）</strong>。本讲的三种资源总账（算力、内存带宽、互联带宽）是这条链的物理地基——之后无论换什么框架、什么硬件，先把这三笔账算一遍，再看它的宣传页。</p>\n<p>后续深水区去向（不在本专题范围内，按需自选）：动手写 Triton kernel 与 CUDA C++、Megatron-LM 源码级走读、国产算力（昇腾）生态实操。三条都建议以本专题的账目框架为地图，按项目需要再深入。</p>"}, {"num": "E1", "ch": "进阶 E · Agent 专题", "label": "E1 Agent 演进", "title": "进阶 E1：Agent 演进——从规则系统到自主智能体", "html": "<h1 id=\"e1agent\">进阶 E1：Agent 演进——从规则系统到自主智能体</h1>\n<blockquote>\n<p><strong>讲次</strong>：第二阶段进阶专题 · 模块 E（Agent 与企业落地）第 1 讲\n<strong>建议时长</strong>：2.5–3 小时（演进走读约 110 分钟 + 现状盘点约 20 分钟 + 实操约 60 分钟）\n<strong>前置</strong>：业务轨第 3 周（Agent 入门与扣子实操）、第 4 周（Dify + MCP 业务助手）；技术轨第 1 周（推理流程与提示词基础）。业务轨学员可旁听至第三节结束（第 1 代为止），后面三代以技术与治理视角为主。\n<strong>素材来源</strong>：演进节点以公开论文与厂商官方发布为据，逐处标注出处类型（论文 / 厂商官方 / 公开报道口径）；衔接材料为 WaytoAGI 社区《1.3 AI Agents》板块索引、社区摘要《Dify + MCP 实操指南》（存档 materials/11）与业务轨第 3、4 周讲义（内部材料）。教学分代、对照表与实操为「Muse 整理」。\n<strong>来源纪律</strong>：2025–2026 年的前沿动态只写格局性结论，不引用未经核实的产品数据与统计数字；分代是教学切片、不是行业标准，各代在企业里是分层共存、不是新旧替换。</p>\n</blockquote>\n<hr />\n<h2 id=\"_1\">一、学习目标与本讲地图</h2>\n<p>业务轨第 3、4 周，你已经亲手用扣子和 Dify 搭过 Agent，也接过 MCP 工具。但会搭不等于看懂：为什么 2023 年之前的「智能助手」都活成了填表机？为什么 ReAct 一篇论文能定下此后所有 Agent 的基本形状？MCP 在整条演进线里到底站在哪一格？本讲把 Agent 放进技术史里，给你一张能定位任何新名词的坐标系。</p>\n<p>学完本讲，你应当能回答三个问题：</p>\n<ol>\n<li><strong>每一代 Agent 多解决了什么问题、又留下了什么问题</strong>——代际划分的依据是「哪件能力被外包出去了」，不是年份；</li>\n<li><strong>手边任何一个产品或框架（扣子、Dify、某多 Agent 框架、某浏览器 Agent），它站在第几代、自主等级多高</strong>，判断依据说得出来；</li>\n<li><strong>企业里为什么五代东西同时活着</strong>：哪一代做骨架、哪一代做主力、哪一代只配在特定场景开。</li>\n</ol>\n<p><strong>一句话总纲：Agent 的演进，就是把「思考、工具、记忆、协作」逐件从人写的代码里外包给模型与协议的过程。</strong>第 0 代四件事全靠人写死；第 1 代把「思考」交给模型；第 2 代把「记忆与复盘」做成模型的外置器官；第 3 代把「工具接入与协作」交给协议；第 4 代把「操作界面与长时执行」也交了出去，只剩目标与边界还握在人手里。本讲的走读顺序就沿着这条外包线走。</p>\n<p>代际总览先摆出来，走读时逐格回看：</p>\n<table>\n<thead>\n<tr>\n<th>代际</th>\n<th>大致时间</th>\n<th>代表形态</th>\n<th>这次外包了什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第 0 代</td>\n<td>1970s–2010s</td>\n<td>专家系统、工作流引擎、RPA</td>\n<td>什么都没外包：规则、路径全由人写死</td>\n</tr>\n<tr>\n<td>第 1 代</td>\n<td>2022–2023</td>\n<td>ReAct 循环、Function Calling、扣子/Dify 的 Agent 模式</td>\n<td>思考：下一步做什么由模型现场决定</td>\n</tr>\n<tr>\n<td>第 2 代</td>\n<td>2023–2024</td>\n<td>规划、记忆系统、反思框架</td>\n<td>记忆与复盘：计划、经验、纠错沉淀到运行框架</td>\n</tr>\n<tr>\n<td>第 3 代</td>\n<td>2024–2025</td>\n<td>多 Agent 框架、MCP、A2A</td>\n<td>协作：工具接入与智能体互联走标准协议</td>\n</tr>\n<tr>\n<td>第 4 代</td>\n<td>2024–</td>\n<td>Computer Use、深度研究、编码 Agent</td>\n<td>执行界面与时长：直接操作 GUI、连续工作数十分钟至数小时</td>\n</tr>\n</tbody>\n</table>\n<p><strong>先说结论</strong>：判断一个 Agent 方案的成熟度，不要看它自称第几代，看三样东西——工具是否标准化接入、出错后能不能自己恢复、自主边界是否可审计。这三样恰好是第 1、2、3 代各自补上的短板，也是 E2 讲企业落地的出发点。</p>\n<h2 id=\"0\">二、第 0 代：规则与流程自动化——人把路修好，机器只管走</h2>\n<h3 id=\"1\">1. 三种形态</h3>\n<p><strong>专家系统</strong>（学术界与厂商实践，1970s–1980s）。把某个领域专家的经验写成「如果……那么……」的规则库，再配一个推理机顺着规则链推导结论。斯坦福的 MYCIN（1970 年代，辅助感染性疾病诊疗）是教科书级的原型；DEC 公司的 XCON（1980 年代投入商用，自动配置 VAX 计算机订单）证明了这条路在边界清晰的场景里真能省钱省人。它是「AI」这个词第一次大规模进企业的形态。</p>\n<p><strong>工作流引擎 / BPM</strong>（企业软件，1990s 起）。不再假装系统会「思考」，而是老老实实把业务过程画成状态机：节点、条件分支、审批人、超时规则，全是人预先定义好的。OA 里的请假流、报销流、合同审批流就是这一代活到今天的化石——化石归化石，每天还在跑全公司的流程。</p>\n<p><strong>RPA（机器人流程自动化）</strong>（厂商产品，2010 年代普及，UiPath 等为代表厂商）。连系统接口都不需要：软件机器人像人一样看屏幕、点按钮、复制粘贴，把数据从一个系统搬到另一个系统。它的杀手场景是没有 API 的存量系统——老财务软件、银行柜面系统、政企门户，只能从界面进，RPA 就从界面进。</p>\n<h3 id=\"2\">2. 为什么不够：三条天花板</h3>\n<ul>\n<li><strong>规则要人写全</strong>。专家系统的「知识获取瓶颈」是写进教科书的死因：专家脑子里的判断大量是默会知识，问不出来、写不完；业务一变，规则库就要跟着改，维护成本随规则数指数上升。</li>\n<li><strong>不处理非结构化输入</strong>。第 0 代的世界里，输入必须是规整的表单字段。一封写得很绕的客户邮件、一份格式各异的投标文件，它连读都读不了——而企业里真正耗人力的，恰恰是这类材料。</li>\n<li><strong>环境一变就断</strong>。RPA 脚本绑定的是界面元素与坐标，系统改个版、按钮挪个位置，机器人当场趴窝。它没有「理解」，只有「执行」，所以也没有「应变」。</li>\n</ul>\n<h3 id=\"3\">3. 哪些还活着，为什么</h3>\n<p>第 0 代的价值从来不在智能，在<strong>确定性与可审计</strong>：同一输入必得同一输出，每一步都可回放、可举证。审批流至今是企业合规的骨架，财务 RPA 在对账、发票处理、报表搬运上仍在扩编——这些场景规则明确、量大重复、错了代价高，正是「确定性优先」的地盘。后面每一代 Agent 往上叠智能，其实都是在向第 0 代「赎回」可控性。业务轨第 3 周讲扣子时那句「主干流程固定，局部环节智能，关键动作人工确认」，就是这层共存关系的口语版：工作流节点是第 0 代的骨架，里面嵌的智能节点是第 1 代的部件。</p>\n<h2 id=\"1-llm-agent\">三、第 1 代：LLM 单体 Agent——思考被外包给模型</h2>\n<h3 id=\"1-cot\">1. 前置一步：CoT 让模型先想再答</h3>\n<p>CoT（Chain-of-Thought，思维链）出自 Google 团队 2022 年的论文（NeurIPS 2022）：在提示词里给几个「先推导、后结论」的示例，模型就会在答题前把中间推理一步步写出来，复杂推理任务的准确率大幅提升。它的意义是发现了「思考可以外显成文本」——但 CoT 的思考全程在纸面上进行：想得再对，也碰不到真实世界，查不了库存、发不了邮件，推理链里编造的事实没有任何东西来纠正它。</p>\n<h3 id=\"2-react\">2. 转折点：ReAct 把推理和行动缝在一起</h3>\n<p>ReAct（Yao 等，普林斯顿与 Google，论文 2022 年 10 月公开、ICLR 2023）只做了一件事：让模型在循环里交替输出三种东西——</p>\n<ul>\n<li><strong>Thought（思考）</strong>：我现在知道什么、下一步打算干什么；</li>\n<li><strong>Action（行动）</strong>：调用某个工具，参数是什么；</li>\n<li><strong>Observation（观察）</strong>：工具返回的真实结果，作为下一轮思考的输入。</li>\n</ul>\n<p>循环往复，直到模型认为目标达成。这个缝合的意义要逐条讲透：</p>\n<ul>\n<li><strong>推理被现实接地</strong>。每一步行动的结果都会反过来修正下一步推理：查到库存为零，计划当场改道。CoT 时代无处不在的「一本正经地编」，第一次有了一个被事实打断的机会。</li>\n<li><strong>任务从「一次生成」变成「一个循环」</strong>。业务轨第 3 周那张「观察 → 计划 → 调用工具 → 看结果 → 再决定」的循环图，源头就是这里。此后所有 Agent 框架的内核，都是这个循环的不同实现。</li>\n<li><strong>思考轨迹外显，可记录、可回放、可拦截</strong>。这是工程上最重要的一条：Agent 每一步为什么这么做，白纸黑字写在轨迹里。出问题能复盘，高风险动作能在执行前被护栏拦下来——企业敢用 Agent 的前提，一大半建立在这上面。</li>\n</ul>\n<p>同一时期的探索还有 Toolformer（Meta，2023 年论文，让模型自学何时调用 API）和 MRKL（AI21，2022 年论文，模块化「模型 + 专家工具」的早期蓝图）——结论相同：模型需要的不只是知识，还需要「伸手」的能力。这批工作只提一嘴即可，活下来的是它们共同指向的形态。</p>\n<h3 id=\"3-function-calling\">3. 标准化一步：Function Calling 把工具调用变成接口契约</h3>\n<p>ReAct 原始形态有个工程隐患：行动靠模型输出一段约定格式的文本、程序用规则去解析——模型少个冒号、多个空格，整条链就断。2023 年 6 月，OpenAI 官方发布 Function Calling：开发者用 JSON Schema 把工具的名字、用途、参数结构正式声明给模型，模型则以结构化 JSON 输出「要调哪个工具、参数是什么」，由程序执行后再把结果喂回去（厂商官方发布口径）。这一步的意义同样逐条看：</p>\n<ul>\n<li><strong>从「提示词默契」到「接口契约」</strong>。工具描述、参数类型、必填项都有了机器可读的定义，调用可校验、失败可重试、日志可结构化——Agent 第一次有了正经工程接口的样子。</li>\n<li><strong>「会用工具」从使用技巧变成模型能力本身</strong>。厂商开始把工具调用训进模型、用基准去测它，选型时「函数调用可靠性」从此是一项独立指标，而不是写提示词的玄学。</li>\n<li><strong>生态的开关被打开</strong>。调用形态统一之后，工具才谈得上被封装、被复用、被上架——第 3 代的 MCP 不是凭空出现的，它的土壤在这一年备好。</li>\n</ul>\n<h3 id=\"4\">4. 产品化与第一次泡沫</h3>\n<p>框架侧，LangChain（2022 年开源）把 ReAct 循环、工具封装、链式编排做成了开箱即用的库，是此后两年 Agent 开发的事实起点。产品侧，OpenAI 的 GPTs（2023 年 11 月，厂商官方）、字节跳动的扣子（Coze）把「配一个 Agent」做成了零代码操作——业务轨第 3 周用的正是这一代的产品形态。社区侧，AutoGPT、BabyAGI（2023 年开源社区项目）把循环的缰绳彻底松开，让 Agent 自己给自己派活，一度爆火；它们同时演示了松开缰绳的代价：死循环、目标漂移、token 账单失控。<strong>这两个项目如今已降温、被吸收</strong>——留下的共识是：循环可以自主，每一步的预算和边界必须有人管。</p>\n<p>衔接一句：你在 Dify 里选的「FunctionCalling 策略」、在扣子 Agent 模式里看到的「思考中……正在调用工具」，跑的都是这一节的循环。区别只在于是谁写的循环——平台替你写好了。</p>\n<h2 id=\"2-agent\">四、第 2 代：能力扩展——给单体 Agent 装上计划、记忆与复盘</h2>\n<p>第 1 代的 Agent 能走一步看一步，但很快撞上三堵墙：任务一长就走丢（没有计划）、聊完就忘（没有记忆）、错了只会原样重试（没有复盘）。第 2 代的解法不是换更大的模型，而是往运行框架里加三件「外置器官」。这一代的主战场，第一次从模型转向系统工程。</p>\n<h3 id=\"1-planning\">1. 规划（Planning）：先想全程，再走第一步</h3>\n<p>ReAct 原生是边走边想，长处是灵活，短处是短视：走到第五步才发现第二步选错了路。规划路线要求模型先把任务拆成子目标清单、排出依赖顺序，再逐项执行，代表工作是 Plan-and-Solve 提示方法（2023 年论文）。再进一步，Tree of Thoughts（普林斯顿等，2023 年论文）把思考组织成树：多个候选步骤并行展开、评估、回溯——本质是把搜索算法装进推理过程。搜索式规划质量更高，但成本随分支数陡增，企业里的通行取舍是：<strong>只对高价值、步骤多的任务开显式规划，日常小任务继续边走边想</strong>。今天各平台里「先生成计划、经人确认再执行」的产品形态，就是这一支的直系后代。</p>\n<h3 id=\"2-memory\">2. 记忆（Memory）：把「记性」从窗口里搬出来</h3>\n<p>先分清两层。<strong>短期记忆</strong>就是当前会话上下文里的对话与行动轨迹——它受三重约束：窗口长度、每轮都要重算的成本（回忆进阶 B1/D2 的账：上下文越长，KV Cache 越大、每步越贵），以及窗口一满就被截断的遗忘。<strong>长期记忆</strong>则把信息存到模型之外：向量数据库里的文档与历史片段（本质是把 RAG 用在「自己身上」）、结构化档案（用户偏好、项目状态）、按需检索注入。MemGPT（UC Berkeley 等，2023 年论文，后续演进为厂商产品 Letta）提出了一个影响很大的比喻：<strong>像操作系统管理内存一样管理上下文</strong>——主存是窗口、磁盘是外部存储，模型自己决定什么换入、什么换出。</p>\n<p>要如实说清的是：长期记忆至今没有公认的解法。什么该记、记错了怎么纠正、新旧记忆冲突听谁的、隐私边界划在哪——工程上都还靠各家自己拿捏。WaytoAGI 社区那篇《为什么 LLM 的长期记忆仍然是一个未解决的问题》（社区文章）值得课后读一遍，免得被厂商演示误导。</p>\n<h3 id=\"3-reflection\">3. 反思（Reflection）：不用改权重，也能从错误里学</h3>\n<p>Reflexion（2023 年论文）的机制朴素而有效：任务失败后，让模型用语言总结「这次错在哪、下次该怎么做」，把这段复盘存进记忆，带着复盘重试——成功率明显提升，全程不碰模型参数。Self-Refine（2023 年论文）是同一思路的轻量版：同一模型对自己的输出先批评、再改写。这一支的意义是把「试错学习」从昂贵的训练阶段搬到了运行阶段：<strong>权重不变，经验可以长</strong>。代价也要讲明：反思会把任务的 token 消耗与时长再放大一截，且模型对自己错误的诊断未必对——复盘环节本身也需要校验。</p>\n<h3 id=\"4_1\">4. 多步任务与错误恢复：从演示到生产的距离</h3>\n<p>第 2 代真正拉开差距的，是那些不上论文的工程细节：工具报错要能被解析成 Observation 喂回去，而不是直接抛异常终止；重试要有策略（原样重试、换参数重试、换工具绕行、降级交付）；每条任务要有步数上限与预算护栏，超限就停下来交还给人；长任务要有检查点，崩了能从中间续跑而不是从头再来。这些能力拼起来叫「错误恢复」，它决定了 Agent 是只能在演示里成功，还是能在生产里以可接受的成功率持续运行。</p>\n<p><strong>本节小结</strong>：第 2 代没有改变 Agent 的物种，只是给它配齐了计划本、记事本和复盘会。代价是系统复杂度与排障难度陡增——任务轨迹从一问一答变成几十步的长链，定位问题要看「全程录像」，这直接催生了 E2 要讲的可观测与审计。</p>\n<h2 id=\"3-agent\">五、第 3 代：多 Agent 与协议化——协作被外包给标准</h2>\n<p>单体 Agent 再强，也只是一个「人」。第 3 代问的是组织问题：多个 Agent 怎么分工？成百上千的工具怎么统一接入？这一代的答案分两层：先有协作框架的探索，后有协议层的收敛——而真正成为分水岭的是后者。</p>\n<h3 id=\"1-agent\">1. 多 Agent 协作框架的格局</h3>\n<p>兴起逻辑很直观：单个 Agent 上下文有限、角色混杂（又规划又执行又检查，自己查自己），拆成角色专精的多个 Agent，理论上各管一段、互相校验。代表框架（均为开源项目）：AutoGen（微软，2023 年）主打多 Agent 对话编排；MetaGPT（2023 年）把软件公司的 SOP 与角色分工（产品经理、架构师、工程师）写进协作流程；CrewAI（2023 年）以「组建团队、分配任务」的抽象降低上手门槛；CAMEL（2023 年论文）是更早的角色扮演式双 Agent 对话探索。2024 年的 LangGraph（LangChain 团队）代表了另一种取向：把多步与多 Agent 组织成<strong>带状态的图</strong>，节点、边、检查点全由开发者显式定义——与其说是「多 Agent 自由协作」，不如说是「可控编排」。</p>\n<p>格局性结论（公开报道口径）：2024–2025 年多 Agent 框架经历了一轮大爆发与快速分化。自由对话式的「一群 Agent 开会」在生产环境里稳定性、成本与可调试性都吃亏，如今声量明显下降；活得更好的是图编排与角色流水线这类<strong>边界清晰、状态显式</strong>的路线。判断口径留给学员：企业场景里，绝大多数任务是单 Agent 加好工具就能解的，多 Agent 只在任务天然可拆、子任务可并行或需要独立复核时才划算。</p>\n<h3 id=\"2-mcp\">2. MCP：工具接入的协议层</h3>\n<p>MCP（Model Context Protocol）由 Anthropic 于 2024 年 11 月开源发布（厂商官方）。它解决的是一个算术问题：没有标准时，M 个模型应用 × N 个工具要写 M×N 套对接；有了标准，工具方只需按 MCP 实现一次服务端，任何支持 MCP 的客户端都能用——M+N。协议定义了三类可暴露的能力：Tools（可调用的函数）、Resources（可读取的数据）、Prompts（可复用的提示模板）。业务轨第 4 周你们已经在 Dify 里实际接过 MCP 工具，本讲只补它在代际坐标中的位置：<strong>它是「工具」这件外包的标准化时刻</strong>。2025 年 3 月，OpenAI 官方宣布在其产品与 SDK 中支持 MCP——最大竞争对手的采纳，是它从「一家的协议」变成「行业的协议」的标志性事件（厂商官方口径）；此后国内主流平台陆续跟进（公开报道口径）。</p>\n<h3 id=\"3-a2a\">3. A2A：智能体之间的协议层</h3>\n<p>工具接好了，Agent 与 Agent 之间还缺一层。A2A（Agent2Agent）由 Google 于 2025 年 4 月发布（厂商官方），2025 年内移交 Linux 基金会托管（基金会与厂商公告口径）。它管三件事：<strong>能力发现</strong>（每个 Agent 用 Agent Card 声明自己会什么）、<strong>任务委托</strong>（把任务作为有生命周期的对象交出去、跟踪状态）、<strong>产物交付</strong>（结果以文件、消息等形态回传）。与 MCP 的分工可以用一句话钉住：<strong>MCP 管 Agent 向下接工具，A2A 管 Agent 横向找同伴</strong>。两个协议目前都在快速演进，版本号与细节开课前务必按当周官方文档复核——这一点本身就是本讲常见坑之一。</p>\n<h3 id=\"4_2\">4. 为什么说协议层是分水岭</h3>\n<ul>\n<li><strong>集成成本的结构变了</strong>。对接从「一个项目写一套」变成「实现一次、处处可用」，工具与 Agent 第一次可以独立开发、独立升级、独立采购。</li>\n<li><strong>生态可以分层生长</strong>。工具方专心做好工具，平台方专心做好运行时，模型方专心做好推理——每一层不必等其他层，正如 HTTP 之后浏览器与服务器各自狂奔。</li>\n<li><strong>企业治理有了落点</strong>。权限、审计、限流如果逐个系统各做一遍，永远做不齐；收敛到协议层的网关与注册中心，才有可能统一管控——这是 E2 的核心议题之一。</li>\n<li><strong>但协议热不等于落地熟</strong>。标准年轻意味着实现质量参差、安全模型还在补课（工具投毒、越权调用已有公开讨论），企业引入时要按「试点接入、网关收口」的节奏来，不可裸奔。</li>\n</ul>\n<h2 id=\"4_3\">六、第 4 代：走向自主——界面与时长也被外包</h2>\n<p>第 1 到第 3 代的 Agent 始终活在「有 API 的世界」里。第 4 代的突破口是把操作面从 API 扩展到人类用的界面，把单次任务时长从分钟级拉到小时级。</p>\n<h3 id=\"1-computer-use\">1. Computer Use：直接操作屏幕</h3>\n<p>2024 年 10 月，Anthropic 随 Claude 3.5 Sonnet 发布 Computer Use（公测，厂商官方）：模型看屏幕截图、输出鼠标键盘操作，在真实桌面软件里完成任务。这一步与第 0 代 RPA 构成全讲最值得玩味的一组对照：<strong>同一个战场（没有 API 的存量软件），两代打法</strong>——RPA 靠预先录制的坐标与元素定位，界面一变就断；Computer Use 靠当场理解画面，灵活得多，但每一步都要「看图思考」，慢、贵，且会看错点错。浏览器操作是其中最先成熟的子集：OpenAI 的 Operator（2025 年 1 月，厂商官方）等产品把「替人逛网页办事」做成独立品类，2025 年内又被各家陆续并入通用 Agent 形态（公开报道口径）。</p>\n<h3 id=\"2-agent_1\">2. 深度研究类 Agent：第一个跑通的长时任务形态</h3>\n<p>Deep Research 由 Google 于 2024 年 12 月先在 Gemini 上线，OpenAI 于 2025 年 2 月跟进同名产品（均为厂商官方），国内厂商随后陆续推出同类功能（公开报道口径）。它的形态特征值得记住：接到一个开放问题后，自主规划检索路径、读几十上百个来源、边读边修正方向，运行数分钟到数十分钟，最后交付一份带引用的结构化报告。它是第一个被大众用户认知的「长时任务 Agent」，证明了三件事：任务可以长、过程可以无人值守、产物可以达到「能直接拿去用」的完成度——尽管引用准确性仍需人工抽查，这也是它留给人的最后一道工序。</p>\n<h3 id=\"3-agent_1\">3. 编码 Agent：自主最先规模化的领域</h3>\n<p>编码是第 4 代的样板间。这条线走了三步：代码补全（GitHub Copilot，2021 年上线预览，厂商官方）只做「写下一行」；对话式改码把粒度放大到函数与文件；自主编码 Agent（Anthropic 的 Claude Code、OpenAI 的新一代 Codex 等，2025 年起陆续发布，厂商官方）则能接一个工单级的任务，自己读代码库、改多处文件、跑测试、根据报错修到通过为止。为什么偏偏编码域先跑通？三个条件：<strong>环境可沙盒</strong>（改坏了不影响生产）、<strong>结果可验证</strong>（测试通过与否是硬标准）、<strong>失败可回滚</strong>（版本控制一键还原）。记住这三条，它们就是 E2 里判断「某个场景能不能上高自主」的通用尺子。</p>\n<h3 id=\"4_4\">4. 自我验证：长时任务的另一半</h3>\n<p>任务拉长后，「做完」和「做对」之间会出现裂缝：第 4 代的标配动作是让 Agent 自带验收——写完代码跑测试、写完报告核引用、填完表格对清单，验不过就自己回炉。这本质是把第 2 代的反思从「失败后复盘」前移成「交付前自检」，再配上检查点与回滚，长时运行才有基本的可靠性叙事。同时，SWE-bench（普林斯顿，2023 年论文）这类「用真实任务、按可验证标准打分」的基准，成为衡量自主能力的主尺子——演示视频从此不再算数，通过率才算数。</p>\n<h3 id=\"5\">5. 自主等级：按场景标，不按产品标</h3>\n<p>业界讨论里常借用自动驾驶 L0–L5 的分级直觉（通行类比，非统一标准；下表为 Muse 整理的企业口径）：</p>\n<table>\n<thead>\n<tr>\n<th>等级</th>\n<th>形态</th>\n<th>人的角色</th>\n<th>大致对应</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>L0</td>\n<td>固定流程自动执行</td>\n<td>设计规则</td>\n<td>第 0 代</td>\n</tr>\n<tr>\n<td>L1</td>\n<td>给建议、出草稿</td>\n<td>采纳并执行</td>\n<td>普通聊天 AI + RAG 问答</td>\n</tr>\n<tr>\n<td>L2</td>\n<td>副驾驶：Agent 逐步执行</td>\n<td>每步确认</td>\n<td>业务轨第 3、4 周的助手（发送前确认）</td>\n</tr>\n<tr>\n<td>L3</td>\n<td>有监督自主：边界内自己跑</td>\n<td>定边界、处理异常上报</td>\n<td>第 2–3 代的成熟部署</td>\n</tr>\n<tr>\n<td>L4</td>\n<td>高度自主：长时运行</td>\n<td>抽查与事后审计</td>\n<td>第 4 代在编码、研究等可验证场景</td>\n</tr>\n<tr>\n<td>L5</td>\n<td>完全自主</td>\n<td>——</td>\n<td>目前无生产共识，不存在</td>\n</tr>\n</tbody>\n</table>\n<p>两条纪律：其一，等级必须落到<strong>单个场景</strong>上谈——同一个平台，查资料是 L3、动付款连 L2 都不该给；其二，企业里合理的目标从来不是全场 L4，而是让每个场景停在「风险与收益匹配」的那一级。2025–2026 年的整体格局（公开报道口径）是：竞争焦点已从「能不能演示自主」转向「长时任务的成功率与单位成本」，编码与深度研究是最先规模化的两个场景，通用办公与电脑操作仍在可靠性爬坡期。</p>\n<h2 id=\"_2\">七、四条驱动线小结：每一代是哪条线突破带来的</h2>\n<p>把五代走读压缩成一张驱动表。以后再看到任何「Agent 新突破」的新闻，先问一句：它动的是哪条线？</p>\n<table>\n<thead>\n<tr>\n<th>驱动线</th>\n<th>第 0→1 代</th>\n<th>第 1→2 代</th>\n<th>第 2→3 代</th>\n<th>第 3→4 代</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>模型能力</strong></td>\n<td>指令跟随与推理能力达标，CoT/ReAct 才成立</td>\n<td>更长、更稳的多步推理撑起规划与反思</td>\n<td>工具调用可靠性成为独立训练目标</td>\n<td>多模态理解（看懂屏幕）与长程推理</td>\n</tr>\n<tr>\n<td><strong>上下文长度</strong></td>\n<td>窗口够放下「轨迹 + 工具结果」</td>\n<td>窗口仍不够用，逼出外置记忆</td>\n<td>多 Agent 本质是把上下文按角色切分</td>\n<td>长窗口 + 检查点支撑小时级任务</td>\n</tr>\n<tr>\n<td><strong>工具生态</strong></td>\n<td>从零散 API 封装起步</td>\n<td>工具数量上来后，管理与选型成问题</td>\n<td>MCP 让工具供给标准化、市场化</td>\n<td>工具面扩展到 GUI 本身</td>\n</tr>\n<tr>\n<td><strong>协议标准</strong></td>\n<td>Function Calling 定下调用契约</td>\n<td>框架各自实现，互不相通</td>\n<td>MCP 向下、A2A 横向，协议层成型</td>\n<td>协议之上才谈得上跨厂商的长时协作</td>\n</tr>\n</tbody>\n</table>\n<p>两个推论。其一，<strong>代际推进从来不是单线突破</strong>：ReAct 的论文 2022 年就有，但它要等模型能力、够用的窗口、Function Calling 三样凑齐，才在 2023 年变成产品。其二，<strong>卡点会轮换</strong>：当下这一代的瓶颈不在模型智商，而在可靠性与成本——这就是为什么 E2 讲的全是治理、评测与成本，而不是新框架。</p>\n<h2 id=\"_3\">八、每代在企业里的现状：分层共存，不是新陈代谢</h2>\n<table>\n<thead>\n<tr>\n<th>代际</th>\n<th>还活着吗</th>\n<th>活在哪</th>\n<th>与下一代的关系</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>第 0 代</td>\n<td>活得很好</td>\n<td>OA 审批流、财务 RPA、批处理与报表搬运</td>\n<td>骨架被沿用：新一代的「可控外壳」就是它</td>\n</tr>\n<tr>\n<td>第 1 代</td>\n<td>主流形态</td>\n<td>智能客服、知识问答 + 工具调用、各类平台助手</td>\n<td>是 2、3 代的运行底座，循环内核不变</td>\n</tr>\n<tr>\n<td>第 2 代</td>\n<td>按需启用</td>\n<td>高价值长任务的规划、客服与销售场景的记忆、高风险动作的复核</td>\n<td>能力被平台吸收为可配置项，默认半开</td>\n</tr>\n<tr>\n<td>第 3 代</td>\n<td>试点转生产</td>\n<td>MCP 接工具已在多家企业进生产；A2A 与多 Agent 协作多在试点</td>\n<td>正在成为集成标准，未收敛前与私有对接并存</td>\n</tr>\n<tr>\n<td>第 4 代</td>\n<td>点状突破</td>\n<td>编码、深度研究已规模化使用；电脑操作类限于低风险场景试用</td>\n<td>与低代长期共存，按场景逐个升等级</td>\n</tr>\n</tbody>\n</table>\n<p>这张表要配一句话读：<strong>企业落地的艺术，是给每件事选对代际与等级，而不是追最新的一代。</strong>把这句话带进 E2——那里我们把公司自己的场景清单逐个摆上这张表。</p>\n<h2 id=\"react\">九、实操：手写一个 ReAct 循环，再与平台助手对照</h2>\n<h3 id=\"1_1\">1. 目标与准备</h3>\n<p>不用任何 Agent 框架，百行左右的 Python，直接调用公司本地 vLLM 服务（DGX Spark 上的 Qwen3.8，OpenAI 兼容接口；服务地址与模型名以技术轨第 2 周部署文档为准，开课前由讲师确认可达）。事先备好两个只读工具函数：</p>\n<ul>\n<li><code>get_weather(city)</code>：课堂版使用脚本内置的模拟天气字典（避开外部 API 密钥与网络变量，重点在循环本身）；</li>\n<li><code>get_project_status(project_id)</code>：读取本地一个模拟项目库 JSON（项目状态、计划完成日、负责人），呼应业务轨第 4 周的状态查询场景；</li>\n<li>可选 <code>calc_days(date_a, date_b)</code>：计算两个日期的间隔天数，逼出「两次工具调用有先后依赖」的任务。</li>\n</ul>\n<h3 id=\"2_1\">2. 两条路线，先看清、再简化</h3>\n<p><strong>路线 A（教学优先）：纯提示词 ReAct。</strong>在 system 提示里约定输出格式——每轮只输出 <code>Thought:</code> 加 <code>Action:</code>（工具名与 JSON 参数），或输出 <code>Final Answer:</code> 结束；程序用字符串解析提取行动、执行工具、把结果以 <code>Observation:</code> 拼回对话，循环上限 6 步。格式约定与解析规则全部写在讲义示例代码中，学员照抄可跑。</p>\n<p><strong>路线 B（现代做法）：Function Calling。</strong>同一组工具改用接口的 <code>tools</code> 参数声明，模型直接返回结构化调用，程序不再解析文本。此路线依赖服务端开启工具调用支持，开启方式以开课当周 vLLM 文档为准，讲师课前预演一遍。</p>\n<p>课堂顺序先 A 后 B：先亲手看清循环的每一根线，再看标准化把其中哪几根线收走了。</p>\n<h3 id=\"3_1\">3. 步骤</h3>\n<ol>\n<li><strong>环境确认</strong>（5 分钟）：调一次普通对话接口，确认服务可达、模型名正确。</li>\n<li><strong>写工具与描述</strong>（10 分钟）：补全三个工具函数，并为每个工具写一句话用途与参数说明——写得含糊，待会儿模型就选错，用亲身教训理解「工具描述就是接口文档」。</li>\n<li><strong>跑通两步任务</strong>（15 分钟）：提问「P-102 项目现在什么状态？距离计划完成日还有几天？需要先查哪天的天气来安排现场验收（城市见项目库）？」这类需要串联两次以上调用的问题，全程打印轨迹，逐行对照第三节的 Thought/Action/Observation。</li>\n<li><strong>制造错误并补恢复</strong>（15 分钟）：换一个不存在的项目号提问，观察裸循环如何收场；然后给循环加上两条规则——工具报错时把错误信息作为 Observation 喂回让模型换路或道歉收尾、步数到顶强制结束并说明未完成项。对照第四节的错误恢复清单，指出自己刚补的是哪几项。</li>\n<li><strong>换路线 B 重跑</strong>（10 分钟）：同一问题、同一工具，对照两次轨迹：格式出错的概率、代码量、日志可读性各有什么变化。</li>\n<li><strong>填代际对照表</strong>（15 分钟）：见下表，逐项写一句结论。</li>\n</ol>\n<table>\n<thead>\n<tr>\n<th>对照维度</th>\n<th>本讲手写版</th>\n<th>业务轨扣子 / Dify 助手</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>思考方式</td>\n<td>模型运行时自循环，路径不预设</td>\n<td>工作流预编排为主，Agent 节点内才自循环</td>\n</tr>\n<tr>\n<td>工具接入</td>\n<td>代码里注册函数，无标准协议</td>\n<td>平台插件市场；Dify 可经 MCP 接入</td>\n</tr>\n<tr>\n<td>记忆</td>\n<td>只有本轮上下文，关掉即忘</td>\n<td>平台提供会话变量与知识库，仍非长期记忆</td>\n</tr>\n<tr>\n<td>可控性</td>\n<td>灵活，但护栏要自己逐条写</td>\n<td>流程可视化、节点级日志，约束强、上限低</td>\n</tr>\n<tr>\n<td>排障</td>\n<td>看全程轨迹文本</td>\n<td>看节点运行日志与输入输出</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"4_5\">4. 降级方案与验收</h3>\n<p>本地服务不可用时，改用 Dify 的 Agent 节点（FunctionCalling 策略，第 4 周已学）完成同样的两步任务与错误场景，对照表照常填写——本讲的考核点是代际判断，不是代码本身。</p>\n<p><strong>验收标准</strong>：① 两步任务跑通，轨迹完整且能逐行复述每一步的因果；② 报错场景不死循环、能合理收尾，并说得出补的是哪条恢复规则；③ 对照表五行齐全，每行能说出「代价是什么」；④ 能指出手写版缺了平台的哪三样东西——权限管控、日志审计、限流与预算护栏（这正是 E2 的内容清单）。</p>\n<p><strong>安全纪律</strong>：本讲工具一律只读模拟数据；任何接真实系统的写操作，都必须等 E2 的治理口径讲完再谈。</p>\n<h2 id=\"_4\">十、常见坑清单</h2>\n<ol>\n<li><strong>把套壳聊天当 Agent</strong>。只有知识库问答、没有工具、没有循环，就不是 Agent——判断标准回到业务轨第 3 周那句：能为了目标连续采取动作，才算。</li>\n<li><strong>迷信多 Agent</strong>。角色越多，上下文碎片、互相甩锅与成本膨胀越严重；多数企业任务是「单 Agent + 好工具」胜过「一群 Agent 开会」。先单后多，能单不双。</li>\n<li><strong>拿演示视频当能力边界</strong>。演示是剪出来的成功路径，要问的是成功率、步数分布、失败模式与单次任务成本——第 4 代尤其如此。</li>\n<li><strong>协议名词与版本对不上</strong>。MCP、A2A 都在快速演进，去年读的教程今年就可能过时；引用必带版本与日期，选型看实现质量，不看名词新旧。</li>\n<li><strong>拿第 4 代的形态套第 0 代的场景</strong>。审批、付款、对账要的是确定性与审计，把自主等级拉满不是先进，是事故源。</li>\n<li><strong>忽略成本账</strong>。Agent 的 token 消耗是普通聊天的数倍乃至数十倍：轨迹、多轮工具、反思与重试都在烧钱。上线前按进阶 C2 的口径算清单任务成本，别等账单教育人。</li>\n<li><strong>只盯着换模型</strong>。生产 Agent 的成败大头在工具质量、护栏与可观测性上；模型升级带来的提升，往往不如把工具描述写清楚、把错误恢复补完整。</li>\n<li><strong>把记忆当成存得越多越好</strong>。长期记忆写错一条，污染的是之后所有会话；先定写入规则与纠错通道，再谈记忆容量。</li>\n</ol>\n<h2 id=\"_5\">十一、课后练习与延伸阅读</h2>\n<p><strong>课后练习</strong></p>\n<ol>\n<li>从公司现有系统里挑三个场景（各部门的自动化或 AI 应用均可），逐个标代际与自主等级，各写一句依据；至少有一个场景要论证「为什么不该升到更高等级」。</li>\n<li>把实操中的步数上限分别改成 2 和 20，重复第 3、4 步，记录行为差异（完成率、轨迹长度、成本），用第四节的概念解释现象。</li>\n<li>选一个现存的第 0 代 RPA 场景，写一页纸：如果用 Computer Use 重做，收益、风险、验证方式各是什么？结论落到「做 / 不做 / 试点」三选一。</li>\n</ol>\n<p><strong>延伸阅读</strong>（逐条标注来源类型）</p>\n<ul>\n<li>ReAct 论文（Yao et al., 2022，arXiv:2210.03629）——本讲的源头文本，重点读其循环格式与案例。</li>\n<li>CoT 论文（Wei et al., NeurIPS 2022）——理解「思考外显」这一步是怎么被发现的。</li>\n<li>Reflexion 论文（Shinn et al., 2023）与 MemGPT 论文（Packer et al., 2023）——第 2 代反思与记忆两支的原典，读摘要与方法图即可。</li>\n<li>MCP 官方文档（modelcontextprotocol.io，Anthropic 发起、社区维护；以开课当周版本为准）；A2A 官方文档与规范（Google 发布、Linux 基金会托管；以当周版本为准）。</li>\n<li>WaytoAGI 社区《1.3 AI Agents》板块与《MCP 协议：案例精选》（社区索引，本地存档 materials/00），以及社区文章《为什么 LLM 的长期记忆仍然是一个未解决的问题》（存档同上）——看国内实践者怎么用、怎么吐槽。</li>\n<li>回看内部材料：业务轨第 3 周讲义（Agent 部件与工作流选型）、第 4 周讲义（MCP 链路与权限口径），把当时的操作经验对回本讲的坐标系。</li>\n</ul>\n<hr />\n<h2 id=\"_6\">附：讲师备注</h2>\n<ul>\n<li>前半（第 0–1 代）业务轨学员在场，节奏放慢，多用业务轨第 3 周的投标公告助手、会议室预订案例回扣；第 3 代协议部分学员已在 Dify 里摸过 MCP，讲概念时直接调他们的实操记忆，不要再演示接工具。</li>\n<li>第 4 代只讲格局与判断尺子，不放演示视频——放了视频学员记住的只有「酷」，本讲要的是「它为什么先在编码域跑通」。</li>\n<li>实操路线 B 依赖 vLLM 工具调用开关，课前务必在 Spark 上预演；若版本口径有变，退回纯路线 A + Dify 降级方案，本讲考核点不受影响。</li>\n<li>全讲最容易跑偏的讨论是「Agent 会不会取代岗位」，按既定口径收束到第八节那句：落地的艺术是给每件事选对代际与等级——具体怎么选，是 E2 的正题。</li>\n</ul>"}, {"num": "E2", "ch": "进阶 E · Agent 专题", "label": "E2 Agent 企业落地", "title": "进阶 E2：Agent 企业落地——从试点到规模化，成败在场景、数据、权限与验收", "html": "<h1 id=\"e2agent\">进阶 E2：Agent 企业落地——从试点到规模化，成败在场景、数据、权限与验收</h1>\n<blockquote>\n<p><strong>讲次</strong>：第二阶段进阶专题 · 模块 E（Agent 演进与企业落地）第 2 讲 · 模块 E 结课讲\n<strong>建议时长</strong>：2.5–3 小时（讲授约 100 分钟 + 实操约 80 分钟）\n<strong>前置</strong>：进阶 E1（Agent 演进史，本讲衔接其结论：能力边界由框架与工具生态决定）；进阶 C2（单 token 成本建模，本讲成本账直接沿用其模型与数字）；第一阶段业务轨第 3 周（Agent 设计卡）、第 4 周（Dify + MCP 与人工确认纪律）；技术轨第 2/3 周（本地 vLLM 部署与运维纪律）\n<strong>素材来源</strong>：本讲的方法论、三本账、参考架构与路线图为「Muse 整理」；引用概念逐处标注——Agent 化判据与编排模式承接 E1 讲义口径；成本数字出自进阶 C2 第五节（公司实测与官方定价口径，开课前复核）；人工确认纪律出自业务轨第 3、4 周讲义；公司场景（biz-management、投标公告整理助手、资料问答助手）为公司内部事实。人力单价为教学假设，讲义中逐处标明。</p>\n</blockquote>\n<hr />\n<h2 id=\"_1\">一、学习目标与本讲地图</h2>\n<p>E1 讲清了 Agent 是怎么一步步长出来的。本讲只回答一个问题：<strong>把 Agent 放进一家真实公司，它怎么活下来、怎么扩得开。</strong></p>\n<p>先给结论：企业里 Agent 项目失败，极少死于模型不够聪明。复盘下来，死因高度集中在四件事上——<strong>场景选错</strong>（拿 Agent 去解不该它解的问题）、<strong>数据不通</strong>（要查的东西在 Excel、微信群和某个人的电脑里）、<strong>权限失控</strong>（要么不敢给权限、Agent 什么都办不了；要么给满权限、没人敢上线）、<strong>没有验收</strong>（上线前说不清「做到什么程度算成功」，上线后更说不清「它到底有没有用」）。模型只是这四件事的背景板。</p>\n<p>学完这一讲，你应该能做到五件事：</p>\n<ol>\n<li><strong>会算三本账</strong>：给任何候选场景，能用价值账、成本账、风险账三张表判它该不该做、先做哪个；</li>\n<li><strong>会画场景地图</strong>：把公司内的候选场景按类别摆开，给出适合度判读，并能指出哪些场景明确不适合硬上；</li>\n<li><strong>会搭参考架构</strong>：说清模型层双通道、编排层、工具与数据层、网关层四层各管什么，人工确认点画在哪；</li>\n<li><strong>会处理六个关键工程问题</strong>：权限、审计、评估、可观测、兜底、版本——每个问题知道最低限度的合格做法；</li>\n<li><strong>交得出作品</strong>：为一个真实场景产出《落地设计卡》，并能用路线图的验收指标判断一个试点该进、该停还是该退。</li>\n</ol>\n<p>本讲地图：三本账（第二节）→ 场景地图（第三节）→ 参考架构（第四节）→ 关键工程问题（第五节）→ 路线图（第六节）→ 组织与治理（第七节）→ 实操（第八节）→ 坑单（第九节）→ 练习与阅读（第十节）。</p>\n<p><strong>一条贯穿全讲的纪律</strong>（承接业务轨第 3 周）：主干流程固定，局部环节智能，关键动作人工确认。E1 里那些炫酷的自主 Agent 演示，落进企业都要先过这条纪律——不是保守，是因为企业里每个动作都有后果、每个后果都要有人负责。</p>\n<hr />\n<h2 id=\"_2\">二、落地前三本账：先算清楚，再谈技术</h2>\n<p>任何 Agent 场景动手之前，先算三本账。三本账任何一本算不过，场景就不立项——这比任何技术选型都重要（Muse 整理）。</p>\n<h3 id=\"21-agent\">2.1 价值账：什么样的任务适合 Agent 化</h3>\n<p>一个任务值不值得 Agent 化，看四个判据，缺一不可：</p>\n<table>\n<thead>\n<tr>\n<th>判据</th>\n<th>问什么</th>\n<th>不过的样子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>高频</strong></td>\n<td>这件事每周发生多少次？单次省下的时间 × 频次，够不够摊掉建设与维护成本？</td>\n<td>一年做两次的年终汇报，写得再好也不回本</td>\n</tr>\n<tr>\n<td><strong>规则可述</strong></td>\n<td>流程能不能用语言说清？判断标准能不能写成清单？</td>\n<td>「靠经验感觉」的定价谈判，规则说不清，Agent 无从学起</td>\n</tr>\n<tr>\n<td><strong>容错空间</strong></td>\n<td>出错一次的代价是什么？错了能不能撤回、能不能被人审出来？</td>\n<td>直接对外付款、发正式承诺——零容错的动作不能交给 Agent 无监督执行</td>\n</tr>\n<tr>\n<td><strong>人工成本</strong></td>\n<td>现在是谁在做、花多少时间、这些时间值多少钱？</td>\n<td>本来就是系统自动完成的流程，再套一层 Agent 是负价值</td>\n</tr>\n</tbody>\n</table>\n<p>价值账的算法很朴素（教学口径，Muse 整理）：<strong>年价值 ≈ 单次耗时（小时）× 年频次 × 人力单价 − 全年运行与维护成本</strong>。人力单价本讲统一用教学假设 <strong>150 元/小时</strong>（综合人力成本口径，实际立项时换公司真实口径重算）。</p>\n<p>拿公司的投标公告整理举例：过去靠人工每天刷多个采购平台、下载公告、摘录关键字段、判断是否跟进，熟练人员约 1.5 小时/天，全年按 250 个工作日算约 375 小时，折合约 5.6 万元/年的人力。业务轨第 3 周已经做出了「投标公告整理助手」原型——这个场景四条判据全过：高频（每天）、规则可述（字段清单与跟进标准可写成表）、容错空间大（产物是内部简报，是否投标由人拍板）、人工成本实在。<strong>这就是一个满分场景长相：Agent 干收集与整理，人干判断与承诺。</strong></p>\n<p>反过来算一笔反例账：给老板做「智能经营日报」，数据源是 biz-management 里尚未录全的经营数据——频次是够（每天），但数据完整性这一关在价值账里就该被否掉：数据不全时，日报越自动、错得越理直气壮。<strong>价值账里要专门留一行查「数据现成程度」</strong>，数据不在系统里、靠人临时补的场景，先补数据，再谈 Agent。</p>\n<h3 id=\"22-api\">2.2 成本账：云 API 与本地部署怎么选</h3>\n<p>成本账沿用 C2 的模型与数字，不重新发明（进阶 C2 第五节）：</p>\n<ul>\n<li><strong>本地部署</strong>（公司 2×DGX Spark 跑 Qwen3.8-Flash）：成本几乎全是固定投入，单位成本由利用率决定——利用率 100% 时约 <strong>43 元/百万 token</strong>，30% 时约 <strong>145 元</strong>，10% 时约 <strong>430 元</strong>。硬件已经买了，边际成本的关键是「利用率能不能打上去」。</li>\n<li><strong>云 API</strong>：按量付费、无闲置成本。以 DeepSeek 官方 Flash 档为例，输入约 $0.30、输出约 $1.20 每百万 token，按常见输入输出比例折混合价约合人民币 <strong>4 元/百万 token</strong> 量级（C2 记录的官方价口径，开课前复核）。</li>\n</ul>\n<p>两笔账并排看，结论和 C2 一致：<strong>纯按 token 单价，本地在任何现实利用率下都打不过云 API 的低价档</strong>。所以成本账真正的决策变量不是单价，而是三件事：</p>\n<ol>\n<li><strong>数据敏感度</strong>：敏感数据不出内网是公司既定原则。合同金额、客户信息、经营数据这类内容一旦不能上云，本地通道是唯一选项，成本账直接让位于合规账；</li>\n<li><strong>调用量级与形态</strong>：低频、突发、探索期的场景，云 API 的零固定成本占优；高频、持续、已经跑在内网的场景，本地的固定成本已被其他业务摊着，增量成本接近于零；</li>\n<li><strong>延迟与可用性</strong>：内网调用不受公网波动影响，对交互类场景是体验问题，对批量任务则无关紧要。</li>\n</ol>\n<p>实务上的结论（Muse 整理）：<strong>双通道并行，按数据敏感度分流</strong>——这是第四节参考架构的第一块基石。成本账要算的是「分流之后两边的量各是多少」，而不是在立项时赌一个通道包打天下。</p>\n<h3 id=\"23\">2.3 风险账：四类风险各记一笔</h3>\n<p>风险账不追求量化精确，追求<strong>不漏项</strong>。立项时逐项过，任何一项没有应对方案，场景降级或推迟（Muse 整理）：</p>\n<table>\n<thead>\n<tr>\n<th>风险</th>\n<th>典型形态</th>\n<th>立项时必须给出的应对</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>数据出境</strong></td>\n<td>员工把合同、标书、客户名单粘进云端工具；Agent 自动把内网数据带进云端上下文</td>\n<td>数据分级与分流规则（第四节）；敏感场景只走本地通道；网关层做出口检查</td>\n</tr>\n<tr>\n<td><strong>权限放大</strong></td>\n<td>Agent 拿着某个人的账号或一张万能 API Key，能看到、能改的东西远超任务所需</td>\n<td>权限最小化与身份透传（第五节 5.1）；工具按只读/读写分级</td>\n</tr>\n<tr>\n<td><strong>幻觉执行</strong></td>\n<td>模型编造了一个不存在的字段值、一条不存在的制度，然后<strong>真的照着执行了</strong>——查询类幻觉只是答错，执行类幻觉是办错事</td>\n<td>高风险动作人工确认；执行前参数校验与二次核对；只读优先</td>\n</tr>\n<tr>\n<td><strong>责任归属</strong></td>\n<td>Agent 办错事，算开发的、用的、还是批的人的？说不清，就没人敢批、没人敢用</td>\n<td>审计留痕（5.2）；每个 Agent 有明确的业务 owner（第七节）；出错走人工流程追责到「批准动作的人」</td>\n</tr>\n</tbody>\n</table>\n<p>风险账还有一条容易被忘的：<strong>风险随规模放大</strong>。试点期 3 个人用、出一次错当场就发现；推广到全公司 300 人用，同样的错误率就是每天出事。路线图（第六节）每一阶段的验收指标里都埋了风险项，原因在此。</p>\n<hr />\n<h2 id=\"agent\">三、场景地图：公司里哪些活适合 Agent</h2>\n<p>把候选场景按三类摆开，每类给出适合度判读和反例。判读口径统一：★★★ 四判据全过、可直接立项；★★ 有条件（需先补数据或先收权限）；★ 不适合硬上（Muse 整理）。</p>\n<h3 id=\"31\">3.1 对内提效类</h3>\n<table>\n<thead>\n<tr>\n<th>场景</th>\n<th>适合度</th>\n<th>判读</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>制度与资料知识问答</td>\n<td>★★★</td>\n<td>高频、规则可述（答案以资料为准）、零执行风险。业务轨已有「资料问答助手」原型，是公司最稳的第一个规模化候选</td>\n</tr>\n<tr>\n<td>文档处理：公告/文件摘录、格式整理、会议纪要</td>\n<td>★★★</td>\n<td>产物都是草稿形态，人审后使用，容错空间大</td>\n</tr>\n<tr>\n<td>经营数据自然语言查询（biz-management）</td>\n<td>★★</td>\n<td>价值高，但两个前提：数据要先录全、且查询必须落到结构化取数而非让模型「算账」——金额类问题只许走工具取数，模型只负责翻译问题与组织答复</td>\n</tr>\n<tr>\n<td>帮员工写周报、写邮件草稿</td>\n<td>★★</td>\n<td>能做，但价值账偏薄：单次省时有限，且产物质量参差；适合作为推广期的「体验场景」，不适合作为立项主场景</td>\n</tr>\n</tbody>\n</table>\n<p><strong>反例</strong>：让 Agent 自动给全员发通知、自动回复外部邮件——发送动作本身零容错，且这类需求用普通工作流（固定模板 + 定时触发）就能解决，套 Agent 是杀鸡用牛刀还多担风险。<strong>能用确定流程解决的，不要 Agent 化</strong>，这是场景地图的第一条筛选线（与 E1 的编排模式结论呼应：工作流适合确定性强的任务，Agent 留给真正需要判断的环节）。</p>\n<h3 id=\"32\">3.2 业务流程类</h3>\n<table>\n<thead>\n<tr>\n<th>场景</th>\n<th>适合度</th>\n<th>判读</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>招投标信息处理：公告抓取、字段摘录、跟进初筛</td>\n<td>★★★</td>\n<td>公司主营业务、高频、已有原型；人工确认点在「是否投标、是否交保证金、正式报名」（业务轨第 3 周已定）</td>\n</tr>\n<tr>\n<td>标书辅助：历史标书检索、资质文件清单核对、响应表初稿</td>\n<td>★★</td>\n<td>检索与核对部分适合度高；<strong>正文撰写只能出草稿</strong>——标书错一字可能废标，终稿责任必须落在人身上</td>\n</tr>\n<tr>\n<td>合同与经营数据问答：合同条款查询、回款状态、商机阶段（biz-management）</td>\n<td>★★</td>\n<td>数据已在系统内是最大优势；前提同 3.1：取数走工具、金额零编造、按提问者权限过滤可见范围</td>\n</tr>\n</tbody>\n</table>\n<p><strong>反例</strong>：让 Agent 自动生成投标报价或自动判断「这个标能不能投」。报价与投/不投是经营决策，判据里有大量说不清的经验成分（客户关系、产能排期、竞争态势），规则不可述，且一次错误代价以十万计。这类场景 Agent 的正确位置是<strong>把判断所需材料备齐</strong>（公告要点、历史同类项目、资质匹配度），判断本身留给人。</p>\n<h3 id=\"33\">3.3 对客服务类</h3>\n<table>\n<thead>\n<tr>\n<th>场景</th>\n<th>适合度</th>\n<th>判读</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>售前助手：产品资料问答、方案素材检索（内部人员使用）</td>\n<td>★★</td>\n<td>本质是 3.1 的知识问答换个知识库，适合度同级</td>\n</tr>\n<tr>\n<td>客服助手：常见问题答复草稿、工单分类与摘要</td>\n<td>★★</td>\n<td>草稿形态可用；直接面向客户自动回复要等评估与审计能力齐备后再议</td>\n</tr>\n<tr>\n<td>客户侧自助问答（对外开放）</td>\n<td>★</td>\n<td>对外即承诺：答错一句就是公司的正式表态。数据出境、责任归属、品牌风险三笔账都不划算，中小公司现阶段不建议做</td>\n</tr>\n</tbody>\n</table>\n<p><strong>反例汇总（一句话版）</strong>：凡是「动作不可撤回 + 后果对外 + 判据说不清」三条占两条以上的场景，现阶段一律不做全自动 Agent，最多做到「备料 + 草稿 + 人工确认」。</p>\n<hr />\n<h2 id=\"_3\">四、参考架构：四层两通道一个人审</h2>\n<p>参考架构不绑定某个产品，是一张分工图：无论用 Dify、扣子还是自研编排，这四层职责都要有人承担（Muse 整理）。公司版本如下：</p>\n<pre><code>                        ┌─────────────────────────────┐\n   员工 / 业务系统 ────▶ │ 网关层：鉴权 · 限流 · 审计日志 │ \n                        └──────────────┬──────────────┘\n                                       ▼\n                        ┌─────────────────────────────┐\n                        │ 编排层：流程与 Agent 逻辑      │\n                        │ （Dify 工作流 / 自研编排）     │\n                        │ ★ 人工确认点嵌在这里           │\n                        └───────┬──────────────┬──────┘\n                                ▼              ▼\n                 ┌───────────────────┐  ┌────────────────────┐\n                 │ 模型层（双通道）    │  │ 工具与数据层         │\n                 │ · 本地 vLLM（内网） │  │ · biz-management API │\n                 │ · 云 API          │  │ · 知识库（RAG）      │\n                 │ 按敏感度分流        │  │ · MCP 工具接入       │\n                 └───────────────────┘  └────────────────────┘\n</code></pre>\n<p><strong>模型层：双通道，按数据敏感度分流。</strong> 本地通道是公司内网的 vLLM 服务（Qwen3.8-Flash，OpenAI 兼容 API），云通道是合规采购的云 API。分流规则在立项时按场景定死，不让运行时「随便选」：涉及合同、客户、经营数据的场景只走本地；公开资料处理、通用写作类可走云端。分流决策写进《落地设计卡》（第八节），审计日志里要能看到每个请求实际走了哪条通道。</p>\n<p><strong>编排层：流程与判断的所在地。</strong> 主干用工作流写死（步骤、分支、重试都可预期），只在需要理解与判断的节点放 Agent 能力。业务轨用 Dify 工作流已经验证过这条路线；规模上去之后，无论换不换平台，<strong>编排逻辑要能导出、能版本管理</strong>（第七节、5.6），不能只活在一个网页控制台里。</p>\n<p><strong>工具与数据层：Agent 的手只能伸到这里。</strong> 业务系统通过 API 或 MCP 暴露工具：biz-management 提供合同查询、回款查询、商机查询等只读接口优先，写操作单独审批；知识库提供带出处引用的检索。工具清单即权限清单——Agent 能调什么工具，它就能办什么事，治理从这张清单开始（5.1）。</p>\n<p><strong>网关层：所有调用的必经之路。</strong> 统一鉴权（谁在用、代表哪个部门）、限流与配额（防止某个失控的循环调用一夜烧掉预算）、审计日志（全量记录，见 5.2）。试点期可以借平台自带能力简配，但<strong>任何直连模型、绕开网关的调用都是架构违规</strong>——没有日志的调用等于没发生过，出事时也等于查不到。</p>\n<p><strong>人工确认点：画在流程图上，不是写在口号里。</strong> 确认点的设置标准（承接业务轨纪律）：动作不可撤回、后果对外、金额相关、权限变更——命中任一条，动作必须停在人审。确认不是把弹窗点掉：确认界面要给出 Agent 的依据（引用了哪份资料、取了哪条数据）、将执行的确切参数，人点的是「我核对过」。</p>\n<hr />\n<h2 id=\"_4\">五、关键工程问题：六件上线前必须做完的事</h2>\n<p>设计讲完，这一节讲「不做完不许上线」的六件事。每件给出最低合格线（Muse 整理）。</p>\n<h3 id=\"51\">5.1 权限最小化与身份透传</h3>\n<p>两条原则。<strong>其一，Agent 的权限 = 本次任务的最小集</strong>：只读任务只给只读工具；工具按「查询 / 草稿写入 / 正式执行」三级分开授权，级别在工具注册时定死。<strong>其二，身份透传</strong>：Agent 调业务系统时，必须带着<strong>当前使用者的身份</strong>去调，让业务系统按这个人的原有权限过滤数据——而不是用一个超级账号替所有人查。biz-management 的经营数据问答就是试金石：销售只能看到自己片区的商机，Agent 透传他的身份，系统自然只返回他能看的；若 Agent 用管理员账号取数再「靠提示词约束它别说」，等于把权限系统换成了模型的自觉，不合格。</p>\n<h3 id=\"52\">5.2 审计留痕与可回放</h3>\n<p>每次运行至少记录：谁、何时、问了什么、走了哪个模型通道、调了哪些工具及参数、引用了哪些资料、产出了什么、哪一步有人确认、确认人是谁。要求是<strong>可回放</strong>：拿着日志能把一次运行完整重演，用来回答三类问题——用户投诉「它乱说」时查依据、出错时定位是哪一步坏的、合规检查时证明敏感数据没出内网。日志保留期与公司文档管理口径对齐，含敏感内容的日志本身也要按敏感数据管理。</p>\n<h3 id=\"53\">5.3 评估集与回归测试</h3>\n<p>这是全讲最容易被跳过、上线后代价最大的一件（Muse 整理；方法承接第一阶段技术轨第 5/6 周的冻结测试集纪律）：</p>\n<ul>\n<li><strong>上线前建评估集</strong>：每个场景准备一组真实问题（建议 30–50 条起步）配标准答案或评分要点，覆盖正常、边界、诱导出错三类。没有评估集，不许声称「效果不错」；</li>\n<li><strong>变更必过回归</strong>：改提示词、换模型、升级知识库、调工具——任何一项变更，先在评估集上跑一遍，指标不退步才许上线。Agent 系统最常见的事故模式就是「修好了一个问题，悄悄弄坏三个」；</li>\n<li><strong>指标分两层</strong>：任务层（答对率、字段摘录准确率、人工修改率）与系统层（失败率、平均成本、确认驳回率）。人工修改率是性价比最高的真实指标——用户每次都要大改，说明 Agent 在添乱，日志里直接可统计。</li>\n</ul>\n<h3 id=\"54\">5.4 可观测：三本运行账</h3>\n<p>运行期要持续能看到三组数字：<strong>调用链（trace）</strong>——一次请求经过哪些步骤、各步耗时与状态，出问题能定位到步；<strong>成本</strong>——按场景、按通道统计 token 与费用，对回 2.2 的成本账，本地通道同步看利用率；<strong>失败率</strong>——工具调用失败、模型拒答、超时、被人工驳回的比例与趋势。三组数字做成一张周维度报表，由技术 owner 在试点期每周过一遍（第七节）。没有可观测的 Agent 上线，等于闭着眼睛把业务交给它。</p>\n<h3 id=\"55\">5.5 失败兜底与人工接管</h3>\n<p>先承认 Agent 会失败，再设计失败时怎么办（Muse 整理）：</p>\n<ul>\n<li><strong>识别失败</strong>：工具报错、低置信度、评估探针异常、用户连续追问纠正——都要能被系统察觉，而不是等用户投诉；</li>\n<li><strong>降级路径</strong>：Agent 答不了就明说答不了并给出人工渠道，禁止「编一个也要答满」。知识问答类给「未找到依据」是合格答复；</li>\n<li><strong>接管开关</strong>：每个场景都要有业务侧能直接操作的停用开关，停用后流量回到原人工流程。原流程在推广期不许 dismantle（拆除），这是 3.1 说的「影子运行」的另一面：回得去，才敢往前走。</li>\n</ul>\n<h3 id=\"56\">5.6 版本与变更管理</h3>\n<p>提示词、知识库、工作流、工具、模型，五样都是版本化对象：每次变更有版本号、变更说明、评估结果（5.3）、可回滚。特别提醒两条：一是<strong>知识库更新也是变更</strong>——制度文件换版、旧文件下架，都要在知识库同步并留记录，Agent 引用过期制度是最典型的「系统没错、数据错了」；二是<strong>模型版本变更按大变更对待</strong>：云端模型悄悄升级、本地模型换权重，都要重跑评估集并公告使用者，因为同一个提示词在新模型上的行为可能完全不同。</p>\n<hr />\n<h2 id=\"_5\">六、落地路线图：三段路，每段有门</h2>\n<p>路线图的全部意义是<strong>把「感觉不错」换成「指标过门」</strong>（Muse 整理）。</p>\n<h3 id=\"61-1-24\">6.1 阶段一：试点（1 个场景，2–4 周）</h3>\n<ul>\n<li><strong>选场景</strong>：从第三节地图里挑 ★★★ 场景，只挑一个；挑选标准除了判据，还要「出问题影响面小、受益人明确且愿意配合」；</li>\n<li><strong>成功标准先行</strong>：开工前把验收指标写进设计卡，例如「公告字段摘录准确率 ≥ 95%（评估集口径）、单日处理耗时从 1.5 小时降到 20 分钟内、使用者愿意继续用（访谈确认）」。标准后补的试点，永远不会失败，也永远证明不了什么；</li>\n<li><strong>小圈子真实跑</strong>：3–5 名真实用户、真实数据（敏感场景在内网本地通道跑），影子运行：Agent 产物与原人工流程并行，人比对后再用；</li>\n<li><strong>过门条件</strong>：验收指标达成 + 评估集上线 + 审计与回放可用 + 业务 owner 签字；</li>\n<li><strong>停下来的条件</strong>：准确率类指标连续一周不达标且原因不在数据可得性（即模型/方案本身不行）；或使用者普遍绕开它走回老路——<strong>试点被停是正常结果，不是失败事故</strong>，停得越早，沉没成本越小。</li>\n</ul>\n<h3 id=\"62-48\">6.2 阶段二：小范围推广（一个部门，4–8 周）</h3>\n<ul>\n<li><strong>扩的是真实性，不是人数</strong>：接入真实权限体系（5.1 身份透传上线）、真实数据全量、原流程保留但降为备份；</li>\n<li><strong>验收指标换挡</strong>：从「准不准」扩到「稳不稳」——失败率、人工驳回率、周成本、用户修改率进入周报；出一次可回放定位的问题定位时间 ≤ 半天；</li>\n<li><strong>治理件补齐</strong>：owner 与维护责任落人（第七节）、变更走 5.6 流程、停用开关演练一次；</li>\n<li><strong>停下来的条件</strong>：出现权限或数据类事故（越权取数、敏感数据走错通道）——立即停用回退，先修治理再谈恢复；成本月环比异常增长且查不清来源，同理。</li>\n</ul>\n<h3 id=\"63\">6.3 阶段三：规模化（多场景复用平台能力）</h3>\n<ul>\n<li><strong>复用的才是平台</strong>：第二个、第三个场景接入时，复用网关、审计、评估框架、工具注册规范——规模化阶段的主要工作是把试点期手搓的东西沉淀成规范，而不是复制三份；</li>\n<li><strong>验收指标</strong>：新场景接入周期（从立项到试点）逐个缩短；平台级指标（全场景失败率、单位任务成本）有月度报表；每个场景仍各自持有自己的评估集与 owner；</li>\n<li><strong>停下来的条件</strong>：新场景接入速度上去了，但评估与审计开始被「先上再说」侵蚀——这是规模化最常见的腐烂方式，发现即冻结新接入，先补治理。</li>\n</ul>\n<p>三段路的共同纪律：<strong>每段结束开一次复盘，过门评审只看指标与事故记录，不看演示效果。</strong>演示可以挑最好的例子，指标不会。</p>\n<hr />\n<h2 id=\"agent_1\">七、组织与治理：Agent 是业务资产，要有主人</h2>\n<p>技术问题解决完，剩下的全是组织问题（Muse 整理）：</p>\n<ul>\n<li><strong>双 owner 制</strong>：每个 Agent 配业务 owner 与技术 owner。业务 owner 管「它该干什么、答得对不对、知识库内容谁审」——从使用部门出人；技术 owner 管「它稳不稳、花多少钱、变更与事故」。没有业务 owner 的 Agent，上线三个月必然烂尾，因为没人对内容负责；</li>\n<li><strong>提示词与知识库的维护责任</strong>：提示词归技术 owner 管版本（5.6），知识库内容归业务 owner 管审校——制度变了谁去更新、标书模板换版谁去下架旧版，写进职责表，不靠自觉；</li>\n<li><strong>用户培训与预期管理</strong>：推广时把三件事说在前面——它能干什么、不能干什么（尤其「它会出错、重要结果要复核」）、出了问题找谁。预期管理不到位的典型后果是两个极端：一部分人把它当神仙，第一次出错就全盘否定；另一部分人过度信任，把该复核的直接发出去。培训的目标是让所有人把它当「手快但需要复核的新同事」；</li>\n<li><strong>与公司信息化进程对齐</strong>：公司正从 Excel+白板向系统迁移（biz-management 是第一步）。Agent 落地要顺着这条线走：数据先进系统，Agent 再接系统。<strong>不要用 Agent 去掩盖数据没进系统的问题</strong>——让 Agent 读散落各处的 Excel，短期看是捷径，长期看是把数据治理的债利滚利。</li>\n</ul>\n<hr />\n<h2 id=\"_6\">八、实操：产出你的《落地设计卡》</h2>\n<p><strong>任务</strong>：自选一个公司真实场景（建议从第三节地图的 ★★ 及以上场景里选，也可自带新场景，但须过 2.1 四判据），完成《落地设计卡》并在课内互评。建议时长 80 分钟（含互评 20 分钟）。</p>\n<p>设计卡必备栏目：</p>\n<ol>\n<li><strong>场景与价值账</strong>：场景一句话描述；四判据逐条判读；年价值测算（写明耗时、频次、单价口径）；</li>\n<li><strong>流程图</strong>：从触发到交付的完整流程，<strong>人工确认点逐个标出</strong>并注明确认人角色与确认界面要展示的依据；</li>\n<li><strong>工具清单</strong>：需要的工具逐个列出，标注只读/草稿写入/正式执行级别，写明数据来源系统；</li>\n<li><strong>数据分流</strong>：每个环节的数据敏感度判定与通道选择（本地/云端），敏感数据给出不出内网的保证方式；</li>\n<li>

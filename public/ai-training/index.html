i>交实验记录：配置 diff、两组原始数字、结论一句话、遇到的异常与定位过程。</li>\n</ol>\n<p><strong>验收标准</strong>：全程只动了一个变量；双机配置始终一致；服务最终恢复且健康检查通过；结论必须能用第 1 周的原理（带宽/KV/组批）解释，不接受「变快了/变慢了」式的无解释记录。</p>\n<p><strong>安全红线</strong>：不在业务高峰做；不顺手升级镜像；实验数据与生产请求分开记录；任何一步不确定，先停手问讲师，不要在双机上做未同步的单边修改。</p>\n<h2 id=\"_3\">七、课后作业</h2>\n<ol>\n<li>读社区《大模型本地部署完整指南（DGX Spark）》，列一张差异表：它的单机方案与公司双机方案在并行方式、量化格式、并发设置、MTP 口径上各有什么不同、为什么；</li>\n<li>画一张公司现行部署拓扑图：两台 Spark、API 入口、脚本与镜像位置、数据流向，标出你认为最脆弱的一个环节及理由；</li>\n<li>预习第 3 周：列出你想用压测回答的三个问题（例如「并发 16 时 P99 TTFT 会到多少」），下周课上直接开测。</li>\n</ol>\n<h2 id=\"_4\">八、延伸阅读</h2>\n<ul>\n<li>《大模型本地部署完整指南（DGX Spark）》— WaytoAGI 社区：https://waytoagi.feishu.cn/wiki/CyJrwn8abiUUd9kjjeqcZ25En0g</li>\n<li>vLLM 官方文档·引擎参数：https://docs.vllm.ai/en/latest/configuration/engine_args/</li>\n<li>公司内部材料：《MTP 实测总结（2026-10-13）》（目标文件区 dgx-spark/files）、《vLLM 参数实验手册》（第 3 周起共建）</li>\n</ul>\n<hr />\n<p><em>讲师备注：本周最常见的问题是学员急着调参数却说不清每个参数动的是哪笔账。每个参数讲解都要求学员先回答「它动的是内存、带宽、算力还是调度」，答不上来就回到第 1 周的表。</em></p>"}, {"num": "T3", "ch": "技术轨 · 原理到蒸馏（6 周）", "label": "第 3 周 压测与运维", "title": "技术轨 · 第 3 周讲义：本地部署与 vLLM 工程（下）——压测方法论与运维排障", "html": "<h1 id=\"3-vllm\">技术轨 · 第 3 周讲义：本地部署与 vLLM 工程（下）——压测方法论与运维排障</h1>\n<ul>\n<li>轨道：技术轨</li>\n<li>周次：第 3 周 · 本地部署与 vLLM 工程（下）</li>\n<li>建议时长：授课 90 分钟 + 实操 120 分钟（阶梯压测，低峰时段）</li>\n<li>前置：第 1 周三笔账、第 2 周参数体系与部署清单</li>\n<li>本讲目标：能设计一份可复现的压测（变量受控、口径写明），读懂吞吐–延迟曲线并找到拐点；能用引擎日志的周期字段做日常巡检；遇到常见故障能按处置卡定位到层、按变更纪律处理，知道何时回滚</li>\n<li>来源标注：日志字段与启动阶段整理自公司内部《MTP 实测总结（2026-10-13）》；压测方法论与告警阈值为 Muse 按行业通行做法整理（阈值标注为建议起点，上线前按本机基线校准）</li>\n</ul>\n<hr />\n<h2 id=\"_1\">一、先立规矩：压测要回答问题，不是跑个数字</h2>\n<p>一份合格的压测在开跑前必须写清四件事，缺一不可：</p>\n<ol>\n<li><strong>要回答的问题</strong>：例如「并发从 8 提到 16，P99 TTFT 会不会超过 2 秒」；</li>\n<li><strong>负载定义</strong>：输入长度、输出长度、并发/到达率、总请求数、数据集来源；</li>\n<li><strong>环境快照</strong>：镜像版本、启动参数全文、双机配置一致性、当时是否有其他负载；</li>\n<li><strong>判定标准</strong>：什么结果算通过、什么结果触发回滚或调参。</li>\n</ol>\n<p>没有这四项的数字只能叫「测着玩」：换个时间、换批 prompt，结论就翻面，团队也就不再信压测。</p>\n<h2 id=\"_2\">二、指标体系：每个指标回答一个问题</h2>\n<table>\n<thead>\n<tr>\n<th>指标</th>\n<th>定义</th>\n<th>回答的问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>TTFT</td>\n<td>请求发出到第一个 token</td>\n<td>用户等多久才「有反应」；长 prompt 与排队看这里</td>\n</tr>\n<tr>\n<td>TPOT / ITL</td>\n<td>相邻输出 token 的间隔</td>\n<td>生成顺不顺滑；Decode 带宽与调度看这里</td>\n</tr>\n<tr>\n<td>E2E 延迟</td>\n<td>请求全程耗时</td>\n<td>单请求总体验；≈ TTFT + TPOT × 输出长度</td>\n</tr>\n<tr>\n<td>输出吞吐</td>\n<td>全系统每秒产出 token</td>\n<td>系统总产能；和并发一起看</td>\n</tr>\n<tr>\n<td>QPS / 请求吞吐</td>\n<td>每秒完成请求数</td>\n<td>业务口径的产能，注意它受输出长度影响</td>\n</tr>\n<tr>\n<td>成功率</td>\n<td>非错误请求占比</td>\n<td>饱和后先掉的是它，不是延迟</td>\n</tr>\n<tr>\n<td>P50 / P95 / P99</td>\n<td>延迟分位数</td>\n<td>尾延迟。<strong>平均值会掩盖长尾，报告一律用分位数</strong></td>\n</tr>\n</tbody>\n</table>\n<p>两个纪律：</p>\n<ul>\n<li><strong>延迟和吞吐必须成对报告</strong>：只报吞吐不报延迟，等于没说用户感受；只报单流延迟不报并发吞吐，等于没说系统产能；</li>\n<li><strong>输入/输出长度必须写明</strong>：输出从 200 改到 1000 token，QPS 能掉一半——不是系统变慢了，是活变多了。</li>\n</ul>\n<h2 id=\"_3\">三、负载设计：控制变量，比工具重要</h2>\n<ul>\n<li><strong>固定数据集</strong>：一组有代表性的 prompt 存成文件反复用（公司压测脚本口径与 vllm bench serve 对齐，脚本在 <code>~/workspace/your_files/qwen38-flash-bench/</code>）；临时手敲的 prompt 不许进正式报告；</li>\n<li><strong>长度分档</strong>：至少设短输入短输出、长输入短输出、短输入长输出三档，分别压 Prefill 与 Decode 两个阶段；</li>\n<li><strong>并发阶梯</strong>：1 → 2 → 4 → 8 → 16 逐档加，每档请求数足够让指标稳定（经验上每档 ≥50 个请求或 ≥3 分钟）；</li>\n<li><strong>预热</strong>：正式计时前先跑一小批请求，让 CUDA Graph、缓存与连接池进入稳态，预热数据不计入结果；</li>\n<li><strong>排除客户端瓶颈</strong>：压测机与被测服务分开部署；先单请求验证客户端本身延迟可忽略；注意现行 <code>max-num-seqs=8</code>，并发压到 16 时多出的请求在排队——<strong>这正是要观察的现象，不是脚本错误</strong>；</li>\n<li><strong>一次只动一个变量</strong>（与第 2 周改参纪律一致）：换参数就重跑全阶梯，不要拿 A 配置的低压档和 B 配置的高压档拼结论。</li>\n</ul>\n<h2 id=\"_4\">四、读曲线：吞吐–延迟拐点在哪里</h2>\n<p>阶梯压测的结果画成两条曲线一起看：横轴并发，纵轴分别是输出吞吐与 P95/P99 延迟。典型形态分三段：</p>\n<ol>\n<li><strong>线性区</strong>：并发上升，吞吐近线性上升，延迟基本平坦——带宽还没吃满，系统有余量；</li>\n<li><strong>拐点</strong>：吞吐增速放缓，延迟开始明显爬升——接近饱和，这里是<strong>推荐运行水位</strong>的上限附近；</li>\n<li><strong>饱和区</strong>：吞吐不再涨甚至回落，延迟陡增，成功率开始掉——再加并发纯粹是排队，<code>Waiting</code> 队列变长。</li>\n</ol>\n<p>定容量就定在拐点之前并留余量：日常水位、突发上限、告警线三档分别标在曲线上，这比拍脑袋写「支持 XX 并发」可信得多。</p>\n<p><strong>和第 1 周的账对上</strong>：饱和区的输出吞吐应接近「带宽 ÷ 每 token 搬运量」的量级估算（公司环境：单流 TPOT 下限约 13ms 对应约 75 tok/s 的权重搬运天花板，多流共享搬运后总吞吐可高于单流，但每 token 还要叠加 KV 读取与 MoE 通信）。实测远低于估算，先查客户端与调度，别急着怪硬件。</p>\n<h2 id=\"_5\">五、日常巡检：把引擎日志读成仪表盘</h2>\n<p>vLLM 周期日志每 10 秒一行，是不用额外工具的现成仪表盘（字段口径据公司《MTP 实测总结》）：</p>\n<table>\n<thead>\n<tr>\n<th>字段</th>\n<th>含义</th>\n<th>巡检看法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Avg prompt throughput</td>\n<td>窗口内 Prefill 吞吐（tok/s）</td>\n<td>突然升高多半是长 prompt 请求涌入</td>\n</tr>\n<tr>\n<td>Avg generation throughput</td>\n<td>窗口内 Decode 吞吐（tok/s）</td>\n<td>与基线比：现行单流约 31 tok/s（MTP 开）/ 约 25（MTP 关）</td>\n</tr>\n<tr>\n<td>Running / Waiting reqs</td>\n<td>执行中 / 排队请求数</td>\n<td>Waiting 持续 &gt;0 说明已过拐点</td>\n</tr>\n<tr>\n<td>GPU KV cache usage</td>\n<td>KV 占用率</td>\n<td>长期高位意味着长上下文或并发把 KV 吃满，新请求会等或被抢占</td>\n</tr>\n<tr>\n<td>Prefix cache hit rate</td>\n<td>前缀缓存命中率</td>\n<td>现行环境已开启；命中率骤降先查流量结构是否变了</td>\n</tr>\n</tbody>\n</table>\n<p>MTP 开启时另有 SpecDecoding 周期行，重点看三个数：<strong>平均接受率</strong>（猜得准不准）、<strong>平均接受长度</strong>（每步多产几个 token）、<strong>Accepted throughput</strong>（实际产出速度）。注意接受率有两种口径：讲义与报告引用时写明是哪种（公司 A/B 结论的 61.8% 是全程平均口径）。</p>\n<p>采集建议：周期日志按天归档；有条件时接 vLLM 的 Prometheus <code>/metrics</code> 做趋势与告警。<strong>告警阈值建议起点</strong>（按本机基线校准后固化）：Waiting 持续 5 分钟 &gt;0、KV usage 持续 &gt;90%、generation throughput 低于基线 30%、5 分钟内请求错误率 &gt;1%。</p>\n<h2 id=\"_6\">六、性能诊断树：先分层，再动手</h2>\n<table>\n<thead>\n<tr>\n<th>症状</th>\n<th>先分清</th>\n<th>常见原因与查法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>TTFT 高</td>\n<td>是排队还是 Prefill 慢</td>\n<td>Waiting&gt;0 → 已过载或并发设置低；prompt 很长 → 看 prompt throughput 与 Chunked Prefill；前缀命中骤降 → 流量结构变了</td>\n</tr>\n<tr>\n<td>TPOT 高</td>\n<td>是带宽满还是接受率跌</td>\n<td>对照第 1 周带宽账估算差距；查 SpecDecoding 接受率是否异常（流量内容变化会让接受率掉）；KV 占用高时 Decode 还要多搬 KV</td>\n</tr>\n<tr>\n<td>吞吐上不去</td>\n<td>是客户端还是服务端</td>\n<td>压测机 CPU/网络先排除；并发没到拐点就平台化，多半是客户端或 max-num-seqs 限制</td>\n</tr>\n<tr>\n<td>P99 抖动大</td>\n<td>是长请求混入还是抢占</td>\n<td>长输出请求与短请求混跑会拉长尾延迟；KV 不足引发抢占重算时更明显；考虑按场景分队列/分实例</td>\n</tr>\n<tr>\n<td>偶发错误</td>\n<td>是饱和还是故障</td>\n<td>饱和时先掉成功率；对照错误时间点的 KV usage 与 Waiting 曲线</td>\n</tr>\n</tbody>\n</table>\n<p>诊断口头禅：<strong>先看队列（Waiting），再看 KV，再看接受率，最后才动参数。</strong></p>\n<h2 id=\"_7\">七、运维排障：分级、处置卡与变更纪律</h2>\n<h3 id=\"_8\">故障分级（建议）</h3>\n<table>\n<thead>\n<tr>\n<th>级别</th>\n<th>定义</th>\n<th>响应</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>P1</td>\n<td>服务不可用或大面积错误</td>\n<td>立即处置，先恢复后复盘；优先回滚最近变更</td>\n</tr>\n<tr>\n<td>P2</td>\n<td>可用但性能明显劣化（超告警线）</td>\n<td>当班处理，定位到层后决定调参或扩容</td>\n</tr>\n<tr>\n<td>P3</td>\n<td>单点异常、个别请求失败</td>\n<td>记录工单，纳入周复盘</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"_9\">五张处置卡</h3>\n<ol>\n<li><strong>OOM / KV 分配失败</strong>：确认是否有其他容器抢占内存（实验容器停启纪律见第 2 周）；核对 utilization 与 max-model-len 最近变更；先降并发或长度止血，再谈根因；</li>\n<li><strong>双机一台掉线</strong>：TP2/EP 是双机一体，单台故障即服务不可用——按 P1 处理，恢复时走完整集群启动与健康检查三件套，不要试图「单机先顶着」改配置上线；</li>\n<li><strong>大面积超时</strong>：先看 Waiting 与 KV：过载就限流/降级（缩短 max_tokens、暂停长任务队列），不要盲目重启——重启 15 分钟内服务全停；</li>\n<li><strong>输出质量异常</strong>（答非所问、格式崩坏）：先查最近变更——采样参数、镜像版本、模型文件三件套；质量问题多数是变更引入的，回滚比调提示词优先；</li>\n<li><strong>升级后性能回退</strong>：按版本管理流程回滚到 pin 住的旧版本与旧脚本，用同一份压测数据集复测确认，再离线排查新版本差异。</li>\n</ol>\n<h3 id=\"2\">变更纪律（与第 2 周一脉相承）</h3>\n<ul>\n<li>任何变更先写变更单：改什么、为什么、影响面、回滚步骤、验证方法；</li>\n<li>双机配置一致性是红线：脚本 scp 同步 + diff 核对（公司曾出现双机 MTP 配置不一致导致启动卡住，教训在案）；</li>\n<li>变更后固定动作：健康检查三件套 + 一档小压测对照基线，数字入档；</li>\n<li>配置基线归档：每次变更后的启动脚本、镜像版本、压测报告三件套一起存档，能按日期完整复原任一历史状态。</li>\n</ul>\n<h3 id=\"_10\">版本管理</h3>\n<ul>\n<li>升级前读官方 changelog 与已知问题，重点看参数改名/默认值变化与模型适配说明；</li>\n<li>升级窗口放低峰，先在单组配置上完成「启动 → 健康检查 → 全阶梯压测 → 与旧版同口径对比」；</li>\n<li>新版指标不劣于旧版才保留，否则回滚——<strong>升级的目标是收益，不是新鲜</strong>。</li>\n</ul>\n<h2 id=\"120\">八、实操：一次完整的阶梯压测（120 分钟）</h2>\n<p><strong>任务</strong>：为现行服务产出第一份标准压测报告。</p>\n<ol>\n<li><strong>写计划</strong>（20 分钟）：按第一节四要素写压测计划——推荐问题：「现行配置的拐点在哪个并发档？P99 TTFT 在拐点处是多少？」；</li>\n<li><strong>备负载</strong>（15 分钟）：从固定数据集选三档长度组合，写明每档的输入/输出长度；</li>\n<li><strong>跑阶梯</strong>（45 分钟）：并发 1/2/4/8/16 五档，每档先预热再计时，记录 TTFT（P50/P95/P99）、TPOT、输出吞吐、成功率；同时截取同期引擎周期日志；</li>\n<li><strong>画曲线定拐点</strong>（20 分钟）：标出线性区、拐点、饱和区，给出推荐运行水位；</li>\n<li><strong>对账与结论</strong>（20 分钟）：饱和吞吐与第 1 周带宽账估算对比，差距写明可能构成（KV 读取、MoE 通信、调度开销、客户端因素）；结论一句话 + 一条调参建议（只建议，本实操不改生产参数）。</li>\n</ol>\n<p><strong>验收标准</strong>：报告四要素齐全；五档数据完整且口径一致；曲线有拐点标注；结论能被数据支撑；全程未改动生产配置，压测在低峰完成且随时可停。</p>\n<h2 id=\"_11\">九、课后作业</h2>\n<ol>\n<li>把本组压测报告按附录模板定稿，存入目标文件区作为服务基线 v1；</li>\n<li>桌面推演：任选一张处置卡，写出从发现告警到恢复验证的完整动作序列（含回滚点），下周课前互评；</li>\n<li>预习第 4 周：准备一个「希望模型学会按公司格式输出」的微调小任务设想（场景 + 20 条样例长什么样）。</li>\n</ol>\n<h2 id=\"_12\">附录：压测报告模板（复制使用）</h2>\n<table>\n<thead>\n<tr>\n<th>项</th>\n<th>内容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>日期 / 执行人</td>\n<td></td>\n</tr>\n<tr>\n<td>要回答的问题</td>\n<td></td>\n</tr>\n<tr>\n<td>环境快照</td>\n<td>镜像版本：　启动参数：　双机一致（是/否）：</td>\n</tr>\n<tr>\n<td>负载定义</td>\n<td>数据集：　输入/输出长度档：　并发阶梯：　每档请求数：</td>\n</tr>\n<tr>\n<td>结果表</td>\n<td>并发档 ×（TTFT P50/P95/P99、TPOT、输出吞吐、成功率）</td>\n</tr>\n<tr>\n<td>曲线与拐点</td>\n<td>拐点并发：　推荐水位：</td>\n</tr>\n<tr>\n<td>对账</td>\n<td>实测饱和吞吐 vs 带宽账估算，差距构成：</td>\n</tr>\n<tr>\n<td>结论与建议</td>\n<td>一句话结论：　调参建议（或维持现状）：</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<p><em>讲师备注：本讲最容易跑偏成「压测工具教学」。工具随时可查，方法论才是资产：每个数字都要能回答「和哪笔账对上了、和哪个基线比怎么样」。实操中务必让学员亲手经历并发 16 档的排队现象——那是理解 max-num-seqs 最直观的一课。</em></p>"}, {"num": "T4", "ch": "技术轨 · 原理到蒸馏（6 周）", "label": "第 4 周 SFT 微调", "title": "技术轨 · 第 4 周讲义：SFT 微调——从数据开始，而不是从参数开始", "html": "<h1 id=\"4-sft\">技术轨 · 第 4 周讲义：SFT 微调——从数据开始，而不是从参数开始</h1>\n<ul>\n<li>轨道：技术轨</li>\n<li>周次：第 4 周 · SFT / 微调实战</li>\n<li>建议时长：授课 90 分钟 + 实操 150 分钟（单台 DGX Spark 或 Colab 备选）</li>\n<li>前置：第 1–3 周；第 3 周作业中准备的微调小任务设想（场景 + 样例形态）</li>\n<li>本讲目标：能判断一个需求该不该用微调解决；能亲手准备一份合格的小数据集（格式、体检、切分）；用 LLaMA-Factory 对 7–8B 基座做一次 LoRA SFT，并用固定测试集与基座做 A/B 对比，得出「是否值得上线」的结论</li>\n<li>来源标注：概念框架整理自 WaytoAGI 社区《模型微调基本概念和名词》《微调概念笔记（CPT/SFT/DPO）》；训练显存量级估算、超参数经验区间与实操流程为 Muse 按通行工程实践整理（估算值以框架实际日志为准）；LLaMA-Factory 的版本与 GB10/ARM 兼容性须开课前在现行环境复核</li>\n</ul>\n<hr />\n<h2 id=\"_1\">一、先判断：这个需求该不该微调</h2>\n<p>微调改的是模型的<strong>行为</strong>（格式、风格、口径、任务套路），不是给它灌新知识。决策顺序永远是先便宜后贵：</p>\n<table>\n<thead>\n<tr>\n<th>手段</th>\n<th>适合解决</th>\n<th>不适合</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>提示词（第 2 周业务轨内容）</td>\n<td>临时要求、格式说明能讲清的</td>\n<td>要求每次都稳定复现、上下文塞不下示范时</td>\n</tr>\n<tr>\n<td>RAG / 知识库（第 4 周业务轨内容）</td>\n<td>事实知识更新、要出处</td>\n<td>输出行为本身要变（语气、结构、流程）</td>\n</tr>\n<tr>\n<td><strong>SFT 微调</strong></td>\n<td><strong>固定任务的行为定型</strong>：结构化抽取按固定 schema、固定文风、固定审查口径</td>\n<td>知识频繁变、样本拿不到、基座本身不会做这个任务</td>\n</tr>\n<tr>\n<td>继续预训练 / 后训练</td>\n<td>领域语言与能力整体迁移（第 5–6 周）</td>\n<td>单个小任务——杀鸡用牛刀</td>\n</tr>\n</tbody>\n</table>\n<p><strong>反例清单</strong>（出现任意一条先停）：希望微调让模型「知道」公司上周的新制度（该用 RAG）；只有十几条样本却想改通用能力；任务连人都说不清验收标准。</p>\n<h2 id=\"sft\">二、SFT 在学什么</h2>\n<p>SFT（Supervised Fine-Tuning）就是拿「输入 → 期望输出」的示范对，继续训练基座模型，让它把示范里的行为变成默认行为。三件事要分清：</p>\n<ul>\n<li><strong>学行为不学事实</strong>：示范里出现的事实会被顺带记住，但不可靠、会过时——事实交给 RAG；</li>\n<li><strong>风格即数据</strong>：你给的示范什么口吻、什么结构，模型就学什么口吻结构，包括坏习惯（示范里有错别字它都学）；</li>\n<li><strong>模板必须一致</strong>：训练用的对话模板（chat template、特殊 token）必须和推理部署时完全一致。模板对不上是微调翻车第一名——训完看着 loss 很低，一上线输出乱码或停不下来，十有八九是这里。</li>\n</ul>\n<p>数据格式两种主流，内容等价：</p>\n<pre><code class=\"language-json\">// Alpaca 风格：单轮指令\n{&quot;instruction&quot;: &quot;把下面这段话改写成正式公文口吻&quot;, &quot;input&quot;: &quot;那个事儿你尽快弄一下&quot;, &quot;output&quot;: &quot;请尽快办理相关事项。&quot;}\n\n// ShareGPT 风格：多轮对话（system/human/gpt 三种角色）\n{&quot;conversations&quot;: [{&quot;from&quot;: &quot;system&quot;, &quot;value&quot;: &quot;你是投标文件审查助手&quot;},\n                   {&quot;from&quot;: &quot;human&quot;, &quot;value&quot;: &quot;……公告原文……&quot;},\n                   {&quot;from&quot;: &quot;gpt&quot;, &quot;value&quot;: &quot;……结构化审查结果……&quot;}]}\n</code></pre>\n<h2 id=\"_2\">三、数据是主角：准备与体检</h2>\n<p>微调圈共识：<strong>数据的上限决定模型的上限，参数只决定你离上限多远。</strong> 小数据集时代（几百到几千条）的纪律：</p>\n<ol>\n<li><strong>来源</strong>：人工编写（最准、最贵）＞ 业务真实样本脱敏改编 ＞ 强模型生成后人工筛（第 5–6 周蒸馏就是规模化做这件事）＞ 公开数据集（注意许可与口径差异）；</li>\n<li><strong>质量三关</strong>：准确（答案本身对）、一致（同类输入同种处理口径）、多样（覆盖真实输入的长尾，不要 500 条都是同一句式）；</li>\n<li><strong>配比</strong>：目标任务数据为主，掺 10–20% 通用指令数据防「只会干这一件事」的窄化（灾难性遗忘的轻量对冲）；</li>\n<li><strong>体检清单</strong>（训前必做）：格式合法（能被框架无报错加载）、去重（完全重复与近重复）、长度分布（超长样本截断策略写明）、抽检 ≥10% 人工看、敏感信息清除；</li>\n<li><strong>切分</strong>：按 9:1 或固定留出测试集；<strong>测试集必须独立</strong>，与训练集同源抽出来的「测试」测的是记忆不是能力；评估结论引用时写明测试集构成与样本量。</li>\n</ol>\n<h2 id=\"_3\">四、三种训练方式与训练显存账</h2>\n<table>\n<thead>\n<tr>\n<th>方式</th>\n<th>动什么</th>\n<th>可训参数</th>\n<th>7–8B 量级显存（估算）</th>\n<th>适用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>全参数微调</td>\n<td>全部权重</td>\n<td>100%</td>\n<td>约 110GB+（权重 BF16 16GB + 梯度 16GB + Adam 状态约 64GB + 激活）——单台 Spark 很紧</td>\n<td>数据大、要改能力本体时</td>\n</tr>\n<tr>\n<td><strong>LoRA</strong></td>\n<td>冻结基座，只训低秩增量</td>\n<td>约 0.1–1%</td>\n<td>约 25–40GB（基座 BF16 常驻 + 小量优化器状态 + 激活）</td>\n<td><strong>本讲主线</strong>：行为定型类任务</td>\n</tr>\n<tr>\n<td>QLoRA</td>\n<td>基座 4bit 量化冻结 + LoRA</td>\n<td>约 0.1–1%</td>\n<td>约 12–20GB</td>\n<td>显存更紧或更大基座时</td>\n</tr>\n</tbody>\n</table>\n<p>注意这笔账和推理完全不同：<strong>训练显存 = 权重 + 梯度 + 优化器状态 + 激活</strong>，优化器状态（Adam 的一阶/二阶动量，FP32）往往是全参训练的大头。这就是为什么推理能跑 125B 的机器，全参训 8B 都要精打细算。</p>\n<p><strong>LoRA 原理一句话</strong>：不改原权重 W，只学一个低秩增量 ΔW = B·A（B、A 是两个小矩阵，秩 r 远小于维度）。合并时 W' = W + ΔW，推理零额外开销；不合并也能以适配器形式挂载、热切换——多个业务各训一个适配器共用一个基座，是很实用的部署形态。</p>\n<h2 id=\"_4\">五、关键超参数：先懂这五个</h2>\n<table>\n<thead>\n<tr>\n<th>参数</th>\n<th>LoRA 常用起点</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>learning_rate</td>\n<td>1e-4（全参约 1e-5 量级）</td>\n<td>最敏感的参数；过大训崩（loss 爆炸/输出复读），过小等于没训</td>\n</tr>\n<tr>\n<td>num_train_epochs</td>\n<td>2–3</td>\n<td>小数据多轮易过拟合；配合 eval 曲线看</td>\n</tr>\n<tr>\n<td>per_device_batch × grad_accum</td>\n<td>有效批量 16–32 条</td>\n<td>显存不够就减小单卡批量、用梯度累积补</td>\n</tr>\n<tr>\n<td>lora_rank / alpha</td>\n<td>r=16 起，alpha 常取 2r</td>\n<td>r 越大容量越大也越易过拟合；任务越「行为化」r 越可以小</td>\n</tr>\n<tr>\n<td>cutoff_len</td>\n<td>按数据长度分布定，如 1024/2048</td>\n<td>超长截断会教坏模型（学会半截输出），先看分布再定</td>\n</tr>\n</tbody>\n</table>\n<p><strong>看曲线</strong>：train loss 平稳下降是常态；eval loss 先降后升就是过拟合拐点，取拐点前的 checkpoint。loss 不是验收标准——验收看第八节的测试集对比。</p>\n<h2 id=\"llama-factory\">六、工具链：LLaMA-Factory</h2>\n<ul>\n<li>定位：把数据处理、训练、评估、导出做成统一配置（YAML/CLI/WebUI），是当前国内团队做 SFT 最常用的开源框架之一；</li>\n<li>关键动作：数据集注册（dataset_info.json）→ 选模板（template 必须与基座一致）→ 训练 → 导出（merge LoRA 到基座）→ 用 vLLM 加载验证；</li>\n<li>备选：Axolotl、Unsloth（各有侧重，了解即可）；</li>\n<li><strong>开课前复核项</strong>：现行驱动/PyTorch 版本下框架能否在 GB10（ARM）正常起训；先拿 100 条数据跑通 10 分钟冒烟，再上正式数据。若 Spark 侧受阻，备选方案是 Colab 跑同一套配置（数据经 Drive 挂载），流程不变。</li>\n</ul>\n<h2 id=\"150\">七、实操：给基座定一个「行为型」任务（150 分钟）</h2>\n<p><strong>任务（各组从第 3 周设想中选一，建议从这两类起步）</strong>：</p>\n<ul>\n<li>甲类·结构化抽取：会议纪要/公告文本 → 固定 JSON（字段口径各组自定并写明）；</li>\n<li>乙类·文风改写：口语化内部通知 → 正式公文口吻。</li>\n</ul>\n<p><strong>步骤</strong>：</p>\n<ol>\n<li><strong>备数据</strong>（40 分钟）：每组 200–500 条，按第三节体检清单自检，留出 30 条做独立测试集（不进训练）；</li>\n<li><strong>冒烟</strong>（15 分钟）：抽 100 条、1 epoch 跑通全链路，确认模板、日志、显存占用正常；</li>\n<li><strong>正式训练</strong>（40 分钟）：LoRA r=16、lr 1e-4、2–3 epoch，保存每个 epoch 的 checkpoint，记录 train/eval 曲线；</li>\n<li><strong>导出验证</strong>（20 分钟）：merge 后用 vLLM 起服务，先健康检查，再跑测试集；</li>\n<li><strong>A/B 对比</strong>（25 分钟）：同一测试集分别喂基座与微调模型，按评分表打分（格式合规率、字段准确率、口吻一致性三项，各组按任务微调），再抽查 10 条通用问题看有没有「学坏」；</li>\n<li><strong>结论</strong>（10 分钟）：一句话——值得上线 / 数据要补 / 任务不适合微调，三选一并给依据。</li>\n</ol>\n<p><strong>验收标准</strong>：数据体检记录齐全；训练曲线与 checkpoint 对应关系说得清；A/B 表有原始数字；结论与数字一致（不许只写「效果很好」）；微调模型已下线或明确标注为实验服务，不与生产服务混淆。</p>\n<h2 id=\"_5\">八、评估纪律（单独强调）</h2>\n<ul>\n<li>只看 loss 就宣布成功，是微调项目最常见的自欺；</li>\n<li>测试集小（几十条）时结论要带样本量，并人工逐条看输出，不要只看自动分数；</li>\n<li>格式类任务优先用规则可判的指标（JSON 可解析率、字段齐全率），比「感觉像不像」可靠；</li>\n<li>上线后按第 3 周口径补一轮压测：merge 模型与基座的性能应基本一致，差太多要查导出与加载方式。</li>\n</ul>\n<h2 id=\"_6\">九、常见坑清单</h2>\n<ol>\n<li>训练/推理模板不一致（第一名）；</li>\n<li>测试集泄漏进训练集，评估虚高；</li>\n<li>学习率过大训崩，或过小白训——都先小步冒烟；</li>\n<li>数据口径不一致：同类样本两种写法，模型学会随机发挥；</li>\n<li>期待微调补知识：事实类错误训完依旧，只是语气更自信；</li>\n<li>只训不评、只评不看：不看原始输出就调参，方向全靠猜；</li>\n<li>merge 后部署忘了同步 tokenizer/模板配置。</li>\n</ol>\n<h2 id=\"_7\">十、课后作业</h2>\n<ol>\n<li>提交实操全套产物：数据集（含体检记录）、训练配置、曲线截图、A/B 对比表、一页复盘（结论 + 下一步）；</li>\n<li>预习第 5–6 周蒸馏结课：每人准备 30 条种子指令（来自真实业务问题，脱敏），并想好一条「好回答」的判据——结课项目将用 DeepSeek 作教师模型批量生成训练数据，再回到本讲的流程训自己的小模型；</li>\n<li>选读：社区《怎么准备 LLM 的数据》（2023 年文，方法可借鉴，工具提法已过时）。</li>\n</ol>\n<h2 id=\"llama-factory_1\">附录：LLaMA-Factory 训练命令模板（参数以开课时版本为准）</h2>\n<pre><code class=\"language-bash\"># LoRA SFT（单卡）示意：数据集需先在 dataset_info.json 注册\nllamafactory-cli train \\\n  --stage sft --do_train \\\n  --model_name_or_path &lt;基座模型路径&gt; \\\n  --dataset &lt;数据集名&gt; --template &lt;与基座一致的模板名&gt; \\\n  --finetuning_type lora --lora_rank 16 --lora_alpha 32 --lora_target all \\\n  --learning_rate 1e-4 --num_train_epochs 3 \\\n  --per_device_train_batch_size 4 --gradient_accumulation_steps 4 \\\n  --cutoff_len 2048 --logging_steps 10 --save_strategy epoch \\\n  --output_dir &lt;输出目录&gt;\n\n# 导出合并权重（训完后）\nllamafactory-cli export \\\n  --model_name_or_path &lt;基座模型路径&gt; \\\n  --adapter_name_or_path &lt;LoRA输出目录&gt; \\\n  --template &lt;同一模板名&gt; --export_dir &lt;合并后目录&gt;\n</code></pre>\n<hr />\n<p><em>讲师备注：本讲学员最容易把时间花在调参而不是数据上。巡场时先看数据体检记录再看曲线——多数「训了没效果」的问题，在数据里当场就能找到。另注意各组样本多来自真实业务的脱敏改编，课堂上再次强调：真实敏感原文不进任何外部平台。</em></p>"}, {"num": "T5", "ch": "技术轨 · 原理到蒸馏（6 周）", "label": "第 5 周 后训练与蒸馏", "title": "技术轨 · 第 5 周讲义：后训练全景与蒸馏——先看清整张地图，再动手造数据", "html": "<h1 id=\"5\">技术轨 · 第 5 周讲义：后训练全景与蒸馏——先看清整张地图，再动手造数据</h1>\n<ul>\n<li>轨道：技术轨</li>\n<li>周次：第 5 周 · 预训练/后训练全景 + 蒸馏数据工坊（结课项目上半程）</li>\n<li>建议时长：授课 90 分钟 + 数据工坊 150 分钟</li>\n<li>前置：第 4 周 SFT 全流程；第 4 周作业的 30 条种子指令与「好回答」判据</li>\n<li>本讲目标：能画出从预训练到上线的完整训练地图并说清每层的成本量级与适用边界；理解蒸馏的两种形态与本课选数据蒸馏的原因；在本周内为结课项目产出冻结测试集与过滤完成的数据集 v1</li>\n<li>来源标注：训练全景整理自 WaytoAGI 社区《你不知道的大模型训练：原理、路径与新实践》与《微调概念笔记（CPT/SFT/DPO）》；蒸馏成本与价格为 2026-10 公开口径整理（价格以平台实时页面为准）；结课流程与过滤标准为 Muse 按已确认的蒸馏方案整理</li>\n</ul>\n<hr />\n<h2 id=\"_1\">一、训练全景图：一个模型一生要经历的五层</h2>\n<table>\n<thead>\n<tr>\n<th>层</th>\n<th>做什么</th>\n<th>数据形态</th>\n<th>成本量级</th>\n<th>本课程的态度</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>预训练</td>\n<td>从海量文本学语言与世界知识</td>\n<td>万亿级 token 无标注文本</td>\n<td>千卡级集群、月级时间</td>\n<td><strong>只理解、不实操</strong>：学会读别人的预训练报告</td>\n</tr>\n<tr>\n<td>继续预训练 CPT</td>\n<td>在基座上继续吃领域语料</td>\n<td>领域文档原文</td>\n<td>百 GB 级语料起才有意义</td>\n<td>知道适用条件，小语料别用</td>\n</tr>\n<tr>\n<td>SFT</td>\n<td>示范数据定型行为</td>\n<td>输入→输出示范对</td>\n<td>第 4 周已实操</td>\n<td>已掌握</td>\n</tr>\n<tr>\n<td>偏好优化</td>\n<td>按人类/规则偏好再对齐</td>\n<td>成对偏好（DPO）或奖励信号（RLHF/GRPO）</td>\n<td>数据与算力中等</td>\n<td>本讲速览，不实操</td>\n</tr>\n<tr>\n<td><strong>蒸馏</strong></td>\n<td><strong>强教师教小学生：生成数据 + SFT</strong></td>\n<td><strong>教师生成的示范对</strong></td>\n<td><strong>百元级数据成本起</strong></td>\n<td><strong>结课项目主线</strong></td>\n</tr>\n</tbody>\n</table>\n<p>读全景图要带走的判断：<strong>离应用越近的层越便宜、越可控</strong>。公司的体量决定了主战场在 SFT 与蒸馏这两层；预训练层的知识用来做选型判断（看数据配比、token 规模、上下文与许可），不是用来自己下场。</p>\n<p><strong>CPT 的适用红线</strong>：领域语料不到百 GB 量级、或差异只是「多了些专有名词」时，CPT 收益通常不如把力气花在 SFT 数据与 RAG 上。先问「基座到底缺什么」，缺行为用 SFT，缺知识用 RAG，缺整片领域语言分布才轮到 CPT。</p>\n<h2 id=\"_2\">二、偏好优化速览（知道位置即可）</h2>\n<ul>\n<li><strong>RLHF</strong>：训奖励模型 → 用强化学习优化策略，效果强但链路长、稳定性差；</li>\n<li><strong>DPO</strong>：跳过奖励模型，直接用「好答案/坏答案」成对数据做对比学习，工程上简单得多，是目前团队级项目的常用选择；</li>\n<li><strong>GRPO 等 RL 方法</strong>：在推理类任务上效果突出（R1 路线），但需要可验证的奖励信号与更多算力；</li>\n<li>共同前提：先有过得去的 SFT 模型。偏好优化是精修，不是补课——SFT 都没做对的任务，DPO 救不回来。</li>\n</ul>\n<p>想深挖的学员走知乎蓝宝书第二册《强化学习》（WaytoAGI × Datawhale，索引已存入素材库），本课不展开。</p>\n<h2 id=\"_3\">三、蒸馏：两种形态，先分清再选路</h2>\n<p><strong>蒸馏 = 让小模型（学生）模仿大模型（教师）的行为，得到「接近教师、大幅更便宜更快」的专用模型。</strong></p>\n<table>\n<thead>\n<tr>\n<th>形态</th>\n<th>学什么</th>\n<th>需要什么</th>\n<th>本课可用性</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Logit/特征蒸馏</td>\n<td>教师每一步的完整概率分布（软标签）</td>\n<td>教师的内部输出（logits）</td>\n<td>API 教师拿不到 logits，<strong>不可行</strong></td>\n</tr>\n<tr>\n<td><strong>数据（序列级）蒸馏</strong></td>\n<td>教师生成的示范答案，再按 SFT 训学生</td>\n<td>只需要教师的文本输出</td>\n<td><strong>本课路线</strong>：第 4 周流程原样复用</td>\n</tr>\n</tbody>\n</table>\n<p>为什么这条路线适合公司（2026-10 已确认的方案口径）：</p>\n<ul>\n<li><strong>成本账</strong>：以 DeepSeek 官方 API 现行价量级估算（输入约 $0.30/百万 token、输出约 $1.20/百万 token，2026-10 第三方汇总的官方价，开课前以平台页面复核），生成 1 万条 SFT 数据的量级约百元人民币——和第 4 周人工写数据的成本完全不在一个数量级；</li>\n<li><strong>效果背书</strong>：DeepSeek-R1 论文报告，其蒸馏版 R1-Distill-Qwen-7B 在 AIME 2024 达 55.5、MATH-500 达 92.8（论文 Table 5）——小模型靠学教师输出，能摸到远超自身规模的表现；</li>\n<li><strong>能力解耦</strong>（社区《大模型训练》一文的论述）：先用大模型把能力做出来，再蒸馏到小模型部署，是把「能力成本」和「部署成本」拆开的标准打法；</li>\n<li><strong>天花板与风险</strong>：学生上限被教师与数据覆盖度锁住；教师的错误与偏见会被一并学走——所以过滤环节（第五节）不是形式，是蒸馏的成败点；</li>\n<li><strong>合规口径</strong>：DeepSeek 条款相对宽松、其开源权重为 MIT 许可，公司内部非竞争用途风险低（开课前由讲师复核最新条款）；<strong>敏感数据不出内网</strong>：涉及真实业务原文的生成任务，改用本地 Qwen3.8-Flash 作教师（免费、慢一些、质量略低，但数据不出门）。</li>\n</ul>\n<h2 id=\"56\">四、结课项目全图（第 5–6 周）</h2>\n<pre><code>第 5 周：① 冻结测试集 → ② 种子指令 → ③ 扩展 → ④ 教师生成 → ⑤ 四道过滤 → 数据集 v1\n第 6 周：⑥ LoRA 训练 → ⑦ 三方评估 → ⑧ vLLM 部署与压测 → ⑨ Bad case 回流（限一轮） → ⑩ 路演\n</code></pre>\n<p>选题沿用各组在第 3–4 周的任务（结构化抽取或文风/审查类），学生模型统一选 7–8B 级 Qwen 系基座，单台 Spark 可训。</p>\n<h2 id=\"_4\">五、数据工坊：四道工序 + 四道过滤</h2>\n<h3 id=\"1\">工序 1：先冻结测试集（动手顺序第一位）</h3>\n<ul>\n<li>从真实业务问题中选 100–200 条，人工写出标准答案或评分要点；</li>\n<li>冻结后<strong>全程不进任何训练数据</strong>，组间互查防泄漏；</li>\n<li>测试集构成写清：场景分布、难度分布、样本量——第 6 周所有效果结论都引用它。</li>\n</ul>\n<h3 id=\"2\">工序 2：种子指令</h3>\n<ul>\n<li>每组从第 4 周作业的 30 条种子出发，补到覆盖任务的主要场景类型；</li>\n<li>种子要「杂」：不同长度、不同表述、带噪声的真实问法优先。</li>\n</ul>\n<h3 id=\"3\">工序 3：扩展（教师或规则做量）</h3>\n<ul>\n<li>方法：改写（同义不同问法）、换场景要素（行业/对象/时间）、加约束（格式/长度/口吻）、难度梯度（简单→多条件→带干扰信息）；</li>\n<li>参数口径：扩展用较高温度（约 0.9）求多样，作答用较低温度（0.3–0.6）求稳定；</li>\n<li>目标量级：扩展到 5,000–10,000 条候选指令。</li>\n</ul>\n<h3 id=\"4\">工序 4：教师生成 + 四道过滤</h3>\n<p>教师按统一作答模板输出，然后过四道关（目标留存率心里有数，别追求全留）：</p>\n<ol>\n<li><strong>格式关</strong>：可解析、字段齐全，不合格直接弃；</li>\n<li><strong>去重关</strong>：指令与答案双向去重（含近重复）；</li>\n<li><strong>自评关</strong>：教师按评分模板给自己的答案打分（准确性、完整性、合规性），低于 4 分（5 分制）弃；</li>\n<li><strong>抽检关</strong>：人工抽检 ≥5%，通过率低于 90% 的批次整批回炉查模板。</li>\n</ol>\n<p>过滤后再掺 10–20% 通用指令数据，进训练前按第 4 周体检清单再过一遍。</p>\n<h3 id=\"_5\">教师作答与自评模板（骨架，各组按任务改）</h3>\n<pre><code>作答模板要点：角色与任务一句话 / 输出格式（与 SFT 数据格式一致）/ 判据清单 / 不知道就明说不许编\n自评模板要点：逐项 1–5 分（准确、完整、格式、合规）/ 任一项 ≤2 分给一句话理由 / 只输出分数与理由，方便程序过滤\n</code></pre>\n<h2 id=\"150\">六、本周实操安排（150 分钟）与产出</h2>\n<ol>\n<li>冻结测试集并组间互查（40 分钟）；</li>\n<li>种子补全与扩展脚本跑通（40 分钟）；</li>\n<li>教师批量生成（异步跑，课上完成首批 1,000 条）（40 分钟）；</li>\n<li>四道过滤实施 + 数据集 v1 定稿登记（30 分钟）：记录漏斗数字——候选数 → 格式留存 → 去重留存 → 自评留存 → 最终条数。</li>\n</ol>\n<p><strong>本周验收</strong>：测试集冻结证明（清单 + 互查签字）；数据集 v1 与漏斗记录；生成与自评模板存档。三样不齐，第 6 周不许开训——先有干净的尺子和数据，再谈训练。</p>\n<h2 id=\"_6\">七、课后作业</h2>\n<ol>\n<li>把批量生成跑完（5,000–10,000 条候选走完四道过滤），数据集升 v1.1 并冻结；</li>\n<li>阅读《你不知道的大模型训练》蒸馏部分，写 5 行笔记：它对「先大再小」的论述与本组项目在哪一步对应；</li>\n<li>预习第 6 周：按第 4 周流程先想好训练配置表（基座、r、lr、epoch、数据版本），路演提纲列一版。</li>\n</ol>\n<h2 id=\"_7\">八、延伸阅读</h2>\n<ul>\n<li>《你不知道的大模型训练：原理、路径与新实践》— WaytoAGI 社区（素材库 04 号文件）</li>\n<li>《微调概念笔记（CPT/SFT/DPO）》— WaytoAGI 社区（素材库 03 号文件；原题与正文不符，以正文为准）</li>\n<li>知乎蓝宝书第二册《强化学习》索引 — WaytoAGI 社区（素材库 13 号文件）</li>\n</ul>\n<hr />\n<p><em>讲师备注：本周最大的风险是组与组之间的测试集互相污染（拿同一批业务问题既当测试又当训练）。冻结与互查环节请严格按流程走；另一风险是学员迷信教师分数——抽检关的人工通过率才是数据集质量的真正锚。</em></p>"}, {"num": "T6", "ch": "技术轨 · 原理到蒸馏（6 周）", "label": "第 6 周 蒸馏结课项目", "title": "技术轨 · 第 6 周讲义：蒸馏结课项目——训练、评估、路演（技术轨收官）", "html": "<h1 id=\"6\">技术轨 · 第 6 周讲义：蒸馏结课项目——训练、评估、路演（技术轨收官）</h1>\n<ul>\n<li>轨道：技术轨</li>\n<li>周次：第 6 周 · 蒸馏结课项目（下半程）+ 技术轨结业</li>\n<li>建议时长：训练与评估 240 分钟（可拆两次课）+ 路演评审 90 分钟</li>\n<li>前置：第 5 周冻结测试集与数据集 v1.1；第 4 周 SFT 流程；第 3 周压测口径</li>\n<li>本讲目标：完成「教师造数据 → 学生训练 → 三方评估 → 部署压测 → 路演」的完整闭环，产出一份经得起追问的结课报告：效果增益有数字、成本优势有账目、局限与失败如实呈现</li>\n<li>来源标注：流程承接第 3–5 周讲义；评分量规与工作页为 Muse 原创整理</li>\n</ul>\n<hr />\n<h2 id=\"_1\">一、本周地图：从数据到结论的五步</h2>\n<ol>\n<li><strong>训练</strong>：用第 5 周数据集对 7–8B 基座做 LoRA SFT（第 4 周流程复用）；</li>\n<li><strong>三方评估</strong>：基座 / 蒸馏模型 / 教师（抽样）在冻结测试集上同场对比；</li>\n<li><strong>部署与压测</strong>：学生模型上 vLLM，按第 3 周口径量化「小而快」的收益；</li>\n<li><strong>Bad case 回流</strong>：错误分类后只补一轮数据、只重训一次；</li>\n<li><strong>路演与结业评审</strong>：12 分钟讲清全链路，评审按量规打分。</li>\n</ol>\n<p>贯穿纪律：<strong>数据版本、训练配置、checkpoint 三件套一一对应</strong>，任何评估数字都要能追溯到「哪版数据、哪版配置、哪个 checkpoint」。对不上账的数字不进报告。</p>\n<h2 id=\"_2\">二、训练执行要点</h2>\n<ul>\n<li>配置起点（第 4 周口径）：LoRA r 取 16–64 按任务复杂度选、lr 1e-4、2–3 epoch、有效批量 16–32；</li>\n<li>时长量级参考：1 万条数据、8B 学生、单台 Spark，约 1–3 小时（估算，含序列长度差异；以实际日志为准），排课时按上限留时间；</li>\n<li>训练中看两件事：eval 曲线是否出现过拟合拐点（取拐点前 checkpoint）；抽查中间 checkpoint 的原始输出（防「loss 好看但输出学歪」）；</li>\n<li>训完即登记：数据版本、过滤漏斗数字、配置全文、checkpoint 路径，四项写进项目档案。</li>\n</ul>\n<h2 id=\"_3\">三、三方评估：把「变好了」说成数字</h2>\n<table>\n<thead>\n<tr>\n<th>对比方</th>\n<th>角色</th>\n<th>怎么测</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>基座模型</td>\n<td>起点</td>\n<td>冻结测试集全量</td>\n</tr>\n<tr>\n<td>蒸馏学生</td>\n<td>本项目产出</td>\n<td>冻结测试集全量</td>\n</tr>\n<tr>\n<td>教师模型</td>\n<td>天花板参照</td>\n<td>测试集抽样 30–50 条（控成本），说明抽样口径</td>\n</tr>\n</tbody>\n</table>\n<p>评估维度（四科，逐项出数）：</p>\n<ol>\n<li><strong>任务效果</strong>：按第 5 周判据打分（规则可判的用规则：字段准确率、格式合规率；开放回答用教师评分 + 人工抽检校准）；</li>\n<li><strong>格式与稳定性</strong>：可解析率、拒答/跑题率；</li>\n<li><strong>通用能力抽查</strong>：20 条通用问题，确认没学成「只会一件事」；</li>\n<li><strong>人工盲评</strong>：抽 20 条，学生与基座输出打乱顺序双盲打分，避免先入为主。</li>\n</ol>\n<p>报告每个数字带三件套：样本量、评分方式、与基座的差值。只报相对增益不报绝对值的，评审有权要求补测。</p>\n<h2 id=\"_4\">四、部署与成本账：小模型的商业意义</h2>\n<p>学生模型 merge 后上 vLLM，按第 3 周阶梯压测取关键档位，与「直接调用教师 API」做一张总账表（口径示例，数字用各组实测填）：</p>\n<table>\n<thead>\n<tr>\n<th>项</th>\n<th>学生本地部署</th>\n<th>教师 API 直调</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>单请求成本</td>\n<td>电费+硬件摊销（几近于零的边际成本）</td>\n<td>按 token 实时计费</td>\n</tr>\n<tr>\n<td>延迟</td>\n<td>本地实测 TPOT/TTFT</td>\n<td>含网络往返</td>\n</tr>\n<tr>\n<td>数据合规</td>\n<td>不出内网</td>\n<td>出网（敏感场景不可用）</td>\n</tr>\n<tr>\n<td>效果</td>\n<td>本组评估分</td>\n<td>天花板参照分</td>\n</tr>\n</tbody>\n</table>\n<p>这张表就是蒸馏的立项理由：用一次性的小额数据与训练成本，换长期的低边际成本、可私有化与可控延迟。效果差教师一截是预期内——要论证的是「差多少、换来了什么」。</p>\n<h2 id=\"bad-case\">五、Bad case 回流：只补一轮</h2>\n<p>把评估中的错误逐条分类，不同类不同药：</p>\n<table>\n<thead>\n<tr>\n<th>错误类型</th>\n<th>特征</th>\n<th>处理</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>教师错</td>\n<td>教师抽样答案本身错、学生忠实学错</td>\n<td>修判据与自评模板，该类数据整批复查</td>\n</tr>\n<tr>\n<td>数据缺</td>\n<td>某类场景测试有、训练没有</td>\n<td>定向补种子 → 扩展生成 → 同过滤流程</td>\n</tr>\n<tr>\n<td>训练不足</td>\n<td>数据里有、模型没学会</td>\n<td>先看曲线与配置（epoch/lr），再决定是否加训</td>\n</tr>\n<tr>\n<td>任务边界</td>\n<td>连教师都不稳定</td>\n<td>缩小项目承诺范围，写进局限，不要硬凑</td>\n</tr>\n</tbody>\n</table>\n<p>纪律：<strong>只回流一轮</strong>。一轮后仍不达标的，如实写进局限与下一步——无限打补丁是项目失控的开始，结课评审反而奖励对边界的清醒。</p>\n<h2 id=\"12\">六、路演规则（每组 12 分钟）</h2>\n<ol>\n<li><strong>1 分钟</strong>：任务与基线——基座在测试集上是多少分，痛点是什么；</li>\n<li><strong>3 分钟</strong>：数据构建——种子来源、扩展方法、过滤漏斗数字（候选 → 留存逐级报数）；</li>\n<li><strong>3 分钟</strong>：训练与评估——三方对比表，讲一个最典型的 bad case 及其分类；</li>\n<li><strong>2 分钟</strong>：部署与成本——压测关键数字与总账表；</li>\n<li><strong>2 分钟</strong>：局限与下一步——学生离教师还差在哪、数据与任务边界是什么；</li>\n<li><strong>1 分钟</strong>：结论——这个专用小模型值不值得在组内继续投入。</li>\n</ol>\n<p>评审追问只围绕三件事：测试集干不干净、数字对不对得上账、局限说没说实话。</p>\n<h2 id=\"100-70\">七、评分量规（100 分制，70 分通过）</h2>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>分值</th>\n<th>满分标准</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>数据质量</td>\n<td>25</td>\n<td>测试集冻结无泄漏；漏斗数字完整；抽检通过率达标</td>\n</tr>\n<tr>\n<td>评估严谨</td>\n<td>25</td>\n<td>三方对比齐全；数字带样本量与口径；盲评执行</td>\n</tr>\n<tr>\n<td>效果增益</td>\n<td>20</td>\n<td>相对基座增益显著且可解释；与教师差距如实量化</td>\n</tr>\n<tr>\n<td>工程完整</td>\n<td>15</td>\n<td>训练三件套可追溯；部署压测按第 3 周口径完成</td>\n</tr>\n<tr>\n<td>诚实报告</td>\n<td>15</td>\n<td>失败与局限如实呈现；bad case 分类准确、回流纪律守住</td>\n</tr>\n</tbody>\n</table>\n<p><strong>一票否决项</strong>：测试集泄漏进训练数据；编造或美化评估数字；把真实敏感数据发往外部 API 生成训练数据；隐瞒教师抽样口径冒充全量评估。</p>\n<h2 id=\"_5\">八、技术轨结业与后续深水区</h2>\n<ul>\n<li><strong>结业标准</strong>：六周作业齐全 + 结课路演 ≥70 分且无一票否决；优秀项目进入公司案例库，数据与模型按内部资产归档（数据版本、配置、评估报告齐全才可复用）；</li>\n<li><strong>六周能力清单（自检）</strong>：能算三笔账（参数量/KV/带宽）；能独立部署与调参 vLLM；能做标准压测与故障处置；能备数据并完成 LoRA SFT 与 A/B 验收；能独立跑通一次数据蒸馏全流程；</li>\n<li><strong>深水区自选路线（不占课时）</strong>：知乎蓝宝书第一册《AI Infra》与第二册《强化学习》（素材库 12/13 号索引）；《从零构建自己的 LLM（五阶段）》（素材库 08 号文件）；偏好优化（DPO）专题；CUDA 与推理内核专题（可与 DGX Spark 技术栈学习线合并推进）。</li>\n</ul>\n<h2 id=\"_6\">附录：结课项目工作页</h2>\n<h3 id=\"a\">A. 数据漏斗记录表</h3>\n<table>\n<thead>\n<tr>\n<th>环节</th>\n<th>条数</th>\n<th>备注</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>扩展候选指令</td>\n<td></td>\n<td>扩展方法与温度：</td>\n</tr>\n<tr>\n<td>教师生成完成</td>\n<td></td>\n<td>教师与版本：</td>\n</tr>\n<tr>\n<td>格式关留存</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>去重后留存</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>自评关留存（≥4 分）</td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>抽检通过（批）</td>\n<td></td>\n<td>抽检比例与通过率：</td>\n</tr>\n<tr>\n<td>掺通用数据后最终训练集</td>\n<td></td>\n<td>通用数据来源与比例：</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"b\">B. 三方评估表（模板）</h3>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>基座</th>\n<th>蒸馏学生</th>\n<th>教师（抽样 n=）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>任务效果分</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>格式合规率</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>拒答/跑题率</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>通用抽查（20 条）</td>\n<td></td>\n<td></td>\n<td>—</td>\n</tr>\n<tr>\n<td>盲评胜率（对基座）</td>\n<td>—</td>\n<td></td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"c\">C. 路演自查</h3>\n<ul>\n<li>[ ] 测试集冻结与互查记录在手；</li>\n<li>[ ] 每个数字能对应到数据版本与 checkpoint；</li>\n<li>[ ] 准备了一个 bad case 及其分类；</li>\n<li>[ ] 成本账表数字为实测或注明估算；</li>\n<li>[ ] 局限部分不是空话：写明差距与边界。</li>\n</ul>\n<hr />\n<p><em>讲师备注：结课评审请把「诚实报告」的 15 分用足示范效应——如实报告失败与边界的组要明显高于粉饰数字的组。技术轨的终点不是训出多强的模型，而是学员带走一套可复用的方法：先冻结尺子，再造数据，再训练，再用数字说话。</em></p>"}, {"num": "A1", "ch": "进阶 A · 训练工程", "label": "A1 并行训练与 Megatron 模式", "title": "进阶专题 · 模块 A 第 1 讲：并行训练与 ms-swift Megatron 模式", "html": "<h1 id=\"a-1-ms-swift-megatron\">进阶专题 · 模块 A 第 1 讲：并行训练与 ms-swift Megatron 模式</h1>\n<blockquote>\n<p><strong>讲次</strong>：第二阶段进阶专题 / 模块 A 训练工程 · 第 1 讲（A1）\n<strong>建议时长</strong>：2.5–3 小时（讲解约 100 分钟 + 实操约 60–80 分钟）\n<strong>前置知识</strong>：第一阶段技术轨全部内容——Transformer 与推理原理、vLLM 部署与压测运维、SFT 微调（LLaMA-Factory）、数据蒸馏结课项目。学员应能独立算参数量、KV Cache 与显存账，能读训练日志的 loss 与吞吐字段。\n<strong>素材来源说明</strong>：本讲引用素材均来自公司内部存档 <code>materials-advanced/</code>，逐节标注来源（机构 / 文档名）。框架命令与参数以 ms-swift 官方文档存档为准，开课时须按当前版本复核；自组织教学内容标注「Muse 整理」。社区与机构文档版权归原作者 / 机构所有，仅供公司内部学习。</p>\n</blockquote>\n<p><strong>本讲一句话结论</strong>：并行训练不是「卡多力量大」，而是一道在显存、算力、通信之间做交换的工程题；先把账算清，再选策略，最后才轮到敲命令。</p>\n<hr />\n<h2 id=\"1\">1. 学习目标与本讲地图</h2>\n<p>学完本讲，学员应能做到：</p>\n<ol>\n<li>对任意一个模型，先算两笔账（显存账、算力账），判断它在公司双机 DGX Spark 上「能不能训、要训多久」；</li>\n<li>说清 DP / TP / PP / SP / CP / EP / VPP 七种并行各自切什么、通信什么、代价什么，并能给一个给定场景选出合理的组合；</li>\n<li>说清 ZeRO/FSDP 路线与 Megatron 路线的理念差异，知道 ms-swift 两条路线都在什么位置；</li>\n<li>看懂训练的稳定性信号（loss 曲线、梯度、显存曲线），对训崩、卡死、变慢有初步诊断路径；</li>\n<li>会算 MFU，会把一次训练折算成时间与成本；</li>\n<li>读懂 ms-swift Megatron 模式的官方快速开始脚本与 Qwen3.8-Flash-Next 最佳实践脚本，能在实操中改对并行参数并记录对照数据。</li>\n</ol>\n<p><strong>本讲地图</strong>（Muse 整理）：</p>\n<table>\n<thead>\n<tr>\n<th>节</th>\n<th>内容</th>\n<th>解决的问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>§2</td>\n<td>两笔账：显存与算力</td>\n<td>为什么必须并行</td>\n</tr>\n<tr>\n<td>§3</td>\n<td>并行策略全景</td>\n<td>有哪些切法、各付什么代价</td>\n</tr>\n<tr>\n<td>§4</td>\n<td>两条路线对照</td>\n<td>ZeRO/FSDP 与 Megatron 怎么选</td>\n</tr>\n<tr>\n<td>§5</td>\n<td>混合精度与稳定性</td>\n<td>怎么训得稳、崩了怎么查</td>\n</tr>\n<tr>\n<td>§6</td>\n<td>MFU 与成本账</td>\n<td>训得快不快、贵不贵</td>\n</tr>\n<tr>\n<td>§7</td>\n<td>ms-swift Megatron 实战导读</td>\n<td>命令与参数怎么读</td>\n</tr>\n<tr>\n<td>§8</td>\n<td>贯穿案例</td>\n<td>公司同款模型的官方最佳实践拆解</td>\n</tr>\n<tr>\n<td>§9</td>\n<td>实操</td>\n<td>双机并行对照实验</td>\n</tr>\n<tr>\n<td>§10–§11</td>\n<td>常见坑 / 练习与延伸阅读</td>\n<td>避坑与课后巩固</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"2\">2. 为什么需要并行：单卡装不下、算不完的两笔账</h2>\n<blockquote>\n<p>要点：并行的动机只有两个——<strong>一台设备装不下</strong>（显存账），<strong>一台设备算不完</strong>（算力账）。先算账，再谈策略。本节算例为 Muse 整理，输入数据为公司实测值与公开模型参数；Adam 状态占用的口径来自 Datawhale《So Large LM》第 6 章，内存墙背景来自该书第 8 章。</p>\n</blockquote>\n<p>So Large LM 第 8 章开篇点明了背景：模型规模的增长撞上了「内存墙」——单芯片的算力与容量受物理规律限制，增速跟不上模型膨胀，分布式训练因此势在必行（来源：Datawhale《So Large LM》第 8 章《分布式训练》）。下面用公司自己的硬件把这句话算成数字。</p>\n<h3 id=\"21\">2.1 第一笔账：显存装不装得下</h3>\n<p>全参数训练时，每台设备要同时放下四样东西：<strong>权重、梯度、优化器状态、激活值</strong>。前三样是静态大头，可以按参数量直接估算：</p>\n<ul>\n<li>权重（BF16）：2 字节 / 参数；</li>\n<li>梯度（BF16）：2 字节 / 参数；</li>\n<li>优化器状态（AdamW）：一阶动量 m、二阶动量 v 各一份 FP32（8 字节），混合精度训练还要保留一份 FP32 主权重（4 字节），合计 <strong>12 字节 / 参数</strong>。</li>\n</ul>\n<p>依据：Adam 需要同时保存 θ（参数）、g（梯度）、m、v 四份张量，存储是参数本身的 4 倍量级；混合精度训练则把主权重存为 FP32、在低精度下执行其余运算（来源：Datawhale《So Large LM》第 6 章《模型训练》6.2.2、6.2.4 节）。</p>\n<p>合计口径：<strong>全参数 AdamW 混合精度训练，静态占用 ≈ 16 字节 / 参数</strong>（未含激活值，激活另随 batch、序列长度、层数增长，可用重计算压低，见 §5、§8）。</p>\n<p>拿公司硬件对账（单台 DGX Spark 系统可见内存约 121.6 GB，两台合计约 243 GB；注意 Spark 是统一内存，训练可用内存还要先扣掉系统与现行服务占用）：</p>\n<table>\n<thead>\n<tr>\n<th>模型</th>\n<th>参数量</th>\n<th>静态占用（16 B/参数）</th>\n<th>单台 Spark</th>\n<th>双台 Spark</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Qwen2.5-7B</td>\n<td>7B</td>\n<td>≈112 GB</td>\n<td>临界：静态已逼近上限，激活无处放</td>\n<td>切分后可行</td>\n</tr>\n<tr>\n<td>Qwen3-32B 级别</td>\n<td>32B</td>\n<td>≈512 GB</td>\n<td>装不下</td>\n<td>仍装不下（需 ZeRO-3/卸载/LoRA）</td>\n</tr>\n<tr>\n<td>Qwen3.8-Flash-Next（公司在跑）</td>\n<td>125B</td>\n<td>仅 BF16 权重就 ≈250 GB</td>\n<td>装不下</td>\n<td>权重都装不下</td>\n</tr>\n</tbody>\n</table>\n<p>最后一行最能说明问题：公司现行模型光权重（BF16）就超过两台 Spark 的内存总和，所以线上只能以 NVFP4 量化形态（约 62.5 GB）做推理；而它的官方训练最佳实践是 8 卡集群 + 关键权重卸载到 CPU 内存（见 §8）。<strong>结论：全参数训练稍大一点的模型，单机在物理上就不成立，并行与切分不是优化项，是入场券。</strong></p>\n<p>对照 LoRA：可训练参数占比通常不到 1%，优化器状态随之缩小两个数量级，静态大头只剩冻结的 BF16 权重（2 字节 / 参数）。这就是第一阶段 SFT 课上 7B 级 LoRA 能在单机跑通的原因（ms-swift 官方快速开始给出的参照：单卡 3090、13 GB 即可完成 Qwen3-4B 的 LoRA 自我认知微调，来源：ms-swift《快速开始》）。</p>\n<h3 id=\"22\">2.2 第二笔账：时间等不等得起</h3>\n<p>训练计算量的经验公式（Muse 整理，业界通用估算口径）：</p>\n<blockquote>\n<p><strong>训练 FLOPs ≈ 6 × 有效参数量 × 训练 token 数</strong>（MoE 模型用每 token 激活参数量）</p>\n</blockquote>\n<p>算例：对一个 7B 稠密模型做 10 亿 token 的继续训练，FLOPs ≈ 6 × 7×10⁹ × 1×10⁹ ≈ 4.2×10¹⁹。公司实测 GB10 在优化过的 torch 构建下 FP16 矩阵乘约 90 TFLOPS 量级（公司实测数据，见模块 C 相关材料）；即便乐观地按有效利用率 35%（MFU 的概念见 §6）折算成约 31 TFLOPS 的持续算力，单机耗时 ≈ 4.2×10¹⁹ ÷ 3.1×10¹³ ≈ 1.35×10⁶ 秒 ≈ <strong>15 天以上</strong>。两台并行、且并行效率打八折，也要一周量级。</p>\n<p>反过来，第一阶段蒸馏项目的量级是 1 万条样本、约 1000 万 token，同口径估算单机数小时——与实际体验吻合。<strong>结论：SFT 数据「以条计」时单机够用；一旦目标变成「以 token 计」的继续预训练或大规模微调，时间账立刻逼你并行。</strong></p>\n<h3 id=\"23\">2.3 两笔账的用法</h3>\n<ul>\n<li>显存账决定<strong>切分的下限</strong>：至少要把静态占用切到每台设备装得下、还留得出激活空间；</li>\n<li>算力账决定<strong>并行的收益上限</strong>：设备翻倍，时间最好情况下减半，通信开销会吃掉一部分（吃掉多少，取决于策略，见 §3）；</li>\n<li>两台 Spark 之间的互联远慢于单机内部的统一内存访问——这是后面所有选型直觉的物理根源：<strong>通信量大的切法尽量别跨机器</strong>（公司现行 vLLM 服务用 TP2+EP 跨双机是推理场景的权衡，训练选型另有讲究，见 §3.3 与 §9 的对照实验）。</li>\n</ul>\n<hr />\n<h2 id=\"3\">3. 并行策略全景：切什么、通信什么、代价什么</h2>\n<blockquote>\n<p>要点：七种并行只做三件事——切数据、切权重、切层（含切序列、切专家）。选型的核心变量是<strong>通信量与通信频率</strong>。策略定义与矩阵乘法图解来自 Datawhale《So Large LM》第 8 章；ms-swift 的官方选型规则来自 ms-swift《Megatron-SWIFT 快速开始》的「训练技巧」一节；组合直觉表为 Muse 整理。</p>\n</blockquote>\n<p>先建立一个统一视角（Muse 整理）：一次训练迭代 = 前向 + 反向 + 优化器更新。任何并行策略都是在回答同一个问题——<strong>这一步里，每台设备算哪一部分、存哪一部分、需要和谁交换什么</strong>。交换得越频繁、数据量越大，对互联带宽越敏感。</p>\n<h3 id=\"31\">3.1 逐个讲清</h3>\n<p><strong>DP（数据并行，Data Parallel）</strong>\n- 切什么：切<strong>数据</strong>。每台设备持有一份完整模型副本，各吃一个数据分片。\n- 通信什么：反向后对梯度做 <strong>AllReduce</strong> 求平均，保证各副本更新一致（来源：So Large LM 第 8 章 8.2.1 节）。\n- 代价：每台设备都要装下完整模型 + 优化器状态，显存不省；通信量与梯度大小成正比，每步一次。ms-swift 官方评价：<strong>DP 速度最快，但显存占用最多</strong>（来源：ms-swift《Megatron-SWIFT 快速开始》）。</p>\n<p><strong>TP（张量并行，Tensor Parallel）</strong>\n- 切什么：切<strong>单个算子内部的权重矩阵</strong>（模型并行的一种，如把一层的大矩阵乘按列/行拆到多台设备）。\n- 通信什么：每层前向、反向中都要做 AllReduce / AllGather 拼接部分结果——<strong>通信频率最高、与计算交织</strong>。\n- 代价：对互联带宽与延迟极其敏感。ms-swift 官方规则：TP 通信量大，<strong>尽量不跨节点、限制在高速互联域内</strong>（来源：同上）。</p>\n<p><strong>PP（流水线并行，Pipeline Parallel）</strong>\n- 切什么：按<strong>层</strong>切阶段（stage），设备之间接力：stage 0 算完前几层，把激活传给 stage 1（来源：So Large LM 第 8 章 8.2.3 节）。\n- 通信什么：只在 stage 边界传激活值，<strong>通信量最小</strong>；靠 micro-batch 切分把流水线填满，减少空泡（bubble）。\n- 代价：切分不均会让某个 stage 成为瓶颈（§8 有一个真实案例：因为某层特别重，官方专门调了第一个 stage 的层数）；空泡率随 micro-batch 数下降。</p>\n<p><strong>SP（序列并行，Sequence Parallel）</strong>\n- 切什么：切 TP 没覆盖到的部分——LayerNorm、Dropout 等沿<strong>序列维度</strong>的激活，配合 TP 使用。\n- 通信什么：把 TP 区域边界的 AllReduce 拆成 ReduceScatter + AllGather，总量不增、激活显存下降。\n- 代价：必须与 TP 搭配（ms-swift 脚本里常以 <code>--sequence_parallel true</code> 与 TP 同时出现，来源：ms-swift《Megatron-SWIFT 快速开始》快速入门案例）。收益主要是省激活显存，让 TP 组的单设备占用再降一截。</p>\n<p><strong>CP（上下文并行，Context Parallel）</strong>\n- 切什么：沿<strong>序列长度</strong>切分，让多台设备分摊一条超长序列的注意力计算。\n- 通信什么：注意力需要跨分片交换 K/V（环状传递一类实现）。\n- 代价：为长上下文而生（32K、128K 训练）；短序列场景没有收益，属按需开启项。ms-swift 已将 CP 列入 Megatron 并行支持清单（来源：ms-swift《快速开始》框架介绍）。</p>\n<p><strong>EP（专家并行，Expert Parallel）</strong>\n- 切什么：MoE 模型的<strong>专家</strong>分发到不同设备，每个 token 只被路由到少数专家。\n- 通信什么：token 的分发与回收（All-to-All），通信量随激活专家数与 token 数增长。\n- 代价：与 TP 一样属高通信策略。ms-swift 官方规则：<strong>专家层建议用 EP 而不是 ETP（专家张量并行）</strong>——ETP 更省显存，但速度较慢；且 MoE 的并行组与稠密部分是分离的（注意力用 tp-cp-dp-pp 组，MoE 用 etp-ep-dp-pp 组），称为并行折叠（来源：ms-swift《Megatron-SWIFT 快速开始》训练技巧）。</p>\n<p><strong>VPP（虚拟流水线并行，Virtual Pipeline Parallel）</strong>\n- 切什么：PP 的细化版——每个 stage 再拆成多个不连续的层块（虚拟 stage），交错排布。\n- 通信什么：边界通信次数增多，但单个 stage 的工作粒度变细。\n- 代价：主要收益是<strong>削减流水线空泡</strong>，在 PP 深度较大时才有意义；小规模（如双机）基本用不上，知道概念即可。ms-swift 将 VPP 列入 Megatron 并行策略清单（来源：ms-swift《快速开始》）。</p>\n<h3 id=\"32\">3.2 组合策略与选型直觉</h3>\n<p>真实的大规模训练从来都是组合（混合并行）。So Large LM 给出的经典案例：GPT-3 训练用了 64 个流水线阶段、每阶段跨 6 台 DGX-A100 主机，主机间做数据并行、主机内 8 卡做模型并行（来源：So Large LM 第 8 章 8.2.4 节）。规律是：<strong>通信越重的并行，越往高速互联域里收；通信越轻的，越往外放。</strong></p>\n<p>选型直觉表（Muse 整理，依据上述官方规则归纳）：</p>\n<table>\n<thead>\n<tr>\n<th>场景</th>\n<th>优先组合</th>\n<th>理由</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>模型单机装得下、数据量大</td>\n<td>DP（+ ZeRO 切优化器状态，见 §4）</td>\n<td>通信每步一次，扩展效率最高</td>\n</tr>\n<tr>\n<td>模型单机装不下、设备在同一高速互联域</td>\n<td>TP（+SP）打底，外层套 DP</td>\n<td>TP 通信最重，必须留在域内</td>\n</tr>\n<tr>\n<td>跨机器扩展</td>\n<td>PP / DP 优先，TP、EP 不跨机</td>\n<td>跨机带宽低，PP 只传边界激活、DP 每步同步一次</td>\n</tr>\n<tr>\n<td>MoE 模型</td>\n<td>专家层 EP（不首选 ETP），注意力侧 TP/CP/DP/PP 分开组网</td>\n<td>官方并行折叠规则</td>\n</tr>\n<tr>\n<td>超长上下文</td>\n<td>CP 或 SP 降激活显存，配重计算</td>\n<td>激活随序列长度膨胀，先治激活</td>\n</tr>\n<tr>\n<td>只有两台 Spark（公司实境）</td>\n<td>见 §9 实验：DP 与 TP 跨机正面对照</td>\n<td>双机是最小可实验规模，结论以实测为准</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"33\">3.3 一个必须破除的直觉</h3>\n<p>「并行度越高越快」是错的。§8 的官方实测里，同一个模型把并行从 TP2/EP4/PP2 改成 TP4/EP2/PP2，单步耗时变成基线的 <strong>2.58 倍</strong>（慢了一倍半）；改成 TP2/EP4/PP1 反而快到 0.80 倍，但每卡显存涨了 88.5%。<strong>并行配置是带约束的优化问题：先满足显存约束，再在可行域里找最快的组合</strong>——这也是 §9 实验要让学员亲手摸到的东西。</p>\n<hr />\n<h2 id=\"4-zerofsdp-vs-megatron\">4. 两条路线对照：ZeRO/FSDP 路线 vs Megatron 路线</h2>\n<blockquote>\n<p>要点：两条路线解决的是同一个显存问题，哲学不同——<strong>ZeRO/FSDP 是「在数据并行上做减法」</strong>（模型还是一份逻辑整体，把状态分片存放、用时再拼）；<strong>Megatron 是「把模型本身切开算」</strong>（TP/PP/EP 从算子与层级动刀）。ms-swift 两条路线都支持，本讲主线是 Megatron 模式。ZeRO 分级定义来自 ms-swift《预训练与微调》；Megatron 侧的实测对照数据来自 ms-swift《Megatron-SWIFT 快速开始》Benchmark 一节；对比表为 Muse 整理。</p>\n</blockquote>\n<h3 id=\"41-zerofsdp\">4.1 ZeRO/FSDP 路线：不切模型，切状态</h3>\n<p>回到 §2 的显存账：静态占用的大头其实不是权重本身，而是优化器状态（12 字节/参数）。ZeRO 的思路是：DP 每台设备本来就存了一整份权重、梯度、优化器状态，纯属重复——把它们分片，每台只存 1/N，用到时再通过通信取回。</p>\n<ul>\n<li><strong>ZeRO-2</strong>：对优化器状态、梯度分片；</li>\n<li><strong>ZeRO-3</strong>：在 ZeRO-2 基础上，再对模型参数分片，最省显存，但通信更多、速度更慢（来源：ms-swift《预训练与微调》「分布式训练」一节，该节同时列出 ms-swift 普通模式支持的分布式方式：DDP、device_map 简易模型并行、DeepSpeed ZeRO2/ZeRO3、FSDP，并提醒 DeepSpeed 省显存但会略降速度）。</li>\n</ul>\n<p>FSDP 是 PyTorch 原生的同类实现，理念与 ZeRO-3 接近。对照素材：上海人工智能实验室的新一代训练引擎 XTuner 即基于 PyTorch FSDP 构建，其 FP8 训练文档提到用 FP8 通信缓解「FSDP 通信量大」的固有瓶颈（来源：上海人工智能实验室 XTuner《FP8 训练》）——说明这条路线的痛点与优化方向都在通信上。</p>\n<p><strong>代价一句话</strong>：ZeRO/FSDP 用通信换显存，编程模型最简单（几乎还是单机写法），是「模型略大于单机、卡数不多」时的默认首选；规模越大、模型越深，它的拼装通信越吃紧。</p>\n<h3 id=\"42-megatron\">4.2 Megatron 路线：把并行写进模型</h3>\n<p>Megatron 路线从一开始就把 TP/PP/SP/CP/EP 做进模型的每一层：权重天生是分片存储的，注意力与 MLP 的切分方式写死在实现里，再配合 Transformer Engine 的融合算子与 FP8 支持，把通信与计算的 overlap 做到极致。它的默认搭配还包含一层 ZeRO 思想——ms-swift 官方说明：Megatron-SWIFT 的并行是 <strong>zero1（默认开启分布式优化器）+ 各种并行技术的组合</strong>（来源：ms-swift《Megatron-SWIFT 快速开始》训练技巧），即两条路线并非互斥，Megatron 在 DP 维度上同样借用了 ZeRO-1 的优化器分片。</p>\n<p>官方 Benchmark（来源：ms-swift《Megatron-SWIFT 快速开始》，注意环境是 A800 集群，只作量级参照，不是对 Spark 的预期）：</p>\n<table>\n<thead>\n<tr>\n<th>场景</th>\n<th>Megatron-LM</th>\n<th>DeepSpeed-ZeRO2</th>\n<th>DeepSpeed-ZeRO3</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>稠密 Qwen2.5-14B 全参、8K 上下文、单机 8×A800</td>\n<td><strong>9.04 s/it</strong>，8×64 GB</td>\n<td>10.32 s/it，8×80 GB</td>\n<td>10.56 s/it，8×58 GB</td>\n</tr>\n<tr>\n<td>MoE Qwen3-30B-A3B 全参、8K 上下文、双机 16×A800</td>\n<td><strong>9.6 s/it</strong>，16×60 GiB</td>\n<td>OOM</td>\n<td>91.2 s/it，16×80 GiB</td>\n</tr>\n</tbody>\n</table>\n<p>两组数据读出的信息：稠密模型上 Megatron 速度领先、显存介于 ZeRO2 与 ZeRO3 之间；MoE 模型上差距被放大到数量级（原文注明 DeepSpeed 该结果有 transformers 版本口径，细节以原文为准）。</p>\n<h3 id=\"43-muse\">4.3 怎么选（Muse 整理）</h3>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>ZeRO/FSDP 路线</th>\n<th>Megatron 路线</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>心智模型</td>\n<td>单机程序 + 状态分片</td>\n<td>模型按并行组重构</td>\n</tr>\n<tr>\n<td>上手成本</td>\n<td>低（<code>swift sft</code> + deepspeed 配置）</td>\n<td>高（权重格式、并行参数、转换/桥接）</td>\n</tr>\n<tr>\n<td>显存效率</td>\n<td>ZeRO-3 最高一档</td>\n<td>靠 TP/PP/EP 组合，可与 zero1 叠加</td>\n</tr>\n<tr>\n<td>速度上限</td>\n<td>中</td>\n<td>高（尤其 MoE、大规模、长上下文）</td>\n</tr>\n<tr>\n<td>典型场景</td>\n<td>中小规模全参微调、快速实验</td>\n<td>大模型预训练、MoE、追求 MFU 的生产训练</td>\n</tr>\n<tr>\n<td>ms-swift 入口</td>\n<td><code>swift sft/pt/rlhf</code> + <code>--deepspeed</code></td>\n<td><code>megatron sft/pt/rlhf</code> 子命令</td>\n</tr>\n</tbody>\n</table>\n<p>公司的选择逻辑：第一阶段的 SFT 课用的是 ZeRO 友好的生态（LLaMA-Factory），量级在单机可控范围；进入进阶阶段、要碰公司同款 MoE 大模型的训练方法论，必须补上 Megatron 这条线——§8 的官方最佳实践就是完全长在 Megatron 上的。</p>\n<hr />\n<h2 id=\"5\">5. 混合精度与稳定性：训得稳，比训得快更重要</h2>\n<blockquote>\n<p>要点：BF16 是当前训练的默认精度，FP8 是在 Hopper 之后架构上继续压榨算力与通信的进阶项；稳定性靠三件事——<strong>预热、梯度裁剪、损失缩放（FP16 时代）</strong>，以及一条能看懂的诊断清单。混合精度与优化器口径来自 Datawhale《So Large LM》第 6 章；FP8 数据来自 XTuner《FP8 训练》与 ms-swift 文档对 FP8 训练的支持说明；诊断清单为 Muse 整理（锚点逐项标注）。</p>\n</blockquote>\n<h3 id=\"51\">5.1 精度路线图</h3>\n<ul>\n<li><strong>FP32</strong>：老默认。数值范围大但慢且占显存，现仅保留在优化器主权重等关键位置。</li>\n<li><strong>混合精度（FP16/BF16）</strong>：主权重存 FP32，其余计算走低精度，存储减半；FP16 数值下限问题（小于 2⁻²⁴ 的值变 0）靠<strong>损失缩放</strong>（放大 loss 把梯度拉回可表示范围）解决（来源：So Large LM 第 6 章 6.2.4 节）。BF16 指数位与 FP32 相同、动态范围大，不需要损失缩放，是当前大模型训练的事实默认，ms-swift 全部官方脚本都以 <code>--torch_dtype bfloat16</code> 起步（来源：ms-swift《快速开始》《Megatron-SWIFT 快速开始》）。</li>\n<li><strong>FP8</strong>：Hopper 架构引入的 8 位浮点。XTuner 文档总结其三项收益：降低通信量（对 FSDP 路线尤其关键）、提升矩阵乘效率、降低计算图显存（保存 FP8 张量而非 BF16）；同时强调要用细粒度量化保证精度。XTuner 的对照数据：256 卡、序列 65536、tp1/ep1/pp1 下，BF16 为 32.77 s/it、2000 tokens/GPU/s，FP8 为 26.75 s/it、2450 tokens/GPU/s，吞吐提升约 22%（来源：上海人工智能实验室 XTuner《FP8 训练》Benchmark）。ms-swift 的 Megatron 模式同样把 FP8 训练列为全方法支持项（来源：ms-swift《Megatron-SWIFT 快速开始》方法支持表）。</li>\n<li><strong>对 GB10 的提醒（Muse 整理）</strong>：存档文档的 FP8 叙述以 Hopper 及之后的数据中心架构为语境；GB10 上 FP8 训练链路（Transformer Engine 等）是否完整可用，<strong>属于 §9 冒烟验证要回答的问题</strong>，不预设结论。</li>\n</ul>\n<h3 id=\"52\">5.2 稳定性三件套</h3>\n<ol>\n<li><strong>学习率预热（warmup）</strong>：Transformer 训练必须先用一小段步数把学习率从低值爬升到目标值，否则早期极易不稳定；So Large LM 第 6 章给出的解释是预热可防止 LayerNorm 相关梯度问题导致 Adam 训练失稳（来源：So Large LM 第 6 章 6.2.5 节）。ms-swift 官方脚本对应参数 <code>--lr_warmup_fraction 0.05</code>（见 §7）。</li>\n<li><strong>梯度裁剪（gradient clipping）</strong>：按全局范数封顶梯度，防止个别坏批次把参数打飞。GPT-3 的公开训练配置即包含梯度裁剪、余弦衰减、权重衰减 0.1、Adam β₁=0.9 / β₂=0.95 等一整套「稳定配方」（来源：So Large LM 第 6 章 6.2.6 节）。</li>\n<li><strong>调度与衰减</strong>：预热后用余弦等方式衰减到一个小值（官方脚本 <code>--min_lr</code> 即衰减下限），避免训练末期震荡。</li>\n</ol>\n<h3 id=\"53-muse\">5.3 训崩诊断清单（Muse 整理）</h3>\n<p>训崩不要慌，按「先看曲线形态、再查数据与配置」的顺序排查：</p>\n<table>\n<thead>\n<tr>\n<th>症状</th>\n<th>优先怀疑</th>\n<th>第一动作</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>开局几步 loss 爆炸 / NaN</td>\n<td>学习率过高、没预热</td>\n<td>降 lr、确认 warmup 生效，小数据复现</td>\n</tr>\n<tr>\n<td>训练中途 loss 突然尖峰后不恢复</td>\n<td>坏数据批次、梯度未裁剪</td>\n<td>定位尖峰步的数据分片；确认梯度裁剪开启</td>\n</tr>\n<tr>\n<td>loss 平稳但不下降</td>\n<td>学习率过低、数据/模板错误</td>\n<td>对照第一阶段 SFT 经验，先查数据与 template</td>\n</tr>\n<tr>\n<td>显存随步数缓慢爬升后 OOM</td>\n<td>序列长度分布不均、长样本后置</td>\n<td>查数据长度分布；开启 packing/长度分组（§5.4）；调重计算</td>\n</tr>\n<tr>\n<td>第 1 步就 OOM</td>\n<td>静态账算错（§2）</td>\n<td>回到显存账：降 micro batch、开重计算、加切分</td>\n</tr>\n<tr>\n<td>多机训练启动后卡住不动</td>\n<td><strong>多机数据预处理不一致</strong></td>\n<td>确认 <code>MODELSCOPE_CACHE</code> 指向共享存储（ms-swift 官方明确警告：不设此项多机可能因数据不一致卡住，来源：ms-swift《Megatron-SWIFT 快速开始》环境准备）</td>\n</tr>\n<tr>\n<td>各 rank 步时差严重、整体被拖慢</td>\n<td>样本长度不均衡，最慢 rank 决定步时</td>\n<td>packing + 按长度分组采样（见 §5.4）</td>\n</tr>\n<tr>\n<td>只有部分 rank 有日志、误以为没启动</td>\n<td>Megatron 日志只在 last rank 打印</td>\n<td>看 last rank 日志为准（来源：ms-swift《Megatron-SWIFT 快速开始》训练技巧）</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"54\">5.4 一个容易被忽视的稳定性因素：数据侧的均衡</h3>\n<p>步时由最慢的 rank 决定——如果各 rank 分到的数据长度分布不均，短序列的 rank 算完只能等。XTuner 的数据流设计专治这个问题：先分布式缓存并统计每条样本的 token 数（meta 信息），再用 packing 把短样本拼满、减少 pad 浪费（SoftPack/HardPack 两种策略），最后用 LengthGroupedSampler 按计算开销分组分发，使各 rank 的每步耗时接近（来源：上海人工智能实验室 XTuner《训练数据流》）。ms-swift 侧对应的提速手段同样包括 packing（官方训练技巧第一条，来源：ms-swift《Megatron-SWIFT 快速开始》）。<strong>记住：并行效率一半在模型切分，一半在数据分发。</strong></p>\n<hr />\n<h2 id=\"6-mfu\">6. MFU 与训练成本账：怎么算、怎么读</h2>\n<blockquote>\n<p>要点：MFU（模型算力利用率）= 实际达成的训练 FLOPs ÷ 硬件峰值 FLOPs，是把「训得快不快」压缩成一个可比数字的口径。本节公式与算例为 Muse 整理；锚点数据来自公司实测与 §4、§8 的官方实测表。</p>\n</blockquote>\n<h3 id=\"61-mfu\">6.1 MFU 怎么算</h3>\n<blockquote>\n<p><strong>实际训练 FLOPs/s ≈ 6 × 有效参数量 × 每秒训练 token 数</strong>\n<strong>MFU = 实际训练 FLOPs/s ÷ 峰值 FLOPs/s</strong></p>\n</blockquote>\n<p>其中每秒 token 数直接从训练日志读：global_batch（以 token 计）÷ 每步耗时，或用框架打印的 tokens/s。峰值则取硬件口径值——注意必须注明是哪种精度、哪种测法，不同口径的「峰值」不可比。</p>\n<p>算例（Muse 整理）：7B 稠密模型，日志显示稳态 750 tokens/s；则实际算力 ≈ 6 × 7×10⁹ × 750 ≈ 3.15×10¹³ FLOPs/s ≈ 31.5 TFLOPS。以公司实测 GB10 矩阵乘约 90 TFLOPS 为分母，MFU ≈ 35%。经验参照（Muse 整理）：调优良好的大规模稠密训练 MFU 常在 40%–55% 区间；小规模、多机跨节点、MoE 路由不均衡等都会把它拉低。<strong>MFU 低不等于「算错了」——先看瓶颈在通信、数据还是空泡，再对症下药（对照 §3、§5.4）。</strong></p>\n<h3 id=\"62\">6.2 成本账：把训练折算成时间与钱</h3>\n<p>公司场景的成本账分两层（Muse 整理）：</p>\n<ol>\n<li><strong>时间成本</strong>：总步数 × 每步耗时 = 墙钟时间。用 §2 的公式先估，再用实测 s/it 校准；§4 的官方表就是现成的校准参照（例如 14B 全参 8K 上下文在 8×A800 上约 9 s/it 量级）。</li>\n<li><strong>机会成本</strong>：双机 Spark 是公司的共享资产——训练占用期间，现行 vLLM 服务要停（见 §9 前置）。一次实验的真实成本 = 占用时长 × 服务不可用窗口，所以实验设计要「一次把变量测全」，这也是 §9 要求同一脚本跑完所有对照配置的原因。</li>\n</ol>\n<p>折算示例：§2 中 10 亿 token 的继续训练，单机 MFU 35% 时约 15 天；若通过并行与调优（双机 + MFU 提升到 45% 且并行效率 85%）折算，墙钟 ≈ 15 ÷ 2 ÷ 0.85 ×（35/45）≈ 6.9 天。数字不重要，重要的是这套折算方法：<strong>任何「要不要训、训多久」的决策，都应该先在纸上完成这笔账</strong>（课后练习第 1 题就是练这个）。</p>\n<h3 id=\"63\">6.3 读官方实测表的正确姿势</h3>\n<p>§8 的最佳实践实测表是本讲最值得细读的数据，读法示范（细节见 §8）：同一模型、同一数据下，只动一个变量，看显存与耗时两个方向的变化幅度与方向是否符合 §3 的机理预期。能解释「为什么 TP4/EP2/PP2 反而慢 2.58 倍」「为什么关掉重计算省了时间却爆了显存」，才算把 §3–§6 打通。</p>\n<hr />\n<h2 id=\"7-ms-swift-megatron\">7. ms-swift Megatron 模式实战导读</h2>\n<blockquote>\n<p>要点：Megatron 模式在 ms-swift 里是与普通模式平行的子命令体系（<code>megatron sft / pt / rlhf</code>），数据集与模板处理与普通模式共用。它支持 CPT/SFT/GRPO/DPO/KTO/RM/GKD 等全部任务形态，且全参数、LoRA、MoE、多模态、FP8 均在支持矩阵内（来源：ms-swift《Megatron-SWIFT 快速开始》方法支持表）。本节命令全部摘自该存档原文，<strong>版本号与参数以开课时官方文档复核为准</strong>。</p>\n</blockquote>\n<h3 id=\"71\">7.1 环境准备：四个额外组件</h3>\n<p>除 ms-swift 本体外，Megatron 模式需要（来源：ms-swift《Megatron-SWIFT 快速开始》环境准备）：</p>\n<pre><code class=\"language-shell\"># transformer_engine（安装出错可参考官方 issue #3793）\npip install --no-build-isolation transformer-engine[pytorch] --no-cache-dir\npip install pybind11\n\n# apex（可选：不装 apex 时设置 --gradient_accumulation_fusion false 亦可运行）\ngit clone https://github.com/NVIDIA/apex\ncd apex\npip install -v --disable-pip-version-check --no-cache-dir --no-build-isolation \\\n    --config-settings &quot;--build-option=--cpp_ext&quot; \\\n    --config-settings &quot;--build-option=--cuda_ext&quot; ./\n\n# mcore-bridge\npip install mcore-bridge -U\n\n# flash_attn（版本勿高于 transformer_engine 的上限要求）\nMAX_JOBS=8 pip install &quot;flash-attn==2.8.3&quot; --no-build-isolation\n</code></pre>\n<p>两个必须记住的环境纪律：</p>\n<ol>\n<li><strong>多机训练必须设置 <code>MODELSCOPE_CACHE</code> 为共享存储路径</strong>，保证数据集缓存共享，否则可能因各节点数据预处理不一致导致训练卡住（官方原文重点标注，来源：同上）。</li>\n<li>官方推荐版本基线（节选）：python 3.12、cuda 12.8/13.0、torch 2.8.0/2.11.0、transformer-engine 2.16.0、megatron-core 0.18.0、mcore-bridge 1.6.0、flash-attn 2.8.3（来源：同上「推荐运行环境」表）。官方也提供整套容器镜像（含 swift 4.x 的 modelscope 镜像）作为环境捷径——<strong>在 GB10 上，优先考虑容器路线</strong>：公司已有实测表明 GB10 的算力表现对 torch 构建来源敏感（vLLM 官方镜像自带 torch 与 pip 直装 torch 在矩阵乘上曾有数量级差距，公司实测数据），环境问题先怀疑构建来源，再怀疑代码。</li>\n</ol>\n<h3 id=\"72-vs-mcore-bridge\">7.2 传统三步流 vs Mcore-Bridge（推荐）</h3>\n<p><strong>传统方式</strong>分三步（来源：ms-swift《Megatron-SWIFT 快速开始》快速入门案例，环境为 2×80 GiB A100、Qwen2.5-7B-Instruct 自我认知微调）：</p>\n<pre><code class=\"language-shell\"># 第一步：HF 权重 → Megatron 格式\nCUDA_VISIBLE_DEVICES=0 \\\nswift export \\\n    --model Qwen/Qwen2.5-7B-Instruct \\\n    --to_mcore true \\\n    --torch_dtype bfloat16 \\\n    --output_dir Qwen2.5-7B-Instruct-mcore \\\n    --test_convert_precision true\n\n# 第二步：训练（脚本见 7.3）\n# 第三步：Megatron 权重 → HF 格式，再用 swift infer 推理\nCUDA_VISIBLE_DEVICES=0 \\\nswift export \\\n    --mcore_model megatron_output/Qwen2.5-7B-Instruct/vx-xxx/checkpoint-xxx \\\n    --to_hf true \\\n    --torch_dtype bfloat16 \\\n    --output_dir megatron_output/Qwen2.5-7B-Instruct/vx-xxx/checkpoint-xxx-hf \\\n    --test_convert_precision true\n</code></pre>\n<p>注意：<code>--test_convert_precision true</code> 会做转换精度校验，但对 MoE 大模型耗时长、内存大，官方提示可酌情去掉；另外转换环节的并行数不必纠结——Megatron-SWIFT 在 mcore 端用 torch_dist 存储格式，<strong>训练时可以再调整并行数，不需要在权重转换时指定</strong>（来源：同上训练技巧）。</p>\n<p><strong>Mcore-Bridge 方式（官方推荐）</strong>免去显式转换：训练命令直接以 <code>--model</code> 指向 HF 模型、加 <code>--save_safetensors true</code>，其余参数与传统方式相同（来源：同上）。本讲实操统一走 Bridge 路线。</p>\n<p>补充：预训练把子命令换成 <code>megatron pt</code>（使用生成式 template）；Megatron 模式与普通模式共用同一套 dataset/template 处理，packing、loss_scale、agent 训练等能力都在（来源：同上）。</p>\n<h3 id=\"73\">7.3 训练脚本逐段走读</h3>\n<p>以下为官方快速入门脚本（Mcore-Bridge 版，2 卡、TP=2），按参数组拆解（脚本来源：ms-swift《Megatron-SWIFT 快速开始》；分组讲解为 Muse 整理）：</p>\n<pre><code class=\"language-shell\">PYTORCH_CUDA_ALLOC_CONF='expandable_segments:True' \\\nNPROC_PER_NODE=2 \\\nCUDA_VISIBLE_DEVICES=0,1 \\\nmegatron sft \\\n    --model Qwen/Qwen2.5-7B-Instruct \\\n    --save_safetensors true \\\n    --dataset 'AI-ModelScope/alpaca-gpt4-data-zh#500' \\\n              'AI-ModelScope/alpaca-gpt4-data-en#500' \\\n              'swift/self-cognition#500' \\\n    --tensor_model_parallel_size 2 \\\n    --sequence_parallel true \\\n    --micro_batch_size 16 \\\n    --global_batch_size 16 \\\n    --recompute_granularity full \\\n    --recompute_method uniform \\\n    --recompute_num_layers 1 \\\n    --finetune true \\\n    --cross_entropy_loss_fusion true \\\n    --lr 1e-5 \\\n    --lr_warmup_fraction 0.05 \\\n    --min_lr 1e-6 \\\n    --num_train_epochs 1 \\\n    --output_dir megatron_output/Qwen2.5-7B-Instruct \\\n    --save_steps 100 \\\n    --max_length 2048 \\\n    --system 'You are a helpful assistant.' \\\n    --dataloader_num_workers 4 \\\n    --no_save_optim true \\\n    --no_save_rng true \\\n    --dataset_num_proc 4 \\\n    --model_author swift \\\n    --model_name swift-robot\n</code></pre>\n<table>\n<thead>\n<tr>\n<th>参数组</th>\n<th>关键参数</th>\n<th>怎么读</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>启动环境</td>\n<td><code>NPROC_PER_NODE=2</code>、<code>CUDA_VISIBLE_DEVICES=0,1</code>、<code>PYTORCH_CUDA_ALLOC_CONF='expandable_segments:True'</code></td>\n<td>每节点进程数 = 参与的设备数；expandable_segments 是缓解显存碎片的常用设置</td>\n</tr>\n<tr>\n<td>模型与产出</td>\n<td><code>--model</code>、<code>--save_safetensors true</code>、<code>--finetune true</code></td>\n<td>Bridge 路线直接吃 HF 模型并存 safetensors；传统路线此处是 <code>--mcore_model</code></td>\n</tr>\n<tr>\n<td>并行组</td>\n<td><code>--tensor_model_parallel_size 2</code>、<code>--sequence_parallel true</code></td>\n<td>本例 TP=2、SP 随 TP 开；未显式给的 PP/DP 由框架按总进程数推导（具体推导与更多参数以官方 Megatron 命令行参数文档为准）</td>\n</tr>\n<tr>\n<td>批次组</td>\n<td><code>--micro_batch_size 16</code>、<code>--global_batch_size 16</code></td>\n<td>全局批次 = micro_batch × 数据并行度 × 梯度累积步数；本例两者相等即无额外累积。改并行度时必须连带核对这一组</td>\n</tr>\n<tr>\n<td>重计算组</td>\n<td><code>--recompute_granularity full</code>、<code>--recompute_method uniform</code>、<code>--recompute_num_layers 1</code></td>\n<td>用算力换激活显存的开关组，是 §2 显存账的调节阀；§8 实测显示它对速度/显存的影响幅度可达数十个百分点</td>\n</tr>\n<tr>\n<td>优化组</td>\n<td><code>--lr 1e-5</code>、<code>--lr_warmup_fraction 0.05</code>、<code>--min_lr 1e-6</code>、<code>--cross_entropy_loss_fusion true</code></td>\n<td>§5.2 三件套的落点：全参 SFT 的 lr 量级（对比 §8 LoRA 用 1e-4）；损失融合是纯收益项</td>\n</tr>\n<tr>\n<td>数据组</td>\n<td><code>--dataset ...#500</code>、<code>--max_length 2048</code>、<code>--dataset_num_proc 4</code>、<code>--dataloader_num_workers 4</code></td>\n<td><code>#500</code> 表示每数据集取 500 条；多机时别忘了 §7.1 的 <code>MODELSCOPE_CACHE</code> 纪律</td>\n</tr>\n<tr>\n<td>保存组</td>\n<td><code>--save_steps 100</code>、<code>--no_save_optim true</code>、<code>--no_save_rng true</code></td>\n<td>教学/微调场景关掉优化器与随机状态保存，显著减小 checkpoint 体积；要断点续训则不能这么关</td>\n</tr>\n</tbody>\n</table>\n<p>官方训练技巧中与本脚本直接相关、值得背下来的四条（来源：ms-swift《Megatron-SWIFT 快速开始》训练技巧）：① 提吞吐的手段排序——packing、增加 DP、减少重计算、加大计算通信 overlap，MoE 还可以丢弃 token 加速；② DP 最快但最占显存，其他并行都是为降显存而引入；③ TP/EP 尽量不跨节点，跨节点优先 PP/DP；④ 日志只在 last rank 打印，排查「没输出」先想到这一条。</p>\n<hr />\n<h2 id=\"8-qwen38-flash-next\">8. 贯穿案例：Qwen3.8-Flash-Next 官方最佳实践拆解</h2>\n<blockquote>\n<p>要点：这是本讲的「公司实境锚点」——ms-swift 官方为<strong>公司现行服务同款模型</strong>写的 Megatron 训练最佳实践（来源：ms-swift《Qwen3.8-Flash-Next 最佳实践》，本节全部数据出自该文档）。它把 §3–§6 的概念全部落到了一个 125B MoE 的真实配置上。</p>\n</blockquote>\n<h3 id=\"81\">8.1 先对上号：模型与公司的对应关系</h3>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>官方最佳实践</th>\n<th>公司现行环境</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>模型</td>\n<td>Qwen3.8-Flash-Next，125B 总参数（含 51B N-gram 嵌入表），每 token 激活约 6B</td>\n<td>同款模型，线上为 NVFP4 量化 + vLLM 推理</td>\n</tr>\n<tr>\n<td>架构要点</td>\n<td>GDN + QSA 混合（每 4 层中 3 层 Gated DeltaNet 压缩历史、1 层 Qwen Sparse Attention 做长程检索，QSA 预算 2048 token）；Gated Residual（每层 4 路残差分支）；原生上下文 262,144 token</td>\n<td>推理侧已领教其 MoE 稀疏性（每步只激活约 6B，是 decode 带宽账的关键输入，第一阶段已算过）</td>\n</tr>\n<tr>\n<td>训练侧新信息</td>\n<td>N-gram 嵌入表可 offload 到主机内存；训练走 Megatron SFT + GRPO 两套官方脚本</td>\n<td>为第二阶段 A2 讲（GRPO/蒸馏深化）与本讲实操提供官方锚点</td>\n</tr>\n</tbody>\n</table>\n<p>一个对 GB10 特别有共鸣的点：这张 51B 的 N-gram 嵌入表在 BF16 下约 95 GiB，<strong>并且只能沿 TP 切分</strong>——单机装不下又切不开时，官方给的解法是整表卸载到 CPU 主内存（统一内存架构的 Spark 对这类「权重放主机内存」的玩法天然不陌生，推理侧已有类似经验）。</p>\n<h3 id=\"82-sft\">8.2 SFT 脚本拆解：每个参数都在解一道题</h3>\n<p>官方 8 卡 LoRA 微调脚本（节选核心参数，完整脚本见存档原文）：</p>\n<pre><code class=\"language-shell\"># 8*70G\nPLE_CPU_OFFLOAD=1 \\\nCUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 \\\nNPROC_PER_NODE=8 \\\nPYTORCH_CUDA_ALLOC_CONF='expandable_segments:True' \\\nmegatron sft \\\n    --model Qwen/Qwen3.8-Flash-Next \\\n    --dataset 'swift/Chinese-Qwen3-235B-2507-Distill-data-110k-SFT#2000' \\\n    --tuner_type lora --lora_rank 8 --lora_alpha 32 \\\n    --target_modules in_proj out_proj linear_proj linear_qkv \\\n    --tensor_model_parallel_size 2 \\\n    --expert_model_parallel_size 4 \\\n    --expert_tensor_parallel_size 1 \\\n    --pipeline_model_parallel_size 2 \\\n    --decoder_first_pipeline_num_layers 12 \\\n    --sequence_parallel true \\\n    --moe_permute_fusion true \\\n    --recompute_granularity full --recompute_method uniform --recompute_num_layers 1 \\\n    --padding_free true \\\n    --max_length 8192 \\\n    --micro_batch_size 1 --global_batch_size 8 \\\n    --lr 1e-4 \\\n    --save_steps 500 \\\n    --output_dir output\n</code></pre>\n<p>逐项对应回前面的章节（Muse 整理，参数与数值均出自上述官方脚本）：</p>\n<ul>\n<li><strong>并行组合 TP2 / EP4 / ETP1 / PP2</strong>：§3.2 的组合直觉在一个脚本里全齐了——注意力侧 TP=2，专家侧 EP=4 而 ETP=1（正是「专家层用 EP 不用 ETP」的官方规则落地），层间 PP=2 分摊权重；</li>\n<li><strong><code>--decoder_first_pipeline_num_layers 12</code></strong>：全模型层数在两个 PP stage 间不均分（stage 0 只放 12 层）。官方解释：PLE 层（第 2 层）落在 stage 0，它的激活与查表开销都压在该 stage，按 24/24 均分会两边不均——这是 §3 里 PP「切分不均则瓶颈在最重 stage」的真实注脚，<strong>调 PP 先看每 stage 的实际负载，不看层数平均</strong>；</li>\n<li><strong><code>PLE_CPU_OFFLOAD=1</code></strong>：把 95 GiB 的 N-gram 表卸到 CPU。代价官方写明：开启后该表<strong>冻结不训练</strong>——LoRA 本来就不训它，无影响；但全参训练下这部分权重会「静默地不参与训练」，属于必须知道的行为变更（列入 §10 坑清单）；</li>\n<li><strong>LoRA 目标模块 <code>in_proj out_proj linear_proj linear_qkv</code></strong>：对应 GDN/QSA 混合架构的线性层命名，与稠密 Qwen 的 <code>all-linear</code> 写法不同——换模型时 target_modules 必须按架构核对，不能抄旧脚本；</li>\n<li><strong><code>--padding_free true</code> + <code>--moe_permute_fusion true</code></strong>：前者是 packing 思想在 Megatron 侧的落地（去掉 pad 浪费，呼应 §5.4），后者是 MoE 置换融合的算子级优化。</li>\n</ul>\n<h3 id=\"83\">8.3 实测表精读：本讲最重要的一张表</h3>\n<p>官方实测条件：8 卡、LoRA rank 8、TP2/EP4/PP2、micro_batch 1、global_batch 8、等长合成数据；显存为每卡峰值，耗时以 seq=2048 基线为 1.00×（相对值，越大越慢）。下表节选关键行（来源：ms-swift《Qwen3.8-Flash-Next 最佳实践》实测数据表）：</p>\n<table>\n<thead>\n<tr>\n<th>变量</th>\n<th>配置</th>\n<th>每卡显存</th>\n<th>单步耗时（相对）</th>\n<th>读出的机理</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>基线</td>\n<td>seq=2048，重计算 full</td>\n<td>75.6 GiB</td>\n<td>1.00×</td>\n<td>—</td>\n</tr>\n<tr>\n<td>序列变长</td>\n<td>seq=8192</td>\n<td>93.3 GiB（+23.4%）</td>\n<td>1.32×</td>\n<td>激活随序列长度膨胀（§2 显存账的激活项）</td>\n</tr>\n<tr>\n<td>PLE 卸载</td>\n<td>seq=8192 + offload</td>\n<td>77.7 GiB（仅 +2.8%）</td>\n<td>1.27×</td>\n<td>95 GiB 级大表卸载后，长序列显存几乎回到基线</td>\n</tr>\n<tr>\n<td>重计算改 selective</td>\n<td>seq=4096</td>\n<td>92.1 GiB（+21.8%）</td>\n<td><strong>0.75×</strong></td>\n<td>少算一遍激活换速度，显存是代价</td>\n</tr>\n<tr>\n<td>关重计算</td>\n<td>seq=4096</td>\n<td>92.1 GiB（+21.8%）</td>\n<td><strong>0.74×</strong></td>\n<td>与上行同理：重计算本质是「显存换时间」</td>\n</tr>\n<tr>\n<td>并行改 TP4/EP2/PP2</td>\n<td>seq=8192</td>\n<td>105.7 GiB（+39.8%）</td>\n<td><strong>2.58×</strong></td>\n<td>并行改错方向，通信反噬（§3.3）</td>\n</tr>\n<tr>\n<td>并行改 TP2/EP4/PP1</td>\n<td>seq=8192</td>\n<td>142.5 GiB（+88.5%）</td>\n<td><strong>0.80×</strong></td>\n<td>去掉 PP 更快，但显存爆炸——先有余量才配谈速度</td>\n</tr>\n</tbody>\n</table>\n<p>精读结论（Muse 整理）：① 所有旋钮都是交换，没有免费的午餐；② 显存不够时先动重计算与卸载，速度不够时先看并行组合与 padding/packing，而不是无脑加卡；③ 这张表是在 8 卡数据中心环境测的，<strong>绝对值与 Spark 无关、机理与 Spark 有关</strong>——实操（§9）就是要在双机上复现出属于我们自己的小号版本表。</p>\n<h3 id=\"84-grpo-a2\">8.4 GRPO 脚本（A2 预告，只点关键差异）</h3>\n<p>同一文档的 GRPO 脚本与 SFT 共用同一套并行与卸载配置，差异点：<code>megatron rlhf --rlhf_type grpo</code>；rollout 用 colocate 模式的 vLLM（<code>--use_vllm true --vllm_mode colocate</code>，推理与训练同机分时复用），并配 <code>--sleep_level 2</code>、<code>--offload_model true</code>、<code>--offload_optimizer true</code> 在采样与训练阶段间腾挪显存；奖励函数 <code>--reward_funcs accuracy</code>、每题采样 <code>--num_generations 4</code>、学习率 5e-5（来源：ms-swift《Qwen3.8-Flash-Next 最佳实践》GRPO 一节）。这正是 A2 讲的主战场，本讲只需建立印象：<strong>推理引擎在 RL 训练里是 rollout 工厂，训练与推理的边界在 GRPO 里是糊的</strong>——这也是进阶专题把训练与推理放在同一模块序列里的原因。</p>\n<hr />\n<h2 id=\"9\">9. 实操：双机并行对照实验</h2>\n<blockquote>\n<p>总原则（Muse 整理）：<strong>先冒烟、后对照；一次占用、测完全部变量</strong>。ms-swift 在 GB10/ARM 上官方未明示支持（其硬件清单为 NVIDIA CUDA 系 / AMD / 国产 NPU 等，未列 GB10），所以本实操的第一步不是训练，而是回答「这条链路在 Spark 上通不通」；不通就走降级路径，不在环境问题上无限耗时间。</p>\n</blockquote>\n<h3 id=\"90\">9.0 前置（运维纪律）</h3>\n<ol>\n<li>约维护窗口：训练实验需停现行 vLLM 服务（容器 <code>vllm-fn</code>，占约 96 GB 内存），实验结束按原流程恢复并做健康检查（承接第一阶段运维课的变更纪律）。</li>\n<li>两台 Spark 系统与驱动版本对齐，时钟同步；预留磁盘给 checkpoint。</li>\n<li>全程留痕：所有命令、版本、日志、记录表存入实验目录，验收以记录表为准。</li>\n</ol>\n<h3 id=\"91-3040\">9.1 第一步：环境冒烟验证清单（预计 30–40 分钟，硬性时间盒）</h3>\n<p>逐项执行，任一项失败先记录原始报错，再按 9.4 决策是否降级——<strong>不在单点死磕超过 15 分钟</strong>。</p>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>检查项</th>\n<th>做法</th>\n<th>通过标准</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>架构与设备基线</td>\n<td>记录系统架构、驱动、可用内存；跑一遍第一阶段的带宽/矩阵乘微基准</td>\n<td>数值与公司基线（带宽 224–226 GB/s 量级）无数量级偏差</td>\n</tr>\n<tr>\n<td>2</td>\n<td>隔离环境</td>\n<td>新建独立 venv/容器（优先官方容器镜像路线，见 §7.1），不污染现行服务环境</td>\n<td>环境可复现（留 requirements/镜像名）</td>\n</tr>\n<tr>\n<td>3</td>\n<td>ms-swift 安装与导入</td>\n<td><code>pip install ms-swift -U</code>（版本以开课时为准）；导入 swift、torch 并打印版本与设备可用性</td>\n<td>无导入错误，torch 能识别 GB10 设备</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Megatron 组件安装</td>\n<td>按 §7.1 依次装 transformer-engine、mcore-bridge、flash-attn（apex 可选）；记录每步结果</td>\n<td>三件套导入成功；某件失败则记录——FP8/TE 相关失败直接标记「FP8 线索关闭」，不阻塞主线</td>\n</tr>\n<tr>\n<td>5</td>\n<td>普通模式 10 步训练</td>\n<td>用 ms-swift《快速开始》的 LoRA 脚本骨架改小数据量跑 10 步：模型 Qwen3-4B 级别、数据集 <code>swift/self-cognition#160</code>、<code>per_device_train_batch_size 1</code>、<code>gradient_accumulation_steps 16</code>（全局批次 16 × 10 步 = 160 条）（脚本骨架来源：ms-swift《快速开始》）</td>\n<td>完成 ≥10 个优化步；loss 为有限值且无 NaN；checkpoint 正常保存；记录峰值内存</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Megatron 模式最小跑通</td>\n<td>以 §7.3 官方脚本为骨架，改单机单进程：<code>NPROC_PER_NODE=1</code>、<code>--tensor_model_parallel_size 1</code>、小模型（Qwen2.5-0.5B 级别，以开课时模型库为准）、数据集取 <code>#500</code> 子集、1 个 epoch</td>\n<td>训练启动并完成；日志在 last rank 正常打印（本例即本进程）；产出 checkpoint 可被 <code>swift infer</code> 加载</td>\n</tr>\n<tr>\n<td>7</td>\n<td>双机连通预检</td>\n<td>两机互通、共享目录可见；在一台上准备好 <code>MODELSCOPE_CACHE</code> 共享路径（§7.1）</td>\n<td>共享路径双机可读写</td>\n</tr>\n</tbody>\n</table>\n<p>冒烟结论只有三种：<strong>全通</strong>（进 9.2）、<strong>主线通、FP8/TE 不通</strong>（进 9.2，实验中关闭 FP8 相关项）、<strong>主线不通</strong>（进 9.4 降级）。</p>\n<h3 id=\"92-3040\">9.2 第二步：基线与变量对照（预计 30–40 分钟）</h3>\n<p>固定项（全程不许动）：模型 Qwen2.5-7B-Instruct、LoRA（参数口径参照 §7.3 与官方快速入门）、数据集 <code>alpaca-gpt4-data-zh#500 + alpaca-gpt4-data-en#500 + self-cognition#500</code>、<code>max_length 2048</code>、1 个 epoch、同一随机种子、同一日志采样口径。多机启动方式以官方多机示例为准（ms-swift 在 <code>examples/megatron</code> 提供多机等案例，来源：ms-swift《Megatron-SWIFT 快速开始》；普通模式多机脚本见 ms-swift《预训练与微调》所引 <code>examples/train/multi-node</code>）。</p>\n<table>\n<thead>\n<tr>\n<th>配置</th>\n<th>内容</th>\n<th>变量</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>E0 单机基线</td>\n<td>单台 Spark、Megatron 模式、TP=1、无跨机通信</td>\n<td>基线</td>\n</tr>\n<tr>\n<td>E1 双机 DP</td>\n<td>双机各持完整模型副本做数据并行（Megatron 侧以 DP 维度扩展、并行参数只开 DP）</td>\n<td>跨机通信模式 = 每步梯度 AllReduce</td>\n</tr>\n<tr>\n<td>E2 双机 TP</td>\n<td>双机 TP=2（<code>--tensor_model_parallel_size 2 --sequence_parallel true</code>，与 §7.3 官方脚本同构，只是把同机双卡换成双机各一卡）</td>\n<td>跨机通信模式 = 每层 AllReduce</td>\n</tr>\n<tr>\n<td>E3（选做）双机 PP</td>\n<td>双机 PP=2，按层各半</td>\n<td>跨机通信模式 = 边界激活传递</td>\n</tr>\n</tbody>\n</table>\n<p>预期（先写假设、再看数据）：E2 的每层通信走跨机链路，大概率被通信拖住；E1 通信集中在步末，效率应更高；E3 通信最少但要注意两 stage 负载均衡。<strong>假设写在实验开始前，结论以实测为准</strong>——如果数据打脸假设，分析为什么（这本身就是最好的学习材料）。</p>\n<h3 id=\"93\">9.3 第三步：记录表与成本账</h3>\n<p>每组配置跑完立即填表（模板如下），并按 §6 公式补算 MFU（峰值口径注明所用数值来源）：</p>\n<table>\n<thead>\n<tr>\n<th>配置</th>\n<th>并行参数</th>\n<th>稳态 s/it</th>\n<th>tokens/s</th>\n<th>每步 token 数</th>\n<th>峰值内存/台</th>\n<th>MFU 估算</th>\n<th>异常与备注</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>E0</td>\n<td>TP1</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>E1</td>\n<td>DP2</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>E2</td>\n<td>TP2+SP</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr>\n<td>E3</td>\n<td>PP2</td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>收尾产出（一页纸）：① 哪种配置最快、快多少；② 显存分别花在哪（对照 §2 的账解释）；③ 若明天要真训一个 7B LoRA，你选哪组配置、为什么；④ 本次实验的 MFU 水平与官方 A800 数据（§4）差在哪、可能差在哪一环。</p>\n<h3 id=\"94-colab-a100\">9.4 降级路径：Colab A100 执行版</h3>\n<p>触发条件：冒烟 9.1 第 5/6 项主线不通，或双机多机启动无法在时间盒内跑通。</p>\n<ul>\n<li><strong>Colab（AI Pro）执行</strong>：在 A100 上跑 E0 与 E2'（单机双卡不可得时，用单卡 TP1 基线 + 「重计算开/关、packing 开/关」两个变量组替代跨机对照——变量换了，但「单变量对照 + 填表 + 算 MFU」的方法不变）；官方快速入门案例本身就是 2×A100-80GiB 口径，在 Colab 上可近乎原样复现（来源：ms-swift《Megatron-SWIFT 快速开始》）。</li>\n<li><strong>Spark 只做观察与数据对照</strong>：复测 §2 两笔账的输入（带宽、矩阵乘、统一内存占用曲线），把自测峰值代入 MFU 公式，与 Colab 实测、官方 A800 表三方对照，写差异分析。</li>\n<li>降级不降标准：记录表、成本账、一页纸结论照常交付，并在报告头注明执行环境与降级原因（这份记录本身就是下一轮 GB10 兼容性排查的输入）。</li>\n</ul>\n<h3 id=\"95\">9.5 验收标准</h3>\n<ul>\n<li>[ ] 冒烟清单 7 项逐项有结论（通过/失败+原始报错），无「没测」项；</li>\n<li>[ ] ≥3 组配置完成对照（降级路径 ≥2 组 + 三方数据对照），记录表无空格；</li>\n<li>[ ] 每组配置有 MFU 估算且注明峰值口径；</li>\n<li>[ ] 一页纸结论能回答「双机 Spark 上 7B 级 LoRA SFT 选哪种并行、为什么」，且引用了自己的实测数字；</li>\n<li>[ ] 实验结束现行 vLLM 服务已恢复并通过健康检查。</li>\n</ul>\n<hr />\n<h2 id=\"10\">10. 常见坑清单</h2>\n<blockquote>\n<p>来源标注：官方文档明示的坑标「文档明示」，公司环境特有的标「公司实境」。</p>\n</blockquote>\n<ol>\n<li><strong>多机训练卡在启动</strong>（文档明示）：没设 <code>MODELSCOPE_CACHE</code> 共享路径，各节点数据预处理结果不一致。开训前先检查这个环境变量（ms-swift《Megatron-SWIFT 快速开始》）。</li>\n<li><strong>flash-attn 装了最新版反而报错</strong>（文档明示）：flash-attn 版本不能高于 transformer-engine 的上限要求，按官方指定版本装（同上）。</li>\n<li><strong>没装 apex 训练起不来</strong>（文档明示）：apex 是可选的，缺它时加 <code>--gradient_accumulation_fusion false</code> 即可（同上）。</li>\n<li><strong>以为训练没启动</strong>（文档明示）：Megatron-SWIFT 日志只在 last rank 打印，其他 rank 沉默是正常现象（同上）。</li>\n<li><strong>大模型权重转换慢到怀疑人生</strong>（文档明示）：<code>--test_convert_precision true</code> 在 MoE 大模型上耗时且吃内存，可酌情去掉；优先走 Mcore-Bridge 免转换路线（同上）。</li>\n<li><strong>开了 PLE offload 后全参训了个寂寞</strong>（文档明示）：offload 的 N-gram 表被冻结，全参训练下静默不更新——用之前先想清这部分参数到底要不要训（ms-swift《Qwen3.8-Flash-Next 最佳实践》）。</li>\n<li><strong>PP 均分层数、stage 0 累死</strong>（文档明示）：含重型早期层的模型（如 PLE 层在第 2 层）要手动调 <code>--decoder_first_pipeline_num_layers</code> 拉平负载（同上）。</li>\n<li><strong>QLoRA 训完没法合并部署</strong>（文档明示）：QLoRA 模型无法 Merge LoRA，官方建议部署导向的微调别用 QLoRA，用 LoRA/全参训完再量化（ms-swift《预训练与微调》）。这条在第一阶段 SFT 课已强调，进阶阶段继续算数。</li>\n<li><strong>DDP + 梯度检查点报 ready only once</strong>（文档明示）：加 <code>--gradient_checkpointing_kwargs '{\"use_reentrant\": false}'</code> 或改用 DeepSpeed（同上）。</li>\n<li><strong>GB10 上装出来的 torch 慢一个数量级</strong>（公司实境）：pip 直装 torch 与优化构建的差异在 GB10 上被放大（公司矩阵乘实测对比）。环境冒烟第 1、3 项就是为它设的——数值不对，先换构建来源，别改训练参数背锅。</li>\n<li><strong>把官方 A800 的 s/it 当成 Spark 的预期</strong>（Muse 整理）：官方 Benchmark 与最佳实践实测都是数据中心集群数据，在本讲只作机理与量级参照；Spark 的数字只能来自 §9 自己的实验。</li>\n<li><strong>并行度越加越慢还继续加</strong>（文档明示的反例）：§8 实测 TP4/EP2/PP2 比基线慢 2.58 倍。调并行的正确顺序是：先算显存账定下限，再小步单变量试，每步留记录。</li>\n</ol>\n<hr />\n<h2 id=\"11\">11. 课后练习与延伸阅读</h2>\n<h3 id=\"111\">11.1 课后练习</h3>\n<ol>\n<li><strong>纸面账</strong>：为 Qwen3-32B 级别模型做全参 AdamW 训练估算——静态显存多少？公司双机在 ZeRO-3、LoRA 两种路线下分别缺什么？给出你的判断与依据（口径见 §2、§4）。</li>\n<li><strong>MFU 练习</strong>：给定一段（虚构）训练日志：14B 模型、global batch 折合 65,536 token/步、稳态 9.0 s/it、运行于 8 卡且单卡峰值按 312 TFLOPS（BF16）计——算总 MFU，并说明这个数字为什么不能直接和 §6 的 GB10 算例比（口径见 §6.1）。</li>\n<li><strong>读表练习</strong>：回到 §8.3 的实测表，若显存预算卡在每卡 80 GiB、目标 seq=8192，你选哪一行配置？写出取舍理由（提示：先筛显存可行域，再比速度）。</li>\n<li><strong>选型练习</strong>：一个 30B MoE 模型要在 16 卡单机房集群上全参训练，用 §3.2 与官方选型规则给出一组 TP/EP/PP/DP 组合并逐项说明放置位置（哪些不跨节点）。</li>\n<li><strong>数据侧练习</strong>：读 XTuner《训练数据流》后，用自己的话解释「为什么最慢的 rank 决定步时」以及 LengthGroupedSampler 的解法，并指出 ms-swift 侧的对应手段。</li>\n</ol>\n<h3 id=\"112\">11.2 延伸阅读（逐条标来源）</h3>\n<ul>\n<li>Datawhale《So Large LM》第 8 章《分布式训练》（存档 <code>datawhale/07-SoLargeLM-分布式训练.md</code>）：本讲 §3 的理论底本，章末延伸阅读指向 OneFlow《常见的分布式并行策略》。</li>\n<li>Datawhale《So Large LM》第 6 章《模型训练》（存档 <code>datawhale/06-SoLargeLM-模型训练.md</code>）：Adam、混合精度、学习率与 GPT-3 训练配方的完整推导；章末附 Lilian Weng 混合精度长文等链接。</li>\n<li>ms-swift《Megatron-SWIFT 快速开始》（存档 <code>modelscope/04-Megatron并行训练快速开始.md</code>）：本讲 §7 的原文；其引用的 Megatron 命令行参数文档与 Mcore-Bridge 文档已于 P1 补抓存档（<code>modelscope/10-Mcore-Bridge.md</code>、<code>modelscope/11-Megatron命令行参数.md</code>、<code>modelscope/09-Megatron-LoRA训练.md</code>），细读以存档为准、版本以官方文档站当前版本为准。</li>\n<li>ms-swift 官方 examples/megatron 目录（GitHub，ms-swift 仓库）：packing、多机、32K 上下文、DPO、MoE、预训练等完整脚本，§9 多机启动以此为准。</li>\n<li>ms-swift《Qwen3.8-Flash-Next 最佳实践》（存档 <code>modelscope/03-Qwen3.8-Flash-Next最佳实践.md</code>）：§8 原文，含 GRPO 完整脚本（A2 讲主素材）。</li>\n<li>上海人工智能实验室 XTuner《训练数据流》（存档 <code>internlm/05-XTuner-训练数据流.md</code>）与《FP8 训练》（存档 <code>internlm/06-XTuner-Float8训练.md</code>）：FSDP 路线的数据工程与 FP8 实践对照读物。</li>\n<li>NVIDIA NCCL 集合通信官方文档（user guide，collectives 一节）：AllReduce 等原语的权威定义，So Large LM 第 8 章亦引用此文档；属一手官方来源，以官网当前版本为准。</li>\n</ul>\n<hr />\n<blockquote>\n<p><strong>讲义版本</strong>：v1（2026-10-20）。已知待复核项：ms-swift 版本基线与参数（开课时按官方文档站复核）；GB10 上 ms-swift / Transformer Engine / flash-attn 的实际可用性（由 §9.1 冒烟清单回答，结论回填本讲义后发布 v1.1）。</p>\n</blockquote>"}, {"num": "A2", "ch": "进阶 A · 训练工程", "label": "A2 偏好优化、GRPO 与蒸馏深化", "title": "第二阶段 · 模块 A 第 2 讲（A2）：偏好优化、GRPO 与蒸馏深化", "html": "<h1 id=\"a-2-a2grpo\">第二阶段 · 模块 A 第 2 讲（A2）：偏好优化、GRPO 与蒸馏深化</h1>\n<blockquote>\n<p><strong>讲次</strong>：第二阶段进阶专题 · 模块 A 训练工程 · 第 2 讲\n<strong>建议时长</strong>：2.5–3 小时（讲解约 2 小时 + 实操约 1 小时，实操也可拆为课后实验）\n<strong>前置知识</strong>：第一阶段技术轨全部内容，重点是第 4 周 SFT 微调、第 5 周后训练与蒸馏、第 6 周蒸馏结课项目；本讲 A1（并行训练与 ms-swift Megatron 模式）的框架操作基础\n<strong>读者</strong>：技术轨进阶学员。本讲是<strong>深化衔接</strong>：SFT、数据蒸馏、冻结测试集这些概念不再重复讲授，只做位置对齐，直接进入偏好优化与 on-policy 蒸馏的深水区\n<strong>素材来源说明</strong>：本讲义引用素材均来自公司内部存档 <code>materials-advanced/</code>——ms-swift 官方文档《人类对齐 RLHF》《知识蒸馏》《预训练与微调》（ModelScope 社区，Apache-2.0）、机器之心编译/专栏长文两篇（Cameron R. Wolfe、Sebastian Raschka 著，版权归原作者与机器之心）、Datawhale《Happy-LLM》第六章（CC BY-NC-SA 4.0）。引用处逐条标注来源；框架对照、实操设计等教学组织内容标注「Muse 整理」。命令与参数全部取自存档文档，开课时须按 ms-swift 当前版本复核。\n<strong>使用声明</strong>：公司内部培训使用，不对外分发。</p>\n</blockquote>\n<hr />\n<h2 id=\"_1\">一、学习目标与本讲地图</h2>\n<p><strong>结论先行</strong>：第一阶段我们让学生模型「抄老师的答案」（数据蒸馏 + SFT），本讲解决抄完之后的两件事——<strong>让模型学会判断什么是更好的答案（偏好优化），以及让模型在自己犯错的地方被老师逐 token 纠正（on-policy 蒸馏）</strong>。学完本讲，你应该能独立判断一个后训练任务该用 DPO、GRPO 还是 GKD，并能在 ms-swift 里把一轮对照实验完整跑通、用冻结测试集验收。</p>\n<p>学完本讲，学员应能做到：</p>\n<ol>\n<li>说清 RLHF 流水线、DPO 家族、GRPO 家族各自解决什么问题、吃什么数据、烧多少算力、边界在哪，并能按任务特征选型；</li>\n<li>复述 o1 → DeepSeek-R1 的技术脉络，理解 RLVR（可验证奖励强化学习）为什么是推理模型训练的分水岭；</li>\n<li>在 ms-swift 中走通 DPO 与 GRPO 两条偏好优化路径的关键配置，知道每个关键参数调大调小会发生什么；</li>\n<li>区分第一阶段的序列级数据蒸馏与 GKD / OPD-RL 这类分布级蒸馏，并能设计「先数据蒸馏打底、再 on-policy 深化」的组合打法；</li>\n<li>识别 reward hacking、KL 失控、偏好数据噪声三类典型事故的早期信号，并用评测闭环证伪「假涨点」。</li>\n</ol>\n<p><strong>本讲地图</strong>（Muse 整理）：</p>\n<table>\n<thead>\n<tr>\n<th>节</th>\n<th>内容</th>\n<th>建议时长</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>二</td>\n<td>与第一阶段的衔接：一张位置图对齐</td>\n<td>10 分钟</td>\n</tr>\n<tr>\n<td>三</td>\n<td>偏好优化全景：RLHF / DPO 家族 / GRPO 家族对照</td>\n<td>35 分钟</td>\n</tr>\n<tr>\n<td>四</td>\n<td>前沿导读：o1 → R1 与 RL 推理训练现状</td>\n<td>20 分钟</td>\n</tr>\n<tr>\n<td>五</td>\n<td>ms-swift 偏好优化路径走读</td>\n<td>25 分钟</td>\n</tr>\n<tr>\n<td>六</td>\n<td>蒸馏深化：从数据蒸馏到 GKD</td>\n<td>30 分钟</td>\n</tr>\n<tr>\n<td>七</td>\n<td>评测闭环：冻结测试集纪律 + 假涨点识别</td>\n<td>15 分钟</td>\n</tr>\n<tr>\n<td>八</td>\n<td>实操：给蒸馏学生模型做一轮 DPO / GRPO 对照实验</td>\n<td>45–60 分钟</td>\n</tr>\n<tr>\n<td>九</td>\n<td>常见坑清单</td>\n<td>10 分钟</td>\n</tr>\n<tr>\n<td>十</td>\n<td>课后练习与延伸阅读</td>\n<td>布置</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"sft\">二、与第一阶段的衔接：从 SFT / 数据蒸馏到偏好优化</h2>\n<p>先把老知识钉在位置图上（Muse 整理，框架来源见第六节注）：</p>\n<pre><code>预训练 ──► SFT ──► 偏好优化 ──► 部署\n  │          │         │\n  │          │         ├─ 离线偏好：DPO / KTO / ORPO / SimPO / CPO（吃偏好对，不在线采样）\n  │          │         └─ 在线 RL：PPO / GRPO（模型边采样边学，奖励来自 RM 或规则验证）\n  │          │\n  │          └─ 第一阶段蒸馏项目所在层：教师生成数据 → 学生 SFT\n  │             本质 = 离线蒸馏（off-policy + per-token 稠密信号，见第六节）\n  │\n  └─ 注入知识与语言能力（第一阶段第 5 周）\n</code></pre>\n<p>三个对齐点，讲完就不再回头：</p>\n<ol>\n<li><strong>SFT 教「怎么答」，偏好优化教「答得哪个好」。</strong> SFT 的监督信号是「标准答案长这样」；偏好优化的信号是「A 比 B 好」或「这个答案对/错」。模型在 SFT 后已经会答题，偏好优化是在不换题库的前提下修正它的取向（来源：Datawhale《Happy-LLM》第六章 6.4 节的衔接讨论——偏好对齐承接在 SFT 之后，新增的核心只有三样：偏好数据组织、奖励建模方式、偏好损失函数设计，模型加载与 PEFT 工程配置全部复用 SFT 那一套）。</li>\n<li><strong>第一阶段的蒸馏是「离线模仿」，本讲的蒸馏是「在线纠错」。</strong> 第 6 周结课项目里，教师（DeepSeek API 或本地 Qwen3.8-Flash）先离线生成数据，学生再 SFT——学生全程在学教师走过的路，从没在自己走错的路上被纠正过。GKD / OPD-RL 补的正是这一课（详见第六节）。</li>\n<li><strong>纪律不变，资产复用。</strong> 第一阶段立下的冻结测试集纪律、三方评估口径（基线 / 教师 / 学生同卷考试）在本讲原样沿用；实操直接拿结课项目的学生模型当起点，不另起炉灶。</li>\n</ol>\n<hr />\n<h2 id=\"_2\">三、偏好优化全景：一张表讲透三条路线</h2>\n<h3 id=\"31-rlhf\">3.1 经典 RLHF 流水线：三段式</h3>\n<p>RLHF（基于人类反馈的强化学习）的标准流水线是三段（来源：ms-swift《人类对齐 RLHF》存档文档；Sebastian Raschka 长文，机器之心编译，存档 jiqizhixin/04）：</p>\n<ol>\n<li><strong>SFT</strong>：先得到一个会答题的模型（第一阶段已完成）；</li>\n<li><strong>RM（奖励建模）</strong>：在 SFT 模型上加一个 value head，用偏好数据 $(x, y_w, y_l)$ 训练出一个「打分员」——给任意回答打一个标量分。ms-swift 文档给出的 RM 损失由两部分组成：偏好排序项 $-\\log\\sigma(r^{(c)} - r^{(r)} - m)$（拉大 chosen 与 rejected 的分差，$m$ 为 margin，需数据提供 <code>margin</code> 列）和一个把分数往 0 附近拉的正则项（系数 <code>center_rewards_coefficient</code>，默认 0）；打分头权重单独存为 <code>value_head.safetensors</code>；</li>\n<li><strong>PPO</strong>：把 RM 当裁判，用强化学习更新 SFT 模型。PPO 一次要养<strong>四个模型</strong>（来源：ms-swift《人类对齐 RLHF》）：训练模型、参考模型（默认即训练模型初始权重，管 KL 约束）、奖励模型（RM 阶段产物，冻结）、价值模型（由奖励模型初始化，训练中同步更新、负责估优势）。关键超参先混个脸熟：<code>kl_coef</code> 默认 0.05、<code>cliprange</code> 默认 0.2、<code>vf_coef</code> 默认 0.1、<code>gamma</code> 默认 1.0、<code>lam</code>（GAE）默认 0.95、<code>local_rollout_forward_batch_size</code> 默认 64、<code>whiten_rewards</code> 默认 False。</li>\n</ol>\n<p>PPO 的设计哲学一句话：<strong>每次更新只许走一小步</strong>（近端，proximal）——用截断（clip）限制新旧策略的概率比，再加 KL 惩罚防止模型为了讨好奖励而跑偏到胡言乱语（转述自 Raschka 长文的 PPO 介绍，存档 jiqizhixin/04）。代价也一目了然：四模型同场，显存与工程复杂度都是全场最高，这也是后面两条路线诞生的直接原因。</p>\n<h3 id=\"32-dpo\">3.2 DPO 家族：绕过奖励模型，直接学偏好</h3>\n<p>DPO（直接偏好优化）的洞察是：可以把「奖励」用模型自身的 log 概率比隐式表达，于是 RM 和 RL 两步合并成一步——直接拿偏好对 $(x, y_w, y_l)$ 做一个长得像分类的损失（来源：ms-swift《人类对齐 RLHF》）。训练时只需训练模型 + 参考模型两个模型，稳定性接近 SFT，是目前中小团队偏好对齐的默认选项。</p>\n<p>ms-swift 中 DPO 的关键超参（来源同上）：</p>\n<ul>\n<li><code>beta</code>：KL 正则系数，默认 0.1。越大 = 越不许偏离参考模型（学得保守）；越小 = 越放飞（学得猛但容易把语言能力学坏）；</li>\n<li><code>loss_type</code>：DPO 变种选择，默认 <code>sigmoid</code>，可选值见 TRL 文档；还能指定多个 loss 混合（<code>loss_weights</code> 加权），如 MPO 训练；</li>\n<li><code>rpo_alpha</code>：在 DPO loss 里掺一定比例 SFT loss，提升训练稳定性；</li>\n<li><code>ld_alpha</code>（LD-DPO）：对超出公共前缀部分的 logps 加权，抑制长度偏好；<code>discopop_tau</code>（DiscoPOP）：loss_type 为 discopop 时生效的温度参数，默认 0.05。</li>\n</ul>\n<p><strong>官方文档特别提醒的一条经验</strong>：开始 DPO 前，建议先用偏好数据里的 chosen 部分对模型做一次 SFT，让数据分布更贴合 DPO 的假设——这条在实操里会用到。</p>\n<p>DPO 的同族变体（均来源：ms-swift《人类对齐 RLHF》，各自一句话定位）：</p>\n<ul>\n<li><strong>KTO</strong>：数据形态最特殊，只要 $(x, y, \\text{label})$——单条回答 + 好/坏标签，不要求成对。超参 <code>beta</code> 默认 0.1，<code>desirable_weight</code> / <code>undesirable_weight</code> 默认均为 1.0；原论文作者推荐两类样本的「权重 × 样本数」之比 $\\frac{\\lambda_D n_D}{\\lambda_U n_U} \\in [1, \\frac{4}{3}]$。适合只有点赞/点踩日志、凑不齐偏好对的场景；</li>\n<li><strong>ORPO</strong>：把 SFT 和偏好优化合进一个阶段（odds ratio 损失），注意它借参数名 <code>--beta</code> 传的其实是自己的系数 <code>lambda</code>，别按 DPO 的 beta 理解；</li>\n<li><strong>CPO</strong>：<code>beta</code> 默认 0.1，另有 <code>cpo_alpha</code>（NLL loss 系数）默认 1.0，自带 SFT 成分；</li>\n<li><strong>SimPO</strong>：<code>beta</code> 默认 2.0（注意量级与 DPO 不同）、<code>simpo_gamma</code>（reward margin）默认 1.0，可用 <code>cpo_alpha</code> 混 CPO 的 NLL loss 提高稳定性（设 0.0 即原始 SimPO）。</li>\n</ul>\n<h3 id=\"33-grpo\">3.3 GRPO 家族：去掉价值模型，用「组内相对」算优势</h3>\n<p>GRPO（组相对策略优化，出自 DeepSeekMath）针对 PPO 的贵下手：<strong>砍掉价值模型</strong>。对同一个 prompt 采样一组回答，用组内奖励的相对高低（归一化后）直接当优势——不需要第四个模型去估「预期能拿多少分」，同组答案互相就是标尺（原理转述自 Raschka 长文，存档 jiqizhixin/04；算法在 ms-swift 中的支持见存档《人类对齐 RLHF》与《知识蒸馏》）。</p>\n<p>数据形态也因此最简（来源：ms-swift《人类对齐 RLHF》）：PPO 与 GRPO 需要的数据<strong>只有模型输入</strong>（system prompt 可选 + query）；奖励函数若需要参考答案（如算准确率），数据里额外给一列 <code>solution</code> 即可。这一条直接通向 RLVR：奖励不一定来自 RM，也可以来自规则验证器——答案对不对、代码跑不跑得通、格式合不合规，都是确定性的二值/数值信号（详见第四节）。</p>\n<p>GRPO 家族在本讲涉及的扩展主要是与蒸馏的结合（OPD-RL，第六节），以及社区变体 Dr. GRPO（去除长度与标准差归一化以修正偏差，见第四节导读）。</p>\n<h3 id=\"34\">3.4 对照表与选型口诀</h3>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>RLHF（PPO）</th>\n<th>DPO 家族</th>\n<th>GRPO（+RLVR）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>解决什么问题</td>\n<td>通用偏好对齐的上位方案，效果上限高</td>\n<td>用最低工程成本做偏好对齐</td>\n<td>可验证任务（数学/代码/格式）上激发推理与自我修正</td>\n</tr>\n<tr>\n<td>监督信号</td>\n<td>RM 打分（学出来的裁判）</td>\n<td>偏好对 / 好坏标签（人或教师标的）</td>\n<td>奖励函数：RM 或规则验证（对错判定）</td>\n</tr>\n<tr>\n<td>数据形态</td>\n<td>训练时只需 prompt；RM 阶段需偏好对</td>\n<td>$(x, y_w, y_l)$；KTO 为 $(x, y, label)$</td>\n<td>prompt（+ <code>solution</code> 列供验算）</td>\n</tr>\n<tr>\n<td>在线采样</td>\n<td>是</td>\n<td>否（离线）</td>\n<td>是</td>\n</tr>\n<tr>\n<td>同场模型数</td>\n<td>4（策略/参考/奖励/价值）</td>\n<td>2（策略/参考）</td>\n<td>2–3（策略/参考，奖励为函数或 RM；无价值模型）</td>\n</tr>\n<tr>\n<td>算力与工程代价</td>\n<td>最高，调参面最宽</td>\n<td>最低，接近 SFT 的训练体验</td>\n<td>中高：采样生成是主要开销，可用 vLLM 加速（colocate/server 模式，见第六节）</td>\n</tr>\n<tr>\n<td>典型失效</td>\n<td>RM 被 hack、PPO 不稳定</td>\n<td>偏好数据噪声直接学进模型；分布外 prompt 乏力</td>\n<td>组内全对/全错时优势为 0、白采样；奖励设计漏洞被钻</td>\n</tr>\n<tr>\n<td>适用边界</td>\n<td>有成熟 RM 与算力、追求上限时</td>\n<td>有现成偏好数据、快速迭代时</td>\n<td>任务有客观对错、想激发推理时</td>\n</tr>\n</tbody>\n</table>\n<p>（对照表为 Muse 整理，各行事实依据：ms-swift《人类对齐 RLHF》存档文档与 Raschka 长文存档。）</p>\n<p><strong>选型口诀（Muse 整理）</strong>：有偏好对、先 DPO；有对错、先 GRPO；只有点赞点踩、用 KTO；要冲上限且养得起四个模型，再考虑完整 RLHF。</p>\n<hr />\n<h2 id=\"o1-r1rl\">四、前沿导读：o1 → R1，RL 推理训练发生了什么</h2>\n<p>本节为导读性质，观点转述自两篇存档长文——Cameron R. Wolfe《从 o1-mini 到 DeepSeek-R1，万字长文带你读懂推理模型的历史与技术》（机器之心编译，存档 jiqizhixin/03）与 Sebastian Raschka《RL 推理训练正悄悄突破上限》（机器之心，存档 jiqizhixin/04），不整段抄录，细节请回原文。</p>\n<p><strong>脉络一：推理模型的诞生方式被 R1 公开了配方。</strong> o1/o3 证明了「让模型先想再答」+ 强化学习能换来推理能力的台阶式提升，但配方封闭。DeepSeek-R1 的技术报告把全过程摊开：以 V3 为基座，先有 <strong>R1-Zero</strong>——完全跳过 SFT、纯 RL 训练——再有正式版 R1 的四阶段流水线（转述自 Wolfe 长文）：</p>\n<ol>\n<li><strong>冷启动 SFT</strong>：数千条长思维链数据先给模型一个「会思考的起手式」，消除纯 RL 初期的不稳定性；</li>\n<li><strong>面向推理的 RL</strong>：GRPO + 基于规则的奖励（准确性奖励 + 格式奖励，外加语言一致性奖励修语言混杂）；</li>\n<li><strong>拒绝采样再 SFT</strong>：用 RL 后的模型大量采样、按质量与正确性过滤，凑出 60 万推理轨迹 + 20 万非推理样本，再做一轮 SFT；</li>\n<li><strong>通用 RLHF</strong>：推理数据继续用规则奖励，通用数据用神经奖励模型做偏好对齐。</li>\n</ol>\n<p><strong>脉络二：RLVR 是关键的那块拼图。</strong> R1-Zero 不用神经奖励模型，只用规则奖励（答案对不对、格式对不对），理由很实际：避开 reward hacking、省算力、实现简单。GRPO 又砍掉价值模型——RLHF+PPO 里的四个模型，到 R1-Zero 这里只剩策略 + 参考两个，外加一个「计算器式」的验证器（转述自 Raschka 长文）。R1-Zero 在 AIME 2024 上从 15.6% 练到 71.0%，且自发学会拉长思维链、反思与试探替代解法——这些行为没有人写进数据，是奖励结构「逼」出来的（转述自 Wolfe 长文）。</p>\n<p><strong>脉络三：蒸馏与 RL 不是对手，是接力。</strong> R1 团队把 80 万 SFT 样本蒸馏到 Qwen/LLaMA 小模型上，效果好于对小模型直接做大规模 RL；但 R1 论文同时明确：<strong>对蒸馏模型再加 RL 还有显著进一步收益</strong>。多个团队已独立复现这一现象——有团队用 1.5B 的 R1 蒸馏模型、仅 7000 样本和 42 美元算力做 RL 微调，在 AIME24 上超过 o1-preview（转述自 Raschka 长文的论文教训汇总）。这正是本讲实操的理论依据：<strong>第一阶段蒸馏出的学生模型，不是终点，是 RL 的起点。</strong></p>\n<p>同时要泼三盆冷水（同来源，Raschka 汇总的社区教训）：</p>\n<ul>\n<li><strong>统计显著性</strong>：有复现研究提醒，小蒸馏模型上 RL 的涨点在统计上并不总是显著，基准数字可能夸大收益——所以本讲实验收务必走冻结测试集 + 足够样本量，不许拿三五条样本说事；</li>\n<li><strong>长度偏差</strong>：PPO/GRPO 的损失归一化方式会无意中偏爱长回答、放纵「又长又错」，社区对策包括 Dr. GRPO（去掉长度与标准差归一化）、对冗长错误答案显式惩罚、token 级奖励等；</li>\n<li><strong>归因之争</strong>：有研究认为反思、「顿悟」等行为在基座模型的预训练阶段就已萌芽，RL 更像「激发」而非「无中生有」——这提醒我们选基座与 SFT 数据的质量，仍然决定 RL 的天花板。</li>\n</ul>\n<hr />\n<h2 id=\"ms-swift\">五、ms-swift 中的偏好优化路径走读</h2>\n<p>本节以存档《人类对齐 RLHF》（ms-swift 官方文档）为准走读；该文档本身是「索引 + 要点」式，完整脚本在其引用的 <code>examples/train/</code> 目录下，<strong>开课时以当前版本仓库的 examples 与 GRPO 子文档为准复核</strong>（存档文档的 GRPO 一节仅给出数据说明与脚本链接；细节参数已由 P1 补抓的《GRPO 完整实验流程》与 GRPO 子目录核心篇补齐，存档 <code>modelscope/12</code>、<code>modelscope/13</code>，见 §5.3 回填）。</p>\n<h3 id=\"51\">5.1 先把数据备对：三类数据形态</h3>\n<p>（来源：ms-swift《人类对齐 RLHF》）</p>\n<table>\n<thead>\n<tr>\n<th>算法类</th>\n<th>数据形态</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>PPO / GRPO</td>\n<td>prompt（system 可选 + query）；奖励需要参考答案时加 <code>solution</code> 列</td>\n<td>训练时模型在线采样，数据里没有现成回答</td>\n</tr>\n<tr>\n<td>RM / DPO 类（含 ORPO、CPO、SimPO）</td>\n<td>$(x, y_w, y_l)$：输入 + 偏好回答 + 拒绝回答</td>\n<td>chosen/rejected 必须同题成对</td>\n</tr>\n<tr>\n<td>KTO</td>\n<td>$(x, y, label)$：输入 + 回答 + 是否符合偏好</td>\n<td>不成对，来自真实反馈日志最方便</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"52-dpo\">5.2 DPO 路径（本讲实操的默认路线）</h3>\n<p>命令骨架（Muse 整理，参数全部取自存档文档；确切脚本以仓库 <code>examples/train/rlhf/dpo</code> 为准）：</p>\n<pre><code class=\"language-bash\">swift rlhf \\\n    --rlhf_type dpo \\\n    --model &lt;第一阶段蒸馏学生模型&gt; \\\n    --dataset &lt;偏好对数据集&gt; \\\n    --beta 0.1 \\\n    --loss_type sigmoid \\\n    --rpo_alpha 1.0 \\\n    ...\n</code></pre>\n<p>走读要点：</p>\n<ol>\n<li><strong>顺序不能反</strong>：先用偏好数据的 chosen 部分做一轮 SFT（命令体系见存档《预训练与微调》：<code>swift sft</code> / Web-UI / Python 三种入口），再上 DPO（官方文档建议，见 3.2）；</li>\n<li><strong><code>beta</code> 是本讲最重要的一个旋钮</strong>：0.1 是默认值不是真理。训练中盯住模型与参考模型的偏离程度——偏好准确率涨但通用能力崩，多半是 beta 太小或步数太多；</li>\n<li><strong>一个版本坑先打预防针</strong>：Swift 的 <code>DPOTrainer</code> 暂不支持预计算参考模型 log probabilities，Python API 里 <code>DPOConfig.precompute_ref_log_probs</code> 必须保持默认 <code>False</code>，设 <code>True</code> 会在创建 trainer 时直接抛 <code>ValueError</code>；参考模型的 logp 在训练过程中现算（来源：存档文档 DPO 一节）；</li>\n<li>变体切换成本很低：同一套数据把 <code>--rlhf_type</code> 与对应超参换掉即可跑 ORPO/CPO/SimPO/KTO 对照，这也是实操鼓励做小对照的原因。</li>\n</ol>\n<h3 id=\"53-grpo\">5.3 GRPO 路径（本讲实操的挑战路线）</h3>\n<p>存档内可确认的事实（来源：ms-swift《人类对齐 RLHF》《知识蒸馏》）：</p>\n<ul>\n<li>数据只需 prompt（+ 可选 <code>solution</code> 列供奖励函数验算准确率）；</li>\n<li>训练入口同为 <code>swift rlhf --rlhf_type grpo</code>；在线采样可用 vLLM 加速，支持 colocate（同卡共置）与 server 两种模式；</li>\n<li>监控指标里要特别认识 <code>teacher_kl</code>（仅 OPD-RL 模式，见 6.3）等 KL 类指标，它们是第七节「假涨点识别」的仪表盘。</li>\n</ul>\n<p><strong>P1 补抓回填（2026-10-21）</strong>：GRPO 关键参数已由存档 <code>modelscope/12-GRPO完整实验流程.md</code> 与 <code>modelscope/13-GRPO子目录核心篇.md</code> 补齐，官方实验口径为——组大小 <code>num_generations</code> 8、采样温度 <code>temperature</code> 1.0、KL 系数 <code>beta</code> 0.001（与学习率 5e-7 配套）；<code>--beta 0</code> 可关闭 KL 且不再加载参考模型；编排规则：<code>num_generations</code> 必须能被采样/评估总批量整除、batch 以 completion 为单位。官方另有反例在案：lr 1e-6 + beta 0.04 时约 200 步出现震荡。以上为官方示例/实验口径，开课当周仍须按当前版本官方脚本复核。</p>\n<h3 id=\"54-ppo-rm\">5.4 PPO / RM 路径（了解即可，实操不展开）</h3>\n<p>四模型配置与超参见 3.1。教学口径：PPO 是理解一切的原型（clip + KL + GAE 都在这里），但在 8B 级学生模型 + 双机 Spark 的公司实境里，它的显存与调参成本不划算；知道它在版图里的位置、能读懂它的日志字段即可。RM 的训练脚本入口为 <code>examples/train/rlhf/rm</code>（来源同上），若后续项目需要自训奖励模型再回来深挖。</p>\n<hr />\n<h2 id=\"gkd\">六、蒸馏深化：从数据蒸馏到 GKD</h2>\n<p>本节框架与方法以存档《知识蒸馏》（ms-swift 官方文档）为准。</p>\n<h3 id=\"61\">6.1 先换坐标系：采样方式 × 反馈密度</h3>\n<p>存档文档给了一个非常有用的坐标系（下文为转述）：后训练方法可以按两个维度分类——<strong>采样方式</strong>（训练序列是学生自己生成的 on-policy，还是来自外部固定数据的 off-policy）与<strong>反馈密度</strong>（整条序列一个奖励的稀疏信号，还是每个 token 都有信号的稠密信号）。</p>\n<table>\n<thead>\n<tr>\n<th>方法</th>\n<th>采样方式</th>\n<th>反馈密度</th>\n<th>教师分布</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>SFT</td>\n<td>off-policy（固定数据）</td>\n<td>稠密（per-token）</td>\n<td>one-hot（标注即「教师」）</td>\n</tr>\n<tr>\n<td>离线蒸馏</td>\n<td>off-policy（固定数据或教师生成）</td>\n<td>稠密（per-token）</td>\n<td>教师软分布</td>\n</tr>\n<tr>\n<td>RL</td>\n<td>on-policy（学生采样）</td>\n<td>稀疏（per-sequence）</td>\n<td>无</td>\n</tr>\n<tr>\n<td>On-policy 蒸馏</td>\n<td>on-policy（学生采样）</td>\n<td>稠
